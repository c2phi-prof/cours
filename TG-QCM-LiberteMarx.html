<script>
var QUIZ = {"title": "TG — Liberté et matérialisme historique (Marx)", "sub": "TG — Séance Marx : les quatre textes et le cours sur la liberté", "questions": [{"type": "single", "name": "Dans le Texte 1, que sont les « rapports de production » ?", "options": [{"text": "Des rapports nécessaires, indépendants de la volonté des hommes, dans lesquels ils entrent pour produire leur existence — relations de propriété, d'exploitation, d'échange.", "correct": true, "feedback": "Ils forment la structure économique (la base) sur laquelle s'élèvent le droit, la politique et les formes de conscience : personne ne les a choisis, ils s'imposent à tous."}, {"text": "Des contrats librement signés entre employeurs et salariés.", "correct": false, "feedback": "Attention : pour Marx, ces rapports sont « indépendants de la volonté des hommes » — la forme juridique du contrat ne fait que traduire une structure qui le dépasse."}, {"text": "Les relations personnelles d'amitié ou de sympathie à l'usine.", "correct": false, "feedback": "Il s'agit de rapports sociaux objectifs de production, pas de relations interpersonnelles."}, {"text": "Les idées économiques que les hommes se font de la production.", "correct": false, "feedback": "Non : les rapports de production sont la base réelle ; les idées en dérivent, l'inverse n'est pas vrai."}]}, {"type": "single", "name": "« Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. » Cette formule du Texte 1...", "options": [{"text": "...renverse l'idéalisme de Hegel : les idées n'expriment plus le mouvement de l'histoire, elles expriment des positions sociales matérielles.", "correct": true, "feedback": "C'est le geste matérialiste : les idées dominantes sont les idées de la classe dominante. Expliquer la conscience par l'être social, non plus l'être par la conscience."}, {"text": "...affirme que personne ne peut jamais penser librement quoi que ce soit.", "correct": false, "feedback": "Nuance : la conscience est conditionnée, ce qui n'est pas exactement déterminée au point d'être supprimée — la liberté réelle suppose de changer les conditions."}, {"text": "...montre que Marx est un simple disciple fidèle de Hegel.", "correct": false, "feedback": "Marx se dit hégélien « à rebours » : il conserve la dialectique, mais il la fait marcher sur ses pieds matériels."}, {"text": "...concerne uniquement la conscience religieuse.", "correct": false, "feedback": "La formule vaut pour l'ensemble des formes de conscience : droit, morale, religion, philosophie."}]}, {"type": "single", "name": "Selon le Texte 1, une ère de révolution sociale commence quand...", "options": [{"text": "Les rapports de production, de formes de développement qu'ils étaient, deviennent des entraves pour les forces productives.", "correct": true, "feedback": "La révolution n'est pas un caprice volontariste : elle naît d'une contradiction objective entre le dynamisme des forces productives et la raideur des rapports de propriété."}, {"text": "Un philosophe convainc les foules par la seule force de ses idées.", "correct": false, "feedback": "Ce serait l'explication idéaliste que le matérialisme historique dénonce précisément."}, {"text": "Les hommes décident collectivement et arbitrairement de changer d'époque.", "correct": false, "feedback": "« Indépendants de leur volonté » : le changement structural n'est pas décrété, il s'impose."}, {"text": "La superstructure juridique s'effondre d'elle-même sans cause économique.", "correct": false, "feedback": "C'est l'inverse : la tension part de la base, de la collision entre forces productives et rapports de production."}]}, {"type": "single", "name": "Texte 2 : en quel sens le travail aliéné est-il « extérieur » à l'ouvrier ?", "options": [{"text": "Il est étranger à son essence : dans le travail l'ouvrier se nie au lieu de s'affirmer, il mortifie son corps et ruine son esprit au lieu de déployer une libre activité.", "correct": true, "feedback": "« Extérieur » = étranger à l'essence. Ce qui devait actualiser l'homme (la libre production) devient sa négation."}, {"text": "Il se déroule toujours en extérieur, dans les champs ou les cours.", "correct": false, "feedback": "Ce n'est pas une question de géographie mais d'essence : le travail peut être en atelier et rester extérieur à l'ouvrier."}, {"text": "Il est réservé aux travailleurs étrangers à la ville.", "correct": false, "feedback": "L'extériorité vise le rapport à soi, non la nationalité ni le lieu."}, {"text": "Il relève des fonctions animales (manger, boire, procréer).", "correct": false, "feedback": "C'est exactement l'inverse : c'est dans ses fonctions animales que l'ouvrier se sent libre, et dans ses fonctions humaines qu'il se sent esclave."}]}, {"type": "single", "name": "Pourquoi le travail aliéné est-il « fui comme la peste » dès qu'aucune contrainte n'existe (Texte 2) ?", "options": [{"text": "Parce qu'il est forcé : non la satisfaction d'un besoin, mais le simple moyen de satisfaire des besoins extérieurs à lui.", "correct": true, "feedback": "La fuite spontanée est le test empirique de l'aliénation : si le travail réalisait son essence, on ne le fuirait pas — la fuite prouve que l'activité ne lui appartient plus."}, {"text": "Parce que le travail est naturellement pénible et répulsif pour tout être humain.", "correct": false, "feedback": "Pour Marx, le libre produit du travail est justement ce qui définit l'essence humaine : ce n'est pas le travail en soi qui est haïssable, c'est sa forme aliénée."}, {"text": "Parce que les ouvriers du XIXe siècle étaient particulièrement paresseux.", "correct": false, "feedback": "L'explication naturaliste par la paresse est dénoncée par la philosophie classique comme une pétition de principe."}, {"text": "Parce que la peste sévissait alors dans les ateliers.", "correct": false, "feedback": "L'expression est une comparaison, pas un fait médical."}]}, {"type": "single", "name": "Texte 2 : quel paradoxe la formule « il est comme chez lui quand il ne travaille pas » met-elle en évidence ?", "options": [{"text": "L'aliénation inverse l'humain et l'animal : l'homme se sent libre dans ses fonctions animales et esclave dans ses fonctions proprement humaines.", "correct": true, "feedback": "Le propre de l'homme (produire librement) est vécu comme servitude ; le pur fonctionnement biologique est vécu comme liberté. L'aliénation atteint l'essence même de l'espèce."}, {"text": "L'ouvrier possède deux logements dont un au travail.", "correct": false, "feedback": "La formule est existentielle, pas immobilière : elle décrit le rapport à soi, pas un patrimoine."}, {"text": "Le repos est plus productif économiquement que le travail.", "correct": false, "feedback": "Le paradoxe n'est pas économique mais anthropologique."}, {"text": "L'homme est spontanément sédentaire et attaché à son foyer.", "correct": false, "feedback": "« Chez soi » désigne l'accord avec soi-même, non le domicile."}]}, {"type": "single", "name": "Texte 3 : qu'est-ce qu'un moyen de travail ?", "options": [{"text": "Une chose que l'homme interpose entre lui et l'objet de son travail, utilisant ses propriétés pour produire un effet conforme à son but.", "correct": true, "feedback": "Pierre, couteau, machine : l'homme agit médiatement, en prolongeant son corps par des organes artificiels — il ne se réduit pas à ses organes naturels."}, {"text": "Le salaire qui rémunère l'effort de l'ouvrier.", "correct": false, "feedback": "Le salaire est une catégorie de la distribution, pas un instrument du procès de travail."}, {"text": "Le temps de repos réparateur entre deux journées.", "correct": false, "feedback": "Le moyen de travail est une chose interposée dans la production, pas une pause."}, {"text": "La matière première que l'ouvrier transforme.", "correct": false, "feedback": "C'est l'objet de travail — et Marx précise que l'élément essentiel, du point de vue du procès de production, n'est pas lui, mais le moyen de travail."}]}, {"type": "multi", "name": "Selon le Texte 3, quels éléments relèvent du moyen de travail ou de la terre comme double réservoir ? (plusieurs réponses)", "options": [{"text": "La terre, à la fois magasin de vivres primitif et arsenal primitif des moyens de travail.", "correct": true, "feedback": "La terre est double : réservoir de subsistances et réservoir d'instruments (pierre qui tranche, bois qui sert de levier)."}, {"text": "Les instruments et armes de pierre trouvés dans les cavernes les plus anciennes.", "correct": true, "feedback": "L'archéologie confirme la thèse : la technique fait partie de l'essence de l'homme dès son origine."}, {"text": "L'animal dompté, produit du travail devenu à son tour moyen de travail.", "correct": true, "feedback": "Bête de trait, de somme, de labour : un instrument vivant, produit du travail et moyen de travail."}, {"text": "Les actions de bourse et autres produits financiers.", "correct": false, "feedback": "Les titres financiers sont des formes de la propriété, pas des moyens de travail au sens de Le Capital."}]}, {"type": "single", "name": "Qu'est-ce qui distingue éminemment le travail humain du travail animal (Texte 3) ?", "options": [{"text": "L'emploi et surtout la création de moyens de travail : l'animal n'use que de ses organes, l'homme invente et transforme ses instruments.", "correct": true, "feedback": "Franklin : l'homme, « un animal qui fabrique des outils ». L'animal est rivé à son organisme ; l'homme prolonge le sien — et transforme ses instruments en en créant de nouveaux."}, {"text": "L'animal, lui, fabrique des machines perfectionnées.", "correct": false, "feedback": "Certaines constructions animales existent mais restent embryonnaires et fixes : « à proprement parler », l'animal ne crée pas de moyens de travail."}, {"text": "Seul l'humain se repose après l'effort.", "correct": false, "feedback": "Ce n'est pas le critère retenu par Marx ici."}, {"text": "Seul l'humain travaille par nécessité.", "correct": false, "feedback": "L'animal aussi pourvoit à ses besoins ; la différence est la médiation instrumentale, pas la nécessité."}]}, {"type": "single", "name": "Texte 4 : que signifie « zôon politikon » chez Marx ?", "options": [{"text": "L'homme est un animal qui ne peut s'isoler et se constituer comme individu singulier qu'au sein de la société : l'individualité est un produit social.", "correct": true, "feedback": "Marx reprend la définition aristotélicienne contre l'atome des économistes : la société n'est pas un amas d'individus déjà faits, elle est le milieu où chaque individualité se constitue."}, {"text": "L'homme doit fuir la société pour réaliser sa nature profonde.", "correct": false, "feedback": "C'est le mythe de Robinson que Marx dénonce : l'individu autosuffisant est une fiction."}, {"text": "Seuls les citoyens actifs sont de véritables animaux politiques.", "correct": false, "feedback": "La formule vaut l'espèce humaine entière, pas un statut civique."}, {"text": "L'homme est politique parce qu'il parle, comme l'enseigne Aristote.", "correct": false, "feedback": "Marx reprend le mot d'Aristote mais le déplace : l'accent porte sur la production sociale de l'individu, pas sur le logos seul."}]}, {"type": "single", "name": "Pourquoi la production hors de la société est-elle « aussi absurde que le développement du langage sans individus parlant ensemble » (Texte 4) ?", "options": [{"text": "Parce que produire et parler supposent des êtres déjà en relation : même isolé, l'individu n'agit qu'avec des forces sociales incorporées.", "correct": true, "feedback": "Le naufragé civilisé ne survit qu'avec les puissances de la société en lui : la société est en lui même quand elle n'est pas autour de lui."}, {"text": "Parce que le langage pourrait parfaitement se développer par écrit, seul.", "correct": false, "feedback": "Un langage naît de la communication vivante ; l'écriture en dérive, elle ne la crée pas."}, {"text": "Parce que le travail solitaire est interdit par le droit.", "correct": false, "feedback": "Ce n'est pas une question d'interdit juridique mais de possibilité anthropologique."}, {"text": "Parce que l'absence de société rend physiquement impossible tout geste technique.", "correct": false, "feedback": "Le geste est possible ; c'est sa signification humaine (héritée, sociale, historique) qui s'évanouit."}]}, {"type": "matching", "name": "Associez chaque notion du cours à sa définition.", "pairs": [{"q": "Forces productives", "a": "Les moyens matériels et humains (outils, techniques, énergie, savoir-faire) dont dispose une société pour produire"}, {"q": "Rapports de production", "a": "Les rapports sociaux nécessaires — propriété, exploitation — dans lesquels les hommes produisent leur existence"}, {"q": "Superstructure", "a": "L'ensemble juridique, politique et idéologique qui s'élève sur la base économique"}, {"q": "Aliénation", "a": "Le devenir-étranger du travailleur à l'égard de son propre travail, qui le nie au lieu de l'affirmer"}, {"q": "Zôon politikon", "a": "L'animal qui n'accomplit son essence qu'au sein de la société"}]}, {"type": "single", "name": "COURS — Selon le matérialisme historique, en quoi consiste la libération (au sens fort) ?", "options": [{"text": "Non à changer seulement les idées, mais à transformer les rapports sociaux de production qui conditionnent la conscience et l'activité.", "correct": true, "feedback": "Puisque l'être social détermine la conscience, la libération ne peut être purement idéale : changer les rapports, c'est changer les hommes qui les vivent."}, {"text": "À s'élever par la seule connaissance philosophique, comme chez les Stoïciens.", "correct": false, "feedback": "La sagesse stoïcienne libère dans l'âme ; Marx objecte que l'âme elle-même est façonnée par des rapports sociaux qu'il faut changer."}, {"text": "À respecter scrupuleusement les lois existantes, quelle qu'elles soient.", "correct": false, "feedback": "Le droit fait partie de la superstructure : il exprime la base, il ne la juge pas de l'extérieur."}, {"text": "À fuir toute société pour retrouver une liberté naturelle perdue.", "correct": false, "feedback": "Le retour à l'état de nature est le mythe que le Texte 4 réduit à l'absurde."}]}, {"type": "single", "name": "COURS — L'aliénation du travail (Texte 2) peut-elle être surmontée par la seule bonne volonté de l'ouvrier ?", "options": [{"text": "Non : elle est structurelle — le travail forcé tient aux rapports de production, non à un défaut psychologique de l'ouvrier.", "correct": true, "feedback": "L'aliénation n'est pas un accident subjectif mais une position objective dans les rapports sociaux ; d'où la nécessité d'une transformation sociale, et non d'un simple effort moral."}, {"text": "Oui : il suffit de s'efforcer de travailler avec le sourire.", "correct": false, "feedback": "Ce serait confondre l'aliénation (structure) avec l'ennui ou la démotivation (états d'âme)."}, {"text": "Oui : la méditation individuelle suffit à abolir le salariat.", "correct": false, "feedback": "Aucun état d'âme n'abolit une structure économique."}, {"text": "La question n'a pas de sens pour Marx.", "correct": false, "feedback": "Elle est au contraire le cœur des Manuscrits de 1844."}]}, {"type": "short", "name": "COURS — Quel repère du programme la formule « l'être social détermine la conscience » mobilise-t-elle ? (un mot ou une expression)", "answers": ["ce qui dépend de nous et ce qui ne dépend pas de nous", "ce qui depend de nous", "ce qui dépend de nous"], "feedback": "Repère : ce qui dépend de nous / ce qui ne dépend pas de nous. La conscience est conditionnée par des rapports que l'individu n'a pas choisis ; la liberté exige donc d'agir sur ces conditions — d'où le sens de la libération politique."}, {"type": "single", "name": "SYNTHÈSE — Quelle thèse unit les quatre textes ?", "options": [{"text": "L'homme n'est pas d'abord une conscience solitaire : être matériel, producteur et social, il ne se libère qu'en transformant les rapports qui le façonnent.", "correct": true, "feedback": "L'être social précède la conscience (T1) ; le travail aliène quand il devient forcé (T2) ; l'humanité se définit par la médiation de l'outil (T3) ; l'individu est un produit social (T4). La liberté n'est pas un état intérieur : elle est transformation des conditions."}, {"text": "L'histoire est conduite par les idées, la société en dérive.", "correct": false, "feedback": "C'est la thèse idéaliste que le Texte 1 renverse."}, {"text": "Chacun est libre dès lors qu'il le décide intérieurement.", "correct": false, "feedback": "Ce subjectivisme de la liberté est précisément ce que le matérialisme historique met en question."}, {"text": "La liberté consiste à s'affranchir de toute société.", "correct": false, "feedback": "Le Texte 4 réduit cette idée à une absurdité comparable au langage sans parleurs."}]}, {"type": "short", "name": "SYNTHÈSE — En quoi la liberté ne peut-elle pas se réduire à une conquête intérieure, selon l'ensemble des quatre textes ? (répondez en une phrase : que faut-il transformer ?)", "answers": ["transformer les rapports sociaux de production", "changer les rapports sociaux de production", "transformer les rapports de production", "changer les rapports de production"], "feedback": "Piste (dissertation) : 1) la conquête intérieure (stoïcienne) a une valeur réelle face à ce qui ne dépend pas de nous ; 2) mais le Texte 1 montre que la conscience elle-même est façonnée par l'être social : changer les idées sans changer les rapports laisse intacte la structure ; 3) le Texte 2 en donne la mesure vécue (travail forcé, aliénation) ; 4) le Texte 4 montre qu'aucune solitude n'est native : la libération est donc sociale et politique — transformer les rapports, pas seulement les représentations."}], "comps": []};

var CLE = "c2phi-qcm-liberte-marx";

try { var s = JSON.parse(localStorage.getItem(CLE)); if (s && typeof s.i === "number") etat = s; } catch (e) {}

var TEXTES = [

 { t: "Texte 2 — Marx, Manuscrits de 1844 : le travail aliéné" },

];

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim(); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function save(){ try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }

function catDe(nom){
  if(/^Texte 1/.test(nom)) return "Matérialisme historique";
  if(/^Texte 2/.test(nom)) return "Aliénation";
  if(/^Texte 3/.test(nom)) return "Travail et production";
  if(/^Texte 4/.test(nom)) return "Individu et société";
  if(nom.indexOf("Associez") === 0) return "Association";
  if(nom.indexOf("COURS") === 0) return "Cours : la liberté";
  if(nom.indexOf("SYNTH") === 0) return "Synthèse";
  return "Dissertation";
}

})();

function afficher(){
  var Q = QUIZ.questions;
  if (etat.i >= Q.length) { score(); return; }
  var q = Q[etat.i];
  var h = "";
  h += '<div class="jauge">' + Q.map(function(_, k){
    var cls = "seg";
    if (etat.rep[k]) cls += etat.rep[k].ok ? " ok" : " ko";
    if (k === etat.i) cls += " cur";
    return '<span class="' + cls + '" data-k="' + k + '" title="Question ' + (k + 1) + '"></span>';
  }).join("") + '</div>';
  h += '<span class="tagcat">' + esc(catDe(q.name)) + ' · question ' + (etat.i + 1) + ' / ' + Q.length + '</span>';
  h += '<p class="qtext">' + esc(q.name) + '</p>';

  if (q.type === "single" || q.type === "multi") {
    var perm = shuffle(q.options.map(function(_, k){ return k; }));
    etat.perm = perm;
    perm.forEach(function(orig, d){
      h += '<label class="opt" id="opt' + d + '"><input type="' + (q.type === "multi" ? "checkbox" : "radio") + '" name="q" value="' + d + '"> ' + esc(q.options[orig].text) + '</label>';
    });
  } else if (q.type === "short") {
    h += '<input type="text" id="rep-courte" placeholder="Votre réponse…">';
  } else if (q.type === "long") {
    h += '<textarea id="rep-longue" placeholder="Rédigez ici votre paragraphe (quelques phrases au minimum)…"></textarea>';
  } else if (q.type === "matching") {
    var pool = shuffle(q.pairs.map(function(p){ return p.a; }));
    q.pairs.forEach(function(p, k){
      h += '<p style="margin:8px 0 0"><strong>' + esc(p.q) + '</strong></p><select id="sel' + k + '"><option value="">— Choisir —</option>';
      pool.forEach(function(rep){ h += '<option>' + esc(rep) + '</option>'; });
      h += '</select>';
    });
  }
  h += '<button id="btn-val">Valider</button>';
  zone.innerHTML = h;

  Array.prototype.forEach.call(zone.querySelectorAll(".seg"), function(seg){
    seg.addEventListener("click", function(){ etat.i = +seg.getAttribute("data-k"); save(); afficher(); });
  });
  Array.prototype.forEach.call(zone.querySelectorAll("input[name=q]"), function(inp){
    inp.addEventListener("change", function(){
      Array.prototype.forEach.call(zone.querySelectorAll("label.opt"), function(l){ l.classList.remove("sel"); });
      Array.prototype.forEach.call(zone.querySelectorAll("input[name=q]"), function(x){ if (x.checked) x.closest("label").classList.add("sel"); });
    });
  });
  var inp = document.getElementById("rep-courte");
  if (inp) inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); valider(); } });
  document.getElementById("btn-val").addEventListener("click", valider);
}

function valider(){
  var Q = QUIZ.questions;
  var q = Q[etat.i];
  var ok = false, fb = "";

  if (q.type === "single" || q.type === "multi") {
    var selD = Array.prototype.map.call(zone.querySelectorAll("input[name=q]:checked"), function(x){ return +x.value; });
    var sel = selD.map(function(d){ return etat.perm[d]; });
    var corr = q.options.map(function(o, k){ return o.correct ? k : -1; }).filter(function(k){ return k >= 0; });
    ok = q.type === "single" ? (sel.length === 1 && corr.indexOf(sel[0]) >= 0)
                             : (sel.length === corr.length && sel.every(function(s){ return corr.indexOf(s) >= 0; }));
    etat.perm.forEach(function(orig, d){
      var el = document.getElementById("opt" + d);
      if (q.options[orig].correct) el.classList.add("good");
      else if (selD.indexOf(d) >= 0) el.classList.add("bad");
      el.querySelector("input").disabled = true;
    });
    etat.rep[etat.i] = { ok: ok, given: sel };
    fb = corr.map(function(k){ return q.options[k].feedback; }).filter(Boolean).join("<br><br>");
  } else if (q.type === "short") {
    var v = document.getElementById("rep-courte").value;
    ok = q.answers.some(function(a){ return norm(a) === norm(v); });
    document.getElementById("rep-courte").disabled = true;
    etat.rep[etat.i] = { ok: ok, given: v };
    fb = q.feedback || ("Réponse attendue : " + q.answers[0]);
  } else if (q.type === "long") {
    var t = document.getElementById("rep-longue").value.trim();
    if (t.length < 40) { alert("Rédigez au moins quelques phrases avant de valider."); return; }
    ok = true;
    document.getElementById("rep-longue").disabled = true;
    etat.rep[etat.i] = { ok: ok, given: t };
    fb = q.feedback || "";
  } else if (q.type === "matching") {
    var allOk = true;
    q.pairs.forEach(function(p, k){
      var sel = document.getElementById("sel" + k);
      if (norm(sel.value) !== norm(p.a)) allOk = false;
      sel.disabled = true;
    });
    ok = allOk;
    etat.rep[etat.i] = { ok: ok, given: q.pairs.map(function(p, k){ return document.getElementById("sel" + k).value; }) };
    fb = "Associations correctes : " + q.pairs.map(function(p){ return p.q + " → " + p.a; }).join(" ; ");
  }

  if (ok) etat.ok++;
  save();
  var seg = zone.querySelector('.seg[data-k="' + etat.i + '"]');
  if (seg) { seg.classList.remove("cur"); seg.classList.add(ok ? "ok" : "ko"); }
  document.getElementById("btn-val").style.display = "none";
  zone.insertAdjacentHTML("beforeend",
    '<div class="fb ' + (ok ? "ok" : "no") + '"><strong>' + (ok ? "Réponse acceptée ✔" : "Explication") + '</strong><br>' + fb + '</div>' +
    '<button class="ghost" id="btn-suiv">' + (etat.i + 1 < QUIZ.questions.length ? "Question suivante →" : "Voir le score") + '</button>');
  document.getElementById("btn-suiv").addEventListener("click", function(){ etat.i++; save(); afficher(); });
}

function score(){
  var n = QUIZ.questions.length;
  var pct = Math.round(100 * etat.ok / n);
  zone.innerHTML = '<h2 class="score">' + (pct >= 80 ? "🏆 " : "") + 'Score<span class="big">' + etat.ok + ' / ' + n + '</span>' + pct + '%</h2>' +
    '<div class="barre"><div id="barrep"></div></div>' +
    '<button id="btn-review">Revoir les réponses</button> <button class="ghost" id="btn-ref">Refaire</button>';
  setTimeout(function(){ var b = document.getElementById("barrep"); if (b) b.style.width = pct + "%"; }, 100);
  document.getElementById("btn-review").addEventListener("click", review);
  document.getElementById("btn-ref").addEventListener("click", refaire);
}

function review(){
  var h = "<h2 style='margin-bottom:10px'>Récapitulatif</h2>";
  QUIZ.questions.forEach(function(q, k){
    var r = etat.rep[k] || { ok: false, given: null };
    h += '<div style="border:1px solid #c9c9c9;border-radius:9px;padding:12px;margin:12px 0;background:#fafafa">';
    h += '<p class="qtext">' + (k + 1) + '. ' + esc(q.name) + '</p>';
    if (q.options) {
      q.options.forEach(function(o){
        var picked = r.given && r.given.indexOf(q.options.indexOf(o)) >= 0;
        var cls = o.correct ? "good" : (picked ? "bad" : "");
        h += '<div class="opt ' + cls + '">' + (o.correct ? "✔ " : "") + esc(o.text) + (picked ? ' <em>(votre réponse)</em>' : '') + '</div>';
      });
      var corr = q.options.filter(function(o){ return o.correct; }).map(function(o){ return o.feedback || o.text; }).join("<br><br>");
      h += '<div class="fb ' + (r.ok ? "ok" : "no") + '">' + corr + '</div>';
    } else if (q.pairs) {
      q.pairs.forEach(function(p, j){
        var gv = r.given ? r.given[j] : "";
        h += '<p>' + esc(p.q) + ' → <em>' + esc(gv || "—") + '</em>' + (norm(gv) === norm(p.a) ? ' ✔' : ' (attendu : ' + esc(p.a) + ')') + '</p>';
      });
    } else {
      h += '<p>' + esc(r.given || "") + (q.feedback ? '<br><br><em>' + esc(q.feedback) + '</em>' : '') + '</p>';
    }
    h += '</div>';
  });
  h += '<button id="btn-score2">Retour au score</button>';
  zone.innerHTML = h;
  document.getElementById("btn-score2").addEventListener("click", score);
}

function refaire(){
  etat = { i: 0, ok: 0, rep: {} };
  save();
  afficher();
}

afficher();
</script>
</body>
</html>
