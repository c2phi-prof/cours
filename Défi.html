/**
 * ÉCRAN CONTEXTUEL LORS DE LA SÉLECTION D'UN QCM
 */
function renderQuizContextualIntro(quiz, previousStatus) {
  const qs = getQuizState(quiz.id);
  const answeredCount = Object.keys(qs.validated || {}).length;
  const pct = Math.round((answeredCount / quiz.count) * 100);

  let cardClass = "st-card-new";
  let iconBg = "var(--accent-soft)";
  let iconColor = "var(--accent)";
  let iconChar = "✦";
  let statusHeading = "Nouveau QCM — Jamais consulté";
  let statusDesc = "Vous ouvrez ce questionnaire pour la première fois. Vous pouvez vous tester en conditions réelles avec correction immédiate question par question, ou consulter directement le corrigé détaillé.";

  if (previousStatus === "VISITED") {
    cardClass = "st-card-seen";
    iconBg = "var(--infobg)";
    iconColor = "var(--info)";
    iconChar = "👁";
    statusHeading = "Déjà consulté — Non commencé";
    statusDesc = "Vous avez déjà ouvert ce QCM sans encore répondre aux questions. Lancez l'entraînement pour enregistrer votre premier score.";
  } else if (qs.status === "IN_PROGRESS") {
    cardClass = "st-card-prog";
    iconBg = "var(--warnbg)";
    iconColor = "var(--warn)";
    iconChar = "⏳";
    statusHeading = `QCM commencé en partie (${answeredCount} / ${quiz.count} questions — ${pct} %)`;
    statusDesc = "Votre progression est sauvegardée automatiquement. Vous pouvez reprendre exactement où vous vous êtes arrêté ou recommencer à zéro.";
  } else if (qs.status === "COMPLETED") {
    cardClass = "st-card-done";
    iconBg = "var(--okbg)";
    iconColor = "var(--ok)";
    iconChar = "✓";
    statusHeading = `QCM déjà terminé (${qs.attempts.length} tentative${qs.attempts.length > 1 ? "s" : ""})`;
    statusDesc = `Votre meilleur score est de ${qs.bestScore} % (dernier résultat : ${qs.lastScore} %). Entraînez-vous à nouveau pour améliorer votre moyenne ou relisez les explications.`;
  }

  let historyHtml = "";
  if (qs.attempts.length > 0) {
    historyHtml = `
      <div class="history-pills">
        <div class="hist-pill">🏆 Meilleur score : <strong>${qs.bestScore}%</strong></div>
        <div class="hist-pill">🕒 Dernier score : <strong>${qs.lastScore}%</strong></div>
        <div class="hist-pill">🔁 Tentatives : <strong>${qs.attempts.length}</strong></div>
      </div>
    `;
  }

  let buttonsHtml = "";
  if (qs.status === "IN_PROGRESS") {
    buttonsHtml = `
      <button type="button" class="btn btn-warn" onclick="startQuizRun('${quiz.id}', true)">▶ Reprendre le QCM (${answeredCount}/${quiz.count})</button>
      <button type="button" class="btn" onclick="confirmResetQuiz('${quiz.id}')">↺ Recommencer à zéro</button>
      <button type="button" class="btn" onclick="openCorrectionMode('${quiz.id}')">📖 Voir le corrigé complet</button>
    `;
  } else if (qs.status === "COMPLETED") {
    buttonsHtml = `
      <button type="button" class="btn btn-primary" onclick="startQuizRun('${quiz.id}', false)">🔁 Refaire le QCM (nouvelle tentative)</button>
      <button type="button" class="btn btn-ok" onclick="openCorrectionMode('${quiz.id}')">📖 Revoir le corrigé & explications</button>
    `;
  } else {
    buttonsHtml = `
      <button type="button" class="btn btn-primary" onclick="startQuizRun('${quiz.id}', false)">▶ Démarrer le QCM interactif</button>
      <button type="button" class="btn" onclick="openCorrectionMode('${quiz.id}')">📖 Consulter le corrigé direct</button>
    `;
  }

  contentEl.innerHTML = `
    ${renderChallengeBannerHTML()}
    <div class="qcm-head">
      <h2>${esc(quiz.title)}</h2>
      <div class="meta">
        <span class="tag-chip">${esc(quiz.author)}</span>
        <span class="tag-chip">${esc(quiz.group)}</span>
        <span>${quiz.count} question${quiz.count > 1 ? "s" : ""}</span>
      </div>
    </div>

    <div class="status-card ${cardClass}">
      <div class="status-card-header">
        <div class="status-icon" style="background:${iconBg};color:${iconColor};">${iconChar}</div>
        <div>
          <h3 style="font-size:17px;">${statusHeading}</h3>
          ${qs.lastVisited ? `<span style="font-size:12px;color:var(--muted);">Dernière consultation : ${formatDateFR(qs.lastVisited)}</span>` : ""}
        </div>
      </div>
      <p>${statusDesc}</p>
      ${historyHtml}
      <div class="action-bar">
        ${buttonsHtml}
      </div>
    </div>
  `;
  document.getElementById("back-top").style.display = "none";
}

function confirmResetQuiz(quizId) {
  askConfirm(
    "Recommencer ce QCM ?",
    "Vos réponses en cours seront effacées. Vos précédents scores terminés resteront conservés dans l'historique.",
    () => startQuizRun(quizId, false)
  );
}

/**
 * MODE PASSATION INTERACTIVE DU QCM (AVEC SAUVEGARDE CONTINUE)
 */
function startQuizRun(quizId, resume) {
  const quiz = QUIZZES.find(q => q.id === quizId);
  if (!quiz) return;
  const qs = getQuizState(quizId);

  if (!resume) {
    qs.answers = {};
    qs.validated = {};
    if (qs.status !== "COMPLETED") {
      qs.status = "IN_PROGRESS";
    }
  }
  saveUserState();

  uiState.activeQuizId = quizId;
  uiState.view = "QUIZ_RUN";
  renderMenu();
  renderQuizRunner(quiz);

  // Si reprise, défiler automatiquement vers la première question non validée
  if (resume) {
    const firstTodoIdx = quiz.questions.findIndex((_, i) => qs.validated[i] === undefined);
    if (firstTodoIdx > 0) {
      setTimeout(() => {
        const el = document.getElementById("q" + firstTodoIdx);
        if (el) el.scrollIntoView({ behavior: "smooth" });
      }, 120);
    }
  } else {
    mainEl.scrollTop = 0;
  }
}

function renderQuizRunner(quiz) {
  const qs = getQuizState(quiz.id);
  const validatedCount = Object.keys(qs.validated).length;
  const correctCount = Object.values(qs.validated).filter(Boolean).length;
  const pct = Math.round((validatedCount / quiz.count) * 100);

  let questionsHtml = quiz.questions.map((q, i) => renderInteractiveQuestion(quiz, q, i, qs)).join("");

  contentEl.innerHTML = `
    ${renderChallengeBannerHTML()}
    <div class="qcm-head">
      <h2>${esc(quiz.title)}</h2>
      <div class="meta">
        <span class="tag-chip">${esc(quiz.author)}</span>
        <span>Mode entraînement interactif — progression sauvegardée automatiquement</span>
      </div>
    </div>

    <div class="runner-toolbar">
      <div class="runner-progress-wrap">
        <div class="runner-progress-label">
          <span>Avancement : ${validatedCount} / ${quiz.count} questions validées (${pct}%)</span>
          <span>Réussite actuelle : ${correctCount} / ${validatedCount || 0}</span>
        </div>
        <div class="runner-bar">
          <div class="runner-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn" onclick="selectQuiz('${quiz.id}')">⏸ Pause / Retour</button>
        <button type="button" class="btn btn-ok" onclick="finishQuizEvaluation('${quiz.id}')">🏁 Terminer & Noter</button>
      </div>
    </div>

    ${questionsHtml}

    <div class="status-card" style="text-align:center;margin-top:24px;">
      <p style="margin-bottom:14px;">Vous avez validé <strong>${validatedCount}</strong> question(s) sur <strong>${quiz.count}</strong>.</p>
      <button type="button" class="btn btn-ok" style="font-size:15px;padding:11px 22px;" onclick="finishQuizEvaluation('${quiz.id}')">
        🏁 Valider l'évaluation finale et enregistrer mon score
      </button>
    </div>
  `;
  document.getElementById("back-top").style.display = "block";
}

function renderInteractiveQuestion(quiz, q, qIdx, qs) {
  const isValidated = qs.validated[qIdx] !== undefined;
  const isCorrect = qs.validated[qIdx] === true;
  const userAns = qs.answers[qIdx];
  const tyBadge = `<span class="q-type">${TY_LABEL[q.ty] || q.ty}</span>`;

  let bodyHtml = "";
  let feedbackHtml = "";

  if (q.ty === "multichoice") {
    const correctCount = (q.a || []).filter(a => a.ok).length;
    const isMulti = correctCount > 1;
    const inputType = isMulti ? "checkbox" : "radio";
    const pickedArr = Array.isArray(userAns) ? userAns : (userAns !== undefined ? [userAns] : []);

    bodyHtml = `<div class="answers">` + (q.a || []).map((a, aIdx) => {
      const checked = pickedArr.includes(aIdx);
      let cls = "ans ans-interactive";
      if (isValidated) {
        if (a.ok) cls += " correct";
        else if (checked) cls += " wrong-picked";
      } else if (checked) {
        cls += " selected";
      }
      const fb = (isValidated && a.fb && (a.ok || checked)) ? `<div class="fb">${esc(a.fb)}</div>` : "";
      return `
        <label class="${cls}">
          <input type="${inputType}" name="q_${qIdx}" value="${aIdx}" ${checked ? "checked" : ""} ${isValidated ? "disabled" : ""}
            onchange="handleMultiChange('${quiz.id}', ${qIdx}, ${aIdx}, ${isMulti})">
          <div style="flex:1;">${esc(a.t)}${fb}</div>
        </label>
      `;
    }).join("") + `</div>`;
  } else if (q.ty === "shortanswer" || q.ty === "numerical") {
    const val = userAns !== undefined ? userAns : "";
    bodyHtml = `
      <div class="short-input-row">
        <input type="text" class="short-input" id="inp_${qIdx}" value="${esc(val)}"
          placeholder="${q.ty === "numerical" ? "Saisissez un nombre…" : "Saisissez votre réponse…"}"
          ${isValidated ? "disabled" : ""}
          oninput="handleShortInput('${quiz.id}', ${qIdx}, this.value)">
      </div>
    `;
    if (isValidated) {
      const expected = (q.a || []).find(a => a.ok);
      feedbackHtml = `
        <div class="q-feedback-box ${isCorrect ? "ok" : ""}">
          <strong>${isCorrect ? "✓ Bonne réponse !" : "✗ Réponse attendue : " + esc(expected ? expected.t : "")}</strong>
          ${expected && expected.fb ? `<div style="margin-top:6px;">${esc(expected.fb)}</div>` : ""}
        </div>
      `;
    }
  } else if (q.ty === "matching") {
    const pairs = q.pairs || [];
    const optionsPool = [...pairs.map(p => p.r)].sort((a, b) => a.localeCompare(b, "fr"));
    const currentSel = Array.isArray(userAns) ? userAns : [];

    bodyHtml = `<div class="pairs">` + pairs.map((p, pIdx) => {
      const selVal = currentSel[pIdx] || "";
      const optsHtml = `<option value="">— Choisir la correspondance —</option>` +
        optionsPool.map(opt => `<option value="${esc(opt)}" ${selVal === opt ? "selected" : ""}>${esc(opt)}</option>`).join("");
      const pairOk = isValidated && selVal === p.r;
      const borderStyle = isValidated ? (pairOk ? "border-color:var(--ok);background:var(--okbg);" : "border-color:#c95b63;background:#fbeeed;") : "";

      return `
        <div class="pair">
          <span>${esc(p.l)}</span>
          <div>
            <select style="${borderStyle}" ${isValidated ? "disabled" : ""} onchange="handleMatchingChange('${quiz.id}', ${qIdx}, ${pIdx}, this.value)">
              ${optsHtml}
            </select>
            ${isValidated && !pairOk ? `<div style="font-size:11.5px;color:var(--ok);margin-top:3px;">✓ ${esc(p.r)}</div>` : ""}
          </div>
        </div>
      `;
    }).join("") + `</div>`;

    if (isValidated) {
      feedbackHtml = `<div class="q-feedback-box ${isCorrect ? "ok" : ""}"><strong>${isCorrect ? "✓ Toutes les associations sont exactes !" : "✗ Certaines associations sont incorrectes (corrections affichées en vert)."}</strong></div>`;
    }
  } else if (q.ty === "cloze") {
    const currentBlanks = Array.isArray(userAns) ? userAns : [];
    let blankIdx = 0;
    const renderedCloze = esc(q.text || "").replace(/\{[^{}]*?[^:]*:=([^}]*?)\}/g, (m, w) => {
      const idx = blankIdx++;
      const expectedMain = w.split("~~")[0];
      const val = currentBlanks[idx] || "";
      const validAlts = w.split("~~").map(v => normalizeStr(v));
      const blankOk = isValidated && validAlts.includes(normalizeStr(val));
      const cls = "cloze-input" + (isValidated ? (blankOk ? " ok" : " ko") : "");
      const corrHint = (isValidated && !blankOk) ? ` <mark>${esc(expectedMain)}</mark>` : "";
      return `<input type="text" class="${cls}" value="${esc(val)}" ${isValidated ? "disabled" : ""} oninput="handleClozeInput('${quiz.id}', ${qIdx}, ${idx}, this.value)">${corrHint}`;
    });

    bodyHtml = `<div class="cloze-text">${renderedCloze}</div>`;
    if (isValidated) {
      feedbackHtml = `<div class="q-feedback-box ${isCorrect ? "ok" : ""}"><strong>${isCorrect ? "✓ Texte à trous complété avec succès !" : "✗ Vérifiez les termes surlignés en jaune."}</strong></div>`;
    }
  }

  const cardStateCls = isValidated ? (isCorrect ? " q-answered-ok" : " q-answered-ko") : "";
  const validateBtnHtml = !isValidated
    ? `<div class="q-validate-row"><span style="font-size:12px;color:var(--muted);">Sélectionnez ou saisissez votre réponse puis validez.</span><button type="button" class="btn btn-primary" onclick="validateSingleQuestion('${quiz.id}', ${qIdx})">Valider cette question</button></div>`
    : "";

  return `
    <section class="question${cardStateCls}" id="q${qIdx}">
      <div class="q-top">
        <span class="q-num">Q${qIdx + 1}</span>
        <span class="q-text">${esc(q.q)}</span>
        ${tyBadge}
      </div>
      ${bodyHtml}
      ${validateBtnHtml}
      ${feedbackHtml}
    </section>
  `;
}

/**
 * GESTIONNAIRES DE SAISIE DES RÉPONSES
 */
function handleMultiChange(quizId, qIdx, optIdx, isMulti) {
  const qs = getQuizState(quizId);
  if (isMulti) {
    const cur = Array.isArray(qs.answers[qIdx]) ? [...qs.answers[qIdx]] : [];
    const pos = cur.indexOf(optIdx);
    if (pos === -1) cur.push(optIdx);
    else cur.splice(pos, 1);
    qs.answers[qIdx] = cur;
  } else {
    qs.answers[qIdx] = [optIdx];
  }
  if (qs.status !== "COMPLETED") qs.status = "IN_PROGRESS";
  saveUserState();
  renderMenu();
}

function handleShortInput(quizId, qIdx, val) {
  const qs = getQuizState(quizId);
  qs.answers[qIdx] = val;
  if (qs.status !== "COMPLETED") qs.status = "IN_PROGRESS";
  saveUserState();
}

function handleMatchingChange(quizId, qIdx, pairIdx, val) {
  const qs = getQuizState(quizId);
  const cur = Array.isArray(qs.answers[qIdx]) ? [...qs.answers[qIdx]] : [];
  cur[pairIdx] = val;
  qs.answers[qIdx] = cur;
  if (qs.status !== "COMPLETED") qs.status = "IN_PROGRESS";
  saveUserState();
}

function handleClozeInput(quizId, qIdx, blankIdx, val) {
  const qs = getQuizState(quizId);
  const cur = Array.isArray(qs.answers[qIdx]) ? [...qs.answers[qIdx]] : [];
  cur[blankIdx] = val;
  qs.answers[qIdx] = cur;
  if (qs.status !== "COMPLETED") qs.status = "IN_PROGRESS";
  saveUserState();
}

function validateSingleQuestion(quizId, qIdx) {
  const quiz = QUIZZES.find(q => q.id === quizId);
  const qs = getQuizState(quizId);
  const q = quiz.questions[qIdx];

  const ans = qs.answers[qIdx];
  const isEmpty =
    ans === undefined ||
    ans === "" ||
    (Array.isArray(ans) && ans.length === 0) ||
    (Array.isArray(ans) && ans.every(x => !x && x !== 0));

  if (isEmpty) {
    showToast("Veuillez d'abord renseigner une réponse avant de valider.");
    return;
  }

  qs.validated[qIdx] = evaluateQuestion(q, ans);
  if (qs.status !== "COMPLETED") {
    qs.status = "IN_PROGRESS";
  }
  saveUserState();
  renderMenu();
  renderQuizRunner(quiz);
}

/**
 * CLÔTURE ET ÉVALUATION FINALE D'UN QCM
 */
function finishQuizEvaluation(quizId) {
  const quiz = QUIZZES.find(q => q.id === quizId);
  const qs = getQuizState(quizId);

  // Valider automatiquement les questions éventuellement répondues mais non encore cliquées
  quiz.questions.forEach((q, idx) => {
    if (qs.validated[idx] === undefined && qs.answers[idx] !== undefined) {
      qs.validated[idx] = evaluateQuestion(q, qs.answers[idx]);
    }
  });

  const correctCount = quiz.questions.reduce((sum, q, idx) => sum + (qs.validated[idx] === true ? 1 : 0), 0);
  const scorePct = Math.round((correctCount / quiz.count) * 100);
  const now = new Date().toISOString();

  const previouslyUnlocked = CHALLENGES.filter(c => c.check(userState)).map(c => c.id);

  qs.status = "COMPLETED";
  qs.lastScore = scorePct;
  if (qs.bestScore === null || scorePct > qs.bestScore) {
    qs.bestScore = scorePct;
  }
  qs.attempts.push({ date: now, score: scorePct, correct: correctCount, total: quiz.count });

  // Réinitialiser le brouillon en cours pour permettre une future tentative propre
  qs.answers = {};
  qs.validated = {};

  userState.history.unshift({
    quizId: quiz.id,
    title: quiz.title,
    author: quiz.author,
    date: now,
    score: scorePct,
    correct: correctCount,
    total: quiz.count
  });

  // Vérification d'un défi actif ciblé
  if (userState.activeChallenge && userState.activeChallenge.quizId === quiz.id) {
    if (scorePct >= userState.activeChallenge.targetScore) {
      showToast(`🏆 Défi réussi (${scorePct}% ≥ ${userState.activeChallenge.targetScore}%) !`);
      userState.activeChallenge = null;
    } else {
      showToast(`Score : ${scorePct}%. Objectif du défi : ${userState.activeChallenge.targetScore}%. Réessayez !`);
    }
  } else {
    showToast(`Évaluation terminée : ${scorePct}% (${correctCount}/${quiz.count})`);
  }

  saveUserState();

  // Notification de nouveaux badges débloqués
  const newlyUnlocked = CHALLENGES.filter(c => !previouslyUnlocked.includes(c.id) && c.check(userState));
  if (newlyUnlocked.length > 0) {
    setTimeout(() => showToast(`🎖️ Nouveau défi débloqué : ${newlyUnlocked[0].title} !`), 1600);
  }

  renderMenu();
  renderQuizContextualIntro(quiz, "COMPLETED");
  mainEl.scrollTop = 0;
}

/**
 * MODE CORRIGÉ COMPLET (CONSULTATION LIBRE DES RÉPONSES & FEEDBACKS)
 */
function decoze(t) {
  return esc(t)
    .replace(/\{[^{}]*?[^:]*:=([^}]*?)\}/g, (m, w) => "<mark>" + w.split("~~")[0] + "</mark>")
    .replace(/\{[^{}]*?\}/g, "______");
}

function renderStaticAnswer(item) {
  if (item.ty === "matching") {
    const rows = (item.pairs || []).map(p =>
      `<div class="pair"><span>${esc(p.l)}</span><span>${esc(p.r)}</span></div>`
    ).join("");
    return `<div class="pairs">${rows}</div>`;
  }
  if (item.ty === "cloze") {
    return `<div class="cloze-text">${decoze(item.text || "")}</div>`;
  }
  const ans = (item.a || []).map(a => {
    const cls = a.ok ? " correct" : "";
    const fb = a.fb ? `<div class="fb">${esc(a.fb)}</div>` : "";
    return `<div class="ans${cls}">${esc(a.t)}${fb}</div>`;
  }).join("");
  return `<div class="answers">${ans}</div>`;
}

function openCorrectionMode(quizId) {
  const quiz = QUIZZES.find(q => q.id === quizId);
  if (!quiz) return;
  uiState.activeQuizId = quizId;
  uiState.view = "QUIZ_CORRECTION";
  renderMenu();

  const qsHtml = quiz.questions.map((q, i) => {
    const tyBadge = `<span class="q-type">${TY_LABEL[q.ty] || q.ty}</span>`;
    const extra = q.text && q.ty !== "cloze" ? `<div class="cloze-text">${decoze(q.text)}</div>` : "";
    return `
      <section class="question" id="q${i}">
        <div class="q-top">
          <span class="q-num">Q${i + 1}</span>
          <span class="q-text">${esc(q.q)}</span>
          ${tyBadge}
        </div>
        ${extra}
        ${renderStaticAnswer(q)}
      </section>
    `;
  }).join("");

  contentEl.innerHTML = `
    ${renderChallengeBannerHTML()}
    <div class="qcm-head">
      <h2>${esc(quiz.title)}</h2>
      <div class="meta">
        <span>${quiz.count} question${quiz.count > 1 ? "s" : ""} — Mode Corrigé : réponses exactes en vert et explications « Pourquoi ».</span>
      </div>
    </div>
    <div class="action-bar" style="margin-bottom:20px;">
      <button type="button" class="btn" onclick="selectQuiz('${quiz.id}')">← Retour à la fiche du QCM</button>
      <button type="button" class="btn btn-primary" onclick="startQuizRun('${quiz.id}', false)">▶ Passer en mode entraînement</button>
    </div>
    ${qsHtml}
  `;
  document.getElementById("back-top").style.display = "block";
  mainEl.scrollTop = 0;
}

/**
 * GÉNÉRATEUR DE DÉFIS CIBLÉS
 */
function launchRandomChallenge() {
  // Prioriser les QCM non faits ou avec un score < 85%
  const candidates = QUIZZES.filter(q => {
    const qs = getQuizState(q.id);
    return qs.status !== "COMPLETED" || (qs.bestScore ?? 0) < 85;
  });
  const pool = candidates.length > 0 ? candidates : QUIZZES;
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  const qs = getQuizState(chosen.id);

  const targetScore = qs.bestScore !== null ? Math.min(100, Math.max(80, qs.bestScore + 15)) : 80;

  userState.activeChallenge = {
    quizId: chosen.id,
    title: `Objectif ${targetScore}% sur ${chosen.author}`,
    targetScore
  };
  saveUserState();
  showToast(`⚔️ Défi lancé sur « ${chosen.title} » !`);
  selectQuiz(chosen.id);
}

function cancelChallenge() {
  userState.activeChallenge = null;
  saveUserState();
  if (uiState.view === "DASHBOARD") renderDashboard();
  else if (uiState.activeQuizId) selectQuiz(uiState.activeQuizId);
}

/**
 * TABLEAU DE BORD GLOBAL : PERFORMANCES, PROGRESSION PAR AUTEUR & DÉFIS
 */
function renderDashboard() {
  uiState.view = "DASHBOARD";
  uiState.activeQuizId = null;
  renderMenu();

  const totalQcm = QUIZZES.length;
  const visitedCount = QUIZZES.filter(q => getQuizState(q.id).visited).length;
  const inProgressList = QUIZZES.filter(q => getQuizState(q.id).status === "IN_PROGRESS");
  const completedList = QUIZZES.filter(q => getQuizState(q.id).status === "COMPLETED");

  const scores = completedList.map(q => getQuizState(q.id).bestScore).filter(s => s !== null);
  const avgScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const unlockedChallenges = CHALLENGES.filter(c => c.check(userState)).length;

  // Regroupement par auteur / thème
  const authors = [...new Set(QUIZZES.map(q => q.author))];
  const topicBarsHtml = authors.map(author => {
    const groupQuizzes = QUIZZES.filter(q => q.author === author);
    const doneInGroup = groupQuizzes.filter(q => getQuizState(q.id).status === "COMPLETED");
    const groupScores = doneInGroup.map(q => getQuizState(q.id).bestScore);
    const groupAvg = groupScores.length ? Math.round(groupScores.reduce((a, b) => a + b, 0) / groupScores.length) : 0;
    const compPct = Math.round((doneInGroup.length / groupQuizzes.length) * 100);

    return `
      <div class="topic-row">
        <div class="topic-row-top">
          <span>${esc(author)} (${doneInGroup.length}/${groupQuizzes.length} QCM terminés)</span>
          <span>${groupScores.length ? `Score moyen : ${groupAvg}%` : "Non évalué"}</span>
        </div>
        <div class="mini-bar" style="height:7px;">
          <div class="mini-bar-fill done" style="width:${compPct}%"></div>
        </div>
      </div>
    `;
  }).join("");

  // Cartes des défis
  const challengesHtml = CHALLENGES.map(c => {
    const unlocked = c.check(userState);
    return `
      <div class="chal-card ${unlocked ? "unlocked" : ""}">
        <div>
          <div class="chal-head">
            <span class="chal-title">${esc(c.title)}</span>
            <span class="chal-badge">${unlocked ? "✓ Débloqué" : "En cours"}</span>
          </div>
          <p class="chal-desc" style="margin-top:6px;">${esc(c.desc)}</p>
        </div>
      </div>
    `;
  }).join("");

  // Reprise rapide des QCM en cours
  let resumeSectionHtml = "";
  if (inProgressList.length > 0) {
    resumeSectionHtml = `
      <div class="section-title"><span>⏳ QCM en cours (reprise rapide)</span></div>
      <div class="challenges-grid">
        ${inProgressList.map(q => {
          const qs = getQuizState(q.id);
          const doneQ = Object.keys(qs.validated || {}).length;
          return `
            <div class="chal-card" style="border-left:4px solid var(--warn);">
              <div>
                <div class="chal-title">${esc(q.title)}</div>
                <p class="chal-desc" style="margin-top:4px;">Avancement : ${doneQ} / ${q.count} questions validées</p>
              </div>
              <button type="button" class="btn btn-warn" style="justify-content:center;" onclick="startQuizRun('${q.id}', true)">▶ Reprendre</button>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  // Historique des dernières évaluations
  let historyHtml = `<p style="color:var(--muted);font-size:13.5px;">Aucune évaluation terminée pour le moment. Sélectionnez un QCM à gauche ou lancez un défi !</p>`;
  if (userState.history.length > 0) {
    const rows = userState.history.slice(0, 12).map(h => `
      <tr>
        <td>${formatDateFR(h.date)}</td>
        <td><strong>${esc(h.title)}</strong></td>
        <td>${h.correct} / ${h.total}</td>
        <td><span class="score-badge ${h.score >= 80 ? "high" : h.score >= 50 ? "mid" : ""}">${h.score}%</span></td>
      </tr>
    `).join("");
    historyHtml = `
      <table class="history-table">
        <thead><tr><th>Date</th><th>QCM</th><th>Bonnes réponses</th><th>Score</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  contentEl.innerHTML = `
    ${renderChallengeBannerHTML()}
    <div class="qcm-head">
      <h2>QCM Défi — Tableau de bord & Suivi personnalisé</h2>
      <div class="meta">
        <span>Consultez votre progression, vos résultats par thème et relevez les défis de révision.</span>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">QCM TERMINÉS</div>
        <div class="kpi-val">${completedList.length} / ${totalQcm}</div>
        <div class="kpi-sub">${visitedCount} consultés · ${inProgressList.length} en cours</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">SCORE MOYEN (RECORDS)</div>
        <div class="kpi-val">${avgScore !== null ? avgScore + "%" : "—"}</div>
        <div class="kpi-sub">${userState.history.length} évaluation(s) enregistrée(s)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">DÉFIS VALIDÉS</div>
        <div class="kpi-val">${unlockedChallenges} / ${CHALLENGES.length}</div>
        <div class="kpi-sub">Objectifs de maîtrise</div>
      </div>
    </div>

    ${resumeSectionHtml}

    <div class="section-title">
      <span>🏆 Défis philosophiques</span>
      <button type="button" class="btn btn-primary" style="font-size:12.5px;padding:6px 12px;" onclick="launchRandomChallenge()">⚔️ Nouveau défi ciblé</button>
    </div>
    <div class="challenges-grid">
      ${challengesHtml}
    </div>

    <div class="section-title"><span>📚 Avancement par auteur & thème</span></div>
    <div class="topic-list">
      ${topicBarsHtml}
    </div>

    <div class="section-title">
      <span>🕒 Historique des évaluations</span>
      ${userState.history.length > 0 ? `<button type="button" class="btn btn-danger" style="font-size:12px;padding:5px 10px;" onclick="resetAllProgress()">Réinitialiser le suivi</button>` : ""}
    </div>
    ${historyHtml}
  `;
  document.getElementById("back-top").style.display = "none";
}

function resetAllProgress() {
  askConfirm(
    "Réinitialiser tout votre suivi ?",
    "Tous vos scores, statuts d'avancement, tentatives et défis seront remis à zéro.",
    () => {
      localStorage.removeItem(STORAGE_KEY);
      userState = loadUserState();
      saveUserState();
      renderDashboard();
      showToast("Suivi personnalisé réinitialisé.");
    }
  );
}

/**
 * ÉVÉNEMENTS GLOBAUX
 */
document.getElementById("search").addEventListener("input", (e) => {
  uiState.search = e.target.value;
  renderMenu();
});

document.getElementById("sort-select").addEventListener("change", (e) => {
  uiState.sortBy = e.target.value;
  renderMenu();
});

document.getElementById("author-filter").addEventListener("change", (e) => {
  uiState.authorFilter = e.target.value;
  renderMenu();
});

document.querySelectorAll("#status-tabs .st-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#status-tabs .st-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    uiState.statusFilter = tab.dataset.filter;
    renderMenu();
  });
});

document.getElementById("btn-view-dashboard").addEventListener("click", () => {
  renderDashboard();
  mainEl.scrollTop = 0;
});

document.getElementById("btn-launch-challenge").addEventListener("click", launchRandomChallenge);

document.getElementById("back-top").addEventListener("click", () => {
  mainEl.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---- Thèmes (identiques au modèle des QCM) ---- */
function setTheme(t) {
  document.body.setAttribute("data-theme", t);
  try { localStorage.setItem("qcm_theme", t); } catch (e) {}
}
try {
  const savedTheme = localStorage.getItem("qcm_theme");
  if (savedTheme) {
    const sel = document.getElementById("themesel");
    if (sel) sel.value = savedTheme;
    setTheme(savedTheme);
  } else { setTheme("pronote"); }
} catch (e) { setTheme("pronote"); }

// Démarrage de l'application
initFilters();
updateGlobalIndicators();
renderDashboard();
</script>
