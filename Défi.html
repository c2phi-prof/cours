rt et stable, l'esprit peut mûrir sans péril."}]}, {"ty": "multichoice", "q": "Quel est, au terme du processus des Lumières, l'effet de la pensée libre sur l'autorité politique elle-même ?", "a": [{"ok": true, "t": "Le pouvoir apprend à traiter l'être humain conformément à sa dignité naturelle.", "fb": "L'émancipation de l'esprit finit par transformer le comportement de l'État envers ses sujets. En apprenant à penser librement, l'homme acquiert une liberté d'agir qui incite le gouvernement à le considérer comme plus qu'une machine : comme un être digne de respect."}, {"ok": false, "t": "L'État disparaît pour laisser place à une société sans gouvernants.", "fb": "L'émancipation de l'esprit finit par transformer le comportement de l'État envers ses sujets. En apprenant à penser librement, l'homme acquiert une liberté d'agir qui incite le gouvernement à le considérer comme plus qu'une machine : comme un être digne de respect."}, {"ok": false, "t": "Le monarque abandonne toutes ses prérogatives militaires pour devenir philosophe.", "fb": "L'émancipation de l'esprit finit par transformer le comportement de l'État envers ses sujets. En apprenant à penser librement, l'homme acquiert une liberté d'agir qui incite le gouvernement à le considérer comme plus qu'une machine : comme un être digne de respect."}, {"ok": false, "t": "Des experts prennent la direction des institutions ministérielles et de la police.", "fb": "L'émancipation de l'esprit finit par transformer le comportement de l'État envers ses sujets. En apprenant à penser librement, l'homme acquiert une liberté d'agir qui incite le gouvernement à le considérer comme plus qu'une machine : comme un être digne de respect."}]}]}, {"ti": "La maxime (TG9)", "n": 17, "q": [{"ty": "multichoice", "q": "Par quel élément se termine l'exemple de la fausse promesse, et pourquoi cet élément est-il décisif pour la suite du texte ?", "a": [{"ok": true, "t": "Par une question que l'individu se pose à lui-même (« n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient ? ») : c'est avec cette question que commence le problème du texte.", "fb": "L'exemple commence ligne 2 (la thèse étant ligne 1) et s'achève sur une question. Les termes à relever sont : conscience morale, interdit, contraire au devoir. L'individu se demande si le fait de mentir, de faire une fausse promesse pour se tirer d'affaire, est permis : il se pose un cas de conscience, c'est-à-dire un dilemme moral. Le dilemme est une forme de contradiction : la conscience morale rencontre une contradiction (le besoin le pousse à mentir, sa conscience lui demande s'il en a le droit). C'est à partir de cette contradiction qu'apparaît le problème du texte : avant cette question, aucun indice ne permettait de le formuler. Conséquence de méthode pour la dissertation : il faut chercher la contradiction implicite du sujet (paradoxe, dilemme, contradiction entre des idées) pour construire la problématique."}, {"ok": false, "t": "Par la thèse de l'auteur, énoncée dès la première ligne du texte.", "fb": "L'exemple commence ligne 2 (la thèse étant ligne 1) et s'achève sur une question. Les termes à relever sont : conscience morale, interdit, contraire au devoir. L'individu se demande si le fait de mentir, de faire une fausse promesse pour se tirer d'affaire, est permis : il se pose un cas de conscience, c'est-à-dire un dilemme moral. Le dilemme est une forme de contradiction : la conscience morale rencontre une contradiction (le besoin le pousse à mentir, sa conscience lui demande s'il en a le droit). C'est à partir de cette contradiction qu'apparaît le problème du texte : avant cette question, aucun indice ne permettait de le formuler. Conséquence de méthode pour la dissertation : il faut chercher la contradiction implicite du sujet (paradoxe, dilemme, contradiction entre des idées) pour construire la problématique."}, {"ok": false, "t": "Par la formulation de la loi universelle, qui conclut l'exemple.", "fb": "L'exemple commence ligne 2 (la thèse étant ligne 1) et s'achève sur une question. Les termes à relever sont : conscience morale, interdit, contraire au devoir. L'individu se demande si le fait de mentir, de faire une fausse promesse pour se tirer d'affaire, est permis : il se pose un cas de conscience, c'est-à-dire un dilemme moral. Le dilemme est une forme de contradiction : la conscience morale rencontre une contradiction (le besoin le pousse à mentir, sa conscience lui demande s'il en a le droit). C'est à partir de cette contradiction qu'apparaît le problème du texte : avant cette question, aucun indice ne permettait de le formuler. Conséquence de méthode pour la dissertation : il faut chercher la contradiction implicite du sujet (paradoxe, dilemme, contradiction entre des idées) pour construire la problématique."}, {"ok": false, "t": "Par un second exemple de mensonge, qui confirme le premier.", "fb": "L'exemple commence ligne 2 (la thèse étant ligne 1) et s'achève sur une question. Les termes à relever sont : conscience morale, interdit, contraire au devoir. L'individu se demande si le fait de mentir, de faire une fausse promesse pour se tirer d'affaire, est permis : il se pose un cas de conscience, c'est-à-dire un dilemme moral. Le dilemme est une forme de contradiction : la conscience morale rencontre une contradiction (le besoin le pousse à mentir, sa conscience lui demande s'il en a le droit). C'est à partir de cette contradiction qu'apparaît le problème du texte : avant cette question, aucun indice ne permettait de le formuler. Conséquence de méthode pour la dissertation : il faut chercher la contradiction implicite du sujet (paradoxe, dilemme, contradiction entre des idées) pour construire la problématique."}]}, {"ty": "multichoice", "q": "La question que se pose l'individu (« est-ce que j'ai le droit de mentir ? ») porte sur quel type de droit ?", "a": [{"ok": true, "t": "Le droit au sens moral : la légitimité. Il se demande si son mensonge est conforme au devoir, non s'il est conforme à la loi.", "fb": "La nature du problème posé par l'individu n'est pas d'ordre juridique : il se demande s'il a le droit de mentir, mais au sens de « faut-il ? », « est-ce permis ? », c'est-à-dire au sens moral. C'est le repère du programme légal / légitime, à lire dans le livre à la page 528 et dans la fiche « Découvrir les repères » sur Pronote. Ce qui est légal est conforme à la loi ; ce qui est légitime est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale. Les deux ne coïncident pas : ce qui est légal peut ne pas être légitime (mentir est légal, mais moralement condamnable : on apprend aux enfants à ne pas mentir), et ce qui est légitime peut ne pas être légal."}, {"ok": false, "t": "Le droit au sens juridique : il se demande si le mensonge est puni par la loi.", "fb": "La nature du problème posé par l'individu n'est pas d'ordre juridique : il se demande s'il a le droit de mentir, mais au sens de « faut-il ? », « est-ce permis ? », c'est-à-dire au sens moral. C'est le repère du programme légal / légitime, à lire dans le livre à la page 528 et dans la fiche « Découvrir les repères » sur Pronote. Ce qui est légal est conforme à la loi ; ce qui est légitime est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale. Les deux ne coïncident pas : ce qui est légal peut ne pas être légitime (mentir est légal, mais moralement condamnable : on apprend aux enfants à ne pas mentir), et ce qui est légitime peut ne pas être légal."}, {"ok": false, "t": "Le droit au sens économique : il se demande s'il peut rembourser l'argent emprunté.", "fb": "La nature du problème posé par l'individu n'est pas d'ordre juridique : il se demande s'il a le droit de mentir, mais au sens de « faut-il ? », « est-ce permis ? », c'est-à-dire au sens moral. C'est le repère du programme légal / légitime, à lire dans le livre à la page 528 et dans la fiche « Découvrir les repères » sur Pronote. Ce qui est légal est conforme à la loi ; ce qui est légitime est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale. Les deux ne coïncident pas : ce qui est légal peut ne pas être légitime (mentir est légal, mais moralement condamnable : on apprend aux enfants à ne pas mentir), et ce qui est légitime peut ne pas être légal."}, {"ok": false, "t": "Le droit au sens psychologique : il se demande s'il aura le courage de mentir.", "fb": "La nature du problème posé par l'individu n'est pas d'ordre juridique : il se demande s'il a le droit de mentir, mais au sens de « faut-il ? », « est-ce permis ? », c'est-à-dire au sens moral. C'est le repère du programme légal / légitime, à lire dans le livre à la page 528 et dans la fiche « Découvrir les repères » sur Pronote. Ce qui est légal est conforme à la loi ; ce qui est légitime est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale. Les deux ne coïncident pas : ce qui est légal peut ne pas être légitime (mentir est légal, mais moralement condamnable : on apprend aux enfants à ne pas mentir), et ce qui est légitime peut ne pas être légal."}]}, {"ty": "multichoice", "q": "Vrai ou faux : mentir n'est pas un délit ; ce que la loi punit, c'est l'abus de confiance.", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai. Il ne faut pas confondre le mensonge, qui n'est pas illégal (mentir n'est pas un délit), et l'abus de confiance, qui est un délit. L'abus de confiance consiste à tromper la confiance de quelqu'un, à chercher à tirer profit de lui en abusant de sa vulnérabilité, de sa faiblesse ou de son ignorance (par exemple escroquer une personne âgée), pour lui nuire ou pour satisfaire ses propres intérêts. Mentir n'est pas puni par la loi : on peut même mentir à la police, sauf si l'on est sous serment. Cela ne veut pas dire que la loi autorise le mensonge : rien n'est écrit dans la loi en ce sens, mais il n'y a pas de loi contre le mensonge. Dans l'exemple, promettre de rendre de l'argent que l'on sait ne jamais pouvoir rendre est un mensonge, mais pas un abus de confiance : l'individu n'est pas un escroc, il ne cherche pas à abuser de la confiance de son créancier pour lui nuire."}, {"ok": false, "t": "Faux", "fb": "Vrai. Il ne faut pas confondre le mensonge, qui n'est pas illégal (mentir n'est pas un délit), et l'abus de confiance, qui est un délit. L'abus de confiance consiste à tromper la confiance de quelqu'un, à chercher à tirer profit de lui en abusant de sa vulnérabilité, de sa faiblesse ou de son ignorance (par exemple escroquer une personne âgée), pour lui nuire ou pour satisfaire ses propres intérêts. Mentir n'est pas puni par la loi : on peut même mentir à la police, sauf si l'on est sous serment. Cela ne veut pas dire que la loi autorise le mensonge : rien n'est écrit dans la loi en ce sens, mais il n'y a pas de loi contre le mensonge. Dans l'exemple, promettre de rendre de l'argent que l'on sait ne jamais pouvoir rendre est un mensonge, mais pas un abus de confiance : l'individu n'est pas un escroc, il ne cherche pas à abuser de la confiance de son créancier pour lui nuire."}]}, {"ty": "shortanswer", "q": "Quel terme désigne l'appât du gain, l'avidité pour l'argent, le fait de désirer de l'argent même sans en avoir besoin ?", "a": [{"ok": true, "t": "la cupidité", "fb": "La cupidité, c'est l'appât du gain, l'avidité pour l'argent. L'individu de l'exemple ne ment pas par cupidité : il ment parce qu'il en a vraiment besoin, il est dans la détresse financière. C'est ce qui distingue son cas de celui d'un escroc, et c'est pourquoi son cas pose un vrai problème moral : ses raisons sont bonnes, même si son acte (mentir) pose problème."}, {"ok": true, "t": "cupidité", "fb": ""}, {"ok": true, "t": "l'avidité", "fb": ""}, {"ok": true, "t": "avidité", "fb": ""}]}, {"ty": "multichoice", "q": "Selon le cours, qu'est-ce exactement que le « légal » ?", "a": [{"ok": true, "t": "Ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas.", "fb": "Le légal, c'est ce qui est conforme à la loi : tout ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas. Mentir est légal parce qu'il n'y a pas de loi contre le mensonge, même si aucune loi n'autorise expressément le mensonge : ce n'est pas parce que c'est écrit dans la loi que c'est légal, c'est parce que ce n'est pas interdit. C'est pourquoi le problème de l'exemple n'est pas un problème de légalité : la fausse promesse n'est pas illégale. Le problème est un problème de légitimité : est-elle moralement permise ? Est-elle conforme au devoir ?"}, {"ok": false, "t": "Uniquement ce que la loi autorise expressément par écrit.", "fb": "Le légal, c'est ce qui est conforme à la loi : tout ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas. Mentir est légal parce qu'il n'y a pas de loi contre le mensonge, même si aucune loi n'autorise expressément le mensonge : ce n'est pas parce que c'est écrit dans la loi que c'est légal, c'est parce que ce n'est pas interdit. C'est pourquoi le problème de l'exemple n'est pas un problème de légalité : la fausse promesse n'est pas illégale. Le problème est un problème de légitimité : est-elle moralement permise ? Est-elle conforme au devoir ?"}, {"ok": false, "t": "Uniquement ce que la loi interdit.", "fb": "Le légal, c'est ce qui est conforme à la loi : tout ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas. Mentir est légal parce qu'il n'y a pas de loi contre le mensonge, même si aucune loi n'autorise expressément le mensonge : ce n'est pas parce que c'est écrit dans la loi que c'est légal, c'est parce que ce n'est pas interdit. C'est pourquoi le problème de l'exemple n'est pas un problème de légalité : la fausse promesse n'est pas illégale. Le problème est un problème de légitimité : est-elle moralement permise ? Est-elle conforme au devoir ?"}, {"ok": false, "t": "Ce qui est conforme à la morale, indépendamment de la loi.", "fb": "Le légal, c'est ce qui est conforme à la loi : tout ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas. Mentir est légal parce qu'il n'y a pas de loi contre le mensonge, même si aucune loi n'autorise expressément le mensonge : ce n'est pas parce que c'est écrit dans la loi que c'est légal, c'est parce que ce n'est pas interdit. C'est pourquoi le problème de l'exemple n'est pas un problème de légalité : la fausse promesse n'est pas illégale. Le problème est un problème de légitimité : est-elle moralement permise ? Est-elle conforme au devoir ?"}]}, {"ty": "shortanswer", "q": "Comment le cours définit-il la maxime (formule courte) ?", "a": [{"ok": true, "t": "une règle de conduite", "fb": "La maxime est un principe d'action, une règle de conduite qui permet de réaliser mon intention. J'ai l'intention de faire quelque chose, je désire quelque chose : pour que cette intention devienne réelle, il faut que j'agisse, et je ne peux pas agir n'importe comment si je veux la satisfaire. Il faut agir en conséquence, que l'action soit efficace : il faut donc réfléchir à mon action avant d'agir. Cette réflexion sur ce que je dois faire, c'est la maxime : la règle de conduite que je me donne pour réaliser une intention. Sans maxime, l'intention resterait à l'état de simple désir et ne serait jamais réalisée."}, {"ok": true, "t": "règle de conduite", "fb": ""}, {"ok": true, "t": "un principe d'action", "fb": ""}, {"ok": true, "t": "principe d'action", "fb": ""}, {"ok": true, "t": "une règle de conduite que je me donne pour agir", "fb": ""}]}, {"ty": "multichoice", "q": "Pourquoi l'être humain doit-il se donner des règles de conduite avant d'agir ?", "a": [{"ok": true, "t": "Parce que ses actions ne sont pas déterminées par la nature : contrairement aux animaux, il doit choisir le sens de son existence et réfléchir à ce qu'il doit faire.", "fb": "Contrairement aux animaux, les actes de l'être humain ne sont pas déterminés par la nature. Mettez un renard dans un poulailler : on sait très bien ce qui va se passer, le renard ne peut pas agir autrement qu'en prédateur, son instinct naturel détermine ses actions. L'animal n'a pas à réfléchir à ses actes. L'être humain, lui, doit choisir le sens de son existence (perspective sur l'existence humaine et la culture déjà étudiée) : c'est pour cela qu'il doit se donner des règles de conduite avant d'agir, car ses actions ne sont pas instinctives, pas déterminées à l'avance. La maxime est cette règle que je me donne."}, {"ok": false, "t": "Parce que la société lui impose des règles qu'il ne peut pas discuter.", "fb": "Contrairement aux animaux, les actes de l'être humain ne sont pas déterminés par la nature. Mettez un renard dans un poulailler : on sait très bien ce qui va se passer, le renard ne peut pas agir autrement qu'en prédateur, son instinct naturel détermine ses actions. L'animal n'a pas à réfléchir à ses actes. L'être humain, lui, doit choisir le sens de son existence (perspective sur l'existence humaine et la culture déjà étudiée) : c'est pour cela qu'il doit se donner des règles de conduite avant d'agir, car ses actions ne sont pas instinctives, pas déterminées à l'avance. La maxime est cette règle que je me donne."}, {"ok": false, "t": "Parce qu'il agit par instinct et que l'instinct exige des règles.", "fb": "Contrairement aux animaux, les actes de l'être humain ne sont pas déterminés par la nature. Mettez un renard dans un poulailler : on sait très bien ce qui va se passer, le renard ne peut pas agir autrement qu'en prédateur, son instinct naturel détermine ses actions. L'animal n'a pas à réfléchir à ses actes. L'être humain, lui, doit choisir le sens de son existence (perspective sur l'existence humaine et la culture déjà étudiée) : c'est pour cela qu'il doit se donner des règles de conduite avant d'agir, car ses actions ne sont pas instinctives, pas déterminées à l'avance. La maxime est cette règle que je me donne."}, {"ok": false, "t": "Parce qu'il n'a pas de conscience et doit donc suivre des habitudes.", "fb": "Contrairement aux animaux, les actes de l'être humain ne sont pas déterminés par la nature. Mettez un renard dans un poulailler : on sait très bien ce qui va se passer, le renard ne peut pas agir autrement qu'en prédateur, son instinct naturel détermine ses actions. L'animal n'a pas à réfléchir à ses actes. L'être humain, lui, doit choisir le sens de son existence (perspective sur l'existence humaine et la culture déjà étudiée) : c'est pour cela qu'il doit se donner des règles de conduite avant d'agir, car ses actions ne sont pas instinctives, pas déterminées à l'avance. La maxime est cette règle que je me donne."}]}, {"ty": "multichoice", "q": "Parmi ces besoins ou comportements, lesquels le cours présente-t-il comme déjà modifiés par la culture, donc non naturels et non instinctifs ?", "a": [{"ok": true, "t": "Se nourrir : l'homme ne sait pas instinctivement ce qu'il doit manger, il doit l'apprendre (addictions, pathologies alimentaires, éducation alimentaire).", "fb": "Même les besoins les plus naturels de l'être humain, comme se nourrir, ont déjà été profondément modifiés par la culture. On ne se nourrit pas par instinct : la preuve, c'est que beaucoup développent des addictions ou des pathologies alimentaires, et qu'on doit éduquer un enfant pour qu'il s'alimente bien. L'homme ne sait pas naturellement ce qu'il doit manger : on le lui apprend."}, {"ok": true, "t": "Dormir : la fatigue et le sommeil sont réglés par la vie en société (fatigue après la journée de travail, horaires bouleversés par le travail de nuit).", "fb": "Même la fatigue, même le besoin de dormir, est déterminé par la société : si l'on est fatigué après une journée de travail, c'est à cause de la journée de travail ; celui qui travaille de nuit n'est pas fatigué à 18h mais à 5h du matin. Le sommeil est déjà réglé par notre vie en société."}, {"ok": true, "t": "L'amour maternel : l'amour d'une mère pour son enfant est appris (hérité de l'amour reçu de sa propre mère), il n'y a pas d'instinct maternel.", "fb": "Il n'y a pas d'amour naturel de la mère pour son enfant : l'amour qu'une mère peut éprouver est appris, c'est parce qu'elle a bénéficié de l'amour de sa propre mère qu'elle peut à son tour en éprouver. Et l'on sait bien qu'il y a des mères qui n'éprouvent pas d'amour pour leurs enfants. Il n'y a donc plus rien de naturel en l'homme : ni instinct de survie, ni instinct maternel."}, {"ok": false, "t": "La chasse animale : la lionne apprend des stratégies et fabrique des outils pour chasser.", "fb": "Même les besoins les plus naturels de l'être humain, comme se nourrir, ont déjà été profondément modifiés par la culture. On ne se nourrit pas par instinct : la preuve, c'est que beaucoup développent des addictions ou des pathologies alimentaires, et qu'on doit éduquer un enfant pour qu'il s'alimente bien. L'homme ne sait pas naturellement ce qu'il doit manger : on le lui apprend."}]}, {"ty": "multichoice", "q": "L'homme préhistorique chassait-il par instinct, selon le cours ?", "a": [{"ok": true, "t": "Non : il chassait grâce aux techniques et aux stratégies qu'il a créées (chasse en groupe, outils) ; le propre de l'instinct est de ne pas varier, de ne pas évoluer.", "fb": "L'homme préhistorique n'était pas plus proche de l'animal que nous : il ne s'est pas développé grâce à ses instincts, mais grâce à ses techniques. Il ne chassait pas par instinct : il a créé des techniques, développé des stratégies, appris à chasser en groupe et à fabriquer des outils. La lionne, elle, chasse par instinct : elle n'apprend pas à chasser, n'apprend pas de stratégies, ne fabrique pas d'outils. Le propre de l'instinct, c'est qu'il reste toujours le même et n'évolue pas : les animaux chassent aujourd'hui au 21e siècle comme ils chassaient il y a des centaines de milliers d'années. Si l'homme avait agi par instinct, il aurait été figé, il n'aurait pas changé. C'est le piège dans lequel la plupart sont tombés dans la dissertation « L'homme est-il un animal comme les autres ? » (correction à venir). On peut rattacher cela à la perfectibilité de l'homme."}, {"ok": false, "t": "Oui : comme les animaux, il chassait par instinct, car l'instinct permet de créer des techniques.", "fb": "L'homme préhistorique n'était pas plus proche de l'animal que nous : il ne s'est pas développé grâce à ses instincts, mais grâce à ses techniques. Il ne chassait pas par instinct : il a créé des techniques, développé des stratégies, appris à chasser en groupe et à fabriquer des outils. La lionne, elle, chasse par instinct : elle n'apprend pas à chasser, n'apprend pas de stratégies, ne fabrique pas d'outils. Le propre de l'instinct, c'est qu'il reste toujours le même et n'évolue pas : les animaux chassent aujourd'hui au 21e siècle comme ils chassaient il y a des centaines de milliers d'années. Si l'homme avait agi par instinct, il aurait été figé, il n'aurait pas changé. C'est le piège dans lequel la plupart sont tombés dans la dissertation « L'homme est-il un animal comme les autres ? » (correction à venir). On peut rattacher cela à la perfectibilité de l'homme."}, {"ok": false, "t": "Oui : l'homme préhistorique était plus proche de l'animal que l'homme d'aujourd'hui.", "fb": "L'homme préhistorique n'était pas plus proche de l'animal que nous : il ne s'est pas développé grâce à ses instincts, mais grâce à ses techniques. Il ne chassait pas par instinct : il a créé des techniques, développé des stratégies, appris à chasser en groupe et à fabriquer des outils. La lionne, elle, chasse par instinct : elle n'apprend pas à chasser, n'apprend pas de stratégies, ne fabrique pas d'outils. Le propre de l'instinct, c'est qu'il reste toujours le même et n'évolue pas : les animaux chassent aujourd'hui au 21e siècle comme ils chassaient il y a des centaines de milliers d'années. Si l'homme avait agi par instinct, il aurait été figé, il n'aurait pas changé. C'est le piège dans lequel la plupart sont tombés dans la dissertation « L'homme est-il un animal comme les
