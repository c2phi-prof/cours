multichoice", "q": "Selon Popper, à quelle condition une théorie est-elle scientifique, et quelle en est la conséquence ?", "a": [{"ok": true, "t": "Elle doit être falsifiable, c'est-à-dire réfutable par l'expérience ; donc aucune théorie scientifique n'est définitive.", "fb": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}, {"ok": false, "t": "Elle doit être définitivement démontrée une fois pour toutes ; la science atteint alors des vérités immuables.", "fb": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}, {"ok": false, "t": "Elle doit être acceptée par la majorité des savants, sans quoi elle est fausse.", "fb": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfuta Ce n'est pas un défaut provisoire que la technique corrigerait, mais une condition de tout savoir possible : on ne peut pas tout connaître sans cesser d'être celui qui connaît. C'est une limite de droit, inscrite dans la nature même de la connaissance, non une limite de fait, provisoire et reculable. Attention à ne pas confondre les deux termes : phénomène et noumène."}, {"ok": true, "t": "noumène", "fb": ""}, {"ok": true, "t": "les noumènes", "fb": ""}, {"ok": true, "t": "la chose en soi", "fb": ""}, {"ok": true, "t": "choses en soi", "fb": ""}, {"ok": false, "t": "le phénomène", "fb": "Non : le phénomène désigne au contraire ce qui apparaît et qui, seul, peut être connu ; c'est la chose en soi, le noumène, qui échappe à la connaissance."}]}, {"ty": "multichoice", "q": "Vrai ou faux : pour Kant, l'impossibilité de connaître les choses en soi est un défaut provisoire de la connaissance, que le progrès des techniques corrigera un jour.", "a": [{"ok": true, "t": "Faux", "fb": "Faux : ce n'est pas là un défaut provisoire, que la technique corrigerait, mais une condition de tout savoir possible. Chez Kant, la limite de la connaissance aux phénomènes est une limite de droit, inscrite dans la nature même de la connaissance, qu'aucun progrès ne pourra dépasser. La connaissance humaine est toujours conditionnée : il n'existe pas de point de vue de nulle part, d'où le réel serait saisi tel qu'il est indépendamment de nous. On ne peut pas tout connaître sans cesser d'être celui qui connaît. La limitation des perspectives est la condition de tout savoir, non son échec. Ne pas confondre : une limite de fait est provisoire et reculable (perfection de nos instruments), une limite de droit ne peut pas être dépassée."}, {"ok": false, "t": "Vrai", "fb": "Faux : ce n'est pas là un défaut provisoire, que la technique corrigerait, mais une condition de tout savoir possible. Chez Kant, la limite de la connaissance aux phénomènes est une limite de droit, inscrite dans la nature même de la connaissance, qu'aucun progrès ne pourra dépasser. La connaissance humaine est toujours conditionnée : il n'existe pas de point de vue de nulle part, d'où le réel serait saisi tel qu'il est indépendamment de nous. On ne peut pas tout connaître sans cesser d'être celui qui connaît. La limitation des perspectives est la condition de tout savoir, non son échec. Ne pas confondre : une limite de fait est provisoire et reculable (perfection de nos instruments), une limite de droit ne peut pas être dépassée."}]}, {"ty": "multichoice", "q": "Le désaccord séculaire entre empiristes (Locke, Hume) et rationalistes (Descartes, Spinoza) contredit-il la thèse des limites de droit de la connaissance ?", "a": [{"ok": true, "t": "Non : ce désaccord montre que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même.", "fb": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou rationalistes comme Descartes et Spinoza (qui soutiennent que la raison atteint seule des vérités universelles), prouve que cette question n'est pas réglée et que ses limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}, {"ok": false, "t": "Oui : puisque les philosophes ne sont pas d'accord, les limites de la connaissance ne sont que des limites de fait, aisément reculables.", "fb": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou ration s limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}]}, {"ty": "multichoice", "q": "Que montre Lévi-Strauss à propos des mythes et des systèmes de parenté, et pourquoi cela limite-t-il la connaissance ?", "a": [{"ok": true, "t": "Chaque culture découpe le réel selon ses catégories, symboles et rites, et ce découpage précède toute recherche savante : aucun point de vue absolu n'existe pour un être culturel.", "fb": "Lévi-Strauss a montré que les mythes et les systèmes de parenté sont des réponses élaborées par les sociétés humaines pour organiser et comprendre le monde : chaque culture découpe le réel selon ses catégories, ses symboles, ses rites, et ce découpage précède toute recherche savante. Nous n'appréhendons jamais le monde à partir de rien, mais à partir d'un héritage de mots, de valeurs, de croyances. C'est une raison pour laquelle l'on ne peut pas tout connaître : il faudrait pouvoir se dégager de ses propres cadres pour les comparer tous, et ce point de vue absolu n'existe pas pour un être culturel. Le connaissant est un vivant, situé, qui perçoit par des sens limités, depuis un corps situé, dans un temps et une culture qui ne sont pas toute l'histoire ni toute culture : la finitude est son point de départ."}, {"ok": false, "t": "Les mythes sont de simples erreurs que la science a définitivement éliminées de toutes les cultures.", "fb": "Lévi-Strauss a montré que les mythes et les systèmes de parenté sont des réponses élaborées par les sociétés humaines pour organiser et comprendre le monde : chaque culture découpe le réel selon ses catégories, s partir de rien, mais à partir d'un héritage de mots, de valeurs, de croyances. C'est une raison pour laquelle l'on ne peut pas tout connaître : il faudrait pouvoir se dégager de ses propres cadres pour les comparer tous, et ce point de vue absolu n'existe pas pour un être culturel. Le connaissant est un vivant, situé, qui perçoit par des sens limités, depuis un corps situé, dans un temps et une culture qui ne sont pas toute l'histoire ni toute culture : la finitude est son point de départ."}]}, {"ty": "shortanswer", "q": "Quelle notion, définie par Rousseau comme une « qualité qui, à l'aide des circonstances, développe successivement toutes les autres », désigne la spécificité de l'homme ?", "a": [{"ok": true, "t": "la perfectibilité", "fb": "Rousseau fait de la perfectibilité la spécificité de l'homme, cette « qualité qui, à l'aide des circonstances, développe successivement toutes les autres » : l'homme est le seul être qui s'améliore au cours du temps, qui transmet, qui invente, qui corrige ses erreurs accumulées. Contrairement à l'animal, dont l'intelligence est enfermée dans l'instinct de l'espèce, l'homme accumule ses savoirs (grâce à l'écriture, l'école, la science) et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'épeler exactement : perfectibilité."}, {"ok": true, "t": "perfectibilité", "fb": ""}, {"ok": true, "t": "la perfectibilite", "fb": ""}]}, {"ty": "multichoice", "q": "Vrai ou faux : puisque l'homme est fini et situé, il ne peut pas connaître davantage d'une génération à l'autre ; les limites de la connaissance sont immobiles.", "a": [{"ok": true, "t": "Faux", "fb": "Faux : la finitude de l'homme n'enferme pas l'humanité dans l'ignorance, car elle est doublée d'une capacité proprement humaine : puisque Rousseau, la perfectibilité. L'homme accumule ses savoirs grâce à l'écriture, l'école, la science, et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse, sans que l'on puisse fixer un point où elles s'arrêteraient définitivement. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'homme ne choisit pas son point de vue, il l'hérite ; et pourtant l'inconnu se déplace avec lui comme l'horizon avec le marcheur."}, {"ok": false, "t": "Vrai", "fb": "Faux : la finitude de l'homme n'enferme pas l'humanité dans l'ignorance, car elle est doublée d'une capacité proprement humaine : puisque Rousseau, la perfectibilité. L'homme accumule ses savoirs grâce à l'écriture, l'école, la science, et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse, sans que l'on puisse fixer un point où elles s'arrêteraient définitivement. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'homme ne choisit pas son point de vue, il l'hérite ; et pourtant l'inconnu se déplace avec lui comme l'horizon avec le marcheur."}]}, {"ty": "multichoice", "q": "Pourquoi le recours à l'art montre-t-il que la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance ?", "a": [{"ok": true, "t": "Parce que l'art explore lui-même des vérités sur l'expérience humaine, sur le monde et sur soi, de manière sensible et intuitive, mais sans remplacer le savoir objectif de la science.", "fb": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}, {"ok": false, "t": "Parce que l'art remplace la science : seul l'art parvient à la connaissance totale du réel.", "fb": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}, {"ok": false, "t": "Parce que l'art n'a rien à voir avec la connaissance : il ne produit que du plaisir esthétique.", "fb": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}]}, {"ty": "multichoice", "q": "Sous la perspective de la morale et de la politique, que vient signifier le « peut-on » de « peut-on tout connaître » ?", "a": [{"ok": true, "t": "Le questionnement porte sur le droit : « en a-t-on le droit ? » ; le savoir devient une question de légitimité, car connaître c'est aussi pouvoir agir, prévoir, contrôler.", "fb": "Sous la perspective morale et politique, le sens de la question change : « peut-on » ne signifie plus seulement « en est-on capable ? », mais « en a-t-on le droit ? ». Car connaître n'est pas une activité innocente : savoir, c'est aussi pouvoir agir, prévoir, contrôler. La question devient : le savoir a-t-il des limites de légitimité, au-delà desquelles il cesse d'être légitime et devient une menace ? Kant fournit le critère : la personne humaine a une dignité, non un prix, et doit être traitée comme une fin, jamais seulement comme un moyen. La collecte illimitée d'informations sur une personne la traite comme un moyen, comme un objet à calculer : il y a une sphère de l'intimité qui ne doit pas être connue, non parce qu'elle est inconnaissable, mais parce qu'elle doit rester libre. Celui qui sait tout sur tous tient tout le monde en son pouvoir. On ne peut pas tout connaître au sens où l'on ne doit pas tout connaître."}, {"ok": false, "t": "Le questionnement porte sur la capacité : la société doit tout connaître, au prix de la liberté si nécessaire.", "fb": "Sous la perspective morale et politique, le sens de la question change : « peut-on » ne signifie plus seulement « en est-on capable ? », mais « en a-t-on le droit ? ». Car connaître n'est pas une activité innocente : savoir, c'est aussi pouvoir agir, prévoir, contrôler. La question devient : le savoir a-t-il des limites de légitimité, au-delà desquelles il cesse d'être légitime et devient une menace ? Kant fournit le critère : la personne humaine a une dignité, non un prix, et doit être traitée comme une fin, jamais seulement comme un moyen. La collecte illimitée d'informations sur une personne la traite comme un moyen, comme un objet à calculer : il y a une sphère de l'intimité qui ne doit pas être connue, non parce qu'elle est inconnaissable, mais parce qu'elle doit rester libre. Celui qui sait tout sur tous tient tout le monde en son pouvoir. On ne peut pas tout connaître au sens où l'on ne doit pas tout connaître."}, {"ok": false, "t": "Le questionnement porte sur la légalité : connaître est toujours permis par le droit, donc sans limite de fait comme de droit.", "fb": "Sous la perspective morale et politique, le sens de la question change : « peut-on » ne signifie plus seulement « en est-on capable ? », mais « en a-t-on le droit ? ». Car connaître n'est pas une activité innocente : savoir, c'est aussi pouvoir agir, prévoir, contrôler. La question devient : le savoir a-t-il des limites de légitimité, au-delà desquelles il cesse d'être légitime et devient une menace ? Kant fournit le critère : la personne humaine a une dignité, non un prix, et doit être traitée comme une fin, jamais seulement comme un moyen. La collecte illimitée d'informations sur une personne la traite comme un moyen, comme un objet à calculer : il y a une sphère de l'intimité qui ne doit pas être connue, non parce qu'elle est inconnaissable, mais parce qu'elle doit rester libre. Celui qui sait tout sur tous tient tout le monde en son pouvoir. On ne peut pas tout connaître au sens où l'on ne doit pas tout connaître."}]}, {"ty": "multichoice", "q": "Quelles sont, selon le corrigé, les trois raisons pour lesquelles l'on ne peut pas tout connaître ? (plusieurs réponses)", "a": [{"ok": true, "t": "La connaissance porte en elle des limites de droit : elle ne saisit que des phénomènes, jamais les choses en soi, et toute science demeure falsifiable.", "fb": "Première raison : la connaissance elle-même porte en elle des limites de droit. Elle ne saisit que des phénomènes, jamais les choses en soi (Kant), et toute science demeure falsifiable, donc révisable (Popper). Une connaissance totale et définitive cesserait d'être une connaissance pour devenir une croyance absolue, un dogme."}, {"ok": true, "t": "Le connaissant est un être fini et culturel : il ne choisit pas son point de vue, il l'hérite, et l'inconnu se déplace avec lui comme l'horizon avec le marcheur.", "fb": "Deuxième raison : le connaissant est un être fini et culturel. Il ne choisit pas son point de vue, il l'hérite ; et s'il ne cesse de reculer ses limites grâce à sa perfectibilité (Rousseau), l'inconnu se déplace avec lui comme l'horizon avec le marcheur. La finitude n'interdit pas le progrès indéfini du savoir, mais interdit sa totalisation."}, {"ok": true, "t": "Tout connaître n'est pas désirable : le savoir est un pouvoir, qui doit être borné par la dignité des personnes et le bien commun.", "fb": "Troisième raison : tout connaître ne serait même pas désirable. Le savoir est un pouvoir, et ce pouvoir doit être borné par la dignité des personnes (Kant) et par le bien commun. Le devoir de chercher la vérité n'implique pas le droit de tout savoir sur tout et sur tous : il y a une sphère de l'intimité qui doit rester libre."}, {"ok": false, "t": "Les limites de la connaissance sont uniquement techniques : il suffirait d'instruments plus puissants pour tout connaître.", "fb": "Non : réduire les limites de la connaissance à des obstacles techniques, c'est confondre limites de fait et limites de droit. Le corrigé distingue précisément trois raisons : des limites de droit dans la connaissance théorique (Kant, Popper), la condition fini et culturelle du connaissant (Rousseau, Lévi-Strauss), et les limites de légitimité du savoir comme pouvoir (Kant, morale et politique)."}, {"ok": false, "t": "L'homme ne connaît rien du tout, et le savoir n'est qu'une illusion collective entretenue par la culture.", "fb": "Non : le corrigé aboutit au contraire à une réponse nuancée, qui n'est pas un constat d'impuissance. La conscience des limites est une conquête du savoir : Socrate ne savait qu'une chose, qu'il ne savait rien, et c'est ce savoir-là qui fonde la recherche de la vérité. Trois raisons seulement bornent la connaissance : limites de droit, finitude du connaissant, limites de légitimité."}]}, {"ty": "matching", "q": "Associez chaque auteur à ce que le corrigé retient de sa pensée.", "pairs": [{"l": "Socrate (dialogues de Platon)", "r": "Le sage sait qu'il ne sait pas : la maïeutique délivre des opinions (doxa) sans fondement"}, {"l": "Descartes", "r": "Le doute méthodique, instrument du savoir, élimine l'erreur pour ne retenir que des certitudes indubitables"}, {"l": "Popper", "r": "Une théorie n'est scientifique que si elle est falsifiable, donc jamais définitive"}, {"l": "Kant", "r": "Nous ne connaissons que les phénomènes, jamais les noumènes ; la personne est une fin, jamais seulement un moyen"}, {"l": "Rousseau", "r": "La perfectibilité, qualité propre de l'homme, développe successivement toutes ses autres facultés"}, {"l": "Lévi-Strauss", "r": "Mythes et systèmes de parenté : chaque culture découpe le réel selon ses catégories"}]}, {"ty": "cloze", "q": "La conclusion du corrigé (texte à trous)", "text": "<p>Complétez la conclusion : « l'inconnu se déplace avec lui comme l'{1:SHORTANSWER:=horizon} avec le {1:SHORTANSWER:=marcheur} ». Et : « Une connaissance totale et définitive cesserait d'être une connaissance pour devenir une croyance absolue, un {1:SHORTANSWER:=dogme} ».</p><p>Formules à retenir : « La connaissance n'est pas la possession du tout, elle est le mouvement vers le vrai : un chantier sans fin, dont la valeur ne tient pas à l'atteinte d'une totalité impossible, mais au soin avec lequel on fonde chaque pas. » Et : « Peut-être même que ce qui est proprement humain n'est pas de tout connaître, mais de savoir qu'on ne peut pas tout connaître. »</p>"}]}, {"ti": "Marx — Conscience et être social", "n": 11, "q": [{"ty": "multichoice", "q": "Où se trouve la thèse de l'auteur dans le texte 2 de Marx ?", "a": [{"ok": true, "t": "À la fin du texte : « Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. »", "fb": "La thèse se trouve dans la dernière phrase du texte : « Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. » On peut être sûr que c'est bien la thèse parce qu'elle vient en conclusion de toute l'argumentation : toutes les autres phrases du texte aboutissent à elle. C'est une citation à connaître pour le baccalauréat. Elle est tirée de l'Avant-propos de la Contribution à la critique de l'économie politique (1859) de Karl Marx, texte fondateur du matérialisme historique."}, {"ok": false, "t": "Au début du texte, dans la première phrase : « Dans la production sociale de leur existence, les hommes entrent en des rapports déterminés, nécessaires, indépendants de leur volonté. »", "fb": "La thèse se trouve dans la dernière phrase du texte : « Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. » On peut être sûr que c'est bien la thèse parce qu'elle vient en conclusion de toute l'argumentation : toutes les autres phrases du texte aboutissent à elle. C'est une citation à connaître pour le baccalauréat. Elle est tirée de l'Avant-propos de la Contribution à la critique de l'économie politique (1859) de Karl Marx, texte fondateur du matérialisme historique."}, {"ok": false, "t": "Au milieu du texte, dans la phrase qui définit la structure économique de la société.", "fb": "La thèse se trouve dans la dernière phrase du texte : « Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. » On peut être sûr que c'est bien la thèse parce qu'elle vient en conclusion de toute l'argumentation : toutes les autres phrases du texte aboutissent à elle. C'est une citation à connaître pour le baccalauréat. Elle est tirée de l'Avant-propos de la Contribution à la critique de l'économie politique (1859) de Karl Marx, texte fondateur du matérialisme historique."}, {"ok": false, "t": "La thèse n'est pas énoncée explicitement : elle doit être reconstruite par le lecteur à partir de l'ensemble du texte.", "fb": "La thèse se trouve dans la dernière phrase du texte : « Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. » On peut être sûr que c'est bien la thèse parce qu'elle vient en conclusion de toute l'argumentation : toutes les autres phrases du texte aboutissent à elle. C'est une citation à connaître pour le baccalauréat. Elle est tirée de l'Avant-propos de la Contribution à la critique de l'économie politique (1859) de Karl Marx, texte fondateur du matérialisme historique."}]}, {"ty": "multichoice", "q": "Le mot « conscience » de la thèse se retrouve-t-il ailleurs dans le texte sous d'autres formes ?", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai. Le mot « conscience » de la thèse est repris plusieurs fois dans l'argumentation de l'auteur sous d'autres formes : la « volonté » (rapports indépendants de leur volonté), les « formes de conscience sociale » et le « processus de vie sociale, politique et intellectuel ». Si un mot clé de la thèse se retrouve plusieurs fois, sous une forme ou sous une autre, dans le reste de l'argumentation, c'est un indice important que cette phrase est bien la thèse."}, {"ok": false, "t": "Faux", "fb": "Vrai. Le mot « conscience » de la thèse est repris plusieurs fois dans l'argumentation de l'auteur sous d'autres formes : la « volonté » (rapports indépendants de leur volonté), les « formes de conscience sociale » et le « processus de vie sociale, politique et intellectuel ». Si un mot clé de la thèse se retrouve plusieurs fois, sous une forme ou sous une autre, dans le reste de l'argumentation, c'est un indice important que cette phrase est bien la thèse."}]}, {"ty": "multichoice", "q": "« Déterminer » et « conditionner » expriment la même idée chez Marx.", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai. Si une chose est déterminée par des causes, elle est conditionnée : c'est la même idée. Le déterminisme est la conception philosophique selon laquelle tout ce qui existe dans la réalité résulte de causes nécessaires, de telle sorte que les mêmes causes produisent toujours les mêmes effets. Quand Marx écrit que « le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel », l'idée de déterminisme est bien présente dans l'argumentation, ce qui confirme que la dernière phrase est la thèse."}, {"ok": false, "t": "Faux", "fb": "Vrai. Si une chose est déterminée par des causes, elle est conditionnée : c'est la même idée. Le déterminisme est la conception philosophique selon laquelle tout ce qui existe dans la réalité résulte de causes nécessaires, de telle sorte que les mêmes causes produisent toujours les mêmes effets. Quand Marx écrit que « le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel », l'idée de déterminisme est bien présente dans l'argumentation, ce qui confirme que la dernière phrase est la thèse."}]}, {"ty": "multichoice", "q": "Quel est le sens global de la thèse de Marx ?", "a": [{"ok": true, "t": "Marx inverse une opinion commune : les hommes croient que c'est leur conscience qui détermine leur être, mais c'est au contraire leur être social qui détermine leur conscience.", "fb": "Le sens global de la thèse est donné par le mot « inversement » : Marx inverse quelque chose. Les hommes croient en général que c'est leur conscience, c'est-à-dire leur volonté, qui détermine ce qu'ils sont, leur être. Marx affirme le contraire : c'est la société, l'être social, qui détermine la conscience. Comprendre la logique de la thèse, c'est comprendre cette inversion ; sinon on en reste à une description ou une paraphrase du texte."}, {"ok": false, "t": "Marx décrit la manière dont les hommes prennent progressivement conscience de leur situation sociale.", "fb": "Le sens global de la thèse est donné par le mot « inversement » : Marx inverse quelque chose. Les hommes croient en général que c'est leur conscience, c'est-à-dire leur volonté, qui détermine ce qu'ils sont, leur être. Marx affirme le contraire : c'est la société, l'être social, qui détermine la conscience. Comprendre la logique de la thèse, c'est comprendre cette inversion ; sinon on en reste à une description ou une paraphrase du texte."}, {"ok": false, "t": "Marx affirme que chaque homme est libre de choisir sa conscience et sa place dans la société.", "fb": "Le sens global de la thèse est donné par le mot « inversement » : Marx inverse quelque chose. Les hommes croient en général que c'est leur conscience, c'est-à-dire leur volonté, qui détermine ce qu'ils sont, leur être. Marx affirme le contraire : c'est la société, l'être social, qui détermine la conscience. Comprendre la logique de la thèse, c'est comprendre cette inversion ; sinon on en reste à une description ou une paraphrase du texte."}, {"ok": false, "t": "Marx montre que la conscience humaine détermine l'organisation économique de la société.", "fb": "Le sens global de la thèse est donné par le mot « inversement » : Marx inverse quelque chose. Les hommes croient en général que c'est leur conscience, c'est-à-dire leur volonté, qui détermine ce qu'ils sont, leur être. Marx affirme le contraire : c'est la société, l'être social, qui détermine la conscience. Comprendre la logique de la thèse, c'est comprendre cette inversion ; sinon on en reste à une description ou une paraphrase du texte."}]}, {"ty": "multichoice", "q": "Quel problème pose la thèse de Marx ?", "a": [{"ok": true, "t": "Le problème de la liberté humaine : je ne suis pas libre d'être moi-même, la personne que je suis ne m'appartient pas, elle est déterminée par des facteurs sociaux.", "fb": "La thèse de Marx pose le problème de la liberté humaine. Dire que la conscience d'être soi-même n'est pas libre, qu'elle est conditionnée par des facteurs qui proviennent de la société, c'est dire que je ne suis pas libre d'être moi-même : ce que je suis ne m'appartient pas, c'est la société qui me fait. C'est difficile à admettre, car tout le monde croit le contraire : les hommes se croient libres, ils croient être ce qu'ils désirent être, alors que selon Marx leur être est déterminé par des facteurs sociaux. Une fois le problème clairement compris, il faut expliquer comment l'auteur répond à ce problème par ses arguments."}, {"ok": false, "t": "Le problème du travail : savoir si c'est la manière dont les hommes vivent et travaillent qui influence leur conscience.", "fb": "Ce n'est pas le problème mais déjà une réponse au problème : dire que le travail des hommes détermine leur être ne fait pas problème en soi. Le problème est que les hommes ne sont pas libres, qu'ils se croient libres alors que leur être est déterminé par la société."}, {"ok": false, "t": "Le problème de la connaissance : savoir si l'on peut connaître la structure économique d'une société.", "fb": "La thèse de Marx pose le problème de la liberté humaine. Dire que la conscience d'être soi-même n'est pas libre, qu'elle est conditionnée par des facteurs qui proviennent de la société, c'est dire que je ne suis pas libre d'être moi-même : ce que je suis ne m'appartient pas, c'est la société qui me fait. C'est difficile à admettre, car tout le monde croit le contraire : les hommes se croient libres, ils croient être ce qu'ils désirent être, alors que selon Marx leur être est déterminé par des facteurs sociaux. Une fois le problème clairement compris, il faut expliquer comment l'auteur répond à ce problème par ses arguments."}, {"ok": false, "t": "Le problème de la religion : savoir si les formes de conscience sociale sont d'origine religieuse.", "fb": "La thèse de Marx pose le problème de la liberté humaine. Dire que la conscience d'être soi-même n'est pas libre, qu'elle est conditionnée par des facteurs qui proviennent de la société, c'est dire que je ne suis pas libre d'être moi-même : ce que je suis ne m'appartient pas, c'est la société qui me fait. C'est difficile à admettre, car tout le monde croit le contraire : les hommes se croient libres, ils croient être ce qu'ils désirent être, alors que selon Marx leur être est déterminé par des facteurs sociaux. Une fois le problème clairement compris, il faut expliquer comment l'auteur répond à ce problème par ses arguments."}]}, {"ty": "multichoice", "q": "Quels sont les deux mots clés dont on repère les multiples occurrences pour vérifier qu'une phrase est bien la thèse ? (plusieurs réponses)", "a": [{"ok": true, "t": "La conscience (reprise sous la forme de la volonté, de la conscience sociale, de la vie intellectuelle).", "fb": "Le mot « conscience » figure dans la thèse et se retrouve plusieurs fois dans l'argumentation sous la forme de la « volonté », des « formes de conscience sociale » et du « processus de vie sociale, politique et intellectuel ». C'est un indice fort que la phrase finale est la thèse."}, {"ok": true, "t": "Le déterminisme (l'idée de déterminer, conditionner, rapports déterminés et nécessaires).", "fb": "L'idée de déterminisme, présente dans la thèse avec le mot « détermine », se retrouve dans l'argumentation : « rapports déterminés, nécessaires », « un degré de développement déterminé », « le mode de production conditionne ». Si l'idée de déterminisme ne se retrouvait jamais dans le reste de l'argumentation, la phrase ne serait pas si importante ; ses multiples occurrences confirment qu'il s'agit de la thèse."}, {"ok": false, "t": "La religion, présente dans la thèse et dans toute l'argumentation.", "fb": "Le mot « conscience » figure dans la thèse et se retrouve plusieurs fois dans l'argumentation sous la forme de la « volonté », des « formes de conscience sociale » et du « processus de vie sociale, politique et intellectuel ». C'est un indice fort que la phrase finale est la thèse."}, {"ok": false, "t": "La révolution, annoncée dès la thèse par le mot « inversement ».", "fb": "Le mot « conscience » figure dans la thèse et se retrouve plusieurs fois dans l'argumentation sous la forme de la « volonté », des « formes de conscience sociale » et du « processus de vie sociale, politique et intellectuel ». C'est un indice fort que la phrase finale est la thèse."}]}, {"ty": "matching", "q": "Associer chaque notion du texte de Marx à sa définition.", "pairs": [{"l": "La base (structure économique)", "r": "Le fondement de la société, ce sur quoi elle repose"}, {"l": "Concret", "r": "Ce qui est tangible, réel, par opposition aux idées"}, {"l": "La superstructure", "r": "L'ensemble juridique et politique qui s'élève sur la base économique"}, {"l": "La production économique", "r": "La richesse que produisent les hommes, les marchandises, tout ce que l'homme produit"}, {"l": "Le déterminisme", "r": "La conception selon laquelle tout résulte de causes nécessaires, les mêmes causes produisant toujours les mêmes effets"}]}, {"ty": "cloze", "q": "Compléter la thèse de Marx.", "text": "Complétez la thèse de Marx : « Ce n'est pas la {1:SHORTANSWER:=conscience~~Conscience} des hommes qui {1:SHORTANSWER:=détermine} leur être ; c'est {1:SHORTANSWER:=inversement~~au contraire} leur être {1:SHORTANSWER:=social} qui détermine leur conscience. »"}, {"ty": "numerical", "q": "Combien de pages le professeur conseille-t-il d'utiliser au brouillon pour préparer l'explication de texte ?", "a": [{"ok": true, "t": "3", "fb": "Trois pages au brouillon : sur la première page, on jette en vrac les idées qui viennent concernant le texte ; sur la deuxième page, les idées se structurent (elle est consacrée à la structure de l'argumentation) ; sur la troisième page, on rédige des bouts de copie, en commençant par la problématique. Si l'on n'est pas capable de rédiger la problématique, ce n'est pas la peine d'aller plus loin : il faut continuer à chercher."}]}, {"ty": "multichoice", "q": "Quelle distinction structure tout le texte de Marx ?", "a": [{"ok": true, "t": "La distinction entre la structure économique (la base concrète de la société) et la superstructure juridique et politique.", "fb": "Le texte est structuré par une double définition : la structure économique de la société, définie comme la base concrète, et la superstructure juridique et politique. Cette distinction structure tout le texte : c'est à partir d'elle que l'on peut expliquer le reste. On peut donc avoir pour projet d'explication deux parties, l'une consacrée à la structure économique, l'autre à la superstructure juridique et politique, ces deux moments étant les deux arguments principaux pour défendre la thèse. Pour chercher les étapes de l'argumentation, il faut repérer tous les indices qui montrent comment l'auteur a organisé et hiérarchisé ses idées."}, {"ok": false, "t": "La distinction entre la conscience individuelle et la conscience collective des peuples.", "fb": "Le texte est structuré par une double définition : la structure économique de la société, définie comme la base concrète, et la superstructure juridique et politique. Cette distinction structure tout le texte : c'est à partir d'elle que l'on peut expliquer le reste. On peut donc avoir pour projet d'explication deux parties, l'une consacrée à la structure économique, l'autre à la superstructure juridique et politique, ces deux moments étant les deux arguments principaux pour défendre la thèse. Pour chercher les étapes de l'argumentation, il faut repérer tous les indices qui montrent comment l'auteur a organisé et hiérarchisé ses idées."}, {"ok": false, "t": "La distinction entre le monde naturel et le monde social, tous deux soumis aux mêmes lois.", "fb": "Le texte est structuré par une double définition : la structure économique de la société, définie comme la base concrète, et la superstructure juridique et politique. Cette distinction structure tout le texte : c'est à partir d'elle que l'on peut expliquer le reste. On peut donc avoir pour projet d'explication deux parties, l'une consacrée à la structure économique, l'autre à la superstructure juridique et politique, ces deux moments étant les deux arguments principaux pour défendre la thèse. Pour chercher les étapes de l'argumentation, il faut repérer tous les indices qui montrent comment l'auteur a organisé et hiérarchisé ses idées."}, {"ok": false, "t": "La distinction entre la liberté politique et la liberté économique des individus.", "fb": "Le texte est structuré par une double définition : la structure économique de la société, définie comme la base concrète, et la superstructure juridique et politique. Cette distinction structure tout le texte : c'est à partir d'elle que l'on peut expliquer le reste. On peut donc avoir pour projet d'explication deux parties, l'une consacrée à la structure économique, l'autre à la superstructure juridique et politique, ces deux moments étant les deux arguments principaux pour défendre la thèse. Pour chercher les étapes de l'argumentation, il faut repérer tous les indices qui montrent comment l'auteur a organisé et hiérarchisé ses idées."}]}, {"ty": "multichoice", "q": "Selon le cours, la culture peut être comprise comme l'ensemble de la production matérielle de l'existence humaine.", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai. La production économique, la production matérielle qui fait la base d'une société, permet de situer ce texte dans la perspective de la notion de culture du programme : en un sens, la culture est l'ensemble de la production matérielle de l'existence humaine. Le texte de Marx invite ainsi à penser la culture non comme un simple ensemble d'idées détachées de la vie matérielle, mais comme inséparable de la manière dont les hommes produisent leur existence."}, {"ok": false, "t": "Faux", "fb": "Vrai. La production économique, la production matérielle qui fait la base d'une société, permet de situer ce texte dans la perspective de la notion de culture du programme : en un sens, la culture est l'ensemble de la production matérielle de l'existence humaine. Le texte de Marx invite ainsi à penser la culture non comme un simple ensemble d'idées détachées de la vie matérielle, mais comme inséparable de la manière dont les hommes produisent leur existence."}]}]}, {"ti": "Marx — Superstructure et idéologie", "n": 9, "q": [{"ty": "multichoice", "q": "Qu'est-ce que la superstructure juridique et politique selon Marx ?", "a": [{"ok": true, "t": "L'ensemble des idées que produit la société (lois, État, idéologies, arts, sciences), qui s'élève au-dessus de la base concrète : elle est abstraite.", "fb": "Le texte dit que la structure économique est « la base concrète sur laquelle s'élève » une superstructure juridique et politique. Super signifie « au-dessus » : la superstructure est une structure qui vient se placer au-dessus de la structure économique. Et elle n'est pas concrète : le texte dit qu'à la superstructure « correspondent des formes de conscience sociale déterminées ». La superstructure, c'est ce qui est abstrait : toutes les idées de la société. Repère du programme à utiliser : abstrait / concret. La structure économique est concrète (tout ce que l'homme fabrique et construit) ; la superstructure est abstraite. Elle comprend les lois, la Constitution, les réglementations, l'État, les idéologies, les sciences, les arts, la culture au sens abstrait, la conscience sociale (l'opinion publique)."}, {"ok": false, "t": "L'ensemble des bâtiments publics et des institutions administratives que construit la société par son travail.", "fb": "Les bâtiments et constructions sont matériels : ils relèvent de la structure économique, de la base concrète. La superstructure s'élève au-dessus de la base et elle est abstraite : ce sont toutes les idées que produit la société (lois, État, idéologies, arts, sciences)."}, {"ok": false, "t": "La partie la plus élevée de la production matérielle, c'est-à-dire les industries les plus avancées techniquement.", "fb": "La production matérielle, quel que soit son niveau technique, relève de la structure économique, de la base concrète. La superstructure est abstraite : c'est l'ensemble des idées de la société qui s'élèvent sur cette base (lois, État, idéologies, arts, sciences)."}, {"ok": false, "t": "Une structure cachée sous la base économique, qui détermine la production à l'insu des travailleurs.", "fb": "C'est l'inverse : le texte dit que la superstructure s'élève sur la base (« sur laquelle s'élève »), elle est au-dessus, pas en dessous. Et elle est abstraite : l'ensemble des idées de la société, déterminées par la structure économique."}]}, {"ty": "multichoice", "q": "Qu'est-ce qu'une idéologie, selon la définition donnée en classe ?", "a": [{"ok": true, "t": "Un ensemble d'idées (principes, valeurs, normes) qui se présente comme la vérité et n'admet pas la contestation, ou très peu.", "fb": "Une idéologie, c'est d'abord un ensemble d'idées, donc d'abstractions : par idée, on entend des principes, des valeurs, des normes. La société ne produit pas seulement des biens matériels : elle produit aussi des idées, et c'est cela que Marx appelle la superstructure. Mais une idéologie n'est pas simplement un ensemble d'idées : le propre d'une idéologie, c'est aussi qu'elle prétend dire la vérité. Ce sont des idées qui se présentent comme des vérités, et dans lesquelles il n'y a pas de place pour la contestation, ou très limitée : les dogmes religieux (l'Immaculée Conception, la Résurrection) qu'on ne peut pas discuter ; dans le communisme, la lutte des classes qu'on ne peut pas remettre en cause ; dans l'idéologie capitaliste, la propriété privée, sous peine d'être exclu du parti. C'est ce qui la distingue d'une théorie scientifique, qui doit toujours laisser place à une contestation possible."}, {"ok": false, "t": "Un ensemble d'idées fausses, dont on sait qu'elles sont fausses mais qu'on enseigne quand même à l'école.", "fb": "Une idéologie n'est pas définie par la fausseté qu'on lui connaît : c'est un ensemble d'idées (principes, valeurs, normes) qui se présente comme la vérité et n'admet pas la contestation. Ce qui la distingue d'une théorie scientifique, ce n'est pas l'absence de preuves, c'est l'absence de réfutation possible."}, {"ok": false, "t": "Une théorie scientifique parmi d'autres, mais consacrée aux questions politiques plutôt qu'à la nature.", "fb": "Non : la différence entre idéologie et théorie scientifique est justement le point de la séance. Une idéologie est un ensemble d'idées qui se présente comme la vérité sans admettre la contestation ; une théorie scientifique, elle, doit être réfutable (falsifiable) : elle laisse toujours place à une contestation possible."}, {"ok": false, "t": "L'ensemble des marchandises et des biens matériels que la société produit et échange.", "fb": "Les marchandises et les biens matériels relèvent de la structure économique, la base concrète. L'idéologie est abstraite : c'est un ensemble d'idées (principes, valeurs, normes) qui se présente comme la vérité, et qui n'admet pas la contestation."}]}, {"ty": "multichoice", "q": "Une théorie scientifique se distingue d'une idéologie parce qu'elle est prouvée, alors qu'une idéologie ne s'appuie jamais sur des preuves.", "a": [{"ok": true, "t": "Faux", "fb": "Faux, et c'est le point décisif. Une théorie scientifique est bien prouvée (l'évidence comme critère de la vérité, vu avec Descartes, et une vérité se prouve) ; mais ce n'est pas suffisant pour la distinguer d'une idéologie, parce qu'une idéologie peut aussi s'appuyer sur des preuves. Ce n'est donc pas moins la preuve que le doute qui fait la différence : ce qui fait qu'une théorie est scientifique, c'est qu'elle soit falsifiable, c'est-à-dire réfutable. Selon Carl Popper, toute théorie scientifique doit pouvoir être contredite : une théorie scientifique est vraie tant qu'on n'a pas prouvé le contraire, aucune n'est définitivement vraie. Si l'on ne peut pas réfuter une théorie, on ne peut pas non plus la considérer comme scientifique. Dans une idéologie, au contraire, il n'y a pas de place pour la contestation (les dogmes religieux, la lutte des classes dans le communisme, la propriété privée dans l'idéologie capitaliste)."}, {"ok": false, "t": "Vrai", "fb": "Faux, et c'est le point décisif. Une théorie scientifique est bien prouvée (l'évidence comme critère de la vérité, vu avec Descartes, et une vérité se prouve) ; mais ce n'est pas suffisant pour la distinguer d'une idéologie, parce qu'une idéologie peut aussi s'appuyer sur des preuves. Ce n'est donc pas moins la preuve que le doute qui fait la différence : ce qui fait qu'une théorie est scientifique, c'est qu'elle soit falsifiable, c'est-à-dire réfutable. Selon Carl Popper, toute théorie scientifique doit pouvoir être contredite : une théorie scientifique est vraie tant qu'on n'a pas prouvé le contraire, aucune n'est définitivement vraie. Si l'on ne peut pas réfuter une théorie, on ne peut pas non plus la considérer comme scientifique. Dans une idéologie, au contraire, il n'y a pas de place pour la contestation (les dogmes religieux, la lutte des classes dans le communisme, la propriété privée dans l'idéologie capitaliste)."}]}, {"ty": "multichoice", "q": "Que signifie « falsifiable » dans le critère proposé par Karl Popper ?", "a": [{"ok": true, "t": "Réfutable : la théorie laisse place au doute et à la contradiction ; elle est vraie tant qu'on n'a pas prouvé le contraire.", "fb": "La falsifiabilité vient de « false », faux : falsifiable, c'est réfutable. Il y a un paradoxe apparent : pour qu'une théorie scientifique puisse être valable, il faut qu'elle puisse être réfutée, contredite. Autrement dit, une théorie scientifique est vraie tant qu'on n'a pas prouvé le contraire : aucune théorie n'est définitivement vraie. Elle est vraie jusqu'à ce que les progrès techniques et les progrès de la connaissance montrent qu'elle était incomplète (on la complète) ou complètement fausse. La vérité scientifique n'est donc pas absolue : à l'évidence et à la démonstration s'ajoute l'exigence de laisser place à une réfutation possible. Karl Popper (1902-1994), philosophe autrichien naturalisé britannique, est un philosophe des sciences qui a proposé ce critère pour définir une théorie scientifique."}, {"ok": false, "t": "Fausse : une théorie scientifique est une théorie dont on a démontré qu'elle était fausse.", "fb": "Non : falsifiable ne veut pas dire fausse. Une théorie scientifique peut être vraie, mais elle doit pouvoir être réfutée : c'est vrai tant qu'on n'a pas prouvé le contraire. Une théorie qu'on ne peut contredire en aucun cas n'est pas scientifique, c'est une idéologie."}, {"ok": false, "t": "Définitivement vraie : une fois prouvée par l'évidence, une théorie scientifique ne peut plus être remise en cause.", "fb": "C'est l'inverse : aucune théorie scientifique n'est définitivement vraie. Une théorie scientifique est vraie tant qu'on n'a pas prouvé le contraire ; c'est précisément parce qu'elle laisse place à la réfutation qu'elle est scientifique, et non idéologique."}, {"ok": false, "t": "Facile à comprendre : une théorie scientifique doit être accessible à tous sans formation particulière.", "fb": "La falsifiabilité n'a rien à voir avec la simplicité ou l'accessibilité. Falsifiable signifie réfutable : la théorie doit laisser place au doute et à la contradiction, et être vraie tant qu'on n'a pas prouvé le contraire. C'est le critère du scientifique proposé par Karl Popper."}]}, {"ty": "multichoice", "q": "Selon l'analyse marxiste faite en classe, pourquoi l'abolition de l'esclavage a-t-elle été possible ? (plusieurs réponses)", "a": [{"ok": true, "t": "Parce qu'avec la mécanisation et l'industrialisation, des machines ont pu remplacer les hommes dans la production.", "fb": "L'esclavage a été aboli à partir du moment où la société n'a plus eu besoin d'hommes pour produire ce dont elle avait besoin : quand des machines ont pu remplacer les hommes. Avec la mécanisation, avec l'industrialisation, on n'a plus eu besoin d'esclaves, et c'est alors que des lois anti-esclavage ont pu être possibles."}, {"ok": true, "t": "Parce que les lois, qui font partie de la superstructure, sont déterminées par la structure économique de la société.", "fb": "L'abolition de l'esclavage est une loi, et les lois font partie de la superstructure juridique : elles sont donc déterminées par la structure économique, la base concrète. C'est le matérialisme de Marx : tant que la société a eu besoin d'exploiter des hommes pour produire, il y a eu de l'esclavage ; quand ce besoin a disparu, la loi a pu changer."}, {"ok": false, "t": "Parce que les hommes du 19e siècle étaient moralement supérieurs aux hommes des siècles précédents.", "fb": "L'esclavage a été aboli à partir du moment où la société n'a plus eu besoin d'hommes pour produire ce dont elle avait besoin : quand des machines ont pu remplacer les hommes. Avec la mécanisation, avec l'industrialisation, on n'a plus eu besoin d'esclaves, et c'est alors que des lois anti-esclavage ont pu être possibles."}, {"ok": false, "t": "Parce que la bonne volonté de certains hommes suffit à expliquer les grands changements des lois.", "fb": "L'esclavage a été aboli à partir du moment où la société n'a plus eu besoin d'hommes pour produire ce dont elle avait besoin : quand des machines ont pu remplacer les hommes. Avec la mécanisation, avec l'industrialisation, on n'a plus eu besoin d'esclaves, et c'est alors que des lois anti-esclavage ont pu être possibles."}]}, {"ty": "multichoice", "q": "Qu'est-ce que la conscience sociale, dans l'analyse du texte de Marx ?", "a": [{"ok": true, "t": "L'opinion publique : ce que pense la société en général, ce que pense la majorité dans une société.", "fb": "La conscience sociale, c'est l'opinion publique : ce que pense la société en général, ce que pense la majorité dans une société. Les sondages d'opinion essaient de se faire une représentation de ce que les Français pensent en général : c'est cela, la conscience collective. Et c'est un point important de la thèse de Marx : aussi bien la conscience individuelle que la conscience collective d'une société sont conditionnées par des facteurs économiques et matériels, la structure économique. Tout ce qu'une société invente, toute sa vie intellectuelle, aussi bien que les lois, résulte de causes matérielles et économiques : c'est un déterminisme social."}, {"ok": false, "t": "La connaissance scientifique que la société accumule au fil des siècles dans ses laboratoires.", "fb": "Les sciences font bien partie de la superstructure, mais la conscience sociale désigne autre chose : l'opinion publique, ce que pense la société en général, la conscience collective que les sondages d'opinion cherchent à représenter. Selon la thèse de Marx, cette conscience collective est conditionnée par des facteurs économiques et matériels."}, {"ok": false, "t": "La conscience que chaque individu prend de sa propre situation économique personnelle.", "fb": "La conscience de sa propre situation par chaque individu, c'est la conscience individuelle. La conscience sociale, c'est autre chose : l'opinion publique, ce que pense la société en général, la conscience collective. Et selon Marx, l'une et l'autre sont conditionnées par des facteurs économiques et matériels."}, {"ok": false, "t": "Le sentiment de responsabilité collective que les lois imposent aux citoyens d'une république.", "fb": "La conscience sociale n'est pas un sentiment juridique imposé par les lois. C'est l'opinion publique : ce que pense la société en général, ce que pense la majorité dans une société, la conscience collective que les sondages d'opinion cherchent à représenter."}]}, {"ty": "matching", "q": "Associer chaque notion de la séance à sa définition.", "pairs": [{"l": "La superstructure", "r": "L'ensemble des idées de la société, qui s'élève sur la base concrète"}, {"l": "Une idéologie", "r": "Un ensemble d'idées qui se présente comme la vérité, sans contestation possible"}, {"l": "Falsifiable", "r": "Réfutable : une théorie est vraie tant qu'on n'a pas prouvé le contraire"}, {"l": "Un dogme", "r": "Une vérité religieuse qu'on ne peut pas discuter ni contester"}, {"l": "Le déterminisme social", "r": "L'idée que toute la conscience humaine résulte de causes matérielles et économiques"}]}, {"ty": "cloze", "q": "Compléter la thèse de la séance.", "text": "Complétez : « Aussi bien la conscience individuelle que la conscience collective d'une société sont {1:SHORTANSWER:=conditionnées~~conditionnee} par des facteurs {1:SHORTANSWER:=économiques~~economiques} et matériels : c'est un {1:SHORTANSWER:=déterminisme~~determinisme} social. »"}, {"ty": "multichoice", "q": "Lequel de ces éléments de la société appartient à la superstructure selon Marx ?", "a": [{"ok": true, "t": "Les arts et les sciences : la culture au sens abstrait du terme, tout ce que la société produit comme idées.", "fb": "En plus des lois, de la Constitution, des réglementations et de l'État, la superstructure comprend les sciences et les arts : la culture au sens abstrait du terme. Tout ce que la société produit comme œuvres d'art, comme romans, comme idées, comme sciences, fait partie de la superstructure. Le texte le confirme : « le mode de production de la vie matérielle conditionne le processus de vie sociale, politique et intellectuelle en général » : le mode de production de la vie matérielle, c'est la structure économique ; le processus de vie sociale, politique et intellectuelle, c'est la superstructure. La volonté, c'est-à-dire la conscience, individuelle et sociale (l'opinion publique), en fait partie aussi."}, {"ok": false, "t": "Le mode de production de la vie matérielle, condition des rapports de production.", "fb": "Le mode de production de la vie matérielle, c'est la structure économique, la base concrète : elle conditionne le processus de vie sociale, politique et intellectuelle, qui lui appartient à la superstructure."}, {"ok": false, "t": "Les marchandises et les immeubles construits par les ouvriers du bâtiment.", "fb": "Les marchandises et les immeubles sont produits par le travail : ce sont des biens matériels, donc ils relèvent de la structure économique, la base concrète. La superstructure est abstraite : les arts, les sciences, les lois, l'État, les idées."}, {"ok": false, "t": "La main-d'œuvre et les outils, qui permettent de produire ce dont la société a besoin.", "fb": "La main-d'œuvre et les outils sont des forces productives matérielles : elles relèvent de la structure économique, la base concrète. La superstructure est abstraite : les idées que produit la société, comme les arts et les sciences."}]}]}, {"ti": "Marx — Méthode de l'explication de texte", "n": 6, "q": [{"ty": "multichoice", "q": "Selon la définition donnée en classe, qu'est-ce qu'une thèse philosophique ?", "a": [{"ok": true, "t": "La phrase principale du texte, celle à laquelle toutes les autres parties sont subordonnées, et qui pose toujours problème.", "fb": "Correct. Une thèse philosophique a deux caractères. D'abord, c'est l'affirmation principale du texte : la phrase à laquelle toutes les autres parties sont subordonnées, les autres parties servant de moyens pour l'établir. Ensuite, une thèse philosophique pose toujours problème : elle crée le débat, elle n'est pas une évidence avec laquelle tout le monde serait d'accord. C'est pourquoi, pour être certain d'avoir trouvé la thèse, il faut montrer en quoi cette phrase pose problème, et vérifier qu'elle contient en elle-même toutes les autres parties du texte."}, {"ok": false, "t": "La première phrase du texte, qui annonce le sujet et sert d'introduction à l'argumentation.", "fb": "Non : la thèse n'est pas nécessairement la première phrase. Dans le texte de Marx, elle se trouve à la fin. La thèse est la phrase principale, celle à laquelle toutes les autres sont subordonnées, et qui pose problème."}, {"ok": false, "t": "N'importe quelle phrase du texte qui contient un concept important du programme.", "fb": "Non : la présence d'un concept du programme ne suffit pas à faire d'une phrase la thèse. La thèse est la phrase principale du texte, celle que toutes les autres servent à établir, et toute thèse philosophique pose problème."}, {"ok": false, "t": "La phrase que l'auteur répète le plus souvent dans le texte.", "fb": "Non : ce n'est pas la répétition qui définit la thèse. C'est la phrase principale, à laquelle toutes les autres parties du texte sont subordonnées, et une thèse philosophique pose toujours problème."}]}, {"ty": "multichoice", "q": "Pour vérifier que l'on a bien trouvé la thèse du texte de Marx, que faut-il faire avec les mots clés de la phrase ?", "a": [{"ok": true, "t": "Vérifier, par écrit, au brouillon, qu'ils se retrouvent ailleurs dans le texte, sous une forme ou sous une autre, dans l'argumentation.", "fb": "Correct. Les mots clés de la thèse de Marx sont « conscience » et « détermine », d'abord parce qu'ils apparaissent deux fois dans la phrase même. Ensuite, il faut vérifier qu'ils se retrouvent ailleurs dans le texte : la notion de conscience revient sous la forme de conscience sociale, de volonté (ce qu'on fait volontairement, on le fait avec conscience) et de vie intellectuelle (la vie de l'esprit, par opposition aux mécanismes involontaires du corps) ; le déterminisme apparaît sous la forme de rapports déterminés, nécessaires, d'un degré de développement déterminé des forces productives, et du mode de production qui conditionne le processus de vie sociale, politique et intellectuelle (conditionner et déterminer, c'est la même idée). Ce travail doit être fait par écrit, au brouillon : c'est en écrivant les différentes occurrences des mots clés que l'on vérifie que l'on a bien la thèse, et que l'on a, pour reprendre Descartes, une perception du vrai."}, {"ok": false, "t": "Chercher leur définition dans un dictionnaire de philosophie et la recopier dans l'introduction.", "fb": "Non : la vérification se fait dans le texte lui-même, pas dans un dictionnaire. Il faut relever par écrit, au brouillon, les autres occurrences des mots clés de la thèse dans l'argumentation : c'est ainsi que l'on s'assure que la phrase est bien la principale."}, {"ok": false, "t": "Compter le nombre de fois où ils apparaissent pour classer les phrases par ordre d'importance.", "fb": "Non : il ne s'agit pas de compter les occurrences pour classer les phrases. Il faut vérifier que les mots clés de la thèse (conscience, détermine) se retrouvent, sous une forme ou sous une autre, dans l'argumentation : cela prouve que toutes les autres parties du texte servent à établir cette phrase."}, {"ok": false, "t": "Souligner uniquement les mots clés dans la thèse, sans s'occuper du reste du texte.", "fb": "Non : souligner ne suffit pas. Il faut vérifier que les mots clés de la thèse se retrouvent ailleurs dans le texte, sous une forme ou sous une autre (la conscience : volonté, vie intellectuelle, conscience sociale ; le déterminisme : rapports déterminés, nécessaires, conditionner). Si les mots de la phrase ne se retrouvent pas dans le reste du texte, c'est que cette phrase n'occupe pas une position centrale."}]}, {"ty": "multichoice", "q": "Dans le texte de Marx, pourquoi la « volonté » et la « vie intellectuelle » sont-elles des formes de la conscience ?", "a": [{"ok": true, "t": "Parce que la volonté est nécessairement consciente (ce qu'on fait volontairement, on le fait avec conscience) et que la vie intellectuelle est la vie de l'esprit, par opposition aux mécanismes involontaires du corps.", "fb": "Correct. Le texte dit que les hommes entrent dans des rapports de production « indépendant de leur volonté » : or la volonté est nécessairement consciente, ce qu'on fait volontairement, on le fait avec conscience (ce qu'on fait inconsciemment, on le fait involontairement). De même, la vie intellectuelle est la vie de l'esprit, donc une vie consciente, par opposition aux mécanismes involontaires du corps : mes cheveux poussent sans que j'y sois pour quelque chose, ce n'est pas ma vie consciente. Voilà comment les mots clés de la thèse (« conscience », « détermine ») se retrouvent dans tout le texte, preuve que la dernière phrase est bien la phrase principale."}, {"ok": false, "t": "Parce que la volonté et la vie intellectuelle sont deux facultés séparées, distinctes de la conscience, que Marx veut opposer.", "fb": "Non : Marx ne les oppose pas, il les rapproche. La volonté est nécessairement consciente, et la vie intellectuelle est la vie consciente de l'esprit : ce sont des formes que prend le mot clé « conscience » dans l'argumentation."}, {"ok": false, "t": "Parce que la volonté désigne la conscience collective et la vie intellectuelle la conscience individuelle.", "fb": "Non : cette distinction collective / individuelle n'est pas celle du texte. La volonté est consciente (ce qu'on fait volontairement, on le fait avec conscience) et la vie intellectuelle est la vie de l'esprit, donc consciente : ce sont des formes de la conscience, le mot clé de la thèse."}, {"ok": false, "t": "Parce que Marx considère que la volonté est une illusion et la vie intellectuelle un rêve.", "fb": "Non : ce ne sont pas des illusions dans le texte. La volonté est nécessairement consciente, et la vie intellectuelle est la vie consciente de l'esprit, par opposition aux mécanismes involontaires du corps : ce sont les formes que prend le mot clé « conscience » dans l'argumentation."}]}, {"ty": "multichoice", "q": "Quelle est la différence entre l'origine et le fondement (repère du programme) ?", "a": [{"ok": true, "t": "L'origine est la base au sens historique ou chronologique ; le fondement est ce qui constitue la base au sens logique, pas forcément chronologique : ce sur quoi repose tout le reste.", "fb": "Correct. Exemple d'origine : l'origine de la Première Guerre mondiale, c'est l'assassinat de l'archiduc François-Ferdinand d'Autriche (base historique, chronologique). Le fondement, c'est ce qui constitue la base au sens logique : le fondement d'une maison ou d'un immeuble, ce sont ses fondations, ce sur quoi repose tout le reste ; si elles ont un défaut, tout l'immeuble risque de s'écrouler. De même, toute la société dépend du fondement économique. Ce repère du programme sert à expliquer le mot « base » dans le texte de Marx : la structure économique est le fondement de la société, ce sur quoi repose tout le reste."}, {"ok": false, "t": "L'origine est la cause logique d'une chose, et le fondement sa simple date de naissance.", "fb": "Non : c'est l'inverse. L'origine est la base au sens historique, chronologique (l'assassinat de l'archiduc François-Ferdinand comme origine de la Première Guerre mondiale) ; le fondement est la base au sens logique, ce sur quoi repose tout le reste, comme les fondations d'un immeuble."}, {"ok": false, "t": "Il n'y a pas de différence : les deux mots sont des synonymes parfaits en philosophie.", "fb": "Non : ce repère du programme distingue précisément deux sens de la base. L'origine est la base chronologique ou historique ; le fondement est la base logique, ce sur quoi repose tout le reste, comme les fondations d'un immeuble dont tout dépend."}, {"ok": false, "t": "Le fondement est le premier événement d'une histoire, et l'origine la justification d'un raisonnement.", "fb": "Non : c'est l'inverse. L'origine renvoie au premier événement, au sens historique et chronologique ; le fondement est la base logique, ce sur quoi repose tout le reste (les fondations d'un immeuble, la structure économique pour la société)."}]}, {"ty": "multichoice", "q": "Pourquoi la structure économique est-elle dite « concrète » dans le texte de Marx, et que désigne-t-elle ?", "a": [{"ok": true, "t": "Parce qu'elle est tangible, réelle, matérielle : l'ensemble de ce que les hommes produisent dans une société par leur travail (richesses, marchandises, biens).", "fb": "Correct. « Concret » signifie tangible, réel, matériel : ce ne sont pas des idées. Cela renvoie aux rapports de production : la structure économique, c'est tout ce que les hommes produisent dans une société, les richesses, les marchandises, les biens, tout ce que la société produit de matériel, par leur travail. Le travail est une notion du programme : introduire une notion du programme pour expliquer un terme du texte (production, travail) enrichit nécessairement la copie. Pour éviter la paraphrase (dire que la base, c'est la base), il faut trouver un autre mot : le fondement, ce sur quoi la société repose."}, {"ok": false, "t": "Parce qu'elle désigne les idées concrètes que les hommes se font de la société dans laquelle ils vivent.", "fb": "Non : les idées relèvent plutôt des formes de conscience sociale, dans la superstructure. La structure économique est concrète au sens de tangible, réel, matériel : tout ce que les hommes produisent par leur travail, les richesses, les marchandises, les biens."}, {"ok": false, "t": "Parce qu'elle désigne les lois et les institutions politiques qui organisent concrètement la société.", "fb": "Non : les lois et les institutions relèvent de la superstructure juridique et politique, qui s'élève sur la base. La structure économique est la base concrète : ce qui est tangible, réel, matériel, l'ensemble de la production matérielle de la société."}, {"ok": false, "t": "Parce qu'elle désigne l'ensemble des liens affectifs et familiaux concrets qui unissent les individus.", "fb": "Non : la structure économique ne désigne pas les liens affectifs ou familiaux. Elle est concrète au sens de tangible, réelle, matérielle : l'ensemble des rapports de production, tout ce que les hommes produisent dans la société par leur travail (richesses, marchandises, biens)."}]}, {"ty": "multichoice", "q": "Dans quelle perspective du programme peut-on situer le texte de Marx étudié en classe ?", "a": [{"ok": true, "t": "La culture : la culture, en un sens, est l'ensemble de la production matérielle de l'existence humaine.", "fb": "Correct. Le texte de Marx peut être situé dans la perspective de la culture : la culture, en un sens, est l'ensemble de la production matérielle de l'existence humaine. Ce lien permet de comprendre pourquoi la structure économique (la production, le travail) est le fondement de la société. Rappel de méthode sur le sens de « méthode » : méthode vient du grec méthodos, « avancer pas à pas ». Avancer pas à pas, c'est ne pas avancer d'un pied avant de s'être assuré que le pas précédent est ferme, comme sur un chemin escarpé en montagne : il faut s'assurer que l'on a bien compris la thèse et le problème avant d'avancer. Si l'on procède ainsi à chaque étape, on sait soi-même, à la fin, si l'on a fait une bonne copie, sans avoir besoin de demander à quelqu'un d'autre. Une méthode n'est pas une recette : ce sont des principes à comprendre et à assimiler pour être méthodique, savoir par soi-même que ce que l'on fait est juste."}, {"ok": false, "t": "La justice : le texte porte sur les rapports juridiques entre les hommes dans la société.", "fb": "Non : le droit et la politique relèvent de la superstructure dans le texte. La perspective pertinente est celle de la culture : la culture, en un sens, est l'ensemble de la production matérielle de l'existence humaine, ce qui relie le texte au fondement économique de la société."}, {"ok": false, "t": "Le devoir : le texte définit les obligations morales que la société impose à chacun.", "fb": "Non : le texte ne porte pas sur les obligations morales. Il peut être situé dans la perspective de la culture : la culture, en un sens, est l'ensemble de la production matérielle de l'existence humaine, ce qui éclaire le rôle fondamental de la structure économique."}, {"ok": false, "t": "La religion : le texte analyse les croyances et leur fonction sociale.", "fb": "Non : ce n'est pas la perspective indiquée en classe pour ce texte. Le texte de Marx se situe dans la perspective de la culture : la culture, en un sens, est l'ensemble de la production matérielle de l'existence humaine, ce qui permet de comprendre le rôle de la structure économique comme fondement de la société."}]}]}, {"ti": "Freud — Culture et pulsions", "n": 8, "q": [{"ty": "multichoice", "q": "Pourquoi la culture doit-elle être défendue contre les individus, d'après le texte 1 de Freud ?", "a": [{"ok": true, "t": "Parce que chaque individu est virtuellement un ennemi de la culture : ses pulsions naturelles, si elles étaient librement satisfaites, nuiraient aux autres et mèneraient à la domination des hommes les uns sur les autres.", "fb": "Le texte de Freud donne la raison : « chaque individu est virtuellement un ennemi de la culture », laquelle est pourtant censée être d'intérêt humain universel. L'homme, lorsqu'il est naturel, a des pulsions qui peuvent nuire à la société : il cherche à satisfaire ses désirs, et la libre satisfaction des pulsions porterait préjudice aux autres individus ; si les individus étaient tous libres de réaliser leurs désirs, cela mènerait à une domination des hommes les uns sur les autres. C'est pourquoi les hommes ressentent comme une pression pénible les sacrifices que la culture attend d'eux, et pourquoi « la culture doit donc être défendue contre l'individu » : ses dispositifs, institutions et commandements se mettent au service de cette tâche. Ce texte rejoint la question posée sur Hannah Arendt : pourquoi faut-il protéger le monde de l'enfant."}, {"ok": false, "t": "Parce que les individus choisissent librement leur culture, et que certains font le choix d'une culture ennemie de la culture commune.", "fb": "La culture ne s'offre pas à notre choix : elle s'impose, comme ensemble de restrictions aux pulsions de chacun, de commandements et d'interdits. Le texte dit que chaque individu est virtuellement un ennemi de la culture, à cause de ses pulsions naturelles : voilà pourquoi elle doit être défendue contre lui."}, {"ok": false, "t": "Parce que la culture est la propriété de l'État, qui doit la protéger contre les individus qui voudraient s'en emparer.", "fb": "Il ne s'agit pas d'une question de propriété ni de vol : le texte dit que chaque individu est virtuellement un ennemi de la culture, parce que ses pulsions naturelles, librement satisfaites, nuiraient aux autres hommes. La culture, ensemble de commandements et d'institutions, doit donc être défendue contre lui."}, {"ok": false, "t": "Parce que la culture est naturelle, et que les individus, eux, ne le sont pas : ils la déforment en la touchant.", "fb": "C'est l'inverse : la culture n'est pas naturelle, elle est un ensemble de choses instituées, conventionnelles, qui réfrènent les pulsions naturelles des individus. C'est parce que chaque individu est virtuellement un ennemi de la culture, par ses pulsions, qu'elle doit être défendue contre lui."}]}, {"ty": "multichoice", "q": "Qu'est-ce qu'une institution, selon l'explication donnée en classe ?", "a": [{"ok": true, "t": "Quelque chose d'institué : mis en place par un accord, une convention, non naturel, qui représente une autorité, un fondement ancré de longue date pour la société.", "fb": "Une institution est ancrée : comme l'ancre d'un bateau, elle maintient et consolide la société, elle en est un fondement ; et elle est là de longue date, elle représente une tradition (une habitude bien ancrée est difficile à changer). Institution vient du verbe instituer : mettre en place, créer quelque chose qui n'existait pas auparavant et qui n'est pas naturel. On institue par un contrat, un accord : l'institution est synonyme de convention, quelque chose d'artificiel, qui ne va pas de soi, et qui représente une autorité. La culture est faite d'institutions : des lois, mais aussi des habitudes culturelles, la façon de se nourrir, de dormir, de se comporter. Manger avec un couteau et une fourchette est une institution ; et même manger avec les mains, dans les cultures où c'est la coutume, obéit à des manières, à des techniques : c'est culturel, pas naturel."}, {"ok": false, "t": "Un établissement scolaire ou administratif, bâti en dur, où l'État exerce ses fonctions publiques.", "fb": "Les bâtiments administratifs ne sont que le sens courant, étroit, du mot. Au sens philosophique travaillé en classe, une institution est quelque chose d'institué : mis en place par une convention, non naturel, qui fonde la société, y représente une autorité et une tradition."}, {"ok": false, "t": "Une loi naturelle, immuable, qui s'impose aux hommes comme la gravité ou les saisons.", "fb": "Une institution est précisément le contraire d'une loi naturelle : c'est quelque chose d'institué, de conventionnel, d'artificiel, mis en place par les hommes (instituer = mettre en place par un accord), même si elle est là de longue date et semble aller de soi."}, {"ok": false, "t": "Une mode passagère, que la société adopte librement et abandonne à sa guise selon les saisons.", "fb": "Une institution n'est pas une mode passagère : elle est ancrée, elle est là de longue date, elle représente une tradition et un fondement pour la société. Et elle est conventionnelle (non naturelle), mise en place par un accord : c'est cela, instituer."}]}, {"ty": "multichoice", "q": "Manger avec les mains est un comportement naturel, identique dans toutes les cultures qui le pratiquent.", "a": [{"ok": true, "t": "Faux", "fb": "Faux. Même dans les cultures où l'on mange avec les mains, ce n'est pas naturel : il y a une manière d'utiliser la main (plutôt la main droite que la main gauche, pas la main mise n'importe comment dans le plat), il y a des techniques derrière, donc des habitudes conventionnelles. De même, manger avec un couteau et une fourchette est une institution : d'autres cultures ont d'autres manières de manger. La culture est un ensemble de choses qui n'existent pas naturellement : des lois, mais aussi des habitudes culturelles, la façon de se nourrir, de dormir, de se comporter. Tout cela est institué, conventionnel."}, {"ok": false, "t": "Vrai", "fb": "Faux. Même dans les cultures où l'on mange avec les mains, ce n'est pas naturel : il y a une manière d'utiliser la main (plutôt la main droite que la main gauche, pas la main mise n'importe comment dans le plat), il y a des techniques derrière, donc des habitudes conventionnelles. De même, manger avec un couteau et une fourchette est une institution : d'autres cultures ont d'autres manières de manger. La culture est un ensemble de choses qui n'existent pas naturellement : des lois, mais aussi des habitudes culturelles, la façon de se nourrir, de dormir, de se comporter. Tout cela est institué, conventionnel."}]}, {"ty": "multichoice", "q": "Quel est le véritable premier but de la culture d'après le texte de Freud ?", "a": [{"ok": true, "t": "La satisfaction des besoins humains : dominer les forces de la nature n'est qu'un moyen pour gagner sur elle des biens.", "fb": "Dans la phrase du texte (« tout le savoir et tout le savoir-faire que les hommes ont acquis afin de dominer les forces de la nature et de gagner sur elle des biens pour la satisfaction des besoins humains »), il faut distinguer le moyen et le but. Dominer les forces de la nature n'est pas le but final, c'est un moyen : les hommes ont appris à détourner les cours d'eau pour irriguer leurs champs, comme les Égyptiens qui domptaient les crues du Nil pour se protéger et utiliser l'eau. Le véritable but de la culture, c'est la satisfaction des besoins humains : la culture protège l'homme, subvient à ses besoins, lui permet d'accomplir une vie digne de l'humanité, et non de vivre simplement comme un animal dépendant de la nature."}, {"ok": false, "t": "Dompter la nature : c'est le but final de la culture, la satisfaction des besoins n'étant qu'un prétexte.", "fb": "C'est l'inverse : dominer les forces de la nature est un moyen, pas le but final. Le but de la culture est la satisfaction des besoins humains : gagner sur la nature des biens pour y subvenir, permettre à l'homme une vie digne de l'humanité plutôt qu'une vie animale dépendante de la nature."}, {"ok": false, "t": "La domination des hommes les uns sur les autres, pour répartir les biens entre les plus forts.", "fb": "La domination des hommes les uns sur les autres, c'est justement ce que la culture doit empêcher : c'est la raison pour laquelle elle doit être défendue contre les individus. Son but est la satisfaction des besoins humains, en dominant la nature (un moyen) pour gagner des biens."}, {"ok": false, "t": "Le bonheur des individus, chacun étant libre de réaliser tous ses désirs comme il l'entend.", "fb": "La libre réalisation de tous les désirs, c'est ce que la culture réprime : elle est un ensemble d'interdits et de commandements. Son premier but, selon le texte, est la satisfaction des besoins humains, par la domination des forces de la nature, qui n'est qu'un moyen."}]}, {"ty": "multichoice", "q": "Dans le texte de Freud, à quelles notions du programme correspondent le savoir et le savoir-faire ? (plusieurs réponses)", "a": [{"ok": true, "t": "Le savoir renvoie à la connai
