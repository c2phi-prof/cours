ssance.", "fb": "Le savoir, c'est la connaissance : tout ce que les hommes ont appris et acquis comme connaissances. Savoir et savoir-faire = connaissance et technique : il faut aller jusqu'à ce degré de précision dans l'étude d'un texte, sinon l'explication reste approximative et superficielle."}, {"ok": true, "t": "Le savoir-faire renvoie aux techniques, l'ensemble des choses que les hommes ont appris à faire.", "fb": "Le savoir-faire, ce sont les compétences : l'ensemble des choses que les hommes ont appris à faire, autrement dit les techniques, notion du programme. Savoir et savoir-faire = connaissance et technique. Les techniques permettent de dominer les forces de la nature (détourner les cours d'eau, dompter les crues du Nil), moyen au service du véritable but : la satisfaction des besoins humains."}, {"ok": false, "t": "Le savoir-faire renvoie à la religion, ensemble des croyances transmises par la tradition.", "fb": "Le savoir, c'est la connaissance : tout ce que les hommes ont appris et acquis comme connaissances. Savoir et savoir-faire = connaissance et technique : il faut aller jusqu'à ce degré de précision dans l'étude d'un texte, sinon l'explication reste approximative et superficielle."}, {"ok": false, "t": "Le savoir renvoie à l'État, qui détient et distribue les connaissances officielles.", "fb": "Le savoir, c'est la connaissance : tout ce que les hommes ont appris et acquis comme connaissances. Savoir et savoir-faire = connaissance et technique : il faut aller jusqu'à ce degré de précision dans l'étude d'un texte, sinon l'explication reste approximative et superficielle."}]}, {"ty": "multichoice", "q": "Quelle contradiction le texte de Freud pose-t-il ?", "a": [{"ok": true, "t": "La culture a deux faces : elle sert à satisfaire les besoins humains, mais elle s'oppose aussi à la satisfaction des pulsions, c'est un ensemble d'interdits.", "fb": "C'est le double aspect de la culture, et il est contradictoire. Le texte présente la culture comme ayant « deux faces » à l'observateur : d'un côté, elle sert à satisfaire les besoins humains (savoir et savoir-faire pour dominer la nature et gagner des biens) ; de l'autre, elle limite les besoins, réfrène les pulsions, les réprime : c'est un ensemble d'interdits, de commandements, de dispositifs pour régler les relations des hommes entre eux. D'un côté la culture sert l'homme, de l'autre elle le contraint : voilà la contradiction. C'est pourquoi les hommes ressentent comme une pression pénible les sacrifices que la culture attend d'eux pour permettre la vie en commun : elle est ressentie douloureusement, comme une contrainte ; mais elle est cependant nécessaire, et c'est pour cela qu'il faut la préserver. Méthode : il y a problème quand il y a contradiction, tension entre des idées ; il faut toujours répondre en montrant la contradiction."}, {"ok": false, "t": "La culture prétend satisfaire les besoins humains mais en réalité elle ne produit aucun bien pour les hommes.", "fb": "La culture produit bien des biens pour les hommes : c'est même sa première orientation (savoir et savoir-faire pour dominer la nature et satisfaire les besoins). La contradiction est ailleurs : la culture sert à satisfaire les besoins humains, mais elle s'oppose aussi à la satisfaction des pulsions, comme ensemble d'interdits. Elle sert l'homme et le contraint en même temps."}, {"ok": false, "t": "La culture est naturelle alors que les pulsions humaines sont artificielles et instituées.", "fb": "C'est l'inverse : la culture n'est pas naturelle, elle est instituée, conventionnelle ; et ce sont les pulsions qui sont naturelles. La contradiction est que la culture sert à satisfaire les besoins humains, tout en réprimant la satisfaction des pulsions : elle a deux faces qui s'opposent."}, {"ok": false, "t": "Les hommes choisissent librement leur culture mais refusent de s'y soumettre en pratique.", "fb": "La culture ne s'offre pas à notre choix : elle s'impose, comme ensemble de commandements et de restrictions aux pulsions. La contradiction du texte est entre les deux faces de la culture : elle sert à satisfaire les besoins humains, et en même temps elle réprime la satisfaction des pulsions. C'est pourquoi elle est ressentie comme une pression pénible, bien qu'elle soit nécessaire."}]}, {"ty": "matching", "q": "Associer chaque notion de la séance à sa définition.", "pairs": [{"l": "Une institution", "r": "Une convention instituée, non naturelle, fondement ancré de la société, qui représente une autorité"}, {"l": "Instituer", "r": "Mettre en place quelque chose qui n'existait pas auparavant et qui n'est pas naturel"}, {"l": "Une pulsion", "r": "Une tendance naturelle qui pousse à satisfaire un désir"}, {"l": "Le savoir-faire", "r": "Les techniques : l'ensemble des choses que les hommes ont appris à faire"}, {"l": "La culture selon Freud", "r": "Tout ce en quoi la vie humaine s'est élevée au-dessus de ses conditions animales"}]}, {"ty": "cloze", "q": "Compléter la contradiction du texte de Freud.", "text": "Complétez : « D'un côté, la culture sert à {1:SHORTANSWER:=satisfaire~~satisfaire~~Satisfaire} les besoins humains ; de l'autre, elle {1:SHORTANSWER:=réfrène~~refrene~~limite} les pulsions : elle est ressentie comme une {1:SHORTANSWER:=pression~~contrainte} pénible, mais elle est nécessaire, et c'est pour cela qu'il faut la préserver. »"}]}, {"ti": "Freud — Culture et pulsions (HLP)", "n": 10, "q": [{"ty": "multichoice", "q": "Pourquoi, au fond, la pulsion est-elle dangereuse pour la culture selon l'analyse faite en cours du texte de Freud ?", "a": [{"ok": true, "t": "Elle est naturelle, féroce, animale : elle n'a pas été éduquée, et la culture s'oppose à ce qu'il y a de naturel en nous.", "fb": "La culture doit être défendue contre l'individu parce qu'elle s'oppose à la satisfaction de nos pulsions. La pulsion est d'abord dangereuse parce qu'elle est égoïste : elle ne prend en compte que soi et pas autrui, elle ne tient pas compte de l'intérêt d'autrui. Mais la raison essentielle est plus profonde : la pulsion est naturelle, féroce, animale, sauvage, c'est-à-dire qu'elle n'a pas été éduquée. La culture s'oppose donc à ce qu'il y a de naturel en nous : elle est l'ensemble des restrictions, des commandements et des institutions qui éduquent l'homme et le font vivre dans une réalité qui n'est pas seulement naturelle, la société. C'est pourquoi la pulsion représente un danger pour les autres et pour la culture elle-même."}, {"ok": false, "t": "Elle est dangereuse parce qu'elle est choisie librement par l'individu, qui décide de nuire à la culture.", "fb": "La culture doit être défendue contre l'individu parce qu'elle s'oppose à la satisfaction de nos pulsions. La pulsion est d'abord dangereuse parce qu'elle est égoïste : elle ne prend en compte que soi et pas autrui, elle ne tient pas compte de l'intérêt d'autrui. Mais la raison essentielle est plus profonde : la pulsion est naturelle, féroce, animale, sauvage, c'est-à-dire qu'elle n'a pas été éduquée. La culture s'oppose donc à ce qu'il y a de naturel en nous : elle est l'ensemble des restrictions, des commandements et des institutions qui éduquent l'homme et le font vivre dans une réalité qui n'est pas seulement naturelle, la société. C'est pourquoi la pulsion représente un danger pour les autres et pour la culture elle-même."}, {"ok": false, "t": "Elle est dangereuse parce qu'elle est déjà le produit de la culture et de ses institutions.", "fb": "La culture doit être défendue contre l'individu parce qu'elle s'oppose à la satisfaction de nos pulsions. La pulsion est d'abord dangereuse parce qu'elle est égoïste : elle ne prend en compte que soi et pas autrui, elle ne tient pas compte de l'intérêt d'autrui. Mais la raison essentielle est plus profonde : la pulsion est naturelle, féroce, animale, sauvage, c'est-à-dire qu'elle n'a pas été éduquée. La culture s'oppose donc à ce qu'il y a de naturel en nous : elle est l'ensemble des restrictions, des commandements et des institutions qui éduquent l'homme et le font vivre dans une réalité qui n'est pas seulement naturelle, la société. C'est pourquoi la pulsion représente un danger pour les autres et pour la culture elle-même."}, {"ok": false, "t": "Elle est dangereuse parce qu'elle tient toujours compte de l'intérêt d'autrui avant le sien.", "fb": "La culture doit être défendue contre l'individu parce qu'elle s'oppose à la satisfaction de nos pulsions. La pulsion est d'abord dangereuse parce qu'elle est égoïste : elle ne prend en compte que soi et pas autrui, elle ne tient pas compte de l'intérêt d'autrui. Mais la raison essentielle est plus profonde : la pulsion est naturelle, féroce, animale, sauvage, c'est-à-dire qu'elle n'a pas été éduquée. La culture s'oppose donc à ce qu'il y a de naturel en nous : elle est l'ensemble des restrictions, des commandements et des institutions qui éduquent l'homme et le font vivre dans une réalité qui n'est pas seulement naturelle, la société. C'est pourquoi la pulsion représente un danger pour les autres et pour la culture elle-même."}]}, {"ty": "multichoice", "q": "Le texte de Freud dit que « ses dispositifs, institutions et commandements se mettent au service de cette tâche ». En cours, le mot « commandement » a été expliqué comme désignant :", "a": [{"ok": true, "t": "Des lois, des impératifs moraux ou politiques, mais aussi religieux (comme les dix commandements de l'Ancien Testament).", "fb": "Le mot « commandement » dans le texte de Freud ne désigne pas l'ordre que donne le chef militaire à ses soldats. Ce sont des lois, des impératifs moraux ou des lois politiques qui font partie de la culture et qui s'imposent aux hommes. Il peut aussi s'agir de commandements religieux : les dix commandements de l'Ancien Testament, par exemple, mettent des limites à la satisfaction de nos pulsions (« tu ne tueras point », « tu ne convoiteras point la femme de ton voisin »). Ces règles sont absolues : elles n'autorisent aucune exception et s'imposent absolument. C'est par ces commandements, ainsi que par les dispositifs et les institutions, que la culture réprime et limite la satisfaction de nos pulsions."}, {"ok": false, "t": "Les ordres que le chef militaire donne à ses troupes, au sens strict du terme.", "fb": "Le mot « commandement » dans le texte de Freud ne désigne pas l'ordre que donne le chef militaire à ses soldats. Ce sont des lois, des impératifs moraux ou des lois politiques qui font partie de la culture et qui s'imposent aux hommes. Il peut aussi s'agir de commandements religieux : les dix commandements de l'Ancien Testament, par exemple, mettent des limites à la satisfaction de nos pulsions (« tu ne tueras point », « tu ne convoiteras point la femme de ton voisin »). Ces règles sont absolues : elles n'autorisent aucune exception et s'imposent absolument. C'est par ces commandements, ainsi que par les dispositifs et les institutions, que la culture réprime et limite la satisfaction de nos pulsions."}, {"ok": false, "t": "Les conseils que la culture donne aux individus, que chacun est libre de suivre ou non.", "fb": "Le mot « commandement » dans le texte de Freud ne désigne pas l'ordre que donne le chef militaire à ses soldats. Ce sont des lois, des impératifs moraux ou des lois politiques qui font partie de la culture et qui s'imposent aux hommes. Il peut aussi s'agir de commandements religieux : les dix commandements de l'Ancien Testament, par exemple, mettent des limites à la satisfaction de nos pulsions (« tu ne tueras point », « tu ne convoiteras point la femme de ton voisin »). Ces règles sont absolues : elles n'autorisent aucune exception et s'imposent absolument. C'est par ces commandements, ainsi que par les dispositifs et les institutions, que la culture réprime et limite la satisfaction de nos pulsions."}, {"ok": false, "t": "Les préférences individuelles que chaque culture laisse à la liberté de chacun.", "fb": "Le mot « commandement » dans le texte de Freud ne désigne pas l'ordre que donne le chef militaire à ses soldats. Ce sont des lois, des impératifs moraux ou des lois politiques qui font partie de la culture et qui s'imposent aux hommes. Il peut aussi s'agir de commandements religieux : les dix commandements de l'Ancien Testament, par exemple, mettent des limites à la satisfaction de nos pulsions (« tu ne tueras point », « tu ne convoiteras point la femme de ton voisin »). Ces règles sont absolues : elles n'autorisent aucune exception et s'imposent absolument. C'est par ces commandements, ainsi que par les dispositifs et les institutions, que la culture réprime et limite la satisfaction de nos pulsions."}]}, {"ty": "multichoice", "q": "Une institution représente-t-elle forcément une forme d'autorité ou de pouvoir ?", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai. Une question d'élève a permis de le préciser : une institution représente forcément une forme d'autorité, de pouvoir ; c'est quelque chose que l'on respecte et à quoi l'on obéit d'une manière ou d'une autre. Pas forcément une obéissance forte : plutôt du respect, mais on la respecte parce qu'elle représente une autorité. L'institution, c'est ce qui est institué : instituer, c'est créer quelque chose qui n'existait pas auparavant et qui n'est pas naturel, par un accord ou un contrat ; l'institution est donc une convention et représente une autorité dans la société. La religion, l'État, l'école sont des institutions, et c'est par elles que la culture réprime, interdit et limite la satisfaction de nos pulsions."}, {"ok": false, "t": "Faux", "fb": "Vrai. Une question d'élève a permis de le préciser : une institution représente forcément une forme d'autorité, de pouvoir ; c'est quelque chose que l'on respecte et à quoi l'on obéit d'une manière ou d'une autre. Pas forcément une obéissance forte : plutôt du respect, mais on la respecte parce qu'elle représente une autorité. L'institution, c'est ce qui est institué : instituer, c'est créer quelque chose qui n'existait pas auparavant et qui n'est pas naturel, par un accord ou un contrat ; l'institution est donc une convention et représente une autorité dans la société. La religion, l'État, l'école sont des institutions, et c'est par elles que la culture réprime, interdit et limite la satisfaction de nos pulsions."}]}, {"ty": "multichoice", "q": "Selon l'analyse du texte 2 de Freud en cours, qu'est-ce qui manifeste l'aspect non utilitaire de la culture ?", "a": [{"ok": true, "t": "Le souci des choses sans utilité aucune : la beauté, par exemple des jardins publics ornés de parterres de fleurs ou des fenêtres parées de vases de fleurs.", "fb": "Dans le texte 2 de Freud, la culture peut se définir par un aspect non utilitaire, alors que les autres textes la définissent par son rôle utile pour l'homme. Freud écrit que nous réclamons davantage à la civilisation : nous saluons comme un indice de civilisation le souci que prennent les hommes de choses sans utilité aucune, ou même en apparence plutôt inutiles. Les exemples du texte : dans une ville, des jardins publics, espaces certes nécessaires comme réservoirs d'air et terrain de jeu, ornés par surcroît de parterres de fleurs ; ou encore les fenêtres des maisons parées de vases de fleurs. Nous exigeons de l'homme civilisé qu'il honore la beauté partout où il la rencontre dans la nature. Parmi les rôles de la culture, il y a donc aussi des rôles inutiles : la beauté."}, {"ok": false, "t": "La répartition des biens accessibles entre les hommes, que la culture doit instaurer et maintenir.", "fb": "Dans le texte 2 de Freud, la culture peut se définir par un aspect non utilitaire, alors que les autres textes la définissent par son rôle utile pour l'homme. Freud écrit que nous réclamons davantage à la civilisation : nous saluons comme un indice de civilisation le souci que prennent les hommes de choses sans utilité aucune, ou même en apparence plutôt inutiles. Les exemples du texte : dans une ville, des jardins publics, espaces certes nécessaires comme réservoirs d'air et terrai  la rencontre dans la nature. Parmi les rôles de la culture, il y a donc aussi des rôles inutiles : la beauté."}]}, {"ty": "multichoice", "q": "Le mot « instituer » a été défini en cours. Instituer, c'est : (plusieurs réponses possibles)", "a": [{"ok": true, "t": "Créer quelque chose qui n'existait pas auparavant et qui n'est pas naturel.", "fb": "Instituer, c'est créer quelque chose qui n'existait pas auparavant et surtout quelque chose qui n'est pas naturel : ce qui est institué appartient à la culture. On institue par un accord ou par un contrat, et c'est ce contrat qui fait de l'institution une convention, c'est-à-dire quelque chose d'artificiel, de non naturel. Par conséquent, l'institution représente aussi une autorité, un pouvoir dans la société."}, {"ok": true, "t": "Créer quelque chose par un accord ou par un contrat entre les hommes.", "fb": "Ce qui est au fondement d'une institution, son acte de naissance, c'est forcément un contrat, un accord entre les hommes. C'est ce contrat qui fait de l'institution une convention : quelque chose d'artificiel qui ne va pas de soi, qui n'est pas naturel, et qui représente une autorité dans la société. La religion, l'État, l'école sont des institutions."}, {"ok": false, "t": "Reprendre une loi de la nature et l'imposer aux hommes.", "fb": "Instituer, c'est créer quelque chose qui n'existait pas auparavant et surtout quelque chose qui n'est pas naturel : ce qui est institué appartient à la culture. On institue par un accord ou par un contrat, et c'est ce contrat qui fait de l'institution une convention, c'est-à-dire quelque chose d'artificiel, de non naturel. Par conséquent, l'institution représente aussi une autorité, un pouvoir dans la société."}, {"ok": false, "t": "Transmettre un savoir-faire technique de génération en génération, comme l'agriculture.", "fb": "Instituer, c'est créer quelque chose qui n'existait pas auparavant et surtout quelque chose qui n'est pas naturel : ce qui est institué appartient à la culture. On institue par un accord ou par un contrat, et c'est ce contrat qui fait de l'institution une convention, c'est-à-dire quelque chose d'artificiel, de non naturel. Par conséquent, l'institution représente aussi une autorité, un pouvoir dans la société."}]}, {"ty": "multichoice", "q": "Pour Freud, la culture permet aux hommes de construire une autre réalité que la réalité naturelle de leur vie. Cette réalité, c'est :", "a": [{"ok": true, "t": "La communauté, la société, autrement dit une réalité politique.", "fb": "La culture doit être défendue contre l'individu, ce n'est pas seulement pour protéger les individus les uns contre les autres : c'est aussi parce que la culture permet aux individus de se dépasser, de vivre dans une réalité qui n'est pas que naturelle : la société, l'État. « Vivre ensemble » ne désigne pas seulement un rapport interpersonnel : la culture garantit l'existence de la société, de la communauté (l'entraide, rendre service aux autres). C'est une réalité politique : « politique » vient du grec polis, qui veut dire la cité, la société, l'État. La culture permet ainsi aux hommes de se dépasser et d'habiter une réalité politique plutôt que de rester dans leur seule condition naturelle."}, {"ok": false, "t": "La nature elle-même, que la culture nous apprend à respecter sans la modifier.", "fb": "La culture doit être défendue contre l'individu, ce n'est pas seulement pour protéger les individus les uns contre les autres : c'est aussi parce que la culture permet aux individus de se dépasser, de vivre dans une réalité qui n'est pas que naturelle : la société, l'État. « Vivre ensemble » ne désigne pas seulement un rapport interpersonnel : la culture garantit l'existence de la société, de la communauté (l'entraide, rendre service aux autres). C'est une réalité politique : « politique » vient du grec polis, qui veut dire la cité, la société, l'État. La culture permet ainsi aux hommes de se dépasser et d'habiter une réalité politique plutôt que de rester ntion, ce qui est institué par un accord ou un contrat, qui représente une autorité"}, {"l": "La beauté (texte 2)", "r": "Un aspect non utilitaire de la culture : le souci de choses sans utilité aucune"}, {"l": "Le savoir-faire", "r": "L'ensemble des choses que les hommes ont appris à faire : les techniques"}]}, {"ty": "cloze", "q": "La contradiction de la culture (texte à trous)", "text": "Dans le texte de Freud, la culture présente un double aspect contradictoire. D'un côté, par les connaissances et les techniques, elle permet de {1:SHORTANSWER:=satisfaire nos besoins~~satisfaire les besoins humains~~répondre à nos besoins} ; de l'autre côté, elle {1:SHORTANSWER:=réprime~~réprime nos besoins~~les interdit~~interdit} , ici le mot « besoin » étant pris au sens de pulsion. La culture pose problème parce qu'elle représente ce double aspect : elle satisfait nos besoins et elle les interdit.<br/><br/>À retenir : besoin au sens de nécessité vitale (que la culture permet de combler en domestiquant la nature) ne doit pas être confondu avec besoin au sens de pulsion, de désir (que la culture réprime au nom de la vie en commun). La contradiction tient dans ce double sens."}, {"ty": "shortanswer", "q": "Quel mot grec, qui désigne la cité, la société, l'État, est à l'origine du mot « politique » ? (réponse à saisir)", "a": [{"ok": true, "t": "polis", "fb": "« Politique » vient du grec polis, qui veut dire la cité, la société, l'État. La culture permet aux hommes de construire une autre réalité que la réalité naturelle de leur vie : la communauté, la société, autrement dit une réalité politique. La culture ne sert donc pas seulement à éviter que les individus s'opposent les uns aux autres : elle permet de vivre ensemble, dans une réalité politique."}, {"ok": true, "t": "la polis", "fb": ""}, {"ok": true, "t": "Polis", "fb": ""}]}, {"ty": "multichoice", "q": "Au grand oral, quelle est la finalité de l'exercice de lecture à voix haute d'un texte préparé, conseillé en cours ?", "a": [{"ok": true, "t": "S'apprivoiser sa propre voix, gagner en confiance et s'exercer aux effets d'éloquence (pauses, rythme, intonations), qu'on n'a pas à lire un texte au grand oral.", "fb": "Au grand oral, on ne vous demandera pas de lire un texte : vous n'aurez jamais à lire un texte (peut-être une très courte citation), mais vous aurez à rendre votre présentation éloquente. Passer par la lecture d'un texte préparé, mise en scène avec sa voix, met à l'aise avec les effets d'éloquence. Le but est de vaincre sa timidité et d'apprivoiser sa propre voix : on travaille d'abord le sens du texte, puis on répète deux ou trois fois avec les intonations, pauses et changements de rythme notés, on s'enregistre et on s'écoute deux jours après, pour entendre sa voix de l'extérieur. Savoir quel effet on donne aux autres dissipe une partie du stress face au jury, qui écoute d'abord en silence. Les questions du jury, ensuite, ne sont pas là pour piéger, mais pour mettre à l'aise et permettre d'approfondir."}, {"ok": false, "t": "Apprendre à lire un texte long devant le jury, car la lecture d'un texte est la première épreuve du grand oral.", "fb": "Au grand oral, on ne vous demandera pas de lire un texte : vous n'aurez jamais à lire un texte (peut-être une très courte citation), mais vous aurez à rendre votre présentation éloquente. Passer par la lecture d'un texte préparé, mise en scène avec sa voix, met à l'aise avec les effets d'éloquence. Le but est de vaincre sa timidité et d'apprivoiser sa propre voix : on travaille d'abord le sens du texte, puis on répète deux ou trois fois avec les intonations, pauses et changements de rythme notés, on s'enregistre et on s'écoute deux jours après, pour entendre sa voix de l'extérieur. Savoir quel effet on donne aux autres dissipe une partie du stress face au jury, qui écoute d'abord en silence. Les questions du jury, ensuite, ne sont pas là pour piéger, mais pour mettre à l'aise et permettre d'approfondir."}, {"ok": false, "t": "Mémoriser ?", "a": [{"ok": true, "t": "La liberté de choisir le contraire de ce que la raison nous recommande", "fb": "Le libre arbitre désigne la seconde forme d'indifférence de la volonté : la volonté se détermine, mais en faisant le contraire de ce que la raison ou la conscience morale lui recommande. Il ne faut pas le confondre avec la liberté d'indifférence comme indécision, qui est l'indétermination de la volonté avant tout choix. Cette faculté positive est pour Descartes le plus bas degré de la liberté."}, {"ok": false, "t": "L'absence de toute volonté lorsque l'esprit délibère sur une vérité", "fb": "Le libre arbitre désigne la seconde forme d'indifférence de la volonté : la volonté se détermine, mais en faisant le contraire de ce que la raison ou la conscience morale lui recommande. Il ne faut pas le confondre avec la liberté d'indifférence comme indécision, qui est l'indétermination de la volonté avant tout choix. Cette faculté positive est pour Descartes le plus bas degré de la liberté."}, {"ok": false, "t": "La capacité de la raison à démontrer une vérité par la preuve", "fb": "Le libre arbitre désigne la seconde forme d'indifférence de la volonté : la volonté se détermine, mais en faisant le contraire de ce que la raison ou la conscience morale lui recommande. Il ne faut pas le confondre avec la liberté d'indifférence comme indécision, qui est l'indétermination de la volonté avant tout choix. Cette faculté positive est pour Descartes le plus bas degré de la liberté."}, {"ok": false, "t": "L'indifférence de la volonté lorsqu'elle n'est pas encore déterminée", "fb": "Le libre arbitre désigne la seconde forme d'indifférence de la volonté : la volonté se détermine, mais en faisant le contraire de ce que la raison ou la conscience morale lui recommande. Il ne faut pas le confondre avec la liberté d'indifférence comme indécision, qui est l'indétermination de la volonté avant tout choix. Cette faculté positive est pour Descartes le plus bas degré de la liberté."}]}, {"ty": "multichoice", "q": "Que signifie « moralement parlant » dans le passage de Descartes ?", "a": [{"ok": true, "t": "Compte tenu des lois de la nature humaine, qui nous portent à accepter les vérités évidentes", "fb": "« Moralement parlant » signifie compte tenu des lois de la nature humaine. Lorsque la raison me présente une vérité avec évidence (« 2 + 2 = 4 », « le tout est plus grand que la partie »), rien ne me pousse naturellement à la nier : la constitution de l'être humain est telle que je suis porté à admettre ces vérités. Moralement parlant, nous ne pouvons donc pas choisir le contraire. • Repère en fait / en droit : en fait (psychologiquement), l'esprit adhère spontanément à l'évidence ; mais en droit (selon la puissance absolue de la volonté), il reste libre de s'y soustraire."}, {"ok": false, "t": "En respectant les lois morales imposées par la société dans laquelle nous vivons", "fb": "« Moralement parlant » signifie compte tenu des lois de la nature humaine. Lorsque la raison me présente une vérité avec évidence (« 2 + 2 = 4 », « le tout est plus grand que la partie »), rien ne me pousse naturellement à la nier : la constitution de l'être humain est telle que je suis porté à admettre ces vérités. Moralement parlant, nous ne pouvons donc pas choisir le contraire. • Repère en fait / en droit : en fait (psychologiquement), l'esprit adhère spontanément à l'évidence ; mais en droit (selon la puissance absolue de la volonté), il reste libre de s'y soustraire."}, {"ok": false, "t": "Selon le jugement de la conscience morale, qui condamne toujours nos actes", "fb": "« Moralement parlant » signifie compte tenu des lois de la nature humaine. Lorsque la raison me présente une vérité avec évidence (« 2 + 2 = 4 », « le tout est plus grand que la partie »), rien ne me pousse naturellement à la nier : la constitution de l'être humain est telle que je suis porté à admettre ces vérités. Moralement parlant, nous ne pouvons donc pas choisir le contraire. • Repère en fa t aux animaux, qui ne peuvent se comporter autrement que ce que l'évolution de leur espèce les détermine à faire, l'homme peut toujours faire le contraire de ce que sa raison ou sa conscience lui recommande. C'est pourquoi il est responsable de ses actes, qu'ils soient inhumains (génocides, meurtres) ou exceptionnels. • Repère obligation / contrainte : la contrainte physique ôte le choix, tandis que l'obligation morale s'adresse à un sujet libre qui a toujours la possibilité de lui désobéir."}]}, {"ty": "multichoice", "q": "Quel est le troisième moment de l'argumentation du texte de Descartes ?", "a": [{"ok": true, "t": "La justification de l'objection : l'indifférence peut être une faculté positive", "fb": "Le texte se construit en trois moments : la thèse (l'indifférence est le plus bas degré de liberté), l'objection (l'indifférence peut avoir une fonction positive, ce n'est pas qu'une indécision), puis la justification de cette objection par un argument : la raison pour laquelle l'homme peut toujours choisir le contraire, et donc est absolument libre. • Repère analyse / synthèse : analyser le texte exige de distinguer rigoureusement ces articulations logiques pour ensuite en restituer la cohérence globale."}, {"ok": false, "t": "La présentation de la thèse : l'indifférence est le plus bas degré de liberté", "fb": "Le texte se construit en trois moments : la thèse (l'indifférence est le plus bas degré de liberté), l'objection (l'indifférence peut avoir une fonction positive, ce n'est pas qu'une indécision), puis la justification de cette objection par un argument : la raison pour laquelle l'homme peut toujours choisir le contraire, et donc est absolument libre. • Repère analyse / synthèse : analyser le texte exige de distinguer rigoureusement ces articulations logiques pour ensuite en restituer la cohérence globale."}, {"ok": false, "t": "L'admission d'une objection : l'indifférence n'est pas qu'un manque", "fb": "Le texte se construit en trois moments : la thèse (l'indifférence est le plus bas degré de liberté), l'objection (l'indifférence peut avoir une fonction positive, ce n'est pas qu'une indécision), puis la justification de cette objection par un argument : la raison pour laquelle l'homme peut toujours choisir le contraire, et donc est absolument libre. • Repère analyse / synthèse : analyser le texte exige de distinguer rigoureusement ces articulations logiques pour ensuite en restituer la cohérence globale."}, {"ok": false, "t": "La description de la méthode : il faut relever les mots clés du passage", "fb": "Le texte se construit en trois moments : la thèse (l'indifférence est le plus bas degré de liberté), l'objection (l'indifférence peut avoir une fonction positive, ce n'est pas qu'une indécision), puis la justification de cette objection par un argument : la raison pour laquelle l'homme peut toujours choisir le contraire, et donc est absolument libre. • Repère analyse / synthèse : analyser le texte exige de distinguer rigoureusement ces articulations logiques pour ensuite en restituer la cohérence globale."}]}]}, {"ti": "Descartes — Les degrés de liberté", "n": 6, "q": [{"ty": "multichoice", "q": "Selon Descartes, quelle est la différence entre l'indifférence et le libre arbitre ?", "a": [{"ok": true, "t": "Le libre arbitre consiste à se décider (au hasard ou contre ce que la raison recommande), l'indifférence à ne pas se décider, ne rien choisir : mais dans les deux cas, c'est le plus bas degré de liberté.", "fb": "Correct. Le libre arbitre n'est pas une forme d'indifférence : Descartes distingue l'indifférence de la volonté, qui consiste à ne rien décider, ne rien choisir, et le libre arbitre, qui consiste à se décider, soit au hasard, soit en faisant le contraire de ce que la raison recommande. Le libre arbitre, c'est se décider ; l'indifférence, c'est ne pas se décider. Toutefois, dans les deux cas, c'est le plus bas degré de liberté : on ne fait pas ce que la raison recommande, on ne sait pas vraiment ce que l'on fait."}, {"ok": false, "t": "Le libre arbitre est l'indifférence : les deux mots désignent le fait de ne pas se décider entre plusieurs possibilités.", "fb": "Non : on ne peut pas dire que le libre arbitre est une forme d'indifférence. Le libre arbitre consiste à se décider (au hasard, ou contre la raison) ; l'indifférence consiste à ne pas se décider. Dans les deux cas, c'est le plus bas degré de liberté."}, {"ok": false, "t": "L'indifférence est le plus haut degré de liberté, le libre arbitre seulement un degré intermédiaire.", "fb": "Non : c'est l'inverse de ce que dit Descartes. L'indifférence (ne pas se décider) et le libre arbitre (se décider au hasard ou contre la raison) sont tous deux le plus bas degré de liberté ; le plus haut degré est celui où la volonté suit la raison."}, {"ok": false, "t": "Le libre arbitre consiste à suivre toujours sa raison, l'indifférence à suivre ses désirs.", "fb": "Non : suivre sa raison n'est pas le libre arbitre, c'est le plus haut degré de liberté. Le libre arbitre, pour Descartes, consiste à se décider au hasard ou en faisant le contraire de ce que la raison recommande ; l'indifférence consiste à ne pas se décider. Les deux relèvent du plus bas degré de liberté."}]}, {"ty": "multichoice", "q": "Quel est le plus haut degré de liberté selon Descartes ?", "a": [{"ok": true, "t": "Le moment où la volonté suit la raison : je fais ce que ma raison me recommande, la volonté est entièrement déterminée par la perception du vrai ou du bien.", "fb": "Correct. Le plus haut degré de liberté, c'est lorsque la volonté suit la raison, lorsque je fais ce que ma raison me recommande, c'est-à-dire lorsque la volonté est entièrement déterminée par la perception du vrai ou du bien. C'est le comportement le plus rationnel que l'on puisse adopter : je ne fais pas n'importe quoi, je ne m'en remets pas au hasard, je sais ce que je fais. Exemple : je ne commencerai jamais à fumer puisque je sais que c'est scientifiquement nocif. Ce haut degré de liberté est toutefois discutable : il suppose d'agir sans avoir véritablement le choix, puisque chaque décision s'impose au vu d'une évidence ; et une vie qui consisterait toujours à être raisonnable (sans excès, sans risque) serait-elle une vie heureuse ? Point précieux pour une dissertation comme « Faut-il préférer la liberté au bonheur ? » : peut-être que le bonheur ne peut pas être entièrement raisonnable."}, {"ok": false, "t": "Le moment où je choisis librement de faire le contraire de ce que ma raison me recommande.", "fb": "Non : faire le contraire de ce que la raison recommande, ou se décider au hasard, c'est le libre arbitre au sens faible, et cela constitue le plus bas degré de liberté. Le plus haut degré est le moment où la volonté suit la raison, entièrement déterminée par la perception du vrai ou du bien."}, {"ok": false, "t": "Le moment où je m'en remets au hasard : ne rien réviser, tenter sa chance, « on verra bien le jour J ».", "fb": "Non : s'en remettre au hasard (« on verra bien le jour J ») fait partie du plus bas degré de liberté, non du plus haut. Le plus haut degré de liberté selon Descartes, c'est lorsque la volonté suit la raison, entièrement déterminée par la perception du vrai ou du bien : je sais ce que je fais, je ne fais pas n'importe quoi."}, {"ok": false, "t": "Le moment où je fais tout ce que je veux, autant que possible, jusqu'à l'excès.", "fb": "Non : faire tout ce qu'on veut, jusqu'à l'excès, c'est la liberté naturelle, très précaire (elle débouche sur la loi du plus fort), et pour Descartes ce n'est pas cela qui nous rend dignes du genre humain. Le plus haut degré de liberté, c'est lorsque la volonté suit la raison, la perception du vrai ou du bien."}]}, {"ty": "multichoice", "q": "Pourquoi obéir à sa raison, ou à sa conscience morale, peut-il être considéré comme une liberté, et même comme le plus haut degré ?", "a": [{"ok": true, "t": "Parce que la raison définit le meilleur de nous-mêmes : en obéissant à ma raison ou à ma conscience morale, j'accomplis ce pourquoi je suis fait, la liberté est la réalisation de ce qu'il y a de meilleur en nous.", "fb": "Correct. C'est paradoxal : obéir serait le plus haut degré de liberté ? Oui, parce qu'il s'agit de deux conceptions très différentes de la liberté. La raison est ce qui définit le meilleur de nous-mêmes : Platon définit l'homme comme un animal rationnel (et Aristote, avant lui, comme un animal politique) ; ce qui définit l'homme, son excellence, sa vertu, son humanité, c'est sa raison. Si l'homme obéit à sa raison, il est libre au sens où il accomplit ce pourquoi il est fait : en tant qu'être humain, l'homme est fait pour agir rationnellement. Certes, l'homme peut toujours agir irrationnellement, mais alors il n'agit pas au meilleur de lui-même. De même, lorsqu'il obéit à sa conscience morale et accomplit son devoir (faire son devoir, c'est faire ce que la conscience morale nous dit de faire), il accomplit ce qu'il y a de meilleur en lui : il est libre parce que la liberté est alors conçue comme la réalisation de ce qu'il y a de meilleur en nous."}, {"ok": false, "t": "Parce qu'obéir à sa raison évite toute punition et toute conséquence fâcheuse de nos actes.", "fb": "Non : ce n'est pas une question de punition ou d'intérêt. La raison définit le meilleur de nous-mêmes : obéir à sa raison ou à sa conscience morale, c'est accomplir ce pourquoi l'homme est fait, ce qu'il y a de meilleur en lui ; la liberté est alors la réalisation de ce qu'il y a de mieux en nous."}, {"ok": false, "t": "Parce que la raison est une force extérieure à l'homme, plus puissante que sa volonté.", "fb": "Non : la raison n'est pas une force extérieure à l'homme, c'est ce qui définit le meilleur de lui-même. C'est parce que l'homme est fait pour agir rationnellement qu'obéir à sa raison ou à sa conscience morale l'accomplit : la liberté est alors la réalisation de ce qu'il y a de meilleur en nous."}, {"ok": false, "t": "Parce qu'obéir à sa raison est plus facile que de suivre ses passions et ses désirs.", "fb": "Non : ce n'est pas une question de facilité. La raison définit le meilleur de nous-mêmes, ce pourquoi l'homme est fait : en obéissant à sa raison ou à sa conscience morale, l'homme accomplit ce qu'il y a de meilleur en lui, et la liberté est conçue comme la réalisation de ce qu'il y a de meilleur en nous."}]}, {"ty": "multichoice", "q": "Que signifie, pour Descartes, ne pas suivre ce que la raison ou la conscience nous recommande ?", "a": [{"ok": true, "t": "C'est être esclave : esclave de nos passions, de nos désirs, de ce qu'il y a en nous de moins bon.", "fb": "Correct. Ne pas suivre ce que la raison nous recommande, ou ce que la conscience nous recommande, c'est être esclave : esclave de nos passions, de nos désirs, de ce qu'il y a en nous de moins bon. Au lieu de me raisonner, je me laisse aller à la colère ou à mes désirs : je suis esclave de mes passions. C'est le renversement du paradoxe précédent : celui qui obéit à sa raison est libre (il réalise ce qu'il y a de meilleur en lui), celui qui suit ses passions est esclave (il est conduit par ce qu'il y a en lui de moins bon)."}, {"ok": false, "t": "C'est être pleinement libre : faire ce que l'on veut, c'est la vraie indépendance de la volonté.", "fb": "Non : faire tout ce qu'on a envie de faire n'est pas la vraie liberté, c'est la liberté naturelle, très précaire, qui nous rend esclave de nos passions et de nos désirs, de ce qu'il y a en nous de moins bon. Pour Descartes, ce n'est pas cela qui nous rend dignes du genre humain."}, {"ok": false, "t": "C'est rester indifférent : ne rien décider et attendre que la situation se décide d'elle-même.", "fb": "Non : l'indifférence, c'est ne pas se décider ; ici, il s'agit de celui qui se laisse aller à ses passions et à ses désirs au lieu de se raisonner. Ne pas suivre sa raison ou sa conscience, c'est être esclave de ce qu'il y a en nous de moins bon."}, {"ok": false, "t": "C'est agir moralement : suivre ses désirs, c'est suivre la nature, qui ne peut pas nous tromper.", "fb": "Non : suivre ses désirs et ses passions sans se raisonner n'est pas agir moralement, c'est être esclave de ce qu'il y a en nous de moins bon. C'est au contraire en obéissant à sa raison et à sa conscience morale que l'homme accomplit ce qu'il y a de meilleur en lui."}]}, {"ty": "multichoice", "q": "Que répondre à la question : peut-on choisir de ne pas choisir ?", "a": [{"ok": true, "t": "On ne peut pas choisir l'indifférence, puisque l'indifférence, c'est justement le fait de ne pas choisir : choisir de ne pas choisir, c'est déjà un choix (l'abstention).", "fb": "Correct. On ne peut pas choisir l'indifférence, puisque l'indifférence, c'est justement le fait de ne pas choisir. Mais choisir de ne pas choisir, n'est-ce pas déjà un choix ? Si le jour des élections vous décidez de vous abstenir, vous choisissez l'abstention : c'est un choix (sauf empêchement absolu). De même, quand quelque chose se passe dans la rue et que l'on choisit de ne pas intervenir, on choisit l'indifférence. En revanche, on peut s'en remettre au hasard (ne rien réviser, tenter sa chance, « on verra bien le jour J ») : est-ce une preuve d'intelligence, la vraie liberté ? Bonne question, qui pourrait être posée dans une dissertation."}, {"ok": false, "t": "Oui, on peut choisir de ne pas choisir : l'abstention prouve que l'on échappe à toute alternative.", "fb": "Non : l'abstention ne fait pas sortir du choix. Si vous décidez de vous abstenir le jour des élections, vous choisissez l'abstention : c'est un choix (sauf empêchement absolu). De même, choisir de ne pas intervenir dans la rue, c'est choisir l'indifférence. Choisir de ne pas choisir, c'est déjà un choix."}, {"ok": false, "t": "Non, et cela n'a aucun sens : l'expression « choisir de ne pas choisir » est dépourvue de signification.", "fb": "Non : l'expression a bien un sens, et c'est ce qui est intéressant. On ne peut pas choisir l'indifférence (l'indifférence, c'est justement le fait de ne pas choisir), mais choisir de ne pas choisir, c'est déjà un choix : l'abstention aux élections est un choix, sauf empêchement absolu."}, {"ok": false, "t": "Oui, et c'est la plus haute forme de liberté : ne rien décider, c'est laisser la raison parler.", "fb": "Non : ne rien décider n'est pas la plus haute forme de liberté, c'est l'indifférence, le plus bas degré. Et l'on ne peut pas choisir l'indifférence, puisque l'indifférence, c'est le fait de ne pas choisir ; mais choisir de ne pas choisir, c'est déjà un choix : l'abstention est un choix, sauf empêchement absolu."}]}, {"ty": "multichoice", "q": "Qu'est-ce que la liberté naturelle, et pourquoi est-elle précaire ?", "a": [{"ok": true, "t": "C'est la liberté de faire tout ce qu'on veut, sans tenir compte de sa raison ni de sa conscience ; elle est précaire car elle débouche sur le conflit avec les autres et la loi du plus fort.", "fb": "Correct. La liberté naturelle, c'est la liberté qui consiste à ne pas tenir compte de sa raison ni de sa conscience morale, à faire un peu tout et n'importe quoi, à s'en remettre au hasard ou à faire uniquement ce qu'on a envie de faire : la liberté de faire tout ce qu'on veut, autant que possible, jusqu'à l'excès. Pour un philosophe comme Descartes, ce n'est pas cela qui nous rend dignes du genre humain. Et cette liberté est très précaire : si chacun fait ce qu'il veut, on entre nécessairement en conflit avec ce que les autres veulent, et alors c'est la loi du plus fort. Une liberté qu'il faut toujours défendre contre les autres n'est pas le plus haut degré de liberté. Cela rejoint le travail sur Hannah Arendt : la liberté sans limite est dangereuse, et apprendre à mettre des limites à sa liberté est peut-être l'un des premiers principes de l'éducation."}, {"ok": false, "t": "C'est la liberté de suivre toujours sa raison et sa conscience morale ; elle est précaire car la raison peut se tromper.", "fb": "Non : suivre sa raison et sa conscience morale, c'est justement le plus haut degré de liberté, non la liberté naturelle. La liberté naturelle, c'est faire tout ce qu'on veut, sans tenir compte de sa raison, jusqu'à l'excès ; elle est précaire parce qu'elle mène au conflit avec les autres et à la loi du plus fort."}, {"ok": false, "t": "C'est la liberté garantie par les lois de la société ; elle est précaire car les lois changent selon les gouvernements.", "fb": "Non : la liberté naturelle n'est pas garantie par les lois, c'est la liberté de faire tout ce qu'on veut, sans limite. Elle est précaire pour une autre raison : si chacun fait ce qu'il veut, on entre nécessairement en conflit avec ce que les autres veulent, et alors c'est la loi du plus fort. Une liberté qu'il faut toujours défendre contre les autres n'est pas le plus haut degré de liberté."}, {"ok": false, "t": "C'est la liberté de l'enfant, qui s'exprime sans limite ; elle est précaire seulement pendant l'enfance, avant l'éducation.", "fb": "Non : la liberté naturelle n'est pas le seul fait de l'enfance, c'est la liberté de faire tout ce qu'on veut, sans tenir compte de sa raison ni de sa conscience morale. Elle est précaire parce qu'elle mène nécessairement au conflit avec les autres, à la loi du plus fort : une liberté qu'il faut toujours défendre contre les autres n'est pas le plus haut degré de liberté. Pour Descartes, ce n'est pas cela qui nous rend dignes du genre humain."}]}]}, {"ti": "Arendt — Protéger l'enfant du monde", "n": 6, "q": [{"ty": "multichoice", "q": "Dans le texte de Hannah Arendt, que signifie « protéger » l'enfant du monde ?", "a": [{"ok": true, "t": "Préserver d'un danger : il s'agit moins de préserver l'innocence de l'enfant que de le défendre contre le danger que représente le monde.", "fb": "Correct. On protège quelqu'un ou quelque chose d'un danger : protéger, c'est préserver d'un danger. Il s'agit moins de préserver l'innocence de l'enfant que de le défendre contre le danger que représente le monde. Attention : protéger ne peut pas vouloir dire isoler l'enfant du monde (sinon, comment l'apprendrait-il ?) ; au contraire, un des rôles de l'éducation est d'amener peu à peu l'enfant au monde. Protéger veut dire introduire avec prudence : introduire l'enfant au monde prudemment, petit à petit, progressivement, en lui faisant comprendre les règles du jeu."}, {"ok": false, "t": "Isoler l'enfant du monde pour ne lui transmettre qu'une représentation du monde, une image filtrée du réel.", "fb": "Non : cette interprétation a été discutée puis écartée en classe. Si l'on isole l'enfant du monde, comment apprendra-t-il le monde ? Le risque serait de ne lui transmettre qu'une image du monde, et non le monde réel. Protéger, c'est préserver d'un danger : cela veut dire introduire l'enfant au monde avec prudence, petit à petit, et non l'isoler."}, {"ok": false, "t": "Interdire à l'enfant tout contact avec la société jusqu'à ce qu'il soit adulte et autonome.", "fb": "Non : protéger l'enfant ne peut pas vouloir dire l'isoler du monde jusqu'à l'âge adulte, sinon il n'apprendrait pas le monde. Protéger, c'est préserver d'un danger : défendre l'enfant contre le danger que représente le monde, tout en l'y introduisant peu à peu, avec prudence."}, {"ok": false, "t": "Satisfaire tous les désirs de l'enfant pour qu'il ne connaisse jamais la frustration.", "fb": "Non : il ne s'agit pas de satisfaire les désirs de l'enfant. Protéger, c'est préserver d'un danger : défendre l'enfant contre le danger que représente le monde, en l'y introduisant prudemment, progressivement, et non en l'isolant ni en cédant à ses désirs."}]}, {"ty": "multichoice", "q": "Quel est le « monde » dont il faut protéger l'enfant selon Hannah Arendt ?", "a": [{"ok": true, "t": "Le monde humain : la société, les civilisations, les cultures, un ensemble de règles et de lois qui dépassent les individus.", "fb": "Correct. Le monde dont il s'agit n'est ni la planète au sens physique (avec son écosystème), ni la nature et ses violences (inondations, tremblements de terre, sécheresses), ni l'ensemble des individus au sens quantitatif (« la cour est remplie de monde » : le monde n'y est pas un terme de dénombrement). Le monde, ici, est le monde humain : la société, les civilisations, les cultures. La société dépasse les individus : les personnes naissent, vivent et meurent, la société demeure. Elle est un ensemble de lois et de règles qui maintiennent les individus en société : si l'on ne comptait que sur la bonne volonté des individus, ce serait le chaos. Il y a aussi des rapports économiques : pour vivre en société, il faut acheter, payer un loyer, subvenir à ses besoins, travailler ; or l'enfant n'est pas capable de travailler pour gagner de quoi vivre : il faut donc le protéger."}, {"ok": false, "t": "La planète et son écosystème, qu'il faut préserver des comportements dangereux des hommes.", "fb": "Non : le monde dont il s'agit n'est pas la planète au sens physique, avec son écosystème. C'est le monde humain : la société, les civilisations, les cultures, l'ensemble des lois et des règles qui maintiennent les individus en société."}, {"ok": false, "t": "La nature et ses violences : inondations, tremblements de terre, sécheresses et catastrophes.", "fb": "Non : la nature et ses violences ne sont pas le monde dont il s'agit. C'est le monde humain : la société, les civilisations, les cultures, un espace réglementé par des lois et des règles, qui dépasse les individus."}, {"ok": false, "t": "L'ensemble des individus, au sens quantitatif du mot : le monde, c'est tout le monde, la foule.", "fb": "Non : dans « la cour est remplie de monde », le monde n'est qu'un terme de dénombrement ; ce n'est pas ce sens. Le monde dont il faut protéger l'enfant est le monde humain : la société, les civilisations, les cultures, l'ensemble des lois et des règles qui maintiennent les individus en société."}]}, {"ty": "multichoice", "q": "Quelle est la différence entre une contrainte et une obligation (repère du programme) ?", "a": [{"ok": true, "t": "La contrainte s'applique extérieurement à ma volonté, que je le veuille ou non ; l'obligation repose sur un consentement : je reconnais le bien-fondé de ce à quoi j'obéis.", "fb": "Correct. La contrainte est une force qui s'applique extérieurement à ma volonté, que je le veuille ou non. L'obligation est une force qui n'est pas extérieure à ma volonté : elle repose sur un consentement, l'accord de ma volonté. Dans l'obligation, je reconnais le bien-fondé, l'autorité de ce à quoi j'obéis : je me soumets à quelque chose que j'accepte. Les lois, par exemple, sont des obligations : dans une république, le principe même de la république est que la loi s'applique à tous, et on peut toujours contester la loi (en manifestant, en écrivant à son député, en contestant une amende) : s'il n'y avait aucun recours, ce ne serait pas une république. Or les enfants ne sont pas encore des citoyens : ils ne peuvent pas consentir aux lois, parce qu'ils ne les comprennent pas ; voilà pourquoi il faut protéger l'enfant du monde."}, {"ok": false, "t": "La contrainte est morale et l'obligation est physique : on est obligé par le corps, contraint par la conscience.", "fb": "Non : c'est l'inverse qu'il faut distinguer, et la différence n'est pas physique / morale. La contrainte est une force extérieure à ma volonté, que je le veuille ou non ; l'obligation repose sur un consentement de ma volonté : je reconnais le bien-fondé de ce à quoi j'obéis, comme pour les lois dans une république."}, {"ok": false, "t": "Il n'y a pas de différence : les deux mots désignent la même force qui nous pousse à agir.", "fb": "Non : le repère du programme distingue précisément les deux. La contrainte s'applique extérieurement à ma volonté, que je le veuille ou non ; l'obligation repose sur un consentement : dans l'obligation, je reconnais l'autorité de ce à quoi j'obéis, je me soumets à quelque chose que j'accepte."}, {"ok": false, "t": "L'obligation s'impose par la force, tandis que la contrainte n'est qu'une suggestion sans garantie.", "fb": "Non : la contrainte n'est pas une suggestion, c'est une force qui s'applique extérieurement à ma volonté, que je le veuille ou non. L'obligation, elle, repose sur un consentement, l'accord de ma volonté : je reconnais le bien-fondé de ce à quoi j'obéis, comme pour les lois dans une république."}]}, {"ty": "multichoice", "q": "Qu'est-ce qui, dans l'enfance, fait de l'enfant un danger pour le monde ?", "a": [{"ok": true, "t": "La liberté naturelle de l'enfant, qui s'exprime sans limite : cette absence de limite à sa liberté peut être nocive pour le monde.", "fb": "Correct. L'innocence, c'est aussi l'ignorance : un enfant innocent (« innocent » signifie étymologiquement « qui ne nuit pas ») qui ignore les règles n'est pas pour autant nocif. Ce qui fait que l'enfant abîme le monde (la pelouse du parc, les jouets démontés par curiosité), ce n'est pas seulement qu'il ignore les règles : c'est qu'il est libre. Il y a dans l'enfance une liberté naturelle, et cette liberté s'exprime sans limite. Une liberté sans limite est dangereuse : l'expression « ma liberté s'arrête là où celle des autres commence » n'est pas une idée naturelle, c'est une idée acquise, apprise ; c'est peut-être l'un des premiers principes de l'éducation : on apprend aux enfants à mettre des limites à leur liberté. Si la liberté n'est pas canalisée, pas limitée, elle porte atteinte à la liberté d'autrui, donc à la préservation du monde."}, {"ok": false, "t": "La méchanceté naturelle de l'enfant, qui veut détruire les règles et les lois de la société.", "fb": "Non : l'idée que les enfants seraient naturellement méchants est un préjugé, comme celle qu'ils seraient forcément bons. L'enfant est un danger pour le monde à cause de sa liberté naturelle, qui s'exprime sans limite : c'est cette absence de limite qui peut être nocive, non une méchanceté innée."}, {"ok": false, "t": "Son ignorance des règles et des lois, qui suffit à expliquer qu'il abîme le monde.", "fb": "Non : l'ignorance des règles ne suffit pas à expliquer que l'enfant les abîme. « Innocent » signifie étymologiquement « qui ne nuit pas » : l'ignorance n'est pas la nocivité. Ce qui rend l'enfant dangereux pour le monde, c'est sa liberté naturelle, qui s'exprime sans limite."}, {"ok": false, "t": "Son désir de remplacer la culture par la nature, pour détruire la civilisation.", "fb": "Non : l'enfant n'a pas de tel projet de destruction. C'est sa liberté naturelle, qui s'exprime sans limite, qui peut être nocive pour le monde : une liberté sans limite porte atteinte à la liberté d'autrui, donc à la préservation du monde. C'est pourquoi l'éducation apprend à mettre des limites à sa liberté."}]}, {"ty": "multichoice", "q": "Quelle opposition explique pourquoi il faut protéger le monde de l'enfant ?", "a": [{"ok": true, "t": "L'opposition entre nature et culture : l'enfant est d'abord un être naturel, sans limite, et le monde humain est un ensemble de conventions, de règles et de lois.", "fb": "Correct. Le monde est le monde humain, la civilisation, la société, la culture : un ensemble de conventions, de règles, de lois ; le monde n'est pas naturel. Or l'enfant est d'abord un être naturel, avant d'être éduqué, un être qui n'a encore reçu aucune limite à l'expression de sa nature (l'enfant fait ses besoins où il veut avant qu'on lui apprenne les règles d'hygiène ; il dort et mange quand il en a envie si on ne le force pas à des heures précises). Cette nature s'oppose par définition au monde humain, ensemble de conventions : c'est l'opposition entre nature et culture qui explique pourquoi il faut préserver le monde de l'enfant."}, {"ok": false, "t": "L'opposition entre le bien et le mal : l'enfant est naturellement mauvais et le monde naturellement bon.", "fb": "Non : l'idée que les enfants seraient naturellement méchants est un préjugé (ils ne sont pas pour autant naturellement bons). L'opposition qui explique la nécessité de protéger le monde de l'enfant est celle entre nature et culture : l'enfant est un être naturel dont la liberté s'exprime sans limite, le monde humain est un ensemble de conventions, de règles et de lois."}, {"ok": false, "t": "L'opposition entre l'individu et l'État : l'enfant représente l'individu face au pouvoir politique.", "fb": "Non : ce n'est pas la bonne opposition. C'est l'opposition entre nature et culture qui est en jeu : l'enfant est d'abord un être naturel, sans limite reçue, et le monde humain est un ensemble de conventions, de règles et de lois, qui n'est pas naturel."}, {"ok": false, "t": "L'opposition entre la famille et l'école : la famille protège, l'école transmet le monde.", "fb": "Non : ce n'est pas l'opposition travaillée pour expliquer ce point. C'est l'opposition entre nature et culture : l'enfant est un être naturel dont la liberté s'exprime sans limite, tandis que le monde humain (la société, la civilisation, la culture) est un ensemble de conventions, de règles et de lois."}]}, {"ty": "multichoice", "q": "Que désignent le public et le privé (repère du programme) ?", "a": [{"ok": true, "t": "Le public est l'espace commun à tous (la société, la ville, la rue), le privé est l'espace propre à la famille, derrière ses quatre murs.", "fb": "Correct. Public désigne un espace commun à tous : la société, la ville, la rue, où l'on ne peut pas se comporter comme on se comporterait chez soi, dans son intérieur ; c'est aussi un espace abstrait, comme l'opinion commune qui s'exprime à travers les médias, y compris les réseaux sociaux : s'y exprimer, c'est s'exprimer publiquement dans un espace commun. Privé désigne l'espace propre à la famille, derrière ses quatre murs. Hannah Arendt distingue ainsi des formes d'éducation : l'éducation au monde, l'éducation de l'enfant (l'introduire au monde), et l'éducation familiale, au sein de la vie de famille, qui se déploie derrière un rempart, dans l'espace privé de la famille."}, {"ok": false, "t": "Le public est l'espace de la famille et le privé l'espace du travai /**
 * EXTRACTION AUTOMATIQUE DES MÉTADONNÉES DE CHAQUE QCM
 * Déduit l'auteur/thème, la classe, la date (si présente dans le titre) et un identifiant stable.
 */
function parseQuizMetadata(item, index) {
  const title = item.ti || `QCM ${index + 1}`;
  let author = "Général";
  if (/kant/i.test(title)) author = "Kant";
  else if (/marx/i.test(title)) author = "Marx";
  else if (/freud/i.test(title)) author = "Freud";
  else if (/descartes/i.test(title)) author = "Descartes";
  else if (/arendt/i.test(title)) author = "Arendt";
  else if (/maxime/i.test(title)) author = "Kant (La maxime)";
  else if (/animal|connaître/i.test(title)) author = "Dissertations & Corrigés";

  const classMatch = title.match(/\((TG\d+|HLP)\)/i);
  const group = classMatch ? classMatch[1].toUpperCase() : "Cours";

  // Détection d'une date jj/mm ou ordre chronologique inversé (les plus récents sont en tête dans DATA)
  const dateMatch = title.match(/(\d{2})\/(\d{2})/);
  const sortOrder = dateMatch
    ? parseInt(dateMatch[2], 10) * 100 + parseInt(dateMatch[1], 10)
    : (1000 - index);

  return {
    id: "qcm_" + index + "_" + title.toLowerCase().replace(/[^a-z0-9]+/g, "_").slice(0, 32),
    index,
    title,
    author,
    group,
    sortOrder,
    count: item.n || item.q.length,
    questions: item.q
  };
}

/**
 * GESTIONNAIRE DE L'ÉTAT UTILISATEUR (localStorage)
 */
const STORAGE_KEY = "qcm_defi_philo_v1";

function loadUserState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.quizzes) return parsed;
    }
  } catch (e) {
    console.warn("Impossible de lire localStorage", e);
  }
  return {
    quizzes: {},   // { [quizId]: { visited, lastVisited, status, answers, validated, bestScore, lastScore, attempts: [] } }
    history: [],   // [{ quizId, title, date, score, correct, total }]
    activeChallenge: null
  };
}

let userState = loadUserState();

function saveUserState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
  } catch (e) {
    console.warn("Impossible de sauvegarder localStorage", e);
  }
  updateGlobalIndicators();
}

function getQuizState(quizId) {
  if (!userState.quizzes[quizId]) {
    userState.quizzes[quizId] = {
      visited: false,
      lastVisited: null,
      status: "NEVER_VISITED", // NEVER_VISITED | VISITED | IN_PROGRESS | COMPLETED
      answers: {},
      validated: {},
      bestScore: null,
      lastScore: null,
      attempts: []
    };
  }
  return userState.quizzes[quizId];
}

/**
 * UTILITAIRES D'AFFICHAGE & NORMALISATION
 */
function esc(t) {
  return String(t || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function normalizeStr(s) {
  return String(s || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, "'")
    .replace(/\s+/g, " ");
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 3200);
}

function askConfirm(title, msg, onConfirm) {
  const modal = document.getElementById("confirm-modal");
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-msg").textContent = msg;

  document.getElementById("modal-cancel").onclick = cleanup;

    onConfirm();
  };
}

function formatDateFR(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

/**
 * ÉVALUATION D'UNE QUESTION INDIVIDUELLE
 */
function evaluateQuestion(q, userAns) {
  if (userAns === undefined || userAns === null) return false;

  if (q.ty === "multichoice") {
    const correctIndices = q.a.map((a, idx) => (a.ok ? idx : -1)).filter(idx => idx !== -1);
    const picked = Array.isArray(userAns) ? userAns : [userAns];
    if (picked.length !== correctIndices.length) return false;
    return correctIndices.every(idx => picked.includes(idx));
  }

  if (q.ty === "shortanswer" || q.ty === "numerical") {
    const normUser = normalizeStr(userAns);
    if (!normUser) return false;
    return (q.a || []).some(a => a.ok && normalizeStr(a.t) === normUser);
  }

  if (q.ty === "matching") {
    const pairs = q.pairs || [];
    if (!Array.isArray(userAns) || userAns.length !== pairs.length) return false;
    return pairs.every((p, idx) => userAns[idx] === p.r);
  }

  if (q.ty === "cloze") {
    const expected = [];
    String(q.text || "").replace(/\{[^{}]*?[^:]*:=([^}]*?)\}/g, (m, w) => {
      expected.push(w.split("~~").map(v => normalizeStr(v)));
      return "";
    });
    if (!Array.isArray(userAns) || userAns.length !== expected.length) return false;
    return expected.every((validList, idx) => validList.includes(normalizeStr(userAns[idx])));
  }

  return false;
}

function updateGlobalIndicators() {
  const completed = QUIZZES.filter(q => getQuizState(q.id).status === "COMPLETED");
  const scores = completed.map(q => getQuizState(q.id).bestScore).filter(s => s !== null);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

  const avgPill = document.getElementById("global-avg-pill");
  avgPill.textContent = avg !== null ? `Moy. : ${avg}%` : "Moy. : —";
  avgPill.className = "score-badge " + (avg === null ? "" : avg >= 80 ? "high" : avg >= 50 ? "mid" : "");

  document.getElementById("footer-progress").textContent = `${completed.length} / ${QUIZZES.length} terminés`;

  const unlockedCount = CHALLENGES.filter(c => c.check(userState)).length;
  document.getElementById("footer-badges").textContent = `${unlockedCount} / ${CHALLENGES.length} défis`;

/**
 * TRI & FILTRAGE DE LA LISTE DES QCM DU MENU
 */
function getFilteredSortedQuizzes() {
  let arr = [...QUIZZES];

  // Recherche textuelle
  if (uiState.search) {
    const f = normalizeStr(uiState.search);
    arr = arr.filter(q =>
      normalizeStr(q.title).includes(f) ||
      normalizeStr(q.author).includes(f) ||
      normalizeStr(q.group).includes(f)
    );
  }

  // Filtre par auteur / thème
  if (uiState.authorFilter !== "ALL") {
    arr = arr.filter(q => q.author === uiState.authorFilter);
  }

  // Filtre par statut d'avancement
  if (uiState.statusFilter !== "ALL") {
    arr = arr.filter(q => {
      const qs = getQuizState(q.id);
      if (uiState.statusFilter === "UNSTARTED") {
        return qs.status === "NEVER_VISITED" || qs.status === "VISITED";
      }
      if (uiState.statusFilter === "IN_PROGRESS") {
        return qs.status === "IN_PROGRESS";
      }
      if (uiState.statusFilter === "COMPLETED") {
        return qs.status === "COMPLETED";
      }
      if (uiState.statusFilter === "TO_IMPROVE") {
        return qs.status === "COMPLETED" && (qs.bestScore ?? 100) < 70;
      }
      return true;
    });
  }

  // Tri multi-critères
  const statusWeight = { IN_PROGRESS: 0, NEVER_VISITED: 1, VISITED: 2, COMPLETED: 3 };
  arr.sort((a, b) => {
    const sa = getQuizState(a.id);
    const sb = getQuizState(b.id);
    switch (uiState.sortBy) {
      case "date-desc":
        return b.sortOrder - a.sortOrder;
      case "date-asc":
        return a.sortOrder - b.sortOrder;
      case "alpha-asc":
        return a.title.localeCompare(b.title, "fr");
      case "alpha-desc":
        return b.title.localeCompare(a.title, "fr");
      case "author":
        return a.author.localeCompare(b.author, "fr") || a.index - b.index;
      case "status":
        return (statusWeight[sa.status] ?? 9) - (statusWeight[sb.status] ?? 9);
      case "score-desc":
        return (sb.bestScore ?? -1) - (sa.bestScore ?? -1);
      case "count-desc":
        return b.count - a.count;
      default:
        return a.index - b.index;
    }
  });

  return arr;
}

/**
 * RENDU DU MENU LATÉRAL AVEC ÉTATS D'AVANCEMENT ET SCORES
 */
function renderMenu() {
  const list = getFilteredSortedQuizzes();
  listEl.innerHTML = "";

  document.getElementById("btn-view-dashboard").classList.toggle("active", uiState.view === "DASHBOARD");

  if (list.length === 0) {
    listEl.innerHTML = `<div style="padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;">Aucun QCM ne correspond à ces critères.</div>`;
    return;
  }

  list.forEach(quiz => {
    const qs = getQuizState(quiz.id);
    const answeredCount = Object.keys(qs.validated || {}).length;
    const pct = quiz.count > 0 ? Math.round((answeredCount / quiz.count) * 100) : 0;

    let statusBadge = `<span class="status-pill st-new">○ Jamais consulté</span>`;
    if (qs.status === "VISITED") {
      statusBadge = `<span class="status-pill st-seen">👁 Consulté (0/${quiz.count})</span>`;
    } else if (qs.status === "IN_PROGRESS") {
      statusBadge = `<span class="status-pill st-prog">⏳ En cours (${answeredCount}/${quiz.count})</span>`;
    } else if (qs.status === "COMPLETED") {
      statusBadge = `<span class="status-pill st-done">✓ Terminé</span>`;
    }

    let scoreHtml = "";
    if (qs.bestScore !== null) {
      const cls = qs.bestScore >= 80 ? "high" : qs.bestScore >= 50 ? "mid" : "";
      const lastPart = qs.attempts.length > 1 ? ` · Dern. ${qs.lastScore}%` : "";
      scoreHtml = `<span class="score-badge ${cls}" title="Meilleur score${lastPart}">★ ${qs.bestScore}%</span>`;
    }

    let progressBarHtml = "";
    if (qs.status === "IN_PROGRESS") {
      progressBarHtml = `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>`;
    } else if (qs.status === "COMPLETED") {
      progressBarHtml = `<div class="mini-bar"><div class="mini-bar-fill done" style="width:100%"></div></div>`;
    }

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "qcm-item" + (uiState.activeQuizId === quiz.id && uiState.view !== "DASHBOARD" ? " active" : "");
    btn.innerHTML = `
      <div class="qcm-item-top">
        <span class="qcm-title">${esc(quiz.title)}</span>
        <span class="cnt">${quiz.count} q.</span>
      </div>
      <div class="qcm-meta-row">
        ${statusBadge}
        ${scoreHtml}
      </div>
      ${progressBarHtml}
    `;

    btn.addEventListener("click", () => selectQuiz(quiz.id));
    listEl.appendChild(btn);
  });
}

/**
 * SÉLECTION D'UN QCM : DÉTECTION AUTOMATIQUE DE SON ÉTAT
 */
function selectQuiz(quizId) {
  const quiz = QUIZZES.find(q => q.id === quizId);
  if (!quiz) return;

  const qs = getQuizState(quizId);
  const previousStatus = qs.status;

  // Marquer comme consulté si c'est la première visite
  qs.visited = true;
  qs.lastVisited = new Date().toISOString();
  if (qs.status === "NEVER_VISITED") {
    qs.status = "VISITED";
  }
  saveUserState();

  uiState.activeQuizId = quizId;
  uiState.view = "QUIZ_INTRO";
  renderMenu();
  renderQuizContextualIntro(quiz, previousStatus);
  mainEl.scrollTop = 0;
}
