e à partir de l'exemple. Il faut marquer cette transition dans son texte."}, {"ok": false, "t": "Elle résout le problème en montrant que mentir est parfois permis.", "fb": "La première chose à voir dans la formulation de la maxime, c'est qu'elle résume l'exemple : elle est générale. Elle synthétise tous les éléments étudiés : la promesse, mais aussi la fausse promesse, le besoin, l'emprunt. Tous les éléments de l'exemple se trouvent réunis dans une seule phrase. C'est aussi ce qui marque la rupture entre les deux moments de l'argumentation : dans la première étape, Kant exposait un exemple particulier ; maintenant, avec la maxime, il énonce, il formule une règle à partir de l'exemple. Il faut marquer cette transition dans son texte."}, {"ok": false, "t": "Elle donne un second exemple, celui d'un autre individu qui ment.", "fb": "La première chose à voir dans la formulation de la maxime, c'est qu'elle résume l'exemple : elle est générale. Elle synthétise tous les éléments étudiés : la promesse, mais aussi la fausse promesse, le besoin, l'emprunt. Tous les éléments de l'exemple se trouvent réunis dans une seule phrase. C'est aussi ce qui marque la rupture entre les deux moments de l'argumentation : dans la première étape, Kant exposait un exemple particulier ; maintenant, avec la maxime, il énonce, il formule une règle à partir de l'exemple. Il faut marquer cette transition dans son texte."}, {"ok": false, "t": "Elle énonce la loi universelle qui conclut le texte.", "fb": "La première chose à voir dans la formulation de la maxime, c'est qu'elle résume l'exemple : elle est générale. Elle synthétise tous les éléments étudiés : la promesse, mais aussi la fausse promesse, le besoin, l'emprunt. Tous les éléments de l'exemple se trouvent réunis dans une seule phrase. C'est aussi ce qui marque la rupture entre les deux moments de l'argumentation : dans la première étape, Kant exposait un exemple particulier ; maintenant, avec la maxime, il énonce, il formule une règle à partir de l'exemple. Il faut marquer cette transition dans son texte."}]}, {"ty": "multichoice", "q": "Qui désigne le « je » de la maxime ? (attention, il y a deux pièges)", "a": [{"ok": true, "t": "Tout individu qui se trouverait dans le même cas (détresse financière, sans autre moyen d'obtenir de l'argent) : pas seulement l'individu de l'exemple, et pas l'auteur.", "fb": "Deux pièges à éviter. Premier piège : croire que le « je » désigne seulement l'individu pris en exemple. La maxime, même formulée à la première personne du singulier, désigne tout individu qui se trouverait dans le même cas, toute personne dans une situation de détresse financière sans autre moyen d'obtenir de l'argent que de faire une fausse promesse. Second piège : croire que le « je » désigne Kant lui-même : quand Kant écrit « je », il ne parle pas de lui, ce n'est pas l'auteur qui est désigné. Le « je » est donc un pronom personnel qui exprime une généralité : c'est un « je » générique, équivalent à « on » (on aurait très bien pu écrire : « quand on se croit à court d'argent, on accepte d'en emprunter et de promettre de le rendre, bien que l'on sache que tel ne sera jamais le cas »). On passe d'un exemple particulier à une généralisation."}, {"ok": false, "t": "Uniquement l'individu précis de l'exemple, et personne d'autre.", "fb": "Deux pièges à éviter. Premier piège : croire que le « je » désigne seulement l'individu pris en exemple. La maxime, même formulée à la première personne du singulier, désigne tout individu qui se trouverait dans le même cas, toute personne dans une situation de détresse financière sans autre moyen d'obtenir de l'argent que de faire une fausse promesse. Second piège : croire que le « je » désigne Kant lui-même : quand Kant écrit « je », il ne parle pas de lui, ce n'est pas l'auteur qui est désigné. Le « je » est donc un pronom personnel qui exprime une généralité : c'est un « je » générique, équivalent à « on » (on aurait très bien pu écrire : « quand on se croit à court d'argent, on accepte d'en emprunter et de promettre de le rendre, bien que l'on sache que tel ne sera jamais le cas »). On passe d'un exemple particulier à une généralisation."}, {"ok": false, "t": "Kant lui-même, qui raconte une expérience personnelle d'emprunt.", "fb": "Deux pièges à éviter. Premier piège : croire que le « je » désigne seulement l'individu pris en exemple. La maxime, même formulée à la première personne du singulier, désigne tout individu qui se trouverait dans le même cas, toute personne dans une situation de détresse financière sans autre moyen d'obtenir de l'argent que de faire une fausse promesse. Second piège : croire que le « je » désigne Kant lui-même : quand Kant écrit « je », il ne parle pas de lui, ce n'est pas l'auteur qui est désigné. Le « je » est donc un pronom personnel qui exprime une généralité : c'est un « je » générique, équivalent à « on » (on aurait très bien pu écrire : « quand on se croit à court d'argent, on accepte d'en emprunter et de promettre de le rendre, bien que l'on sache que tel ne sera jamais le cas »). On passe d'un exemple particulier à une généralisation."}, {"ok": false, "t": "Le lecteur, que Kant invite à répondre à sa place.", "fb": "Deux pièges à éviter. Premier piège : croire que le « je » désigne seulement l'individu pris en exemple. La maxime, même formulée à la première personne du singulier, désigne tout individu qui se trouverait dans le même cas, toute personne dans une situation de détresse financière sans autre moyen d'obtenir de l'argent que de faire une fausse promesse. Second piège : croire que le « je » désigne Kant lui-même : quand Kant écrit « je », il ne parle pas de lui, ce n'est pas l'auteur qui est désigné. Le « je » est donc un pronom personnel qui exprime une généralité : c'est un « je » générique, équivalent à « on » (on aurait très bien pu écrire : « quand on se croit à court d'argent, on accepte d'en emprunter et de promettre de le rendre, bien que l'on sache que tel ne sera jamais le cas »). On passe d'un exemple particulier à une généralisation."}]}, {"ty": "multichoice", "q": "Pourquoi Kant formule-t-il une règle générale à la première personne du singulier (« je ») ?", "a": [{"ok": true, "t": "Parce que la maxime est une règle générale que chacun formule pour lui-même, face à sa propre conscience : le « je » met l'individu face à sa conscience.", "fb": "Si la maxime est une règle générale, Kant aurait pu la formuler de manière impersonnelle (« quand on se croit à court d'argent, on accepte… »). S'il utilise malgré tout le « je », c'est que cela fait partie de la définition même de la maxime : c'est une règle générale dans sa formulation, mais une règle générale que je formule pour moi-même, pour ma conscience. C'est comme si l'individu, grâce à Kant, analysait ses propres actions : quand on fait le point sur ses actes, on se demande « est-ce que j'aurais dû faire ceci ? est-ce que j'aurais dû faire cela ? ». C'est aussi un moyen de mettre le lecteur dans la boucle, dans la connivence : Kant réfléchit à son exemple, mais il réfléchit toujours pour que les autres réfléchissent aussi."}, {"ok": false, "t": "Parce qu'il parle de lui-même et de ses propres difficultés d'argent.", "fb": "Si la maxime est une règle générale, Kant aurait pu la formuler de manière impersonnelle (« quand on se croit à court d'argent, on accepte… »). S'il utilise malgré tout le « je », c'est que cela fait partie de la définition même de la maxime : c'est une règle générale dans sa formulation, mais une règle générale que je formule pour moi-même, pour ma conscience. C'est comme si l'individu, grâce à Kant, analysait ses propres actions : quand on fait le point sur ses actes, on se demande « est-ce que j'aurais dû faire ceci ? est-ce que j'aurais dû faire cela ? ». C'est aussi un moyen de mettre le lecteur dans la boucle, dans la connivence : Kant réfléchit à son exemple, mais il réfléchit toujours pour que les autres réfléchissent aussi."}, {"ok": false, "t": "Parce que le « je » est plus simple à écrire qu'une formule impersonnelle.", "fb": "Si la maxime est une règle générale, Kant aurait pu la formuler de manière impersonnelle (« quand on se croit à court d'argent, on accepte… »). S'il utilise malgré tout le « je », c'est que cela fait partie de la définition même de la maxime : c'est une règle générale dans sa formulation, mais une règle générale que je formule pour moi-même, pour ma conscience. C'est comme si l'individu, grâce à Kant, analysait ses propres actions : quand on fait le point sur ses actes, on se demande « est-ce que j'aurais dû faire ceci ? est-ce que j'aurais dû faire cela ? ». C'est aussi un moyen de mettre le lecteur dans la boucle, dans la connivence : Kant réfléchit à son exemple, mais il réfléchit toujours pour que les autres réfléchissent aussi."}, {"ok": false, "t": "Parce qu'il veut désigner un seul individu bien précis.", "fb": "Si la maxime est une règle générale, Kant aurait pu la formuler de manière impersonnelle (« quand on se croit à court d'argent, on accepte… »). S'il utilise malgré tout le « je », c'est que cela fait partie de la définition même de la maxime : c'est une règle générale dans sa formulation, mais une règle générale que je formule pour moi-même, pour ma conscience. C'est comme si l'individu, grâce à Kant, analysait ses propres actions : quand on fait le point sur ses actes, on se demande « est-ce que j'aurais dû faire ceci ? est-ce que j'aurais dû faire cela ? ». C'est aussi un moyen de mettre le lecteur dans la boucle, dans la connivence : Kant réfléchit à son exemple, mais il réfléchit toujours pour que les autres réfléchissent aussi."}]}, {"ty": "multichoice", "q": "« Sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible avec tout mon bien-être futur, mais… » : quel raisonnement Kant fait-il ici ?", "a": [{"ok": true, "t": "Un raisonnement concessif : il accorde d'abord quelque chose (la concession), pour mieux défendre ensuite sa thèse à partir du « mais ».", "fb": "Kant ne fait pas ici une hypothèse : il fait un raisonnement. Il commence par une concession (« sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible avec tout mon bien-être futur »), puis il remet en cause à partir du « mais » : « mais la seule question est de savoir si ce principe est juste ». Le raisonnement concessif consiste à admettre, à accorder, à faire une concession, pour ensuite, dans un deuxième temps, mieux défendre sa thèse. En somme : « ce que tu dis n'est pas faux, mais j'ai raison ». Attention : le raisonnement concessif n'est pas sur la fiche du livre sur les raisonnements, il faut donc le noter dans le cahier."}, {"ok": false, "t": "Une hypothèse : il imagine ce qui se passerait si l'individu mentait.", "fb": "Kant ne fait pas ici une hypothèse : il fait un raisonnement. Il commence par une concession (« sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible avec tout mon bien-être futur »), puis il remet en cause à partir du « mais » : « mais la seule question est de savoir si ce principe est juste ». Le raisonnement concessif consiste à admettre, à accorder, à faire une concession, pour ensuite, dans un deuxième temps, mieux défendre sa thèse. En somme : « ce que tu dis n'est pas faux, mais j'ai raison ». Attention : le raisonnement concessif n'est pas sur la fiche du livre sur les raisonnements, il faut donc le noter dans le cahier."}, {"ok": false, "t": "Un raisonnement par l'absurde : il montre que la maxime conduit à une conséquence impossible.", "fb": "Kant ne fait pas ici une hypothèse : il fait un raisonnement. Il commence par une concession (« sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible avec tout mon bien-être futur »), puis il remet en cause à partir du « mais » : « mais la seule question est de savoir si ce principe est juste ». Le raisonnement concessif consiste à admettre, à accorder, à faire une concession, pour ensuite, dans un deuxième temps, mieux défendre sa thèse. En somme : « ce que tu dis n'est pas faux, mais j'ai raison ». Attention : le raisonnement concessif n'est pas sur la fiche du livre sur les raisonnements, il faut donc le noter dans le cahier."}, {"ok": false, "t": "Une démonstration par l'exemple : il raconte une nouvelle histoire.", "fb": "Kant ne fait pas ici une hypothèse : il fait un raisonnement. Il commence par une concession (« sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible avec tout mon bien-être futur »), puis il remet en cause à partir du « mais » : « mais la seule question est de savoir si ce principe est juste ». Le raisonnement concessif consiste à admettre, à accorder, à faire une concession, pour ensuite, dans un deuxième temps, mieux défendre sa thèse. En somme : « ce que tu dis n'est pas faux, mais j'ai raison ». Attention : le raisonnement concessif n'est pas sur la fiche du livre sur les raisonnements, il faut donc le noter dans le cahier."}]}, {"ty": "matching", "q": "Associez chaque concept du cours à sa définition.", "pairs": [{"l": "Dilemme moral", "r": "Un cas de conscience : une contradiction que rencontre la conscience morale"}, {"l": "Légal", "r": "Ce qui est conforme à la loi : ce que la loi autorise et tout ce qu'elle n'interdit pas"}, {"l": "Légitime", "r": "Ce qui est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale"}, {"l": "Abus de confiance", "r": "Tromper la confiance de quelqu'un, profiter de sa vulnérabilité ou de son ignorance : un délit"}, {"l": "Cupidité", "r": "L'appât du gain, l'avidité pour l'argent"}, {"l": "Maxime", "r": "Un principe d'action, une règle de conduite que je me donne pour réaliser une intention"}]}, {"ty": "cloze", "q": "La maxime de l'individu", "text": "Complétez la maxime formulée par Kant : « Quand je me crois à court d'argent, j'accepte d'en {1:SHORTANSWER:=emprunter} et de promettre de le {1:SHORTANSWER:=rendre} bien que je sache que tel ne sera jamais le {1:SHORTANSWER:=cas} ». — Formule à retenir : la maxime est une règle de conduite, un principe d'action que je me donne pour réaliser une intention ; formulée à la première personne, elle désigne tout individu dans le même cas."}, {"ty": "shortanswer", "q": "À quelle page du livre se trouve la présentation des différents types de raisonnements, à lire pour la prochaine fois ? (répondez par le numéro)", "a": [{"ok": true, "t": "518", "fb": "Page 518 : la présentation des différents types de raisonnements (l'affiche « outils » sur les raisonnements). Connaître les différents types de raisonnements permet de les identifier dans les textes à expliquer : quand un auteur utilise un certain type de raisonnement, on le reconnaît, et cela permet aussi d'adopter soi-même des raisonnements dans ses dissertations, au lieu de rédiger des dissertations qui ne sont pas logiques. Attention : le raisonnement concessif n'y figure pas, il faut le noter dans le cahier."}]}, {"ty": "shortanswer", "q": "À quelle page du livre se trouve la définition du repère légal / légitime ? (répondez par le numéro)", "a": [{"ok": true, "t": "528", "fb": "Page 528 : la définition du repère légal / légitime. Il faut aussi aller voir la fiche « Découvrir les repères » sur Pronote, où les repères du programme sont définis avec des exemples et un petit QCM pour chacun. Les repères sont un élément du programme : il faut apprendre à faire la différence entre légal (conforme à la loi) et légitime (conforme à une norme non juridique, par exemple morale), même si ces deux mots peuvent avoir des points communs."}]}]}, {"ti": "TG02 — L'homme est-il un animal comme les autres ? (corrigé)", "n": 15, "q": [{"ty": "multichoice", "q": "Problématique : pourquoi le sujet comporte-t-il un paradoxe, c'est-à-dire une contradiction apparente ?", "a": [{"ok": true, "t": "Se demander si l'homme est un animal « comme les autres », c'est en quelque sorte donner la réponse dans la question : seul l'homme se pose cette question, l'animal ne fait pas de philosophie.", "fb": "Correct. La formule « comme les autres » fait problème : se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question, car seul l'homme, doté d'une conscience, se pose cette question. L'animal ne fait pas de philosophie."}, {"ok": false, "t": "Parce que la science ne peut pas trancher : l'homme partage l'essentiel de son patrimoine génétique avec les grands singes, et cette parenté non résolue rendrait seule la question contradictoire.", "fb": "Non : le paradoxe est dans la formule « comme les autres ». Se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question, car seul l'homme se pose cette question : l'animal ne fait pas de philosophie."}, {"ok": false, "t": "Parce que le mot « animal » a un sens péjoratif dans la langue courante, alors qu'il désigne au sens scientifique un simple règne du vivant : cet écart suffirait à créer la contradiction apparente.", "fb": "Non : le paradoxe n'est pas dans le sens péjoratif du mot, il est dans la formule « comme les autres ». Se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question, car seul l'homme se pose cette question : l'animal ne fait pas de philosophie."}, {"ok": false, "t": "Parce que certains animaux semblent plus intelligents que certains hommes : le corbeau fabrique des outils, le chien comprend des centaines de mots, et ce renversement contredirait la question posée.", "fb": "Non : le paradoxe est dans la formule « comme les autres ». Se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question, car seul l'homme, doté d'une conscience, se pose cette question : l'animal ne fait pas de philosophie."}]}, {"ty": "multichoice", "q": "Problématique : quel problème la conscience pose-t-elle exactement ?", "a": [{"ok": true, "t": "Savoir si la conscience introduit une différence de nature ou une simple différence de degré, et si ce privilège confère à l'homme un droit sur la nature ou lui impose des devoirs.", "fb": "Correct. La conscience donne à l'homme le pouvoir de transformer la nature selon ses projets ; on doit se demander si ce pouvoir introduit une différence de nature ou une simple différence de degré, et s'il confère un droit sur la nature et les autres animaux ou impose au contraire des devoirs."}, {"ok": false, "t": "Savoir si la conscience est un don reçu de la nature ou une construction culturelle : l'homme naîtrait avec elle dans un cas, il l'acquerrait par l'éducation et le langage dans l'autre, et tout le statut de la pensée dépendrait de cette origine.", "fb": "Non : le problème est double — différence de nature ou de degré ? droit sur la nature ou devoirs envers elle ? La conscience donne le pouvoir de transformer la nature selon ses projets, et c'est ce pouvoir qui rend la différence problématique."}, {"ok": false, "t": "Savoir si l'animal possède lui aussi une forme de conscience, même réduite : la douleur, la peur et l'attachement observés chez la bête suggèrent une vie intérieure, et la limite entre l'homme et l'animal deviendrait alors une simple frontière floue.", "fb": "Non : la question n'est pas de savoir si l'animal a une conscience. Le problème est : la conscience humaine introduit-elle une différence de nature ou une simple différence de degré, et ce privilège confère-t-il un droit sur la nature ou impose-t-il des devoirs ?"}, {"ok": false, "t": "Savoir si l'homme peut perdre sa conscience dans des situations extrêmes : le sommeil, le coma ou l'ivresse montrent un être qui cesse momentanément de penser, ce qui suggérerait que la conscience est un état variable plutôt qu'une nature fixée.", "fb": "Non : le problème est double — la conscience introduit-elle une différence de nature ou une simple différence de degré ? Et ce privilège donne-t-il un droit sur la nature ou impose-t-il des devoirs qu'aucune bête ne connaît ?"}]}, {"ty": "multichoice", "q": "Problématique : que montre l'exemple de l'alimentation ?", "a": [{"ok": true, "t": "À travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens : il prépare, cuisine et partage ses repas selon des principes culturels ou religieux.", "fb": "Correct. Le loup dévore sa proie par instinct, sous l'impulsion de la faim ; l'homme dépasse cette fonction vitale en préparant ses repas, en cuisinant, en les partageant selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}, {"ok": false, "t": "Que le régime alimentaire suffit à distinguer les vivants : l'homme serait carnivore quand la vache rumine et le loup dévore, et ce critère biologique classerait chaque espèce dans la chaîne alimentaire sans rien dire d'autre.", "fb": "Non : ce n'est pas une question de régime alimentaire. Le loup dévore sa proie par instinct ; l'homme cuisine et partage ses repas selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}, {"ok": false, "t": "Que l'homme sait résister à la faim plus longtemps que l'animal : une performance physiologique de jeûne qui tiendrait à la taille du corps et au métabolisme, comme l'ours qui traverse l'hiver sans manger.", "fb": "Non : l'exemple ne porte pas sur la performance biologique. Le loup dévore sa proie par instinct ; l'homme dépasse la fonction vitale en préparant, cuisinant et partageant ses repas selon des principes culturels ou religieux : par le même besoin biologique, il introduit coutumes, rituels et sens."}, {"ok": false, "t": "Que l'alimentation serait le seul domaine où l'homme transforme la nature : partout ailleurs il subirait, comme la naissance, la croissance et la mort, tandis que seule la cuisine lui appartiendrait en propre.", "fb": "Non : l'alimentation est un exemple parmi d'autres, non le seul domaine distinctif. Le loup dévore par instinct ; l'homme cuisine et partage selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}]}, {"ty": "multichoice", "q": "I. Culture : quel est le premier indice d'une différence qui ne serait pas seulement de degré ?", "a": [{"ok": true, "t": "L'inversion du rapport au milieu : l'ours blanc développe une fourrure au fil de l'évolution, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature.", "fb": "Correct. L'homme ne s'adapte pas à son environnement : il adapte la nature à ses besoins en la transformant (villes, outils, machines, domestication). L'ours blanc a développé une fourrure ; l'homme a conçu le vêtement : cette inversion du rapport au milieu est le premier indice d'une différence qui ne serait pas seulement de degré."}, {"ok": false, "t": "La taille du cerveau humain, supérieure à celle de tous les animaux : un plus grand volume cortical donnerait plus de neurones, donc plus d'habileté, comme un muscle plus développé donne plus de force.", "fb": "Non : ce serait précisément une simple différence de degré. Le premier indice d'une autre différence est l'inversion du rapport au milieu : l'ours blanc développe une fourrure au fil de l'évolution, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}, {"ok": false, "t": "La capacité de l'homme à courir plus vite que ses proies sur de longues distances : la chasse à l'épuisement serait l'indice d'une supériorité biologique de l'espèce, l'homme étant le mammifère terrestre le plus endurant.", "fb": "Non : c'est une performance biologique, donc une question de degré. Le premier indice est l'inversion du rapport au milieu : l'ours blanc développe une fourrure, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}, {"ok": false, "t": "L'absence totale de besoins vitaux chez l'homme : affranchi de la faim, de la soif et du sommeil par la technique, il vivrait désormais hors du vivant, dans un milieu artificiel qui le dispenserait de la nature.", "fb": "Non : l'homme a, comme tout vivant, des besoins vitaux. Le premier indice est l'inversion du rapport au milieu : l'ours développe une fourrure, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}]}, {"ty": "multichoice", "q": "I. Culture : que signifie la perfectibilité selon Rousseau ?", "a": [{"ok": true, "t": "L'homme est capable de se transformer lui-même, « qualité qui, à l'aide des circonstances, développe successivement toutes les autres » : son existence n'a pas de forme fixée, elle est un projet, non une fonction.", "fb": "Correct. Rousseau en fait la définition même de l'homme : tout est bien chez l'animal, parfaitement adapté à sa condition, tandis que l'homme est perfectible, capable de se transformer lui-même. La perfectibilité signifie que l'existence humaine n'a pas de forme fixée : elle est un projet, non une fonction."}, {"ok": false, "t": "L'animal peut devenir humain si les circonstances sont favorables.", "fb": "Non : l'animal est fixé par l'instinct. La perfectibilité est la capacité propre à l'homme de se transformer lui-même, « qualité qui, à l'aide des circonstances, développe successivement toutes les autres » : son existence est un projet, non une fonction."}, {"ok": false, "t": "L'homme parfait ses instincts jusqu'à devenir aussi bien adapté que l'animal.", "fb": "Non : chez l'animal tout est bien justement parce qu'il est parfaitement adapté ; la perfectibilité de l'homme est au contraire la capacité de se transformer lui-même, sans forme fixée : un projet, non une fonction."}, {"ok": false, "t": "La société rend l'homme définitivement parfait, quel que soit son état de nature.", "fb": "Non : Rousseau voit même dans la société une source de dépravation autant que de perfectionnement. La perfectibilité est la capacité de l'homme de se transformer lui-même : son existence n'a pas de forme fixée, elle est un projet, non une fonction."}]}, {"ty": "multichoice", "q": "I. Culture : que signifie homo faber chez Bergson ?", "a": [{"ok": true, "t": "Avant de raisonner (homo sapiens), l'homme fabrique ; et cette fabrication déborde toujours la simple survie : le pot devient vase décoré, le chant de travail devient musique.", "fb": "Correct. Bergson définit l'homme comme homo faber : avant de raisonner, l'homme fabrique. Et cette fabrication déborde toujours la simple survie : le pot qui conserve la nourriture devient vase décoré, le chant qui rythme le travail devient musique, le récit qui transmet l'expérience devient littérature et mythe. La transformation du monde vise à apporter du sens à l'existence."}, {"ok": false, "t": "L'homme est d'abord un fabricant d'outils et rien d'autre : définir l'homme par la seule production technique, l'outillage étant l'unique activité qui compte, et Bergson réduirait ainsi l'esprit humain à la main.", "fb": "Non : homo faber ne réduit pas l'homme à l'outil. Avant de raisonner (homo sapiens), l'homme fabrique ; et cette fabrication déborde toujours la simple survie : le pot devient vase décoré, le chant devient musique — elle apporte du sens à l'existence par des symboles et des valeurs partagées."}, {"ok": false, "t": "Seul l'homme moderne, industrialisé, fabrique des objets : les sociétés anciennes ou dites « primitives » n'auraient produit que des gestes instinctifs, la fabrication exigeant usines et machines sophistiquées.", "fb": "Non : l'animal aussi fabrique (outils des chimpanzés), mais ses fabrications demeurent enfermées dans la fonction vitale. Homo faber signifie : avant de raisonner, l'homme fabrique ; et cette fabrication déborde toujours la simple survie pour apporter du sens (le pot devient vase décoré, le chant devient musique)."}, {"ok": false, "t": "La fabrication humaine vise uniquement la survie, comme celle de l'animal : le pot ne servirait qu'à conserver, le chant qu'à rythmer l'effort, et jamais le fabriqué ne s'émanciperait de la fonction vitale qui l'a fait naître.", "fb": "Non : c'est l'inverse — la fabrication humaine déborde toujours la simple survie. Avant de raisonner, l'homme fabrique ; le pot devient vase décoré, le chant devient musique, le récit devient littérature : la transformation du monde apporte du sens à l'existence."}]}, {"ty": "multichoice", "q": "I. Culture : quelle est la différence entre le signal animal et le mot humain ?", "a": [{"ok": true, "t": "Le signal animal est rivé à la situation présente ; le mot humain peut parler de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet.", "fb": "Correct. Les animaux communiquent de façon instinctive : le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer le pollen. Le langage humain exprime des pensées abstraites et fonde des institutions. Le signal animal est rivé à la situation présente ; le mot humain rend possible la promesse, la règle, la fiction, le projet. C'est pourquoi Lévi-Strauss montre que même les sociétés dites « primitives » organisent le monde par des symboles et des règles."}, {"ok": false, "t": "L'animal ne posséderait aucun moyen de communication : seul l'homme aurait un langage, l'abeille ne danserait pas vraiment, le chant de l'oiseau n'annoncerait rien, et la communication entre bêtes serait une illusion d'observateur.", "fb": "Non : les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse). Mais le signal animal est rivé à la situation présente, tandis que le mot humain peut parler de ce qui n'existe pas ou devrait être : promesse, règle, fiction, projet."}, {"ok": false, "t": "La différence serait uniquement quantitative : l'homme disposerait de davantage de signaux que l'animal, quelques milliers de mots contre quelques cris, la structure du langage restant strictement la même des uns aux autres.", "fb": "Non : ce serait une différence de degré, or la différence est de structure. Le signal animal est rivé à la situation présente ; le mot humain parle de ce qui n'existe pas, a disparu ou devrait être : il rend possible la promesse, la règle, la fiction, le projet."}, {"ok": false, "t": "Le langage animal serait plus précis que le langage humain : rivé à l'instinct, le signal de l'abeille ne peut pas se tromper, là où la parole humaine multiplie malentendus, ambiguïtés et contresens.", "fb": "Non : la précision du signal animal est justement sa limite — il est rivé à la situation présente. Le mot humain parle de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet."}]}, {"ty": "multichoice", "q": "I. Culture : pourquoi l'éthologie (Jane Goodall, corbeaux calédoniens) renforce-t-elle plutôt la distinction homme / animal ?", "a": [{"ok": true, "t": "Parce que les traditions animales demeurent enfermées dans leur fonction vitale, sans conscience de transmettre, désir d'innover ou question du sens : seul l'homme accumule ses inventions, les critique, les dépasse.", "fb": "Correct. Depuis Jane Goodall (1960), on sait que les chimpanzés fabriquent et utilisent des outils, que les corbeaux calédoniens améliorent leurs outils et que ces techniques se transmettent par apprentissage social. On peut parler avec précaution de « cultures animales ». Mais ces traditions demeurent enfermées dans leur fonction vitale : la différence entre le chimpanzé qui casse une noix et l'homme qui écrit un traité de balistique n'est pas seulement quantitative — l'homme seul accumule ses inventions, les critique, les dépasse."}, {"ok": false, "t": "Parce que ces observations se seraient révélées fausses : les chimpanzés n'utiliseraient pas d'outils, les corbeaux n'amélioreraient rien, et l'éthologie contemporaine aurait été entraînée dans une erreur collective d'interprétation.", "fb": "Non : ces observations sont exactes (chimpanzés, corbeaux calédoniens) et l'on peut parler avec précaution de « cultures animales ». Mais ces traditions demeurent enfermées dans leur fonction vitale, sans conscience de transmettre ni question du sens : l'homme seul accumule ses inventions, les critique, les dépasse."}, {"ok": false, "t": "Parce qu'elles montreraient la supériorité animale dans la fabrication technique : la brindille du chimpanzé atteindrait une efficacité que l'outil humain n'égale pas, et c'est la bête qui donnerait la leçon à l'ingénieur.", "fb": "Non : elles montrent seulement des fabrications techniques enfermées dans la fonction vitale. La différence entre le chimpanzé qui casse une noix et l'homme qui écrit un traité de balistique n'est pas seulement quantitative : l'homme seul accumule ses inventions, les critique, les dépasse."}, {"ok": false, "t": "Parce que ces cultures animales prouveraient l'identité complète : la transmission, l'innovation et la question du sens existeraient aussi chez la bête, et l'homme serait exactement un animal comme les autres, sans reste.", "fb": "Non : ces aveux renforcent la distinction. Les « cultures animales » demeurent enfermées dans leur fonction vitale, sans conscience de transmettre ni question du sens : l'homme seul accumule ses inventions, les critique, les dépasse."}]}, {"ty": "multichoice", "q": "II. Morale et politique : comment comprendre la citation de Rousseau « l'impulsion du seul appétit est esclavage, et l'obéissance à la loi qu'on s'est prescrite est liberté » ?", "a": [{"ok": true, "t": "Paradoxalement, c'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions : le lion affamé chasse, l'homme peut jeûner par conviction.", "fb": "Correct. Là où l'animal est déterminé par l'impulsion du seul appétit, l'homme peut s'interroger sur le bien et le mal, résister à ses désirs immédiats, s'imposer des devoirs et des lois. Le lion affamé chasse ; l'homme peut jeûner par conviction religieuse, politique ou médicale. C'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions. Cette capacité fonde la responsabilité : on ne loue ni ne blâme le loup qui tue, on juge l'homme qui assassine."}, {"ok": false, "t": "Rousseau défendrait la spontanéité naturelle : suivre ses désirs sans entrave serait la seule vraie liberté, la loi n'étant qu'une chaîne sociale, et l'homme le plus libre serait celui qui obéit le moins possible.", "fb": "Non : c'est l'inverse. L'impulsion du seul appétit est esclavage ; l'obéissance à la loi qu'on s'est prescrite est liberté. C'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions."}, {"ok": false, "t": "Rousseau justifierait la contrainte tant que la loi n'est pas écrite par le peuple : l'obéissance à un autre vaudrait servitude, et seule la soumission au souverain collectif mériterait le nom de liberté civile.", "fb": "Non : Rousseau ne défend aucun esclavage. La citation est un paradoxe : l'impulsion du seul appétit est esclavage (l'animal y est soumis), l'obéissance à la loi qu'on s'est prescrite est liberté — c'est en s'imposant des règles que l'homme se rend libre."}, {"ok": false, "t": "Toute loi serait en soi un signe de liberté : peu importe qu'on se l'ait prescrite ou qu'un autre l'impose, obéir témoignerait du consentement des gouvernés, et la règle commune vaudrait toujours affranchissement.", "fb": "Non : Rousseau précise « la loi qu'on s'est prescrite ». Ce n'est pas l'obéissance à n'importe quelle loi qui libère, mais l'auto-prescription : c'est en s'imposant ses propres règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions."}]}, {"ty": "multichoice", "q": "II. Morale et politique : quelle distinction Kant établit-il entre le prix et la dignité ?", "a": [{"ok": true, "t": "Le prix est la valeur des choses qui se troquent ; la dignité est la valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen.", "fb": "Correct. La capacité d'agir contre ses penchants immédiats fonde la responsabilité et la dignité de la personne humaine : on ne loue ni ne blâme le loup qui tue, on juge l'homme qui assassine, parce que seul l'homme aurait pu agir autrement. Kant oppose le prix, valeur des choses qui se troquent, à la dignité, valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"ok": false, "t": "Le prix serait la valeur des êtres humains eux-mêmes : le salaire mesurerait la dignité d'une personne sur le marché du travail, et l'on pourrait comparer les individus comme on compare des marchandises selon leur rareté.", "fb": "Non : c'est l'inverse. Le prix est la valeur des choses qui se troquent ; la dignité est la valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"ok": false, "t": "La dignité serait un mérite qui se gagne et se perd : elle dépendrait de la conduite de chacun, le crime la dégraderait, l'héroïsme l'élèverait, et le prix viendrait seulement consacrer ce classement intérieur.", "fb": "Non : la dignité est inconditionnelle, précisément parce qu'elle ne se troque pas comme le prix des choses. La personne doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"ok": false, "t": "Kant réserverait la dignité aux seuls membres d'une cité idéale : hors de la communauté politique, les individus n'auraient qu'une valeur marchande, et le statut de personne se confondrait avec celui de citoyen.", "fb": "Non : la dignité est la valeur inconditionnelle de toute personne humaine, par opposition au prix, valeur des choses qui se troquent. Elle exige que la personne soit toujours traitée comme une fin et jamais seulement comme un moyen."}]}, {"ty": "multichoice", "q": "II. Morale et politique : que disent Descartes et Bentham sur le statut des animaux ?", "a": [{"ok": true, "t": "Descartes soutient que les animaux sont de simples machines, légitimant la disposition des bêtes ; Bentham retourne l'argument : la question n'est pas « peuvent-ils raisonner ? » ou « parler ? » mais « peuvent-ils souffrir ? ».", "fb": "Correct. Descartes soutient que les animaux sont des automates complexes dépourvus de pensée et de langage : l'homme, « maître et possesseur de la nature », disposerait des bêtes comme d'instruments. Bentham, au XVIIIe siècle, retourne l'argument : la question pertinente n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? », mais « peuvent-ils souffrir ? » — or l'animal souffre, éprouve la douleur, la peur."}, {"ok": false, "t": "Descartes accorderait une pensée aux bêtes que Bentham leur refuserait : le premier les rangerait parmi les vivants pensants, le second parmi les automates, et leur désaccord porterait sur la raison animale.", "fb": "Non : c'est l'inverse. Pour Descartes, les animaux sont de simples machines dépourvues de pensée et de langage ; Bentham retourne l'argument en demandant non pas « peuvent-ils raisonner ou parler ? » mais « peuvent-ils souffrir ? » — ce qu'ils éprouvent effectivement."}, {"ok": false, "t": "Bentham soutiendrait que seuls les animaux raisonneurs méritent notre respect : la capacité d'argumenter plutôt que la sensibilité fixerait ce que nous devons aux bêtes, et la douleur ne compterait pas.", "fb": "Non : Bentham déplace précisément le critère de la raison vers la souffrance : la question pertinente n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? », mais « peuvent-ils souffrir ? ». Descartes, lui, tenait les animaux pour de simples machines."}, {"ok": false, "t": "Tous deux s'accorderaient sur l'absence de douleur chez les animaux : la bête ne souffrirait pas plus qu'une machine, et la question de sa protection morale ne se poserait donc pour aucun des deux.", "fb": "Non : Bentham affirme précisément que l'animal souffre, éprouve la douleur et la peur. Descartes tenait les animaux pour des machines sans pensée ; Bentham remplace la question « peuvent-ils raisonner ou parler ? » par « peuvent-ils souffrir ? »."}]}, {"ty": "multichoice", "q": "II. Morale et politique : quelle est la position de Kant sur nos devoirs envers les animaux ?", "a": [{"ok": true, "t": "Nous n'avons pas de devoirs directs « envers » les animaux, mais nous en avons « à l'égard » d'eux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes.", "fb": "Correct. Kant nie que nous ayons des devoirs directs « envers » les animaux, mais reconnaît que nous en avons « à l'égard » d'eux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes. La conscience ne légitime pas la domination, elle fonde une responsabilité. Ce débat irrigue les questions contemporaines : libération animale (Peter Singer), reconnaissance des animaux comme « êtres vivants doués de sensibilité » dans le Code civil français depuis 2015."}, {"ok": false, "t": "Kant accorderait aux animaux exactement les mêmes droits qu'aux personnes : la différence de nature n'aurait aucune conséquence morale, et la communauté des vivants vaudrait la communauté humaine.", "fb": "Non : Kant refuse des devoirs directs « envers » les animaux ; mais il reconnaît des devoirs « à l'égard » d'eux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes."}, {"ok": false, "t": "Kant autoriserait toute cruauté puisque l'animal n'est qu'une machine : reprenant Descartes, il légitimerait l'expérimentation et la domestication sans limite, la bête ne comptant pas moralement.", "fb": "Non : c'est la thèse cartésienne des animaux-machines, pas celle de Kant. Pour Kant, nous avons des devoirs « à l'égard » des animaux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes."}, {"ok": false, "t": "La distinction « envers » / « à l'égard » n'aurait aucune conséquence pratique : simple subtilité de vocabulaire, elle ne changerait rien à nos obligations et la cruauté envers la bête resterait moralement neutre.", "fb": "Non : elle a une conséquence réelle. Les devoirs « à l'égard » des animaux signifient que la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes : la conscience ne légitime pas la domination, elle fonde une responsabilité."}]}, {"ty": "multichoice", "q": "III. Connaissance : pourquoi le doute est-il impossible à l'animal ?", "a": [{"ok": true, "t": "Parce que le doute suppose de se représenter ses propres représentations, de prendre ses croyances pour objet : seul l'homme sait qu'il sait, et peut donc aussi savoir qu'il se trompe.", "fb": "Correct. La mouche perçoit la lumière, la chauve-souris localise ses proies, le pigeon retrouve son pigeonnier ; mais aucun animal ne se demande si sa perception est fidèle à la réalité. Descartes a fait du doute une méthode : suspendre toute croyance jusqu'à la certitude indubitable « je pense, donc je suis ». L'animal ne doute pas, car le doute suppose de se représenter ses propres représentations : seul l'homme sait qu'il sait, et peut savoir qu'il se trompe."}, {"ok": false, "t": "Parce que l'animal n'aurait aucune perception de son milieu : privé de regard et d'ouïe attentifs, la bête errerait dans un monde confus, ce qui expliquerait qu'elle ne puisse rien mettre en question de ce qui l'entoure.", "fb": "Non : l'animal perçoit très bien son milieu (la mouche perçoit la lumière, le pigeon retrouve son pigeonnier), mais pour y survivre. Aucun animal ne se demande si sa perception est fidèle à la réalité : le doute suppose de se représenter ses propres représentations — seul l'homme sait qu'il sait."}, {"ok": false, "t": "Parce que l'animal douterait en permanence : sans certitude jamais fixée, hésitant sur chaque proie et chaque sentier, la bête serait paralysée par un soupçon permanent, incapable de la sûreté de l'instinct.", "fb": "Non : l'animal ne doute pas. Le doute suppose de se représenter ses propres représentations, de prendre ses croyances pour objet : seul l'homme sait qu'il sait, et peut donc aussi savoir qu'il se trompe."}, {"ok": false, "t": "Parce que les animaux détiendraient des certitudes supérieures aux nôtres : l'instinct ne se tromperait jamais là où la raison doute et se corrige, et la mouche, la chauve-souris et le pigeon en sauraient plus que nous.", "fb": "Non : l'animal n'a pas des certitudes mais des perceptions réglées par l'instinct, sans questionnement. Le doute exige de se représenter ses propres représentations : seul l'homme sait qu'il sait, et peut donc savoir qu'il se trompe."}]}, {"ty": "multichoice", "q": "III. Connaissance : que montre Popper à propos de la science ?", "a": [{"ok": true, "t": "Une théorie n'est scientifique que si elle peut être réfutée : pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison.", "fb": "Correct. La science moderne articule l'expérience (empiristes : Locke, Hume) et la raison (rationalistes : Descartes, Spinoza) par la méthode expérimentale, dont Popper montre le caractère critique : une théorie n'est scientifique que si elle peut être réfutée. Toute cette entreprise est impensable dans la conscience animale : pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison."}, {"ok": false, "t": "Une théorie serait scientifique si personne ne peut jamais la contester : admise par la communauté des savants, elle deviendrait inattaquable, et sa solidité se mesurerait au nombre de ses partisans.", "fb": "Non : c'est l'inverse. Pour Popper, une théorie n'est scientifique que si elle peut être réfutée : une théorie qu'aucune observation ne pourrait contester n'est pas scientifique. Pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison."}, {"ok": false, "t": "La science ne reposerait que sur l'expérience : la raison n'y jouerait aucun rôle, contre les rationalistes comme Descartes et Spinoza, et l'observation seule établirait une vérité définitive.", "fb": "Non : la science moderne articule les deux — l'expérience (Locke, Hume) et la raison (Descartes, Spinoza) — par la méthode expérimentale. Popper montre son caractère critique : une théorie n'est scientifique que si elle peut être réfutée."}, {"ok": false, "t": "Popper prouverait que les animaux pratiquent aussi la méthode expérimentale : le rat testerait ses hypothèses comme le chercheur, et la frontière entre la science et l'ingéniosité de la bête s'effacerait.", "fb": "Non : cette exigence de preuve et de réfutation est impensable dans la conscience animale. Popper montre le caractère critique de la science : une théorie n'est scientifique que si elle peut être réfutée — il faut pouvoir préférer être démenti que d'avoir raison."}]}, {"ty": "multichoice", "q": "Conclusion : quelle est la réponse du corrigé à la question posée ?", "a": [{"ok": true, "t": "L'homme demeure un animal né de l'évolution, mais sa différence est une différence de nature ; et cette différence ne lui donne pas un privilège de domination, elle lui impose une responsabilité.", "fb": "Correct. L'homme demeure en fait un animal né de l'évolution, soumis au vivant, mortel ; mais la conscience fait de lui le seul vivant qui se fait lui-même par la culture, se donne des lois par la morale et la politique, et cherche la vérité par la connaissance : différence de nature. Et cette différence ne lui donne pas un privilège de domination mais lui impose une responsabilité : sa grandeur se mesure à la hauteur de ses responsabilités."}, {"ok": false, "t": "L'homme serait un animal exactement comme les autres : la conscience n'ajouterait qu'un degré d'habileté de plus, la culture une habitude prise, et se poser la question ne serait qu'une singulière manie d'animal bavard.", "fb": "Non : la conclusion refuse les deux excès. Si l'homme demeure un animal né de l'évolution, sa différence est de nature (culture, lois, vérité), non un simple degré supplémentaire d'habileté — et elle impose une responsabilité plutôt qu'un privilège de domination."}, {"ok": false, "t": "L'homme ne serait pas du tout un animal : il échapperait entièrement au vivant, à la naissance, à la mort et à l'évolution, et sa conscience le placerait d'emblée dans un ordre de réalité séparé, celui de l'esprit pur.", "fb": "Non : l'homme demeure un animal né de l'évolution, soumis au vivant, mortel. Mais sa différence est de nature — culture, lois, quête de vérité — et elle lui impose une responsabilité, non un privilège de domination."}, {"ok": false, "t": "La question n'aurait pas de réponse : confronté à la limite de ses propres concepts, le philosophe devrait suspendre le jugement, constater l'impasse et laisser chacun croire ce qu'il veut sur l'animalité humaine.", "fb": "Non : le corrigé tranche. L'homme demeure un animal, mais sa différence est de nature ; et cette différence ne lui donne pas un privilège de domination mais lui impose une responsabilité : sa grandeur se mesure à la hauteur de ses responsabilités."}]}]}, {"ti": "TG02 — Évaluation du 19/11 : corrigé Homme/Animal", "n": 16, "q": [{"ty": "multichoice", "q": "Quel paradoxe le corrigé voit-il dans le sujet « L'homme est-il un animal comme les autres ? » ?", "a": [{"ok": true, "t": "Se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question : seul l'homme se pose cette question, l'animal ne fait pas de philosophie.", "fb": "La question comporte un paradoxe, c'est-à-dire une contradiction apparente : se demander si l'homme est un animal « comme les autres », c'est en quelque sorte donner la réponse dans la question, car seul l'homme se pose cette question. L'animal, lui, ne se demande pas s'il est un animal comme les autres : l'animal ne fait pas de philosophie. Pourquoi ? Parce que l'homme est doté d'une conscience. Se poser cette question sur notre appartenance au règne animal, c'est nous interroger sur notre propre nature, c'est-à-dire sur notre essence, sur ce qui définit l'homme, et cela semble rendre l'homme unique. Pour problématiser, il faut donc partir de la formule « comme les autres » : le paradoxe tient au fait que seul un être qui n'est pas « comme les autres » peut se demander s'il l'est."}, {"ok": false, "t": "Tous les animaux se demandent s'ils sont des animaux comme les autres, mais seul l'homme parle pour le dire.", "fb": "La question comporte un paradoxe, c'est-à-dire une contradiction apparente : se demander si l'homme est un animal « comme les autres », c'est en quelque sorte donner la réponse dans la question, car seul l'homme se pose cette question. L'animal, lui, ne se demande pas s'il est un animal comme les autres : l'animal ne fait pas de philosophie. Pourquoi ? Parce que l'homme est doté d'une conscience. Se poser cette question sur notre appartenance au règne animal, c'est nous interroger sur notre propre nature, c'est-à-dire sur notre essence, sur ce qui définit l'homme, et cela semble rendre l'homme unique. Pour problématiser, il faut donc partir de la formule « comme les autres » : le paradoxe tient au fait que seul un être qui n'est pas « comme les autres » peut se demander s'il l'est."}, {"ok": false, "t": "La question est facile : il suffit de compter les différences entre l'homme et l'animal pour répondre oui ou non.", "fb": "La question comporte un paradoxe, c'est-à-dire une contradiction apparente : se demander si l'homme est un animal « comme les autres », c'est en quelque sorte donner la réponse dans la question, car seul l'homme se pose cette question. L'animal, lui, ne se demande pas s'il est un animal comme les autres : l'animal ne fait pas de philosophie. Pourquoi ? Parce que l'homme est doté d'une conscience. Se poser cette question sur notre appartenance au règne animal, c'est nous interroger sur notre propre nature, c'est-à-dire sur notre essence, sur ce qui définit l'homme, et cela semble rendre l'homme unique. Pour problématiser, il faut donc partir de la formule « comme les autres » : le paradoxe tient au fait que seul un être qui n'est pas « comme les autres » peut se demander s'il l'est."}, {"ok": false, "t": "Le paradoxe est que l'homme descend du singe, alors que le singe ne descend pas de l'homme.", "fb": "La question comporte un paradoxe, c'est-à-dire une contradiction apparente : se demander si l'homme est un animal « comme les autres », c'est en quelque sorte donner la réponse dans la question, car seul l'homme se pose cette question. L'animal, lui, ne se demande pas s'il est un animal comme les autres : l'animal ne fait pas de philosophie. Pourquoi ? Parce que l'homme est doté d'une conscience. Se poser cette question sur notre appartenance au règne animal, c'est nous interroger sur notre propre nature, c'est-à-dire sur notre essence, sur ce qui définit l'homme, et cela semble rendre l'homme unique. Pour problématiser, il faut donc partir de la formule « comme les autres » : le paradoxe tient au fait que seul un être qui n'est pas « comme les autres » peut se demander s'il l'est."}]}, {"ty": "multichoice", "q": "Que vient illustrer l'exemple de l'alimentation (le loup dévore sa proie, l'homme cuisine et partage ses repas) ?", "a": [{"ok": true, "t": "À travers le même besoin biologique que tout animal, l'homme introduit des coutumes, des rituels et du sens : ce pouvoir de transformer le vivant peut fonder un droit de disposer de la nature comme un devoir de la respecter.", "fb": "Exemple type d'illustration du problème : si le loup dévore sa proie par instinct, sous l'impulsion de la faim, l'être humain dépasse cette fonction vitale en préparant ses repas, en cuisinant, en partageant ses repas selon des principes culturels ou religieux. Ainsi, à travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens. On voit déjà que ce pouvoir de transformer le vivant peut aussi bien fonder un droit de disposer de la nature qu'un devoir de la respecter : c'est le problème que la dissertation doit construire. L'exemple ne démontre rien tout seul : il illustre la contradiction analysée dans la problématique. La distinction conceptuelle cardinale reste nature (inné, biologique) / culture (acquis, construit, transmis)."}, {"ok": false, "t": "L'homme mange uniquement pour survivre, exactement comme le loup, puisqu'il obéit à la faim.", "fb": "Exemple type d'illustration du problème : si le loup dévore sa proie par instinct, sous l'impulsion de la faim, l'être humain dépasse cette fonction vitale en préparant ses repas, en cuisinant, en partageant ses repas selon des principes culturels ou religieux. Ainsi, à travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens. On voit déjà que ce pouvoir de transformer le vivant peut aussi bien fonder un droit de disposer de la nature qu'un devoir de la respecter : c'est le problème que la dissertation doit construire. L'exemple ne démontre rien tout seul : il illustre la contradiction analysée dans la problématique. La distinction conceptuelle cardinale reste nature (inné, biologique) / culture (acquis, construit, transmis)."}, {"ok": false, "t": "La cuisine prouve que l'homme est encore un animal, car c'est un instinct de chasseur-cueilleur.", "fb": "Exemple type d'illustration du problème : si le loup dévore sa proie par instinct, sous l'impulsion de la faim, l'être humain dépasse cette fonction vitale en préparant ses repas, en cuisinant, en partageant ses repas selon des principes culturels ou religieux. Ainsi, à travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens. On voit déjà que ce pouvoir de transformer le vivant peut aussi bien fonder un droit de disposer de la nature qu'un devoir de la respecter : c'est le problème que la dissertation doit construire. L'exemple ne démontre rien tout seul : il illustre la contradiction analysée dans la problématique. La distinction conceptuelle cardinale reste nature (inné, biologique) / culture (acquis, construit, transmis)."}, {"ok": false, "t": "L'exemple prouve que l'homme doit manger de la viande cuite pour des raisons médicales.", "fb": "Exemple type d'illustration du problème : si le loup dévore sa proie par instinct, sous l'impulsion de la faim, l'être humain dépasse cette fonction vitale en préparant ses repas, en cuisinant, en partageant ses repas selon des principes culturels ou religieux. Ainsi, à travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens. On voit déjà que ce pouvoir de transformer le vivant peut aussi bien fonder un droit de disposer de la nature qu'un devoir de la respecter : c'est le problème que la dissertation doit construire. L'exemple ne démontre rien tout seul : il illustre la contradiction analysée dans la problématique. La distinction conceptuelle cardinale reste nature (inné, biologique) / culture (acquis, construit, transmis)."}]}, {"ty": "multichoice", "q": "L'exemple de l'ours blanc (fourrure) opposé au vêtement humain illustre quel renversement du rapport au milieu ?", "a": [{"ok": true, "t": "Contrairement aux autres vivants qui s'adaptent à leur environnement, l'homme adapte la nature à ses besoins en la transformant : il n'attend pas que la nature le modifie, il modifie la nature.", "fb": "L'ours blanc a développé, au fil de l'évolution, une fourrure qui le protège du froid arctique ; l'homme, lui, a conçu le vêtement. Contrairement aux autres vivants, l'homme ne s'adapte pas à son environnement : il adapte plutôt la nature à ses besoins en la transformant, en construisant des villes, en fabriquant des outils et des machines, en domestiquant des plantes et l'homme fabrique. Et cette fabrication déborde toujours la simple survie : le pot qui conserve la nourriture devient vase décoratif, le chant qui rythme le travail devient musique, le récit qui transmet l'expérience devient littérature et mythe. La transformation du monde vise à apporter du sens à l'existence par des symboles, des idéaux et des valeurs partagées avec les autres humains. L'expression est latine : homo (l'homme) + faber (celui qui fabrique, l'artisan)."}, {"ok": true, "t": "homo faber (l'homme fabricateur)", "fb": ""}, {"ok": true, "t": "homo-faber", "fb": ""}]}, {"ty": "multichoice", "q": "Qu'est-ce qui distingue le langage humain articulé de la communication animale (chant de l'oiseau, danse de l'abeille) ?", "a": [{"ok": true, "t": "Le signal animal est rivé à la situation présente, tandis que le mot humain peut parler de ce qui n'existe pas, a disparu ou devrait être : il rend possible la promesse, la règle, la fiction, le projet.", "fb": "Tandis que les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer la source de pollen), le langage humain est un instrument complexe qui permet d'exprimer des pensées abstraites, de produire des théories, d'inventer des récits et des mythes, tout en fondant des institutions politiques et des lois. Là où le signal animal est rivé à la situation présente, le mot humain peut parler de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet. C'est pourquoi Lévi-Strauss, étudiant les mythes et les systèmes de parenté, a montré que même les sociétés dites « primitives » manifestent la même capacité universellement humaine d'organiser le monde par des symboles et des règles."}, {"ok": false, "t": "Les animaux n'ont aucun mode de communication du tout, aucun signal ni aucun chant.", "fb": "Tandis que les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer la source de pollen), le langage humain est un instrument complexe qui permet d'exprimer des pensées abstraites, de produire des théories, d'inventer des récits et des mythes, tout en fondant des institutions politiques et des lois. Là où le signal animal est rivé à la situation présente, le mot humain peut parler de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet. C'est pourquoi Lévi-Strauss, étudiant les mythes et les systèmes de parenté, a montré que même les sociétés dites « primitives » manifestent la même capacité universellement humaine d'organiser le monde par des symboles et des règles."}, {"ok": false, "t": "Le langage humain et le signal animal font la même chose : transmettre une information sur la situation présente.", "fb": "Tandis que les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer la source de pollen), le langage humain est un instrument complexe qui permet d'exprimer des pensées abstraites, de produire des théories, d'inventer des récits et des mythes, tout en fondant des institutions politiques et des lois. Là où le signal animal est rivé à la situation présente, le mot humain peut parler de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet. C'est pourquoi Lévi-Strauss, étudiant les mythes et les systèmes de parenté, a montré que même les sociétés dites « primitives » manifestent la même capacité universellement humaine d'organiser le monde par des symboles et des règles."}, {"ok": false, "t": "La danse de l'abeille est plus abstraite encore que le langage humain, puisqu'elle indique une direction.", "fb": "Tandis que les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer la source de pollen), le langage humain est ée dans la termitière pour « pêcher » les termites) ; les corbeaux calédoniens améliorent leurs outils, et certaines techniques, comme le cassage des noix, se transmettent par apprentissage social. On peut donc parler, avec précaution, de « cultures animales ». Mais cet aveu renforce plutôt la distinction : ces traditions animales demeurent enfermées dans leur fonction vitale, aucunement accompagnées de la conscience de transmettre, du désir d'innover ou de la question du sens. La différence entre le chimpanzé qui casse une noix et l'homme qui écrit un traité de balistique n'est pas seulement quantitative : l'homme seul accumule ses inventions, les critique, les dépasse."}]}, {"ty": "multichoice", "q": "Vrai ou faux : selon Rousseau, « l'impulsion du seul appétit est esclavage, et l'obéissance à la loi qu'on s'est prescrite est liberté ».", "a": [{"ok": true, "t": "Vrai", "fb": "Vrai : c'est la citation exacte de Rousseau. Paradoxalement, c'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions. Là où l'animal est déterminé par « l'impulsion du seul appétit », l'être humain peut s'interroger sur le bien et le mal, résister à ses désirs immédiats et s'imposer des devoirs et des lois : le loup affamé chasse, tandis que l'homme peut jeûner par conviction religieuse, par protestation politique ou pour raison médicale. Cette capacité d'agir contre ses penchants immédiats fonde la responsabilité et la dignité de la personne humaine : on ne loue ni ne blâme le loup qui tue ; on juge l'homme qui assassine, parce que seul l'homme aurait pu agir autrement. Toute citation doit être expliquée dans la copie : ici, la loi que l'homme « s'est prescrite » désigne la liberté comme autonomie, se donner à soi-même sa loi."}, {"ok": false, "t": "Faux", "fb": "Vrai : c'est la citation exacte de Rousseau. Paradoxalement, c'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions. Là où l'animal est déterminé par « l'impulsion du seul appétit », l'être humain peut s'interroger sur le bien et le mal, résister à ses désirs immédiats et s'imposer des devoirs et des lois : le loup affamé chasse, tandis que l'homme peut jeûner par conviction religieuse, par protestation politique ou pour raison médicale. Cette capacité d'agir contre ses penchants immédiats fonde la responsabilité et la dignité de la personne humaine : on ne loue ni ne blâme le loup qui tue ; on juge l'homme qui assassine, parce que seul l'homme aurait pu agir autrement. Toute citation doit être expliquée dans la copie : ici, la loi que l'homme « s'est prescrite » désigne la liberté comme autonomie, se donner à soi-même sa loi."}]}, {"ty": "multichoice", "q": "Quelle distinction Kant théorise-t-il en opposant le prix à la dignité, et quelles en sont les conséquences pour traiter la personne ?", "a": [{"ok": true, "t": "Le prix est la valeur des choses qui se troquent et peuvent être remplacées ; la dignité est la valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen.", "fb": "Kant oppose le prix, valeur des choses qui se troquent, à la dignité, valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen. Cette distinction théorise ce qui fonde la responsabilité et la dignité humaines : la capacité d'agir contre ses penchants immédiats. On ne loue ni ne blâme le loup qui tue ; on juge l'homme qui assassine, parce que seul l'homme aurait pu agir autrement. Ne pas confondre : les deux termes se répondent terme à terme (prix : chose, troc, équivalent / dignité : personne, inconditionnelle, sans équivalent). C'est aussi cette dignité que Kant mobilise contre la cruauté : nous n'avons pas de devoirs directs « envers » les animaux, mais nous en avons « à l'égard » d'eux."}, {"ok": false, "t": "La dignité est la valeur marchande supérieure e « maître et possesseur de la nature », libre de disposer des bêtes comme d'instruments ; cette position légitime l'élevage, l'expérimentation, la domestication sans limite. De l'autre, dès le XVIIIe siècle, Bentham a retourné l'argument : la question pertinente n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? », mais « peuvent-ils souffrir ? » ; or l'animal souffre, éprouve la douleur, la peur. Kant, tout en niant que nous ayons des devoirs directs « envers » les animaux, reconnaît que nous en avons « à l'égard » d'eux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes. Les débats contemporains, de la libération animale (Peter Singer) au statut juridique des animaux (reconnus comme « êtres vivants doués de sensibilité » dans le Code civil français depuis 2015), montrent que la conscience ne légitime pas la domination : elle est le fondement d'une responsabilité que nul animal ne peut porter à notre place."}, {"ok": false, "t": "Bentham soutient que les animaux sont des machines indolores, et Descartes qu'ils peuvent souffrir.", "fb": "Deux réponses s'opposent. D'un côté, Descartes a soutenu que les animaux sont de simples machines, des automates complexes dépourvus de pensée et de langage : l'homme, seul être pensant, serait comme « maître et possesseur de la nature », libre de disposer des bêtes comme d'instruments ; cette position légitime l'élevage, l'expérimentation, la domestication sans limite. De l'autre, dès le XVIIIe siècle, Bentham a retourné l'argument : la question pertinente n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? », mais « peuvent-ils souffrir ? » ; or l'animal souffre, éprouve la douleur, la peur. Kant, tout en niant que nous ayons des devoirs directs « envers » les animaux, reconnaît que nous en avons « à l'égard » d'eux : la cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes. Les débats contemporains, de la libération e trompe. De cette exigence naît la science : les empiristes (Locke, Hume) fondent la connaissance sur l'expérience, les rationalistes (Descartes, Spinoza) sur la raison, et la science moderne articule les deux par la méthode expérimentale, dont Popper montre le caractère critique : une théorie n'est scientifique que si elle peut être réfutée. Pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison : impensable dans la conscience animale, fût-elle très vive."}, {"ok": false, "t": "Parce que l'animal doute déjà en permanence, mais ne sait pas le formuler en français.", "fb": "L'animal perçoit son milieu pour y survivre, mais ne se demande pas si sa perception est fidèle à la réalité : la mouche perçoit la lumière, la chauve-souris localise ses proies, le pigeon retrouve son pigeonnier, mais aucun animal ne se demande ce que le monde est en dehors de lui. Grâce à sa conscience, l'homme peut au contraire douter de ses certitudes : Descartes a fait de ce doute une méthode, suspendre toute croyance jusqu'à atteindre une certitude indubitable, « je pense, donc je suis ». L'animal ne doute pas, car le doute suppose de se représenter ses propres représentations, de prendre ses croyances pour objet. Seul l'homme sait qu'il sait, et peut donc aussi savoir qu'il se trompe. De cette exigence naît la science : les empiristes (Locke, Hume) fondent la connaissance sur l'expérience, les rationalistes (Descartes, Spinoza) sur la raison, et la science moderne articule les deux par la méthode expérimentale, dont Popper montre le caractère critique : une théorie n'est scientifique que si elle peut être réfutée. Pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison : impensable dans la conscience animale, fût-elle très vive."}, {"ok": false, "t": "Parce que le doute est une faiblesse de l'esprit, que la perception animale, elle, n'a jamais.", "fb": "L'animal perçoit son milieu pour y survivre, mais ne se demande pas si sa perception ul vivant qui se fait lui-même par la culture, se donne des lois et cherche la vérité ; elle ne lui donne pas un privilège de domination mais lui impose une responsabilité.", "fb": "Si l'homme demeure en fait un animal né de l'évolution, vivant, mortel, il n'est aucunement un animal comme les autres. Sa différence n'est pas un simple degré supplémentaire d'habileté, mais une différence de nature : la conscience fait de lui le seul vivant qui se fait lui-même par la culture, qui se donne des lois par la morale et la politique, et qui cherche la vérité par la connaissance. Et cette différence ne lui donne pas un privilège de domination, mais lui impose une responsabilité. L'homme est cet animal qui ne peut vivre sa vie animale sans la penser, sans la transformer et sans répondre de ce qu'il en fait : un être dont l'essence réside dans ce pouvoir de dépassement, et dont la grandeur se mesure à la hauteur de ses responsabilités. Attention à l'argumentation : la supériorité de la conscience est à double tranchant, elle fonde à la fois la domination possible et le devoir (perspectives 2 et 3)."}, {"ok": false, "t": "Une différence de degré : l'homme est simplement plus habile que les autres animaux, plus adapté, plus rapide.", "fb": "Si l'homme demeure en fait un animal né de l'évolution, vivant, mortel, il n'est aucunement un animal comme les autres. Sa différence n'est pas un simple degré supplémentaire d'habileté, mais une différence de nature : la conscience fait de lui le seul vivant qui se fait lui-même par la culture, qui se donne des lois par la morale et la politique, et qui cherche la vérité par la connaissance. Et cette différence ne lui donne pas un privilège de domination, mais lui impose une responsabilité. L'homme est cet animal qui ne peut vivre sa vie animale sans la penser, sans la transformer et sans répondre de ce qu'il en fait : un être dont l'essence réside dans ce pouvoir de dépassement, et dont la grandeur se mesure à la hauteur de ses responsabilités. Attention à l'argumentation : la supériorité de la conscience est à double tranchant, elle fonde à la fois la domination possible et le devoir (perspectives 2 et 3)."}, {"ok": false, "t": "Aucune différence : la conscience n'est qu'une illusion, l'homme est un animal exactement comme les autres.", "fb": "Si l'homme demeure en fait un animal né de l'évolution, vivant, mortel, il n'est aucunement un animal comme les autres. Sa différence n'est pas un simple degré supplémentaire d'habileté, mais une différence de nature : la conscience fait de lui le seul vivant qui se fait lui-même par la culture, qui se donne des lois par la morale et la politique, et qui cherche la vérité par la connaissance. Et cette différence ne lui donne pas un privilège de domination, mais lui impose une responsabilité. L'homme est cet animal qui ne peut vivre sa vie animale sans la penser, sans la transformer et sans répondre de ce qu'il en fait : un être dont l'essence réside dans ce pouvoir de dépassement, et dont la grandeur se mesure à la hauteur de ses responsabilités. Attention à l'argumentation : la supériorité de la conscience est à double tranchant, elle fonde à la fois la domination possible et le devoir (perspectives 2 et 3)."}, {"ok": false, "t": "Une différence de nature qui donne à l'homme le droit de dominer tous les autres vivants sans limite.", "fb": "Si l'homme demeure en fait un animal né de l'évolution, vivant, mortel, il n'est aucunement un animal comme les autres. Sa différence n'est pas un simple degré supplémentaire d'habileté, mais une différence de nature : la conscience fait de lui le seul vivant qui se fait lui-même par la culture, qui se donne des lois par la morale et la politique, et qui cherche la vérité par la connaissance. Et cette différence ne lui donne pas un privilège de domination, mais lui impose une responsabilité. L'homme est cet animal qui ne peut vivre sa vie animale sans la penser, sans la transformer et sans répondre de ce qu'il en fait : un ê s doit être nommée et définie dans la copie : c'est le cas de ce repère essence / accident / existence."}]}, {"ty": "matching", "q": "Associez chaque auteur à ce que le corrigé retient de sa pensée sur l'homme et l'animal.", "pairs": [{"l": "Rousseau", "r": "La perfectibilité de l'homme et « l'impulsion du seul appétit » de l'animal : la loi qu'on s'est prescrite est liberté"}, {"l": "Bergson", "r": "Homo faber : avant de raisonner, l'homme fabrique, et sa fabrication déborde la survie"}, {"l": "Descartes", "r": "Les animaux-machines et l'homme « maître et possesseur de la nature »"}, {"l": "Bentham", "r": "La question n'est pas « peuvent-ils raisonner ? » mais « peuvent-ils souffrir ? »"}, {"l": "Aristote", "r": "L'homme est un « animal politique », doué de parole pour délibérer sur le juste et l'injuste"}, {"l": "Jane Goodall", "r": "Depuis 1960, on sait que les chimpanzés fabriquent et utilisent des outils (la brindille dans la termitière)"}]}, {"ty": "cloze", "q": "La citation de Rousseau (texte à trous)", "text": "<p>Complétez la citation de Rousseau : « l'impulsion du seul appétit est {1:SHORTANSWER:=esclavage}, et l'obéissance à la loi qu'on s'est {1:SHORTANSWER:=prescrite} est {1:SHORTANSWER:=liberté} ».</p><p>Formule à retenir de la conclusion : « L'homme est cet animal qui ne peut vivre sa vie animale sans la penser, sans la transformer et sans répondre de ce qu'il en fait. » Et : sa grandeur « se mesure à la hauteur de ses responsabilités ».</p>"}]}, {"ti": "TG05 — Évaluation du 19/11 : Peut-on tout connaître ?", "n": 15, "q": [{"ty": "multichoice", "q": "Selon le corrigé, que signifie connaître, à la différence de percevoir ou de croire ?", "a": [{"ok": true, "t": "Appréhender une chose telle qu'elle est, c'est-à-dire parvenir à son sujet à un savoir fondé, distinct de la simple perception et de la simple croyance.", "fb": "Connaître, c'est appréhender une chose telle qu'elle est, c'est-à-dire parvenir à son sujet à un savoir fondé : un savoir appuyé sur des raisons, qui se distingue de la simple perception (voir sans comprendre) et de la simple croyance ou opinion (affirmer sans fondement). C'est cette exigence de fondement qui permet de comprendre pourquoi la question de tout connaître fait problème : la multiplication des informations, par exemple sur Internet, n'est pas la connaissance, car l'accumulation n'est pas le fondement. Tout est disponible, et pourtant tout n'est pas connu : l'abondance ne vaut pas fondement de la connaissance."}, {"ok": false, "t": "Percevoir une chose avec ses sens et en avoir une impression vive et détaillée.", "fb": "Connaître, c'est appréhender une chose telle qu'elle est, c'est-à-dire parvenir à son sujet à un savoir fondé : un savoir appuyé sur des raisons, qui se distingue de la simple perception (voir sans comprendre) et de la simple croyance ou opinion (affirmer sans fondement). C'est cette exigence de fondement qui permet de comprendre pourquoi la question de tout connaître fait problème : la multiplication des informations, par exemple sur Internet, n'est pas la connaissance, car l'accumulation n'est pas le fondement. Tout est disponible, et pourtant tout n'est pas connu : l'abondance ne vaut pas fondement de la connaissance."}, {"ok": false, "t": "Croire fermement quelque chose, avec une conviction forte et sincère.", "fb": "Connaître, c'est appréhender une chose telle qu'elle est, c'est-à-dire parvenir à son sujet à un savoir fondé : un savoir appuyé sur des raisons, qui se distingue de la simple perception (voir sans comprendre) et de la simple croyance ou opinion (affirmer sans fondement). C'est cette exigence de fondement qui permet de comprendre pourquoi la question de tout connaître fait problème : la multiplication des informations, par exemple sur Internet, n'est pas la connaissance, car l'accumulation n'est pas le fondement. Tout est disponible, et pourtant tout n'est pas connu : l'abondance ne vaut pas fondement de la connaissance."}, {"ok": false, "t": "Accumuler le plus d'informations possible sur un sujet, comme dans une encyclopédie en ligne.", "fb": "Connaître, c'est appréhender une chose telle qu'elle est, c'est-à-dire parvenir à son sujet à un savoir fondé : un savoir appuyé sur des raisons, qui se distingue de la simple perception (voir sans comprendre) et de la simple croyance ou opinion (affirmer sans fondement). C'est cette exigence de fondement qui permet de comprendre pourquoi la question de tout connaître fait problème : la multiplication des informations, par exemple sur Internet, n'est pas la connaissance, car l'accumulation n'est pas le fondement. Tout est disponible, et pourtant tout n'est pas connu : l'abondance ne vaut pas fondement de la connaissance."}]}, {"ty": "multichoice", "q": "« Celui qui prétend tout connaître ne connaît pas ce qui lui manque » : quel paradoxe ce constat de Socrate révèle-t-il ?", "a": [{"ok": true, "t": "Pour délimiter l'inconnu, il faut déjà en savoir quelque chose : la conscience des limites est une conquête de la connaissance, non son échec.", "fb": "Le paradoxe est une contradiction apparente : se demander si l'on peut tout connaître, c'est déjà distinguer ce que l'on sait et ce que l'on ne sait pas ; or, pour délimiter l'inconnu, il faut déjà en savoir quelque chose. Socrate, dans les dialogues de Platon (l'Alcibiade ou le Gorgias), montre que la plupart des hommes croient savoir alors qu'ils ne possèdent que des opinions (la doxa) sans fondement, qui s'effondrent dès qu'on les examine. Le sage, au contraire, est précisément celui qui sait qu'il ne sait pas. La maïeutique, l'art de faire « accoucher » les esprits, est la première démarche de la connaissance : se déprendre de ses fausses certitudes. Celui qui connaît ses limites en sait déjà davantage : la conscience des limites est une conquête du savoir, non son échec."}, {"ok": false, "t": "Il est impossible de savoir quoi que ce soit, puisque toute prétention au savoir se détruit elle-même.", "fb": "Le paradoxe est une
