<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Défi — Philosophie</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf7;
    --ink: #2b2b26;
    --muted: #6b675e;
    --accent: #8a1c1c;
    --accent-hover: #6e1414;
    --accent-soft: #f6eaea;
    --accent2: #a33c3c;
    --bad: #a33;
    --line: #d8d2c4;
    --ok: #2e6b34;
    --okbg: #e8f4ec;
    --ok-border: #a3d4b5;
    --warn: #9a5b13;
    --warnbg: #fdf3e3;
    --warn-border: #f0cf99;
    --info: #1d4e89;
    --infobg: #eaf2fb;
    --badge: #efe9db;
    --gold: #b09a5f;
    --goldbg: #fcf6e6;
    --shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    --font: Georgia, "Times New Roman", serif;
  }
  /* ---- Thèmes (identiques au modèle des QCM) ---- */
  body[data-theme="pronote"] {
    --bg: #ffffff; --panel: #fafafa; --ink: #333333; --muted: #666666;
    --accent: #006400; --accent-hover: #004d00; --accent2: #4a9d4a; --bad: #b03030;
    --line: #c9c9c9; --font: Arial, Helvetica, "Segoe UI", sans-serif;
    --badge: #efefef; --accent-soft: #eef6ee; --ok: #2e7d32;
  }
  body[data-theme="moderne"] {
    --bg: #eaf2fb; --panel: #ffffff; --ink: #1b2a3a; --muted: #5a7085;
    --accent: #1c5d99; --accent-hover: #14497a; --accent2: #3f8fd6; --bad: #c0392b;
    --line: #c4d4e8; --font: Verdana, Geneva, sans-serif;
    --shadow: 0 3px 10px rgba(28, 93, 153, 0.15); --badge: #e4edf7; --accent-soft: #e7f0fa;
  }
  body[data-theme="machine"] {
    --bg: #e6e6e2; --panel: #f7f7f2; --ink: #222222; --muted: #555;
    --accent: #0a6b3c; --accent-hover: #075430; --accent2: #0e8f54; --bad: #b03030;
    --line: #b8b8ae; --font: "Courier New", Courier, monospace;
    --shadow: 0 3px 10px rgba(0, 0, 0, 0.12); --badge: #e9e9e2; --accent-soft: #e8f3ec;
  }
  body[data-theme="manuscrit"] {
    --bg: #f0e6d6; --panel: #fbf3e4; --ink: #3b2f1e; --muted: #7a6a4e;
    --accent: #7a5b1e; --accent-hover: #614614; --accent2: #a3823a; --bad: #8f3a2a;
    --line: #d9c9a8; --font: "Comic Sans MS", "Segoe Script", cursive;
    --shadow: 0 3px 10px rgba(90, 70, 40, 0.15); --badge: #efe3cb; --accent-soft: #f3ead6;
  }
  body[data-theme="creatif"] {
    --bg: #f3e9ff; --panel: #ffffff; --ink: #2d1b4e; --muted: #6a5a8e;
    --accent: #6a1bb0; --accent-hover: #55148d; --accent2: #c2410c; --bad: #c81e5a;
    --line: #d9c4f2; --font: "Trebuchet MS", "Papyrus", fantasy;
    --shadow: 0 3px 10px rgba(106, 27, 176, 0.18); --badge: #ede0fa; --accent-soft: #f0e4fc;
  }
  body[data-theme="nuit"] {
    --bg: #12141a; --panel: #1c1f28; --ink: #e8e6e0; --muted: #9aa0b8;
    --accent: #7fa8ff; --accent-hover: #6b93e8; --accent2: #a8c2ff; --bad: #ff8a8a;
    --line: #343947; --font: "Segoe UI", Helvetica, Arial, sans-serif;
    --okbg: #12301c; --ok-border: #2e5b3f; --warn: #d9a45b; --warnbg: #332611; --warn-border: #6a4d1e;
    --info: #7fb0e8; --infobg: #152438; --goldbg: #2e2716; --gold: #d8c58a;
    --shadow: 0 3px 10px rgba(0, 0, 0, 0.5); --badge: #262a35; --accent-soft: #232a3a; --ok: #7fd695;
  }
  body[data-theme="nuit"] .challenge-banner, body[data-theme="manuscrit"] .challenge-banner { color: #fffdf7; }
  body[data-theme="nuit"] .challenge-banner .btn-banner { color: #10131a; color: var(--ink); background: var(--panel); }
  body[data-theme="nuit"] .challenge-banner button[style*="color:inherit"] { border-color: rgba(20,24,40,0.5); color: #10131a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    overflow: hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* ---------- Menu gauche ---------- */
  #menu {
    width: 340px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .menu-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #menu h1 {
    font-size: 18px;
    color: var(--accent);
    letter-spacing: .2px;
    font-weight: 700;
  }
  #menu .sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .menu-nav-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }
  .nav-pill-btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all .15s;
  }
  .nav-pill-btn:hover { background: color-mix(in srgb, var(--panel) 88%, var(--muted)); border-color: var(--line); }
  .nav-pill-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .nav-pill-btn.challenge-btn {
    background: var(--goldbg);
    border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
    color: color-mix(in srgb, var(--gold) 70%, var(--ink));
  }
  .nav-pill-btn.challenge-btn:hover { background: color-mix(in srgb, var(--goldbg) 80%, var(--muted)); }

  /* Barre de recherche, tri et filtres */
  .menu-controls {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .qcm-search {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
  }
  .qcm-search:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  .controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .ctrl-select {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font: inherit;
    font-size: 11.5px;
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
    color: var(--ink);
    cursor: pointer;
  }
  .status-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .st-tab {
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .st-tab:hover { background: color-mix(in srgb, var(--panel) 90%, var(--muted)); }
  .st-tab.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Liste scrollable des QCM */
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 36px;
  }
  .qcm-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    padding: 10px 14px 10px 13px;
    border-left: 4px solid transparent;
    transition: background .15s;
  }
  .qcm-item:hover { background: color-mix(in srgb, var(--panel) 92%, var(--muted)); }
  .qcm-item.active {
    background: color-mix(in srgb, var(--panel) 84%, var(--muted));
    border-left-color: var(--accent);
  }
  .qcm-item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .qcm-title {
    font-size: 13.5px;
    line-height: 1.35;
    font-weight: 600;
  }
  .qcm-item .cnt {
    color: var(--muted);
    font-size: 11px;
    background: var(--badge);
    padding: 1px 6px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .qcm-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .status-pill {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .st-new { background: #f0ece1; color: var(--muted); }
  .st-seen { background: var(--infobg); color: var(--info); }
  .st-prog { background: var(--warnbg); color: var(--warn); border: 1px solid var(--warn-border); }
  .st-done { background: var(--okbg); color: var(--ok); border: 1px solid var(--ok-border); }

  .score-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .score-badge.high { color: var(--ok); border-color: var(--ok-border); background: var(--okbg); }
  .score-badge.mid { color: var(--warn); border-color: var(--warn-border); background: var(--warnbg); }
  .mini-bar {
    width: 100%;
    height: 4px;
    background: color-mix(in srgb, var(--line) 55%, var(--panel));
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .mini-bar-fill {
    height: 100%;
    background: var(--warn);
    transition: width .25s ease;
  }
  .mini-bar-fill.done { background: var(--ok); }

  /* Pied de menu : résumé global */
  .menu-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ---------- Panneau droit ---------- */
  #main {
    flex: 1;
    height: 100vh;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  #content {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 38px 90px;
  }

  /* Bannière défi actif */
  .challenge-banner {
    background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%);
    border: 1px solid color-mix(in srgb, var(--accent) 60%, #fff);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: var(--shadow);
  }
  .challenge-banner-info strong {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .challenge-banner-info span {
    font-size: 12.5px;
    opacity: .9;
  }
  .btn-banner {
    background: var(--panel);
    color: var(--accent);
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-banner:hover { background: color-mix(in srgb, var(--panel) 92%, var(--muted)); }

  /* Cartes & En-têtes */
  .qcm-head {
    border-bottom: 3px solid var(--accent);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .qcm-head h2 {
    font-size: 25px;
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .qcm-head .meta {
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .tag-chip {
    background: var(--badge);
    color: var(--ink);
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 600;
  }

  /* Écran de diagnostic contextuel avant QCM */
  .status-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .status-card.st-card-prog { border-left: 5px solid var(--warn); }
  .status-card.st-card-done { border-left: 5px solid var(--ok); }
  .status-card.st-card-seen { border-left: 5px solid var(--info); }
  .status-card.st-card-new { border-left: 5px solid var(--accent); }

  .status-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .status-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .status-card p {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .history-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .hist-pill {
    font-size: 12px;
    background: color-mix(in srgb, var(--panel) 94%, var(--muted));
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 8px;
  }
  .action-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .15s;
  }
  .btn:hover { background: color-mix(in srgb, var(--panel) 88%, var(--muted)); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ok {
    background: var(--ok);
    color: #fff;
    border-color: var(--ok);
  }
  .btn-ok:hover { background: color-mix(in srgb, var(--ok) 85%, #000); }
  .btn-warn {
    background: var(--warn);
    color: #fff;
    border-color: var(--warn);
  }
  .btn-danger {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--bad) 40%, var(--panel));
    background: color-mix(in srgb, var(--bad) 8%, var(--panel));
  }
  .btn-danger:hover { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); }

  /* Barre d'outils pendant l'entraînement */
  .runner-toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 253, 247, 0.96);
    backdrop-filter: blur(4px);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .runner-progress-wrap {
    flex: 1;
    min-width: 180px;
  }
  .runner-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .runner-bar {
    height: 7px;
    background: color-mix(in srgb, var(--line) 55%, var(--panel));
    border-radius: 999px;
    overflow: hidden;
  }
  .runner-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width .25s ease;
  }

  /* ---------- Questions & Interactions ---------- */
  .question {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    scroll-margin-top: 84px;
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  .question.q-answered-ok { border-color: var(--ok-border); }
  .question.q-answered-ko { border-color: color-mix(in srgb, var(--bad) 45%, var(--panel)); }
  .q-top {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .q-num {
    font-weight: 700;
    color: var(--accent);
    font-size: 15px;
    white-space: nowrap;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
  }
  .q-type {
    font-size: 10.5px;
    background: var(--badge);
    color: var(--muted);
    border-radius: 20px;
    padding: 2px 9px;
    white-space: nowrap;
  }

  /* Réponses QCM (mode corrigé & mode interactif) */
  .answers { display: grid; gap: 8px; margin-top: 10px; }
  .ans {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.45;
    background: color-mix(in srgb, var(--panel) 96%, var(--muted));
    transition: all .15s;
  }
  .ans-interactive {
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .ans-interactive:hover { background: color-mix(in srgb, var(--panel) 88%, var(--muted)); border-color: #cbbda3; }
  .ans-interactive input {
    margin-top: 4px;
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .ans.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .ans.correct {
    border-color: var(--ok);
    background: var(--okbg);
  }
  .ans.correct::before {
    content: "✓ ";
    color: var(--ok);
    font-weight: 700;
  }
  .ans.wrong-picked {
    border-color: color-mix(in srgb, var(--bad) 60%, var(--ink));
    background: color-mix(in srgb, var(--bad) 8%, var(--panel));
  }
  .ans.wrong-picked::before {
    content: "✗ ";
    color: var(--accent);
    font-weight: 700;
  }
  .ans .fb {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 7px;
  }
  .ans .fb::before {
    content: "Pourquoi : ";
    font-weight: 600;
    font-style: italic;
  }

  /* Réponse courte & numérique */
  .short-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .short-input {
    flex: 1;
    min-width: 220px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 14.5px;
    background: var(--panel);
  }
  .short-input:focus { outline: none; border-color: var(--accent); }

  /* Association (Matching) */
  .pairs { display: grid; gap: 8px; margin-top: 12px; }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 14px;
    line-height: 1.4;
    align-items: center;
  }
  .pair > span {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: color-mix(in srgb, var(--panel) 96%, var(--muted));
  }
  .pair > span:first-child { font-weight: 600; background: color-mix(in srgb, var(--panel) 88%, var(--muted)); }
  .pair select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 13.5px;
    background: var(--panel);
  }

  /* Texte à trous (Cloze) */
  .cloze-text {
    font-size: 15.5px;
    line-height: 1.85;
    margin-top: 6px;
  }
  .cloze-text mark {
    background: color-mix(in srgb, var(--gold) 25%, var(--goldbg));
    padding: 1px 7px;
    border-radius: 5px;
    font-weight: 600;
  }
  .cloze-input {
    display: inline-block;
    width: 155px;
    padding: 2px 8px;
    margin: 0 3px;

<script>
/* Données embarquées : {"items": [{"ti": "Kant — L'impératif catégorique (TG09)", "n": 15, "q": [...]}]} */
const DATA = {"items": [{"ti": "Kant — L'impératif catégorique (TG09)", "n": 15, "q": [{"ty": "multichoice", "q": "Quelle est la thèse de Kant dans le texte 3, donnée dès la première ligne ?", "a": [{"ok": true, "t": "Il n'y a qu'un unique impératif catégorique : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. »", "fb": "C'est la thèse du texte, à retenir comme citation pour le baccalauréat. Kant affirme qu'il n'existe qu'un seul impératif catégorique, celui qui commande d'agir uniquement d'après une maxime que l'on peut vouloir voir érigée en loi universelle. Cette formule définit l'impératif catégorique, c'est-à-dire le concept qui permet de définir le devoir : un commandement absolu, inconditionnel, qui vaut pour tout être raisonnable, par opposition aux impératifs hypothétiques qui commandent seulement en vue d'une fin (par exemple : si tu veux de l'argent, alors fais une promesse). La séance a montré que cette citation est la définition kantienne du devoir au sens déontologique."}, {"ok": false, "t": "Il faut toujours chercher son intérêt personnel et son bien-être futur dans l'action morale.", "fb": "L'amour de soi ou l'utilité personnelle est la maxime de l'homme de l'exemple, celle que Kant soumet précisément au test de l'universalisation : ce n'est pas la thèse du texte."}, {"ok": false, "t": "Une promesse mensongère peut être justifiée lorsque l'on est dans le besoin et que l'on agit pour de bonnes raisons.", "fb": "C'est la maxime de l'exemple, celle que Kant met à l'épreuve : la fausse promesse est précisément ce que l'impératif catégorique interdit."}, {"ok": false, "t": "Le devoir se définit uniquement par les conséquences de nos actions sur le bien-être du plus grand nombre.", "fb": "C'est la définition conséquentialiste du devoir, que Kant refuse : pour Kant, le devoir est déontologique, il se définit par l'impératif catégorique et non par les conséquences."}]}, {"ty": "multichoice", "q": "Comment qualifier l'exemple de l'homme qui emprunte de l'argent en promettant de le rendre alors qu'il sait que tel ne sera jamais le cas ?", "a": [{"ok": true, "t": "C'est l'exemple d'une fausse promesse, c'est-à-dire d'un mensonge, commis pour répondre à un besoin d'argent.", "fb": "L'exemple de Kant est celui d'une fausse promesse : un homme pressé par le besoin d'emprunter de l'argent sait parfaitement qu'il ne pourra pas rembourser, mais il sait aussi qu'on ne lui accordera aucun prêt s'il ne promet pas avec fermeté de rendre l'argent à un moment déterminé. Il promet donc tout en sachant qu'il ne tiendra pas : c'est une fausse promesse, autrement dit un mensonge. Le plus important dans cet exemple n'est pas l'emprunt lui-même mais la fausse promesse, car c'est elle qui pose le problème du devoir."}, {"ok": false, "t": "C'est l'exemple d'une escroquerie organisée par un homme malhonnête qui détourne de l'argent.", "fb": "Non : ce n'est pas un escroc ni un truand sans scrupule. L'homme est honnête, il est dans le besoin (un cas d'urgence), et il garde assez de conscience morale pour se demander s'il a le droit d'agir ainsi. C'est un dilemme moral."}, {"ok": false, "t": "C'est l'exemple d'un homme qui demande de l'argent par plaisir, pour des raisons futiles.", "fb": "Non : le texte précise qu'il est dans le besoin ; il ne demande pas de l'argent pour des raisons futiles. Le besoin est un mot clé de l'exemple."}, {"ok": false, "t": "C'est l'exemple d'une promesse politique qu'un candidat sait ne pas pouvoir réaliser.", "fb": "Hors sujet : la question politique a été une digression en classe. L'exemple de Kant est l'exemple privé d'une fausse promesse pour obtenir un emprunt."}]}, {"ty": "multichoice", "q": "Quelle est la contradiction au cœur de l'exemple de la fausse promesse ?", "a": [{"ok": true, "t": "L'homme fait une promesse de remboursement tout en sachant très bien qu'il ne pourra pas rembourser.", "fb": "La contradiction est là : d'un côté, pour obtenir l'argent dont il a besoin, l'homme doit faire une promesse ; de l'autre, il sait dès le départ qu'il ne pourra pas la tenir. Ce conflit entre le besoin qui pousse à la fausse promesse et la conscience morale qui s'interroge (« n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient ? ») fait de cet exemple un dilemme moral. C'est cette contradiction que l'universalisation de la maxime révélera comme impossible : une loi universelle du mensonge se détruirait elle-même, car plus personne ne croirait aux promesses et personne ne prêterait plus d'argent."}, {"ok": false, "t": "L'homme veut emprunter alors qu'il n'a pas besoin d'argent et pourrait s'en passer.", "fb": "Non : le texte dit au contraire qu'il est pressé par le besoin, c'est un cas d'urgence, un dénuement."}, {"ok": false, "t": "L'homme rembourse son emprunt alors qu'il avait promis de ne jamais le rendre.", "fb": "Non, c'est l'inverse : il promet de rendre l'argent tout en sachant que tel ne sera jamais le cas."}, {"ok": false, "t": "L'homme refuse de faire une promesse alors même qu'il sait qu'on lui accordera le prêt.", "fb": "Non : Kant précise qu'on ne lui accordera aucun prêt s'il ne promet pas avec fermeté de rendre l'argent ; la promesse est la condition de l'emprunt."}]}, {"ty": "multichoice", "q": "Sélectionnez les mots clés qu'il faut relever pour expliquer l'exemple donné par Kant. (Plusieurs réponses correctes.)", "a": [{"ok": true, "t": "Le besoin", "fb": "Le besoin est un mot clé : l'homme ne demande pas d'argent par plaisir ni pour des raisons futiles, il est dans le besoin, dans le dénuement ; c'est un cas d'urgence."}, {"ok": true, "t": "L'emprunt", "fb": "L'emprunt est le terme qui définit l'exemple : il s'agit de l'exemple d'un emprunt d'argent."}, {"ok": true, "t": "La promesse", "fb": "La promesse est un mot clé : elle est la condition de l'emprunt, un engagement qui porte sur la parole et l'honneur, c'est-à-dire un devoir. Ici, c'est une fausse promesse, un mensonge."}, {"ok": false, "t": "Le plaisir", "fb": "Non : l'homme n'emprunte pas par plaisir, ni pour des raisons futiles, mais par besoin."}, {"ok": false, "t": "L'escroquerie", "fb": "Non : ce n'est pas l'exemple d'une escroquerie ; l'homme est honnête et se demande si son expédient est contraire au devoir."}]}, {"ty": "multichoice", "q": "Le texte 3 de Kant est argumenté de la même manière que les textes de Descartes et de Marx : entièrement fondé sur une démonstration.", "a": [{"ok": true, "t": "Faux", "fb": "Faux : contrairement aux textes de Descartes et de Marx, entièrement fondés sur une démonstration, le texte 3 (comme le texte 4) appartient à un autre genre d'argumentation : une argumentation fondée sur un exemple, qui est développé au fur et à mesure (une situation tout entière, sur plusieurs lignes) puis analysé pour en déduire des arguments. D'où la méthode d'explication : exposer l'exemple, le discuter, puis en tirer les conséquences pour la thèse. Cette distinction est aussi un principe de méthode pour la dissertation : l'exemple peut venir illustrer un argument après coup, ou au contraire précéder l'argument et le faire naître par son analyse."}, {"ok": false, "t": "Vrai", "fb": "Faux : contrairement aux textes de Descartes et de Marx, entièrement fondés sur une démonstration, le texte 3 (comme le texte 4) appartient à un autre genre d'argumentation : une argumentation fondée sur un exemple, qui est développé au fur et à mesure (une situation tout entière, sur plusieurs lignes) puis analysé pour en déduire des arguments. D'où la méthode d'explication : exposer l'exemple, le discuter, puis en tirer les conséquences pour la thèse. Cette distinction est aussi un principe de méthode pour la dissertation : l'exemple peut venir illustrer un argument après coup, ou au contraire précéder l'argument et le faire naître par son analyse."}]}, {"ty": "multichoice", "q": "Le devoir, au sens déontologique que lui donne Kant, se définit comme :", "a": [{"ok": true, "t": "Une obligation, un impératif, et même un impératif catégorique, défini indépendamment des conséquences de l'action.", "fb": "Au sens déontologique (la déontologie est l'étude du devoir), le devoir est défini par Kant comme une obligation, un impératif, et même un impératif catégorique : un commandement absolu, valable inconditionnellement. C'est la première des deux grandes façons de considérer le devoir ; l'autre est le point de vue conséquentialiste, qui envisage le devoir du point de vue des conséquences de nos actions (nous avons le devoir de faire quelque chose quand on réfléchit aux conséquences de nos actions). En première définition générale, le devoir est ce que notre conscience morale, ou notre raison, nous recommande ou nous commande de faire."}, {"ok": false, "t": "Une action dont on juge la valeur uniquement d'après ses conséquences sur le bien-être futur.", "fb": "C'est la définition conséquentialiste du devoir, la seconde façon de le considérer, que l'on abordera après le texte de Kant."}, {"ok": false, "t": "Une inclination naturelle qui pousse chacun à chercher son bonheur.", "fb": "C'est l'amour de soi chez Rousseau, la maxime de l'homme de l'exemple, non la définition kantienne du devoir."}, {"ok": false, "t": "Un moyen provisoire de se tirer d'affaire dans une situation urgente.", "fb": "C'est la définition d'un expédient dans le texte, non celle du devoir."}]}, {"ty": "shortanswer", "q": "Quel concept, emprunté à Rousseau, désigne la tendance naturelle à se conserver soi-même, c'est-à-dire à chercher à réaliser son bonheur ?", "a": [{"ok": true, "t": "l'amour de soi", "fb": "L'amour de soi est la tendance naturelle de se conserver soi-même, c'est-à-dire à chercher à réaliser son bonheur : chaque être humain cherche le bonheur. C'est un concept qui vient de Rousseau, et qui s'oppose à l'amour-propre. Dans le texte de Kant, c'est le principe de l'amour de soi ou de l'utilité personnelle qui justifie la fausse promesse : ce principe est certes compatible avec le bien-être futur de l'homme, mais la seule question, dit Kant, est de savoir si la maxime qui en découle est juste — c'est-à-dire si elle peut être érigée en loi universelle."}, {"ok": true, "t": "amour de soi", "fb": ""}, {"ok": true, "t": "L'amour de soi", "fb": ""}]}, {"ty": "matching", "q": "Associez chaque terme à sa définition ou son usage dans le cours.", "pairs": [{"l": "Impératif catégorique", "r": "Commandement absolu : agis seulement d'après la maxime dont tu peux vouloir qu'elle devienne une loi universelle"}, {"l": "Déontologie", "r": "Étude du devoir ; le devoir envisagé comme obligation et impératif"}, {"l": "Conséquentialisme", "r": "Le devoir envisagé du point de vue des conséquences de nos actions"}, {"l": "Expédient", "r": "Un moyen, un moyen provisoire de se tirer d'affaire"}, {"l": "Amour de soi (Rousseau)", "r": "Tendance naturelle à se conserver soi-même, à chercher son bonheur"}, {"l": "Maxime", "r": "Principe subjectif de l'action, que Kant soumet au test de l'universalisation"}]}, {"ty": "cloze", "q": "L'exemple de Kant (texte à trous)", "text": "Un homme se voit pressé par le {1:SHORTANSWER:=besoin~~le besoin} d'emprunter de l'argent. Il sait parfaitement qu'il ne pourra pas {1:SHORTANSWER:=rembourser~~rendre l'argent}, mais il sait aussi qu'on ne lui accordera aucun {1:SHORTANSWER:=prêt~~emprunt} s'il ne promet pas avec fermeté de rendre l'argent à un {1:SHORTANSWER:=moment déterminé~~moment precis}. Il conserve encore assez de {1:SHORTANSWER:=conscience morale~~conscience} pour se demander s'il n'est pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient. — Thèse à retenir : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. »"}, {"ty": "multichoice", "q": "Vrai ou faux : l'homme de l'exemple est un escroc sans scrupule, qui n'a aucune conscience morale.", "a": [{"ok": true, "t": "Faux", "fb": "Faux : c'est un homme honnête, dans le besoin, qui fait une fausse promesse pour de bonnes raisons (obtenir de l'argent par nécessité, non par plaisir ni par malveillance). Il conserve assez de conscience morale pour se demander s'il a le droit d'agir ainsi : c'est donc un dilemme moral — d'un côté le besoin le pousse à faire une fausse promesse, de l'autre son honnêteté s'interroge sur la légitimité de cet expédient. Comprendre cela est indispensable pour expliquer correctement l'exemple, puisque toute l'argumentation de Kant repose sur lui."}, {"ok": false, "t": "Vrai", "fb": "Faux : c'est un homme honnête, dans le besoin, qui fait une fausse promesse pour de bonnes raisons (obtenir de l'argent par nécessité, non par plaisir ni par malveillance). Il conserve assez de conscience morale pour se demander s'il a le droit d'agir ainsi : c'est donc un dilemme moral — d'un côté le besoin le pousse à faire une fausse promesse, de l'autre son honnêteté s'interroge sur la légitimité de cet expédient. Comprendre cela est indispensable pour expliquer correctement l'exemple, puisque toute l'argumentation de Kant repose sur lui."}]}, {"ty": "multichoice", "q": "Quel est le plan de l'explication de ce texte, déduit de son genre argumentatif ?", "a": [{"ok": true, "t": "Exposer et expliquer l'exemple, le discuter, puis en tirer les conséquences pour la thèse.", "fb": "Puisque l'argumentation est tirée d'un exemple développé au fur et à mesure, le plan suit les moments de cet usage de l'exemple : d'abord l'auteur propose un exemple (l'emprunt, la fausse promesse), puis il le discute, s'interroge sur lui, et enfin il en tire les conséquences pour sa thèse. Le professeur a souligné qu'il n'y a pas d'autre méthode pour trouver le « plan » d'un texte : réfléchir au genre du texte et aux moments de son argumentation. Il a aussi rappelé qu'il n'y a pas de « parties » dans un extrait de texte : les parties sont une invention scolaire, l'extrait étant artificiellement isolé dans un livre beaucoup plus long."}, {"ok": false, "t": "Une thèse, une antithèse et une synthèse, comme dans toute dissertation.", "fb": "Non : ce plan dialectique ne correspond pas au mouvement du texte, qui suit le développement d'un exemple."}, {"ok": false, "t": "Deux parties égales de douze lignes chacune, comptées à partir de la thèse.", "fb": "Non : le nombre de « parties » n'a pas de sens ici ; ce sont les moments de l'argumentation qui importent."}, {"ok": false, "t": "Une introduction, un développement et une conclusion rédigées à l'avance par l'auteur.", "fb": "Non : l'extrait est artificiellement isolé d'un texte plus long ; il ne suit pas ce canevas scolaire."}]}, {"ty": "multichoice", "q": "Qu'est-ce qu'un argument en philosophie, selon la définition rappelée en cours ?", "a": [{"ok": true, "t": "Des raisons, en général plusieurs, qui s'enchaînent logiquement pour défendre une thèse.", "fb": "Un argument, c'est des raisons : un argument sert à défendre une thèse, et toute thèse philosophique pose problème par définition. Un argument est souvent un enchaînement de raisons, plusieurs raisons qui s'enchaînent logiquement. Que vous expliquiez un texte ou que vous rédigiez une dissertation, vous êtes l'auteur (ou l'autrice) de votre argumentation : cette définition vaut donc aussi bien pour l'explication de texte que pour la dissertation."}, {"ok": false, "t": "Une citation d'un philosophe célèbre rapportée pour autoriser sa thèse.", "fb": "Non : cela correspond à une référence, pas à un exemple ni à un argument. Le professeur a précisé la différence : un exemple est une situation, un cas particulier, et non une citation philosophique."}, {"ok": false, "t": "Une émotion partagée par le lecteur pour l'émouvoir et le convaincre.", "fb": "Non : ce sont les raisons qui doivent convaincre, non l'émotion."}, {"ok": false, "t": "Une répétition de la thèse sous une forme plus imagée.", "fb": "Non : un argument donne des raisons, il ne répète pas la thèse."}]}, {"ty": "multichoice", "q": "Quels sont les trois types de fiches de révision conseillés en cours ? (Plusieurs réponses correctes.)", "a": [{"ok": true, "t": "Des fiches de citation (recto : la citation seule ; verso : auteur, explication résumée, numéro de page du cahier)", "fb": "La fiche de révision doit demander un effort de mémoire : on écrit la citation seule sur le recto, puis l'auteur, une explication très résumée (une à deux phrases, trois maximum) et le numéro de la page du cahier où la citation est expliquée dans son contexte au verso. On cherche ensuite de mémoire l'auteur et l'explication, puis on vérifie ; en cas d'erreur ou d'hésitation, on retourne à la page du cours."}, {"ok": true, "t": "Des fiches de concept (recto : le concept seul ; verso : l'auteur et la définition, avec le numéro de page)", "fb": "Exemples donnés en cours : évidence (Descartes), souverain bien (Aristote), structure économique et superstructure juridique et politique (Marx), impératif catégorique (Kant). Le concept figure seul au recto, l'auteur et la définition au verso."}, {"ok": true, "t": "Des fiches de repère (absolu / relatif, nécessaire / contingent, etc.)", "fb": "Exemples donnés en cours : absolu / relatif, utilisé dans le cours sur le bonheur ; nécessaire / contingent, pour le cours sur la liberté. Les repères du programme se révisent aussi sur fiche."}, {"ok": false, "t": "Des fiches résumant tout le cours, chapitre par chapitre", "fb": "Au contraire : résumer tout le cours sur une fiche ne sert à rien, car il n'y a aucun effort de mémoire demandé, on ne cherche rien. Cela ne servirait que si le baccalauréat demandait de réciter un cours, ce qui n'est pas le cas."}]}, {"ty": "shortanswer", "q": "Quel est l'auteur du texte suivant (texte 4), dont l'argumentation sera elle aussi fondée sur un exemple ?", "a": [{"ok": true, "t": "Sartre", "fb": "Le texte 4 sera un texte de Sartre, qui fera pareil que Kant : toute l'argumentation du texte 3 de Kant est fondée sur un exemple qu'il développe (la fausse promesse), et ce sera aussi le cas du texte de Sartre. Reconnaître ce genre d'argumentation fondé sur un exemple est indispensable pour expliquer ces textes, et savoir l'utiliser soi-même en dissertation."}, {"ok": true, "t": "sartre", "fb": ""}, {"ok": true, "t": "Jean-Paul Sartre", "fb": ""}]}, {"ty": "multichoice", "q": "Vrai ou faux : dans une réflexion philosophique, on peut réduire la réalité à un dualisme (le bien / le mal, le vrai / le faux).", "a": [{"ok": true, "t": "Faux", "fb": "Faux : on ne doit jamais réduire sa réflexion, en dissertation comme en explication de texte, à un dualisme (le bien / le mal, le vrai / le faux). C'est toujours beaucoup plus compliqué que cela : ce qu'on demande dans une réflexion philosophique, c'est justement de montrer la complexité de la réalité, qui n'est jamais réductible à deux catégories. C'est le cas de l'exemple de Kant : la fausse promesse y pose problème précisément parce qu'elle est faite par un homme honnête, dans le besoin, un dilemme moral, et non une opposition simple entre le bien et le mal."}, {"ok": false, "t": "Vrai", "fb": "Faux : on ne doit jamais réduire sa réflexion, en dissertation comme en explication de texte, à un dualisme (le bien / le mal, le vrai / le faux). C'est toujours beaucoup plus compliqué que cela : ce qu'on demande dans une réflexion philosophique, c'est justement de montrer la complexité de la réalité, qui n'est jamais réductible à deux catégories. C'est le cas de l'exemple de Kant : la fausse promesse y pose problème précisément parce qu'elle est faite par un homme honnête, dans le besoin, un dilemme moral, et non une opposition simple entre le bien et le mal."}]}]}, {"ti": "Kant — L'impératif catégorique", "n": 11, "q": [{"ty": "multichoice", "q": "Quelle est la thèse de Kant dans le texte 3, donnée dès la première ligne ?", "a": [{"ok": true, "t": "Il n'y a qu'un unique impératif catégorique : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. »", "fb": "C'est la thèse du texte, à retenir comme citation pour le baccalauréat. Kant affirme qu'il n'existe qu'un seul impératif catégorique, celui qui commande d'agir uniquement d'après une maxime que l'on peut vouloir voir érigée en loi universelle. Cette formule définit l'impératif catégorique, c'est-à-dire le concept qui permet de définir le devoir : un commandement absolu, inconditionnel, qui vaut pour tout être raisonnable, par opposition aux impératifs hypothétiques qui commandent seulement en vue d'une fin (par exemple : si tu veux de l'argent, alors fais une promesse). La séance a montré que cette citation est la définition kantienne du devoir au sens déontologique."}, {"ok": false, "t": "Il faut toujours chercher son intérêt personnel et son bien-être futur dans l'action morale.", "fb": "L'amour de soi ou l'utilité personnelle est la maxime de l'homme de l'exemple, celle que Kant soumet précisément au test de l'universalisation : ce n'est pas la thèse du texte."}, {"ok": false, "t": "Une promesse mensongère peut être justifiée lorsque l'on est dans le besoin et que l'on agit pour de bonnes raisons.", "fb": "C'est la maxime de l'exemple, celle que Kant met à l'épreuve : la fausse promesse est précisément ce que l'impératif catégorique interdit."}, {"ok": false, "t": "Le devoir se définit uniquement par les conséquences de nos actions sur le bien-être du plus grand nombre.", "fb": "C'est la définition conséquentialiste du devoir, que Kant refuse : pour Kant, le devoir est déontologique, il se définit par l'impératif catégorique et non par les conséquences."}]}, {"ty": "multichoice", "q": "Comment qualifier l'exemple de l'homme qui emprunte de l'argent en promettant de le rendre alors qu'il sait que tel ne sera jamais le cas ?", "a": [{"ok": true, "t": "C'est l'exemple d'une fausse promesse, c'est-à-dire d'un mensonge, commis pour répondre à un besoin d'argent.", "fb": "L'exemple de Kant est celui d'une fausse promesse : un homme pressé par le besoin d'emprunter de l'argent sait parfaitement qu'il ne pourra pas rembourser, mais il sait aussi qu'on ne lui accordera aucun prêt s'il ne promet pas avec fermeté de rendre l'argent à un moment déterminé. Il promet donc tout en sachant qu'il ne tiendra pas : c'est une fausse promesse, autrement dit un mensonge. Le plus important dans cet exemple n'est pas l'emprunt lui-même mais la fausse promesse, car c'est elle qui pose le problème du devoir."}, {"ok": false, "t": "C'est l'exemple d'une escroquerie organisée par un homme malhonnête qui détourne de l'argent.", "fb": "Non : ce n'est pas un escroc ni un truand sans scrupule. L'homme est honnête, il est dans le besoin (un cas d'urgence), et il garde assez de conscience morale pour se demander s'il a le droit d'agir ainsi. C'est un dilemme moral."}, {"ok": false, "t": "C'est l'exemple d'un homme qui demande de l'argent par plaisir, pour des raisons futiles.", "fb": "Non : le texte précise qu'il est dans le besoin ; il ne demande pas de l'argent pour des raisons futiles. Le besoin est un mot clé de l'exemple."}, {"ok": false, "t": "C'est l'exemple d'une promesse politique qu'un candidat sait ne pas pouvoir réaliser.", "fb": "Hors sujet : la question politique a été une digression en classe. L'exemple de Kant est l'exemple privé d'une fausse promesse pour obtenir un emprunt."}]}, {"ty": "multichoice", "q": "Quelle est la contradiction au cœur de l'exemple de la fausse promesse ?", "a": [{"ok": true, "t": "L'homme fait une promesse de remboursement tout en sachant très bien qu'il ne pourra pas rembourser.", "fb": "La contradiction est là : d'un côté, pour obtenir l'argent dont il a besoin, l'homme doit faire une promesse ; de l'autre, il sait dès le départ qu'il ne pourra pas la tenir. Ce conflit entre le besoin qui pousse à la fausse promesse et la conscience morale qui s'interroge (« n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient ? ») fait de cet exemple un dilemme moral. C'est cette contradiction que l'universalisation de la maxime révélera comme impossible : une loi universelle du mensonge se détruirait elle-même, car plus personne ne croirait aux promesses et personne ne prêterait plus d'argent."}, {"ok": false, "t": "L'homme veut emprunter alors qu'il n'a pas besoin d'argent et pourrait s'en passer.", "fb": "Non : le texte dit au contraire qu'il est pressé par le besoin, c'est un cas d'urgence, un dénuement."}, {"ok": false, "t": "L'homme rembourse son emprunt alors qu'il avait promis de ne jamais le rendre.", "fb": "Non, c'est l'inverse : il promet de rendre l'argent tout en sachant que tel ne sera jamais le cas."}, {"ok": false, "t": "L'homme refuse de faire une promesse alors même qu'il sait qu'on lui accordera le prêt.", "fb": "Non : Kant précise qu'on ne lui accordera aucun prêt s'il ne promet pas avec fermeté de rendre l'argent ; la promesse est la condition de l'emprunt."}]}, {"ty": "multichoice", "q": "Sélectionnez les mots clés qu'il faut relever pour expliquer l'exemple donné par Kant. (Plusieurs réponses correctes.)", "a": [{"ok": true, "t": "Le besoin", "fb": "Le besoin est un mot clé : l'homme ne demande pas d'argent par plaisir ni pour des raisons futiles, il est dans le besoin, dans le dénuement ; c'est un cas d'urgence."}, {"ok": true, "t": "L'emprunt", "fb": "L'emprunt est le terme qui définit l'exemple : il s'agit de l'exemple d'un emprunt d'argent."}, {"ok": true, "t": "La promesse", "fb": "La promesse est un mot clé : elle est la condition de l'emprunt, un engagement qui porte sur la parole et l'honneur, c'est-à-dire un devoir. Ici, c'est une fausse promesse, un mensonge."}, {"ok": false, "t": "Le plaisir", "fb": "Non : l'homme n'emprunte pas par plaisir, ni pour des raisons futiles, mais par besoin."}, {"ok": false, "t": "L'escroquerie", "fb": "Non : ce n'est pas l'exemple d'une escroquerie ; l'homme est honnête et se demande si son expédient est contraire au devoir."}]}, {"ty": "multichoice", "q": "Le texte 3 de Kant est argumenté de la même manière que les textes de Descartes et de Marx : entièrement fondé sur une démonstration.", "a": [{"ok": true, "t": "Faux", "fb": "Faux : contrairement aux textes de Descartes et de Marx, entièrement fondés sur une démonstration, le texte 3 (comme le texte 4) appartient à un autre genre d'argumentation : une argumentation fondée sur un exemple, qui est développé au fur et à mesure (une situation tout entière, sur plusieurs lignes) puis analysé pour en déduire des arguments. D'où la méthode d'explication : exposer l'exemple, le discuter, puis en tirer les conséquences pour la thèse. Cette distinction est aussi un principe de méthode pour la dissertation : l'exemple peut venir illustrer un argument après coup, ou au contraire précéder l'argument et le faire naître par son analyse."}, {"ok": false, "t": "Vrai", "fb": "Faux : contrairement aux textes de Descartes et de Marx, entièrement fondés sur une démonstration, le texte 3 (comme le texte 4) appartient à un autre genre d'argumentation : une argumentation fondée sur un exemple, qui est développé au fur et à mesure (une situation tout entière, sur plusieurs lignes) puis analysé pour en déduire des arguments. D'où la méthode d'explication : exposer l'exemple, le discuter, puis en tirer les conséquences pour la thèse. Cette distinction est aussi un principe de méthode pour la dissertation : l'exemple peut venir illustrer un argument après coup, ou au contraire précéder l'argument et le faire naître par son analyse."}]}, {"ty": "multichoice", "q": "Le devoir, au sens déontologique que lui donne Kant, se définit comme :", "a": [{"ok": true, "t": "Une obligation, un impératif, et même un impératif catégorique, défini indépendamment des conséquences de l'action.", "fb": "Au sens déontologique (la déontologie est l'étude du devoir), le devoir est défini par Kant comme une obligation, un impératif, et même un impératif catégorique : un commandement absolu, valable inconditionnellement. C'est la première des deux grandes façons de considérer le devoir ; l'autre est le point de vue conséquentialiste, qui envisage le devoir du point de vue des conséquences de nos actions (nous avons le devoir de faire quelque chose quand on réfléchit aux conséquences de nos actions). En première définition générale, le devoir est ce que notre conscience morale, ou notre raison, nous recommande ou nous commande de faire."}, {"ok": false, "t": "Une action dont on juge la valeur uniquement d'après ses conséquences sur le bien-être futur.", "fb": "C'est la définition conséquentialiste du devoir, la seconde façon de le considérer, que l'on abordera après le texte de Kant."}, {"ok": false, "t": "Une inclination naturelle qui pousse chacun à chercher son bonheur.", "fb": "C'est l'amour de soi chez Rousseau, la maxime de l'homme de l'exemple, non la définition kantienne du devoir."}, {"ok": false, "t": "Un moyen provisoire de se tirer d'affaire dans une situation urgente.", "fb": "C'est la définition d'un expédient dans le texte, non celle du devoir."}]}, {"ty": "shortanswer", "q": "Quel concept, emprunté à Rousseau, désigne la tendance naturelle à se conserver soi-même, c'est-à-dire à chercher à réaliser son bonheur ?", "a": [{"ok": true, "t": "l'amour de soi", "fb": "L'amour de soi est la tendance naturelle de se conserver soi-même, c'est-à-dire à chercher à réaliser son bonheur : chaque être humain cherche le bonheur. C'est un concept qui vient de Rousseau, et qui s'oppose à l'amour-propre. Dans le texte de Kant, c'est le principe de l'amour de soi ou de l'utilité personnelle qui justifie la fausse promesse : ce principe est certes compatible avec le bien-être futur de l'homme, mais la seule question, dit Kant, est de savoir si la maxime qui en découle est juste — c'est-à-dire si elle peut être érigée en loi universelle."}, {"ok": true, "t": "amour de soi", "fb": ""}, {"ok": true, "t": "L'amour de soi", "fb": ""}]}, {"ty": "matching", "q": "Associez chaque terme à é s'interroge sur la légitimité de cet expédient. Comprendre cela est indispensable pour expliquer correctement l'exemple, puisque toute l'argumentation de Kant repose sur lui."}, {"ok": false, "t": "Vrai", "fb": "Faux : c'est un homme honnête, dans le besoin, qui fait une fausse promesse pour de bonnes raisons (obtenir de l'argent par nécessité, non par plaisir ni par malveillance). Il conserve assez de conscience morale pour se demander s'il a le droit d'agir ainsi : c'est donc un dilemme moral — d'un côté le besoin le pousse à faire une fausse promesse, de l'autre son honnêteté s'interroge sur la légitimité de cet expédient. Comprendre cela est indispensable pour expliquer correctement l'exemple, puisque toute l'argumentation de Kant repose sur lui."}]}, {"ty": "multichoice", "q": "Quel est le plan de l'explication de ce texte, déduit de son genre argumentatif ?", "a": [{"ok": true, "t": "Exposer et expliquer l'exemple, le discuter, puis en tirer les conséquences pour la thèse.", "fb": "Puisque l'argumentation est tirée d'un exemple développé au fur et à mesure, le plan suit les moments de cet usage de l'exemple : d'abord l'auteur propose un exemple (l'emprunt, la fausse promesse), puis il le discute, s'interroge sur lui, et enfin il en tire les conséquences pour sa thèse. Le professeur a souligné qu'il n'y a pas d'autre méthode pour trouver le « plan » d'un texte : réfléchir au genre du texte et aux moments de son argumentation. Il a aussi rappelé qu'il n'y a pas de « parties » dans un extrait de texte : les parties sont une invention scolaire, l'extrait étant artificiellement isolé dans un livre beaucoup plus long."}, {"ok": false, "t": "Une thèse, une antithèse et une synthèse, comme dans toute dissertation.", "fb": "Non : ce plan dialectique ne correspond pas au mouvement du texte, qui suit le développement d'un exemple."}, {"ok": false, "t": "Deux parties égales de douze lignes chacune, comptées à partir de la thèse.", "fb": "Non : le nombre de « parties » n'a pas de sens ici ; ce sont les moments de l'argumentation qui importent."}, {"ok": false, "t": "Une introduction, un développement et une conclusion rédigées à l'avance par l'auteur.", "fb": "Non : l'extrait est artificiellement isolé d'un texte plus long ; il ne suit pas ce canevas scolaire."}]}]}, {"ti": "Kant — Impératif catégorique et fonction de l'exemple (TG02)", "n": 6, "q": [{"ty": "multichoice", "q": "Méthode : quelle est la première manière de traiter un exemple dans une argumentation ?", "a": [{"ok": true, "t": "L'exemple vient illustrer un argument : l'auteur (ou l'élève) développe d'abord son argument, en donnant plusieurs raisons qui s'enchaînent logiquement, puis donne un exemple après coup pour l'illustrer.", "fb": "Correct. Première manière : l'exemple vient illustrer un argument. L'auteur (ou l'élève) développe d'abord son argument, c'est-à-dire donne plusieurs raisons qui s'enchaînent logiquement, puis donne un exemple après coup pour l'illustrer."}, {"ok": false, "t": "On commence par l'exemple, on le développe sur plusieurs lignes, et c'est à partir de lui seulement qu'on en déduit des arguments.", "fb": "Non : ceci est la deuxième manière de traiter un exemple, pas la première. Première manière : l'exemple vient illustrer un argument. L'auteur développe d'abord son argument (plusieurs raisons qui s'enchaînent logiquement), puis donne un exemple après coup pour l'illustrer."}, {"ok": false, "t": "L'exemple remplace l'argument : une fois l'exemple donné, il est inutile de donner des raisons.", "fb": "Non : un exemple ne remplace jamais un argument. Première manière : l'exemple vient illustrer un argument, donné d'abord (plusieurs raisons qui s'enchaînent logiquement), puis illustré par un exemple après coup."}, {"ok": false, "t": "L'exemple est une simple phrase citée en passant, sans lien logique avec l'argument.", "fb": "Non : un exemple n'est jamais une simple phrase isolée. Première manière : l'exemple vient illustrer un argument, donné d'abord (plusieurs raisons qui s'enchaînent logiquement), puis illustré par un exemple après coup."}]}, {"ty": "multichoice", "q": "Méthode : dans la deuxième manière de traiter un exemple, que fait-on après avoir développé la situation ?", "a": [{"ok": true, "t": "On l'analyse : on montre pourquoi cet exemple est intéressant dans le sujet, on reprend ses termes, on définit certains concepts, et c'est à partir de là seulement qu'on en déduit des arguments.", "fb": "Correct. Deuxième manière : on commence par un exemple au lieu de commencer par un argument. L'exemple est toute une situation, développée sur plusieurs lignes. Puis on l'analyse : on montre au lecteur pourquoi cet exemple est intéressant dans le sujet traité, on reprend les termes de l'exemple, on définit certains concepts, et c'est à partir de là seulement qu'on en déduit des arguments."}, {"ok": false, "t": "On passe directement à l'exemple suivant, pour accumuler les cas.", "fb": "Non : accumuler des exemples ne remplace pas l'analyse. Deuxième manière : après avoir développé la situation, on l'analyse (pourquoi elle est intéressante dans le sujet, reprise des termes, définition des concepts) et c'est à partir de là seulement qu'on en déduit des arguments."}, {"ok": false, "t": "On conclut tout de suite : l'exemple parle de lui-même, le lecteur comprend sans analyse.", "fb": "Non : un exemple ne parle jamais de lui-même, il doit être analysé. Deuxième manière : après avoir développé la situation, on l'analyse (pourquoi elle est intéressante dans le sujet, reprise des termes, définition des concepts) et c'est à partir de là seulement qu'on en déduit des arguments."}, {"ok": false, "t": "On le compare à la thèse d'un autre auteur avant de l'analyser.", "fb": "Non : la comparaison avec un autre auteur n'est pas l'étape suivante. Deuxième manière : après avoir développé la situation, on l'analyse (pourquoi elle est intéressante dans le sujet, reprise des termes, définition des concepts) et c'est à partir de là seulement qu'on en déduit des arguments."}]}, {"ty": "multichoice", "q": "Méthode : pourquoi l'explication de texte et la dissertation sont-elles deux exercices complémentaires ?", "a": [{"ok": true, "t": "Parce que comprendre comment un auteur comme Kant (ou Sartre) utilise l'exemple pour en tirer des arguments apprend à faire la même chose dans une dissertation.", "fb": "Correct. Comprendre comment un auteur comme Kant (ou Sartre ensuite) utilise l'exemple pour en tirer des arguments doit vous apprendre à faire la même chose dans une dissertation : c'est pourquoi l'explication de texte et la dissertation sont deux exercices complémentaires."}, {"ok": false, "t": "Parce que les deux exercices portent toujours sur les mêmes auteurs.", "fb": "Non : ce n'est pas une question d'auteurs. Comprendre comment un auteur comme Kant (ou Sartre) utilise l'exemple pour en tirer des arguments doit vous apprendre à faire la même chose dans une dissertation : c'est pourquoi les deux exercices sont complémentaires."}, {"ok": false, "t": "Parce que la dissertation n'exige pas d'exemples, contrairement à l'explication de texte.", "fb": "Non : la dissertation, au contraire, exige elle aussi de bien traiter les exemples. Comprendre comment un auteur comme Kant (ou Sartre) utilise l'exemple pour en tirer des arguments doit vous apprendre à faire la même chose dans une dissertation : c'est pourquoi les deux exercices sont complémentaires."}, {"ok": false, "t": "Parce qu'au baccalauréat l'élève peut choisir l'un ou l'autre, donc il suffit d'en maîtriser un.", "fb": "Non : il faut maîtriser les deux exercices. Comprendre comment un auteur comme Kant (ou Sartre) utilise l'exemple pour en tirer des arguments doit vous apprendre à faire la même chose dans une dissertation : c'est pourquoi les deux exercices sont complémentaires."}]}, {"ty": "multichoice", "q": "Kant : quelle est la formule exacte de l'unique impératif catégorique (citation à connaître pour le baccalauréat) ?", "a": [{"ok": true, "t": "« Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. »", "fb": "Correct. La thèse se trouve dès la première ligne du texte : il n'y a qu'un unique impératif catégorique : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. » Cette citation est à connaître pour le baccalauréat : à ajouter à la liste des citations ou à transformer en fiche (recto : la citation seule ; verso : l'auteur et une explication très résumée, avec le numéro de page du cahier)."}, {"ok": false, "t": "« Agis de telle sorte que ta maxime puisse devenir une loi de la nature. »", "fb": "Non : la formule exacte est « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. » Attention à la citation exacte : une citation approximative décrédibilise l'explication. Cette citation est à connaître pour le baccalauréat."}, {"ok": false, "t": "« Agis selon la maxime que tous les hommes pourraient approuver. »", "fb": "Non : ce n'est pas l'approbation des autres hommes qui fait la loi, mais l'universalité que je peux vouloir. Formule exacte : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. » Citation à connaître pour le baccalauréat."}, {"ok": false, "t": "« Agis de façon à ce que ton action ait toujours les meilleures conséquences possibles. »", "fb": "Non : c'est une conception conséquentialiste du devoir, l'inverse de l'impératif catégorique kantien. Formule exacte : « Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. » Citation à connaître pour le baccalauréat."}]}, {"ty": "multichoice", "q": "Kant : quelle est la différence entre la déontologie et le conséquentialisme ?", "a": [{"ok": true, "t": "La déontologie définit le devoir comme une obligation, un impératif (Kant) ; le conséquentialisme envisage le devoir du point de vue des conséquences de nos actions.", "fb": "Correct. Deux manières de considérer le devoir : de manière déontologique (la déontologie est l'étude du devoir), le devoir est alors défini par Kant comme une obligation, un impératif, et même un impératif catégorique ; ou d'un point de vue conséquentialiste, le devoir est alors envisagé du point de vue des conséquences de nos actions (nous avons le devoir de faire quelque chose quand nous réfléchissons aux conséquences de nos actions)."}, {"ok": false, "t": "La déontologie regarde les conséquences, le conséquentialisme regarde l'obligation.", "fb": "Non : c'est l'inverse. La déontologie (étude du devoir) définit le devoir comme une obligation, un impératif catégorique chez Kant ; le conséquentialisme envisage le devoir du point de vue des conséquences de nos actions."}, {"ok": false, "t": "Les deux termes désignent la même morale du devoir chez Kant.", "fb": "Non : ce sont deux manières différentes, voire opposées, de considérer le devoir. La déontologie définit le devoir comme une obligation, un impératif catégorique (Kant) ; le conséquentialisme envisage le devoir du point de vue des conséquences de nos actions."}, {"ok": false, "t": "La déontologie concerne la dissertation, le conséquentialisme l'explication de texte.", "fb": "Non : ce sont deux conceptions du devoir, sans rapport avec les exercices. La déontologie définit le devoir comme une obligation, un impératif catégorique (Kant) ; le conséquentialisme envisage le devoir du point de vue des conséquences de nos actions."}]}, {"ty": "multichoice", "q": "Méthode : quel est le plan de l'explication d'un extrait de texte de 25 lignes ?", "a": [{"ok": true, "t": "Il n'y a pas de « parties » : on réfléchit au genre du texte pour en déduire les moments de son argumentation, en remplaçant le verbe flou « expliquer » par des verbes précis (l'auteur propose un exemple, s'y appuie, le discute, en tire les co
