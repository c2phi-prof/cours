<style>

*{box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);margin:0;padding:20px;transition:background .4s,color .4s}
.wrap{max-width:760px;margin:0 auto}

button.helpbtn{margin:0;width:34px;height:34px;padding:0;border-radius:50%!important;background:#fff!important;color:var(--ink);border:1px solid var(--line);font:700 1em/1 var(--font);cursor:pointer;box-shadow:0 1px 4px var(--shadow);display:inline-flex;align-items:center;justify-content:center;transition:border-color .16s ease}
button.helpbtn:hover{border-color:var(--acc);color:var(--acc)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
label.opt,div.opt{display:block;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0;cursor:pointer;line-height:1.4;animation:fadeUp .4s ease backwards;transition:background .25s,border-color .25s,transform .15s}

@keyframes goodGlow{0%,100%{box-shadow:0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 22px color-mix(in srgb,var(--ok) 70%,transparent)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(130px) rotate(560deg) scale(.6);opacity:0}}

@keyframes bigTick{0%{transform:translate(-50%,-50%) scale(0) rotate(-40deg);opacity:0}55%{transform:translate(-50%,-50%) scale(1.35) rotate(8deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
.bigtick{position:fixed;left:50%;top:38%;font-size:64px;z-index:60;pointer-events:none;animation:bigTick .85s ease forwards;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--ok) 60%,transparent))}
@keyframes cardCheer{0%,100%{box-shadow:0 3px 10px var(--shadow)}45%{box-shadow:0 0 34px color-mix(in srgb,var(--ok) 55%,transparent),0 3px 10px var(--shadow)}}
.card.cheer{animation:cardCheer 1s ease 2}
label.opt.bad,div.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));animation:shake .45s ease}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

select.pairsel{width:100%;margin:6px 0;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-family:var(--font)}
button{font-family:var(--font);font-size:1em;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px 24px;cursor:pointer;margin-top:14px;transition:transform .15s,filter .2s,background .4s}

.score .big{font-size:2em;color:var(--acc);display:block}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:var(--ok);transition:width 1.1s cubic-bezier(.25,.9,.3,1)}

.rq div.opt{cursor:default}
.aibox{margin-top:10px}
.scrollbtns{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:40}
.scrollbtns button{width:48px;height:48px;border-radius:50%!important;cursor:pointer;border:1px solid var(--line);background:var(--card)!important;color:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.scrollbtns button:hover{transform:translateY(-2px) scale(1.06);border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2),0 7px 18px var(--shadow)}
.scrollbtns button:active{transform:translateY(0) scale(.95)}
.scrollbtns .arr{font:700 26px/1 var(--font);color:var(--acc);display:inline-block}
.helpwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.helpbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:20px 26px;box-shadow:0 12px 40px rgba(0,0,0,.4);font-family:var(--font)}
.helpbox h2{margin:0 0 10px}
.helpbox p,.helpbox li{line-height:1.55}
.helpbox .lbl{display:block;margin-top:14px}
.hidden{display:none}
#editor{position:fixed;inset:0;background:rgba(15,12,8,.6);overflow:auto;padding:20px;z-index:50;animation:fadeUp .3s ease}
#editor .panel{background:var(--card);color:var(--ink);max-width:820px;margin:0 auto;border-radius:12px;padding:20px}
#editor textarea,#editor input[type=text]{width:100%;margin:4px 0 10px}
.eq{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0;background:color-mix(in srgb,var(--acc) 4%,var(--card))}
.eq .lbl{font-size:.8em;opacity:.65;margin-top:6px;display:block}
.mini{font-size:.85em;padding:6px 11px;margin:4px 4px 0 0;background:var(--ink)}
.danger{background:var(--bad)}
</style>

<script>
var QUIZ = {"title": "Kant : la maxime", "sub": "TG2 — Séance du 17 novembre 2026", "questions": [{"type": "single", "name": "Par quel élément se termine l'exemple de la fausse promesse, et pourquoi cet élément est-il décisif pour la suite du texte ?", "options": [{"text": "Par une question que l'individu se pose à lui-même (« n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient ? ») : c'est avec cette question que commence le problème du texte.", "correct": true, "feedback": "L'exemple commence ligne 2 (la thèse étant ligne 1) et s'achève sur une question. Les termes à relever sont : conscience morale, interdit, contraire au devoir. L'individu se demande si le fait de mentir, de faire une fausse promesse pour se tirer d'affaire, est permis : il se pose un cas de conscience, c'est-à-dire un dilemme moral. Le dilemme est une forme de contradiction : la conscience morale rencontre une contradiction (le besoin le pousse à mentir, sa conscience lui demande s'il en a le droit). C'est à partir de cette contradiction qu'apparaît le problème du texte : avant cette question, aucun indice ne permettait de le formuler. Conséquence de méthode pour la dissertation : il faut chercher la contradiction implicite du sujet (paradoxe, dilemme, contradiction entre des idées) pour construire la problématique."}, {"text": "Par la thèse de l'auteur, énoncée dès la première ligne du texte.", "correct": false, "feedback": ""}, {"text": "Par la formulation de la loi universelle, qui conclut l'exemple.", "correct": false, "feedback": ""}, {"text": "Par un second exemple de mensonge, qui confirme le premier.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "Pourquoi Kant écrit-il que l'individu « conserve encore assez de conscience morale », et que faut-il ajouter pour ne pas se contenter d'une paraphrase ?", "options": [{"text": "La détresse, le besoin dans lequel il se trouve, a pu éroder une partie de sa conscience morale : « conserver » renvoie à la situation de besoin déjà expliquée.", "correct": true, "feedback": "Dire que l'individu « conserve encore assez de conscience morale » signifie qu'il lui en reste un peu. Mais le sous-entendu, c'est que quelque chose lui a retiré une partie de sa conscience morale : le fait d'être dans le besoin, dans la détresse (termes relevés au départ dans l'exemple). Dans le malheur, on est prêt à tout pour survivre, pour se conserver soi-même. Le verbe « conserver » est secondaire dans l'argumentation : il renvoie au terme de « besoin » déjà expliqué précédemment. Se contenter de dire « il conserve, donc il lui reste de la conscience » serait une paraphrase (un simple synonyme sans rien ajouter à la lecture du texte) ; il faut relier ce terme à la situation de détresse de l'individu."}, {"text": "Parce qu'il a perdu toute conscience morale depuis longtemps.", "correct": false, "feedback": ""}, {"text": "Parce que la conscience morale est innée et ne peut jamais diminuer.", "correct": false, "feedback": ""}, {"text": "Parce qu'il imite la conscience morale des autres membres de la société.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "La question que se pose l'individu (« est-ce que j'ai le droit de mentir ? ») porte sur quel type de droit ?", "options": [{"text": "Le droit au sens moral : la légitimité. Il se demande si son mensonge est conforme au devoir, non s'il est conforme à la loi.", "correct": true, "feedback": "La nature du problème posé par l'individu n'est pas d'ordre juridique : il se demande s'il a le droit de mentir, mais au sens de « faut-il ? », « est-ce permis ? », c'est-à-dire au sens moral. C'est le repère du programme légal / légitime, à lire dans le livre à la page 528 et dans la fiche « Découvrir les repères » sur Pronote. Ce qui est légal est conforme à la loi ; ce qui est légitime est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale. Les deux ne coïncident pas : ce qui est légal peut ne pas être légitime (mentir est légal, mais moralement condamnable : on apprend aux enfants à ne pas mentir), et ce qui est légitime peut ne pas être légal."}, {"text": "Le droit au sens juridique : il se demande si le mensonge est puni par la loi.", "correct": false, "feedback": ""}, {"text": "Le droit au sens économique : il se demande s'il peut rembourser l'argent emprunté.", "correct": false, "feedback": ""}, {"text": "Le droit au sens psychologique : il se demande s'il aura le courage de mentir.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "Vrai ou faux : mentir n'est pas un délit ; ce que la loi punit, c'est l'abus de confiance.", "options": [{"text": "Vrai", "correct": true, "feedback": "Vrai. Il ne faut pas confondre le mensonge, qui n'est pas illégal (mentir n'est pas un délit), et l'abus de confiance, qui est un délit. L'abus de confiance consiste à tromper la confiance de quelqu'un, à chercher à tirer profit de lui en abusant de sa vulnérabilité, de sa faiblesse ou de son ignorance (par exemple escroquer une personne âgée), pour lui nuire ou pour satisfaire ses propres intérêts. Mentir n'est pas puni par la loi : on peut même mentir à la police, sauf si l'on est sous serment. Cela ne veut pas dire que la loi autorise le mensonge : rien n'est écrit dans la loi en ce sens, mais il n'y a pas de loi contre le mensonge. Dans l'exemple, promettre de rendre de l'argent que l'on sait ne jamais pouvoir rendre est un mensonge, mais pas un abus de confiance : l'individu n'est pas un escroc, il ne cherche pas à abuser de la confiance de son créancier pour lui nuire."}, {"text": "Faux", "correct": false, "feedback": ""}]}, {"type": "short", "name": "Quel terme désigne l'appât du gain, l'avidité pour l'argent, le fait de désirer de l'argent même sans en avoir besoin ?", "answers": ["la cupidité", "cupidité", "l'avidité", "avidité"], "feedback": "La cupidité, c'est l'appât du gain, l'avidité pour l'argent. L'individu de l'exemple ne ment pas par cupidité : il ment parce qu'il en a vraiment besoin, il est dans la détresse financière. C'est ce qui distingue son cas de celui d'un escroc, et c'est pourquoi son cas pose un vrai problème moral : ses raisons sont bonnes, même si son acte (mentir) pose problème."}, {"type": "single", "name": "Selon le cours, qu'est-ce exactement que le « légal » ?", "options": [{"text": "Ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas.", "correct": true, "feedback": "Le légal, c'est ce qui est conforme à la loi : tout ce que la loi autorise, mais aussi tout ce qu'elle n'interdit pas. Mentir est légal parce qu'il n'y a pas de loi contre le mensonge, même si aucune loi n'autorise expressément le mensonge : ce n'est pas parce que c'est écrit dans la loi que c'est légal, c'est parce que ce n'est pas interdit. C'est pourquoi le problème de l'exemple n'est pas un problème de légalité : la fausse promesse n'est pas illégale. Le problème est un problème de légitimité : est-elle moralement permise ? Est-elle conforme au devoir ?"}, {"text": "Uniquement ce que la loi autorise expressément par écrit.", "correct": false, "feedback": ""}, {"text": "Uniquement ce que la loi interdit.", "correct": false, "feedback": ""}, {"text": "Ce qui est conforme à la morale, indépendamment de la loi.", "correct": false, "feedback": ""}]}, {"type": "short", "name": "Comment le cours définit-il la maxime (formule courte) ?", "answers": ["une règle de conduite", "règle de conduite", "un principe d'action", "principe d'action", "une règle de conduite que je me donne pour agir"], "feedback": "La maxime est un principe d'action, une règle de conduite qui permet de réaliser mon intention. J'ai l'intention de faire quelque chose, je désire quelque chose : pour que cette intention devienne réelle, il faut que j'agisse, et je ne peux pas agir n'importe comment si je veux la satisfaire. Il faut agir en conséquence, que l'action soit efficace : il faut donc réfléchir à mon action avant d'agir. Cette réflexion sur ce que je dois faire, c'est la maxime : la règle de conduite que je me donne pour réaliser une intention. Sans maxime, l'intention resterait à l'état de simple désir et ne serait jamais réalisée."}, {"type": "single", "name": "Pourquoi l'être humain doit-il se donner des règles de conduite avant d'agir ?", "options": [{"text": "Parce que ses actions ne sont pas déterminées par la nature : contrairement aux animaux, il doit choisir le sens de son existence et réfléchir à ce qu'il doit faire.", "correct": true, "feedback": "Contrairement aux animaux, les actes de l'être humain ne sont pas déterminés par la nature. Mettez un renard dans un poulailler : on sait très bien ce qui va se passer, le renard ne peut pas agir autrement qu'en prédateur, son instinct naturel détermine ses actions. L'animal n'a pas à réfléchir à ses actes. L'être humain, lui, doit choisir le sens de son existence (perspective sur l'existence humaine et la culture déjà étudiée) : c'est pour cela qu'il doit se donner des règles de conduite avant d'agir, car ses actions ne sont pas instinctives, pas déterminées à l'avance. La maxime est cette règle que je me donne."}, {"text": "Parce que la société lui impose des règles qu'il ne peut pas discuter.", "correct": false, "feedback": ""}, {"text": "Parce qu'il agit par instinct et que l'instinct exige des règles.", "correct": false, "feedback": ""}, {"text": "Parce qu'il n'a pas de conscience et doit donc suivre des habitudes.", "correct": false, "feedback": ""}]}, {"type": "multi", "name": "Parmi ces besoins ou comportements, lesquels le cours présente-t-il comme déjà modifiés par la culture, donc non naturels et non instinctifs ?", "options": [{"text": "Se nourrir : l'homme ne sait pas instinctivement ce qu'il doit manger, il doit l'apprendre (addictions, pathologies alimentaires, éducation alimentaire).", "correct": true, "feedback": "Même les besoins les plus naturels de l'être humain, comme se nourrir, ont déjà été profondément modifiés par la culture. On ne se nourrit pas par instinct : la preuve, c'est que beaucoup développent des addictions ou des pathologies alimentaires, et qu'on doit éduquer un enfant pour qu'il s'alimente bien. L'homme ne sait pas naturellement ce qu'il doit manger : on le lui apprend."}, {"text": "Dormir : la fatigue et le sommeil sont réglés par la vie en société (fatigue après la journée de travail, horaires bouleversés par le travail de nuit).", "correct": true, "feedback": "Même la fatigue, même le besoin de dormir, est déterminé par la société : si l'on est fatigué après une journée de travail, c'est à cause de la journée de travail ; celui qui travaille de nuit n'est pas fatigué à 18h mais à 5h du matin. Le sommeil est déjà réglé par notre vie en société."}, {"text": "L'amour maternel : l'amour d'une mère pour son enfant est appris (hérité de l'amour reçu de sa propre mère), il n'y a pas d'instinct maternel.", "correct": true, "feedback": "Il n'y a pas d'amour naturel de la mère pour son enfant : l'amour qu'une mère peut éprouver est appris, c'est parce qu'elle a bénéficié de l'amour de sa propre mère qu'elle peut à son tour en éprouver. Et l'on sait bien qu'il y a des mères qui n'éprouvent pas d'amour pour leurs enfants. Il n'y a donc plus rien de naturel en l'homme : ni instinct de survie, ni instinct maternel."}, {"text": "La chasse animale : la lionne apprend des stratégies et fabrique des outils pour chasser.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "L'homme préhistorique chassait-il par instinct, selon le cours ?", "options": [{"text": "Non : il chassait grâce aux techniques et aux stratégies qu'il a créées (chasse en groupe, outils) ; le propre de l'instinct est de ne pas varier, de ne pas évoluer.", "correct": true, "feedback": "L'homme préhistorique n'était pas plus proche de l'animal que nous : il ne s'est pas développé grâce à ses instincts, mais grâce à ses techniques. Il ne chassait pas par instinct : il a créé des techniques, dé ormule une règle à partir de l'exemple. Il faut marquer cette transition dans son texte."}, {"text": "Elle résout le problème en montrant que mentir est parfois permis.", "correct": false, "feedback": ""}, {"text": "Elle donne un second exemple, celui d'un autre individu qui ment.", "correct": false, "feedback": ""}, {"text": "Elle énonce la loi universelle qui conclut le texte.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "Qui désigne le « je » de la maxime ? (attention, il y a deux pièges)", "options": [{"text": "Tout individu qui se trouverait dans le même cas (détresse financière, sans autre moyen d'obtenir de l'argent) : pas seulement l'individu de l'exemple, et pas l'auteur.", "correct": true, "feedback": "Deux pièges à éviter. Premier piège : croire que le « je » désigne seulement l'individu pris en exemple. La maxime, même formulée à la première personne du singulier, désigne tout individu qui se trouverait dans le même cas, toute personne dans une situation de détresse financière sans autre moyen d'obtenir de l'argent que de faire une fausse promesse. Second piège : croire que le « je » désigne Kant lui-même : quand Kant écrit « je », il ne parle pas de lui, ce n'est pas l'auteur qui est désigné. Le « je » est donc un pronom personnel qui exprime une généralité : c'est un « je » générique, équivalent à « on » (on aurait très bien pu écrire : « quand on se croit à court d'argent, on accepte d'en emprunter et de promettre de le rendre, bien que l'on sache que tel ne sera jamais le cas »). On passe d'un exemple particulier à une généralisation."}, {"text": "Uniquement l'individu précis de l'exemple, et personne d'autre.", "correct": false, "feedback": ""}, {"text": "Kant lui-même, qui raconte une expérience personnelle d'emprunt.", "correct": false, "feedback": ""}, {"text": "Le lecteur, que Kant invite à répondre à sa place.", "correct": false, "feedback": ""}]}, {"type": "single", "name": "Pourquoi Kant formule-t-il une règle générale à is la seule question est de savoir si ce principe est juste ». Le raisonnement concessif consiste à admettre, à accorder, à faire une concession, pour ensuite, dans un deuxième temps, mieux défendre sa thèse. En somme : « ce que tu dis n'est pas faux, mais j'ai raison ». Attention : le raisonnement concessif n'est pas sur la fiche du livre sur les raisonnements, il faut donc le noter dans le cahier."}, {"text": "Une hypothèse : il imagine ce qui se passerait si l'individu mentait.", "correct": false, "feedback": ""}, {"text": "Un raisonnement par l'absurde : il montre que la maxime conduit à une conséquence impossible.", "correct": false, "feedback": ""}, {"text": "Une démonstration par l'exemple : il raconte une nouvelle histoire.", "correct": false, "feedback": ""}]}, {"type": "matching", "name": "Associez chaque concept du cours à sa définition.", "pairs": [{"q": "Dilemme moral", "a": "Un cas de conscience : une contradiction que rencontre la conscience morale"}, {"q": "Légal", "a": "Ce qui est conforme à la loi : ce que la loi autorise et tout ce qu'elle n'interdit pas"}, {"q": "Légitime", "a": "Ce qui est conforme à une norme qui n'est pas nécessairement juridique, par exemple une norme morale"}, {"q": "Abus de confiance", "a": "Tromper la confiance de quelqu'un, profiter de sa vulnérabilité ou de son ignorance : un délit"}, {"q": "Cupidité", "a": "L'appât du gain, l'avidité pour l'argent"}, {"q": "Maxime", "a": "Un principe d'action, une règle de conduite que je me donne pour réaliser une intention"}]}, {"type": "cloze", "name": "La maxime de l'individu (texte à trous)", "segs": [{"t": "Complétez la maxime formulée par Kant : « Quand je me crois à court d'argent, j'accepte d'en "}, {"blank": ["emprunter"]}, {"t": " et de promettre de le "}, {"blank": ["rendre"]}, {"t": " bien que je sache que tel ne sera jamais le "}, {"blank": ["cas"]}, {"t": " ». — Formule à retenir : la maxime est une règle de conduite, un principe d'action que je me donne pour réaliser une intention ; formulée à la première personne, elle désigne tout individu dans le même cas."}]}, {"type": "single", "name": "Quel repère du programme permet de structurer le texte, et quelle progression décrit-il ?", "options": [{"text": "Universel / général / particulier / singulier : le texte passe du particulier (l'exemple de l'individu) au général (la maxime), puis à l'universel (la loi universelle, troisième moment).", "correct": true, "feedback": "Le repère du programme universel / général / particulier / singulier (à lire dans le livre, page 529 environ, et dans la fiche « Découvrir les repères » sur Pronote) permet de structurer le texte. Premier moment de l'argumentation : l'exemple, qui est particulier (un individu précis dans une situation de détresse financière). Deuxième moment : la formulation de la maxime, qui généralise l'exemple (« quand je me crois à court d'argent… » vaut pour tout individu dans le même cas). Troisième moment, annoncé pour la suite : la loi universelle (« agis selon la maxime qui peut se concevoir comme loi universelle »), c'est elle qui permettra de comprendre la thèse. On passe donc du particulier au général, puis à l'universel."}, {"text": "Légal / légitime : le texte passe du légal au légitime.", "correct": false, "feedback": ""}, {"text": "Cause / conséquence : le texte passe des causes du mensonge à ses conséquences.", "correct": false, "feedback": ""}, {"text": "En acte / en puissance : le texte passe de la puissance morale à l'acte.", "correct": false, "feedback": ""}]}, {"type": "short", "name": "À quelle page du livre se trouve la définition du repère légal / légitime ? (répondez par le numéro)", "answers": ["528"], "feedback": "Page 528 : la définition du repère légal / légitime. Il faut aussi aller voir la fiche « Découvrir les repères » sur Pronote, où les repères du programme sont définis avec des exemples et un petit QCM pour chacun. Les repères sont un élément du programme : il faut apprendre à faire la différence entre légal (conforme à la loi) et légitime (conforme à une norme non juridique, par exemple morale), même si ces deux mots peuvent avoir des points communs."}], "comps": ["6.1"]};

var HELP_DEF = "## Comment fonctionne ce QCM ?\n\n**Déroulement.** Le QCM présente les questions une par une. Choisissez votre réponse puis cliquez sur **Valider** : un encart affiche alors « Réponse acceptée. » ou « Réponse incorrecte. » avec l'explication du cours. La barre de progression en haut indique votre avancement.\n\n**Types de questions.** Cinq formes possibles : choix unique (une seule bonne réponse), choix multiple (plusieurs bonnes réponses), réponse courte (tapez votre réponse, les variantes proches sont acceptées), association (relier chaque élément à sa définition) et texte à trous (complétez la phrase). Dans les questions à trous et les réponses courtes, la touche **Entrée** valide directement la réponse.\n\n**Écran de score.** À la fin, votre score s'affiche accompagné d'un bilan de votre performance : une appréciation d'ensemble, les types d'erreurs à corriger et deux conseils pour progresser.\n\n## L'écran « Revoir les réponses du QCM »\n\nDepuis l'écran de score, le bouton **Revoir les réponses du QCM** affiche le récapitulatif complet : pour chaque question, votre réponse, la bonne réponse mise en évidence et l'explication du cours.\n\n**Poser une question.** Sous chaque question du récapitulatif, le bouton **Poser une question** ouvre une recherche : la réponse est cherchée dans des sources en ligne (des pages consultées sont indiquées sous chaque réponse). Vous pouvez poser **plusieurs questions successives** : elles s'empilent les unes sous les autres et restent enregistrées dans le navigateur, même après avoir fermé la page. La touche Entrée envoie la question, le bouton **Réduire** referme la conversation.\n\n**Enregistrer.** Deux exports sont possibles :\n- **Enregistrer les questions et réponses (texte)** (en haut du récapitulatif) : enregistre uniquement les questions que vous avez posées et les réponses obtenues.\n- **Enregistrer mon résultat** (en bas de page) : enregistre tout votre résultat (chaque question, votre réponse, la réponse attendue, l'explication du cours) ainsi que toutes les questions posées et les réponses obtenues.\n\nLes fichiers obtenus sont des fichiers texte que vous pouvez conserver, imprimer ou consulter plus tard.\n\n## Apparence et navigation\n\n- Le menu défilant en haut à droite change l'apparence du QCM : plusieurs thèmes, dont le thème Pronote (par défaut) et un mode nuit. Votre choix est mémorisé par le navigateur.\n- Les deux boutons ronds à droite de l'écran permettent de **remonter tout en haut** (flèche du haut) ou de **descendre tout en bas** (flèche du bas) du QCM.\n- Chaque appareil dispose d'une **limite quotidienne d'utilisation** pour un QCM donné : au-delà, les recherches de réponses ne sont plus possibles jusqu'au lendemain, mais le QCM reste utilisable.";

function nbsp(s){return String(s).replace(/ ([;:!?])/g,'\u00A0$1').replace(/« /g,'«\u00A0').replace(/ »/g,'\u00A0»');}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function render(){

  var h='<div class="progwrap"><div class="progbar"></div></div>';
  h+='<div class="qnum">Question '+(st.i+1)+' sur '+Q.length+'</div>';
  if(q.type==='single'||q.type==='multi'){
    st.perm=shuffle(q.options.map(function(o,k){return k;}));
    h+='<p class="qtext">'+esc(q.name)+'</p>';
    st.perm.forEach(function(orig,d){
      h+='<label class="opt" id="opt'+d+'" style="animation-delay:'+(0.05+d*0.07)+'s"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="q" value="'+d+'" onchange="markSel()"> '+esc(q.options[orig].text)+'</label>';
    });
  }else if(q.type==='short'){
    h+='<p class="qtext">'+esc(q.name)+'</p><input type="text" id="shortin" placeholder="Votre réponse…" onkeydown="keyGo(event)">';
  }else if(q.type==='matching'){
    h+='<p class="qtext">'+esc(q.name)+'</p>';
    var pool=shuffle(q.pairs.map(function(p){return p.a;}));
    q.pairs.forEach(function(p,k){
      h+='<div style="margin:10px 0"><strong>'+esc(p.q)+'</strong><select class="pairsel" id="sel'+k+'"><option value="">— Choisir —</option>'+pool.map(function(a){return '<option>'+esc(a)+'</option>';}).join('')+'</select></div>';
    });
  }else if(q.type==='cloze'){
    h+='<p class="qtext" style="white-space:pre-wrap">';
    q.segs.forEach(function(s,k){
      if(s.t!==undefined){h+=esc(s.t);}else{h+='<span class="blank"><input type="text" id="cz'+k+'" onkeydown="keyGo(event)" style="min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"></span>';}

function norm(s){return (s||'').replace(/[\u00A0\u202F]/g,' ').toLowerCase().replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûùü]/g,'u').replace(/ç/g,'c').replace(/[''`’]/g,'').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').replace(/^ | $/g,'');}

  }else if(q.type==='matching'){

      document.getElementById('sel'+k).disabled=true;
    });
    ok=allOk;
    st.ans[st.i]={ok:ok,given:q.pairs.map(function(p,k){return document.getElementById('sel'+k).value;})};
    fb='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  }else if(q.type==='cloze'){
    var allOk2=true, wrongs=[];
    q.segs.forEach(function(s,k){
      if(s.blank===undefined)return;
      var gv=document.getElementById('cz'+k).value;
      var v2=norm(gv);
      if(!s.blank.some(function(a){return norm(a)===v2;})){allOk2=false;wrongs.push({k:k,gv:gv,blank:s.blank});}
      document.getElementById('cz'+k).disabled=true;
    });
    ok=allOk2;
    st.ans[st.i]={ok:ok,given:q.segs.map(function(s,k){return s.blank===undefined?null:document.getElementById('cz'+k).value;})};
    fb='La réponse complète : « '+q.segs.map(function(s){return s.blank!==undefined?s.blank[0]:s.t;}).join('')+' »';
    if(!ok&&wrongs.some(function(w){return norm(w.gv);})){pending=function(done){aiCheckCloze(st.i,wrongs,done);};}
  }
  if(pending){
    st.answered=true;
    card.insertAdjacentHTML('beforeend','<div class="fb ok" id="aichk">⏳ Vérification de votre réponse…</div>');
    pending(function(aiOk,extra){
      var el=document.getElementById('aichk'); if(el)el.remove();
      if(aiOk){ok=true;st.ans[st.i].ok=true;}
      finishValidate(ok,fb+(extra?'<br><br>'+extra:''));
    });
  }else{finishValidate(ok,fb);}
}
function finishValidate(ok,fb){
  if(ok)st.score++;
  st.answered=true;
  var h='<div class="fb '+(ok?'ok':'no')+'" style="animation-delay:.25s"><strong>'+(ok?'Réponse acceptée. ✅':'Réponse incorrecte. ✖')+'</strong><br>'+fb+'</div>';
  if(ok){
    var cols=['#2e7d32','#ffd166','#ef476f','#118ab2','#06d6a0','#f78c6b'];
    var conf='<div class="party">';
    for(var c=0;c<14;c++){conf+='<i style="left:'+(8+6*c)+'%;background:'+cols[c%cols.length]+';animation-delay:'+(c*0.025).toFixed(3)+'s"></i>';}
    h+=conf+'</div>';
    card.classList.add('cheer');
    var bt=document.createElement('div');bt.className='bigtick';bt.textContent='✅';
    document.body.appendChild(bt);
    setTimeout(function(){if(bt.parentNode)bt.parentNode.removeChild(bt);},900);
  }
  h+='<button class="ghost" onclick="redo()" style="margin-top:10px">← Refaire cette question</button> ';
  h+='<button onclick="next()">'+(st.i+1<QUIZ.questions.length?'Question suivante →':'Voir le score')+'</button>';
  card.insertAdjacentHTML('beforeend',h);
}
function redo(){
  var a=st.ans[st.i];
  if(a&&a.ok)st.score--;
  delete st.ans[st.i];
  render();
}
function cheatRandom(){
  st.score=0;
  QUIZ.questions.forEach(function(q,k){
    var ok=false, given=null;
    if(q.type==='single'){
      var j=Math.floor(Math.random()*q.options.length);
      given=[j]; ok=!!q.options[j].correct;
    }else if(q.type==='multi'){
      var nb=1+Math.floor(Math.random()*Math.min(3,q.options.length));
      var picks=shuffle(q.options.map(function(o,x){return x;})).slice(0,nb);
      var corr=q.options.filter(function(o){return o.correct;}).length;
      ok=picks.length===corr&&picks.every(function(x){return q.options[x].correct;});
      given=picks;
    }else if(q.type==='short'){
      if(Math.random()<0.5){given=q.answers[Math.floor(Math.random()*q.answers.length)];ok=true;}
      else{given=['réponse au hasard'][0];ok=false;}
    }else if(q.type==='matching'){
      var pool=shuffle(q.pairs.map(function(p){return p.a;}));
      given=pool;
      ok=q.pairs.every(function(p,x){return norm(pool[x])===norm(p.a);});
    }else if(q.type==='cloze'){
      given=[];ok=true;
      q.segs.forEach(function(s){
        if(s.blank===undefined){given.push(null);return;}
        if(Math.random()<0.6){given.push(s.blank[0]);}
        else{given.push('au hasard');ok=false;}
      });
    }
    st.ans[k]={ok:ok,given:given};
    if(ok)st.score++;
  });
  st.i=QUIZ.questions.length-1;
  st.answered=true;
  renderScore();
}

/* ---- Couche IA minimaliste (Ministral 3B, repli Mistral Small) ---- */
var MISTRAL_KEY='mstrl_rWaAuPNbjAcCqKNJDj7XjTiFhS3AdBds_2jbUGh';
var AI_MAX=10;
var AI_MODELS=['ministral-3b-latest','mistral-small-latest'];
/* ---- Markdown minimal pour les réponses de l'IA ---- */
function md(t){
  t=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/```[a-z]*\n?/g,'');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  t=t.replace(/^\s*[-•]\s+/gm,'• ');
  t=t.replace(/\n/g,'<br>');
  return nbsp(t);
}
/* ---- Quota IA quotidien, par élève et par QCM (sans connexion) ---- */
function lsGet(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return 'h'+(h>>>0).toString(36);}
function devId(){var d=lsGet('ai_dev','');if(!d){d=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));lsSet('ai_dev',d);}return d;}
var AI_IP='na';
try{fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(j){if(j&&j.ip)AI_IP=String(j.ip);}).catch(function(){});}catch(e){}

/* ---- Appel générique à l'IA (Ministral 3B, repli Mistral Small) ---- */
function aiCall(sys,usr,maxtok,temp,cb){
  if(quotaLeft()<=0){cb(null);return;}
  quotaUse();
  function call(model){
    return fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+MISTRAL_KEY},body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:maxtok,temperature:temp})});
  }
  call(AI_MODELS[0])
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok)return cb((res.j&&res.j.choices&&res.j.choices[0]&&res.j.choices[0].message&&res.j.choices[0].message.content)||null);
      var m=String((res.j&&res.j.message)||'');
      if(m.indexOf('model')>=0||m.indexOf('not found')>=0){
        return call(AI_MODELS[1]).then(function(r){return r.json();}).then(function(j){return cb((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||null);}).catch(function(){cb(null);});
      }
      cb(null);
    })
    .catch(function(){cb(null);});
}
/* ---- Analyse robuste du verdict JSON renvoyé pour une vérification ---- */
function aiVerdict(txt,n){
  var t=String(txt).replace(/```[a-z]*\n?/g,'').trim();
  var j=null; try{j=JSON.parse(t);}catch(e){}
  var arr=null,comment=null;
  if(j){
    comment=j.comment||null;
    if(comment&&typeof comment!=='string'){
      comment=(comment.text!==undefined&&typeof comment.text==='string')?comment.text:(comment.raison!==undefined&&typeof comment.raison==='string')?comment.raison:(comment.message!==undefined&&typeof comment.message==='string')?comment.message:null;
    }
    if(Array.isArray(j.ok))arr=j.ok;
    else if(typeof j.ok==='boolean')arr=[j.ok];
  }
  if(!arr){
    var m=t.match(/\[[\s\S]*?\]/);
    if(m){arr=m[0].slice(1,-1).split(',').map(function(x){return /true/i.test(x);});}
    else if(/"ok"\s*:\s*"?true"?/i.test(t))arr=[true];
    else if(/"ok"\s*:\s*"?false"?/i.test(t))arr=[false];
    var cm=t.match(/"comment"\s*:\s*"([^"]*)"/); if(cm)comment=cm[1];
  }
  if(arr&&n){while(arr.length<n)arr.push(false);arr=arr.slice(0,n);}
  return {ok:arr,comment:comment};
}
/* ---- Vérification IA des réponses courtes approximatives ---- */
function aiCheckText(k,given,answers,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var usr='Question du QCM : « '+q.name+' »\nRéponses attendues : '+answers.join(' ; ')+'\nRéponse de l\'élève : « '+given+' »\nCette réponse est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, article ou casse, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Ne refuse que si le sens est réellement différent ou si la réponse est vide. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":true,"comment":"une phrase très brève pour l\'élève"} ou {"ok":false,...}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,120,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,1);
    if(v.ok===null){
      aiCall('Réponds uniquement OUI ou NON, un seul mot, sans ponctuation.',usr+'\n\nRéponds uniquement par OUI (si la réponse de l\'élève est acceptable) ou NON.',10,0,function(t2){
        if(t2&&/oui|vrai|true/i.test(String(t2).toLowerCase()))done(true,null);
        else done(false,null);
      });
      return;
    }
    /* Aucun message ajouté après l'explication (pas de « Réponse acceptée : null ») */
    done(!!(v.ok&&v.ok[0]),null);
  });
}
/* ---- Vérification IA des textes à trous approximatifs ---- */
function aiCheckCloze(k,wrongs,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var list=wrongs.map(function(w,x){return 'Trou '+(x+1)+' — réponse de l\'élève : « '+w.gv+' » ; réponses attendues : '+w.blank.join(' ; ');}).join('\n');
  var usr='Texte à trous du QCM : « '+q.name+' »\n'+list+'\nPour chaque trou, la réponse de l\'élève est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Un trou laissé vide est toujours faux. Ne refuse que si le sens est réellement différent. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":[true ou false pour chaque trou dans l\'ordre], "comment": "une phrase très brève"}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,150,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,wrongs.length);
    if(!v.ok){
      aiCall('Réponds uniquement par une liste de mots OUI ou NON séparés par des virgules, un par trou, dans l\'ordre, sans autre texte.',usr+'\n\nRéponds uniquement par une liste de OUI ou NON séparés par des virgules, dans l\'ordre des trous.',20,0,function(t2){
        if(!t2){done(false,null);return;}
        var parts=String(t2).split(/[,;\n]/).map(function(x){return /oui|vrai|true/i.test(x.trim());});
        while(parts.length<wrongs.length)parts.push(false);
        var all=wrongs.every(function(w,x){return parts[x]===true;});
        done(all,null);
      });
      return;
    }
    var all=wrongs.length>0&&wrongs.every(function(w,x){return v.ok[x]===true;});
    done(all,null);
  });
}
/* ---- Bilan IA de fin de QCM ---- */
function aiBilan(){
  try{if(!navigator.onLine){bilanFallback();return;}}catch(e){}

  }).join('\n');
  var sys='Tu es un professeur de philosophie au lycée. Rédige un bilan de révision pour un élève de terminale, en français : un mot d\'ensemble sur sa performance, le ou les types d\'erreurs observés, puis 2 conseils précis pour progresser. 150 mots maximum. STYLE IMPERSONNEL OBLIGATOIRE : ne jamais t\'adresser à l\'élève, ni « tu » ni « vous » ni impératifs ; employer des tournures neutres du type « Le score obtenu montre… », « Les erreurs portent sur… », « Il convient de… », « Il serait utile de… ». Markdown simple autorisé (**gras**, listes).';
  var usr='Score : '+st.score+'/'+n+'\nDétail question par question :\n'+det;

/* Enregistre toutes les questions-réponses de l'écran de révision en fichier texte */
function saveChat(){
  var lines=[QUIZ.title+(QUIZ.sub?' — '+QUIZ.sub:''),'Questions posées et réponses obtenues',''];

      lines.push(t);

/* Convertit le markdown des réponses en texte brut pour les exports texte */
function mdPlain(t){
  return String(t).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)').replace(/\*\*/g,'').replace(/^\s*#+\s*/gm,'').replace(/^\s*[-*]\s+/gm,'- ').replace(/^\s*•\s+/gm,'- ');
}

function aiContext(k){

/* ---- Recherche internet de sources académiques pour les questions des élèves ---- */
/* Sites et sources exclusivement français */
function isFrUrl(u){
  u=String(u||'');
  return /^https?:\/\/[^\/]*\.fr(\/|$)/i.test(u)||/fr\.wikipedia\.org|cairn\.info|cairn\.fr|openedition\.org|revues\.org|philomag\.com|hal\.science|erudit\.org|classiques\.uqac\.ca|le-philosophe\.|la-philosophie\.fr|noes\.|persee\.fr|universalis\.fr|lemonde\.fr|lemonde\.com/i.test(u);
}
function aiSearch(q){
  var terms=(q+' '+QUIZ.title).replace(/[«»"]/g,'').slice(0,200);
  function wiki(){
    return fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(terms)+'&srlimit=2&format=json&origin=*')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.query&&j.query.search)||[];
        return hits.map(function(h){return '« '+h.title+' » (Wikipedia : https://fr.wikipedia.org/wiki/'+encodeURIComponent(h.title)+')';}).join('\n');
      }).catch(function(){return '';});
  }
  function openalex(){
    return fetch('https://api.openalex.org/works?search='+encodeURIComponent(terms)+'&per-page=5&language=fre&mailto=prof.c2phi.fr@gmail.com')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.results)||[];
        return hits.filter(function(w){return w.title;}).map(function(w){
          var url=w.doi?w.doi:(w.id||'');
          var auth=w.authorships&&w.authorships[0]&&w.authorships[0].author&&w.authorships[0].author.display_name;
          return '« '+w.title+' »'+(w.publication_year?(' ('+w.publication_year+')'):'')+(auth?(' — '+auth):'')+' (source académique : '+url+')';
        }).join('\n');
      }).catch(function(){return '';});
  }
  function ddg(){
    return fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(terms)+'&kl=fr-fr&format=json&no_html=1&skip_disambig=1')
      .then(function(r){return r.json();})
      .then(function(j){
        var out=[];
        var topics=(j&&(j.RelatedTopics||[]))||[];
        topics.forEach(function(t){
          var u=t.FirstURL||(t.topics&&t.topics[0]&&t.topics[0].FirstURL);
          var x=t.Text||(t.topics&&t.topics[0]&&t.topics[0].Text);
          if(u&&x&&/https?:/.test(u)&&isFrUrl(u))out.push('« '+String(x).split(' - ')[0].slice(0,90)+' » ('+u+')');
        });
        return out.slice(0,3).join('\n');
      }).catch(function(){return '';});
  }
  return Promise.all([openalex(),wiki(),ddg()]).then(function(r){
    var lines=(r[0]+'\n'+r[1]+'\n'+r[2]).split('\n');
    /* OpenAlex : ne conserver que les œuvres en français dont le lien est un site français ou un DOI */
    lines=lines.filter(function(l){return l&&(/doi\.org|source académique/.test(l)?(/doi\.org/.test(l)||isFrUrl(l)):isFrUrl(l)||/Wikipedia : https:\/\/fr\.wikipedia\.org/.test(l));});
    return lines.slice(0,7).join('\n');
  }).catch(function(){return '';});
}
function aiSourcesLinks(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7).map(function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';}).join('<br>');
}
function chatUrls(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7);
}
function aiAsk(k){
  if(st.ai>=AI_MAX){document.getElementById('aibox'+k).innerHTML=aiChatHtml(k)+'<div class="fb no">Limite de '+AI_MAX+' questions par session atteinte.</div>';return;}
  var q=document.getElementById('aiq'+k).value.trim();
  if(!q)return;
  var b=document.getElementById('aibox'+k);
  if(quotaLeft()<=0){b.innerHTML=aiChatHtml(k)+'<div class="fb no">Limite quotidienne d\'utilisation atteinte pour ce QCM.</div>';return;}
  b.innerHTML=aiChatHtml(k)+'<div class="fb ok" id="aistat'+k+'">🔎 Recherche de sources…</div>';
  st.ai++;
  aiSearch(q).then(function(sources){
    var el=document.getElementById('aistat'+k); if(el)el.innerHTML='⏳ Recherche d\'une réponse…';
    var sys='Tu es un professeur de philosophie au lycée. Réponds en français, en 120 mots maximum, de façon claire et pédagogique. Fonde-toi d\'abord sur l\'explication de la séance fournie ; tu peux la compléter avec les sources trouvées sur internet ci-dessous : sources académiques (articles, DOI) et sites sérieux sur le sujet (encyclopédies, universités, ressources de référence). Si tu t\'appuies sur une source, cite-la explicitement entre parenthèses (auteur ou site, titre) et donne le lien exact de la page consultée. Markdown simple autorisé (**gras**, listes, [libellé](https://lien)).';
    var usr=aiContext(k)+'\n\nSources trouvées sur internet :\n'+(sources||'(aucune source trouvée)')+'\n\nQuestion de l\'élève : '+q;
    aiCall(sys,usr,300,0.3,function(txt){
      if(txt){
        var a=loadChat(k);
        a.push({q:q,a:txt,urls:chatUrls(sources)});
        lsSet('chat_'+qid()+'_'+k,JSON.stringify(a));
        b.innerHTML=aiChatHtml(k)+aiInput(k);
      }
      else{b.innerHTML=aiChatHtml(k)+'<div class="fb no">Impossible de répondre pour le moment (connexion). Reformulez ou réessayez plus tard.</div>'+aiInput(k);}
    });
  });
}

function applyEdit(){
  QUIZ.title=document.getElementById('etitle').value||QUIZ.title;
  var nh=document.getElementById('ehelp');
  if(nh){HELP=nh.value;lsSet('qcm_help_'+qid(),HELP);}
  document.getElementById('qtitle').textContent=QUIZ.title;
  document.title=QUIZ.title;
  QUIZ.sub=document.getElementById('esub').value||'';
  document.getElementById('qsub').textContent=QUIZ.sub;
  QUIZ.questions.forEach(function(q,k){
    if(q.type==='single'||q.type==='multi'){
      q.name=document.getElementById('eq'+k).value;
      q.options.forEach(function(o,j){
        o.text=document.getElementById('eo'+k+'_'+j).value;
        o.correct=!!document.getElementById('ec'+k+'_'+j).checked;
        o.feedback=document.getElementById('ef'+k+'_'+j).value;
      });
    }else if(q.type==='short'){
      q.name=document.getElementById('eq'+k).value;
      q.answers=document.getElementById('ea'+k).value.split(';').map(function(s){return s.trim();}).filter(Boolean);
      q.feedback=document.getElementById('ef'+k).value;
    }else if(q.type==='matching'){
      q.name=document.getElementById('eq'+k).value;
      q.pairs.forEach(function(p,j){
        p.q=document.getElementById('epq'+k+'_'+j).value;
        p.a=document.getElementById('epa'+k+'_'+j).value;
      });
    }else{
      var raw=document.getElementById('eq'+k).value;
      var segs=[],i=0,re=/\{1:(?:SHORTANSWER|MULTICHOICE|NUMERICAL):([^}]*)\}/g,m;
      while((m=re.exec(raw))!==null){
        if(m.index>i)segs.push({t:raw.slice(i,m.index)});
        segs.push({blank:m[1].split(/~~|~/).map(function(a){return a.replace(/^=/,'').trim();})});
        i=re.lastIndex;
      }
      if(i<raw.length)segs.push({t:raw.slice(i)});
      q.segs=segs;
    }
  });
  document.getElementById('editor').classList.add('hidden');
  st.i=Math.min(st.i,QUIZ.questions.length-1);st.score=0;st.clicks=[];render();
}
/* Nom de fichier des téléchargements : ClasseMoisJour-Notion (ex. TG51116-ImperatifCategorique.html).
   Classe extraite du sous-titre ou du titre ; mois et jour extraits de la date de la séance
   dans le sous-titre (sinon date du jour) ; notion = dernière partie du titre, sans accents,
   sans petits mots (l', le, de, …), chaque mot commençant par une majuscule. */
function dlBase(){
  var t=QUIZ.title||'qcm',sub=QUIZ.sub||'';
  var m=sub.match(/([A-Z]{2,4}\d(?:\/[A-Z]{2,4}\d)*)/)||t.match(/([A-Z]{2,4}\d)/);
  var cls=m?m[1].replace(/[^A-Za-z0-9]/g,''):'';
  var mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var dm=sub.toLowerCase().match(/(\d{1,2})(?:er)?\s+([a-zéû]+)/);
  var mo=dm?mois.indexOf(dm[2]):-1,mmdd;
  if(dm&&mo>=0){mmdd=('0'+(mo+1)).slice(-2)+('0'+parseInt(dm[1],10)).slice(-2);}
  else{var d=new Date();mmdd=('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
  var notion=t.split(/ : | - | — /).pop().trim();
  var stop={l:1,d:1,n:1,s:1,j:1,le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,a:1,au:1,aux:1,et:1,en:1,y:1,ce:1,cet:1,cette:1,que:1,qui:1,est:1,il:1,elle:1,on:1,comme:1,autre:1,autres:1};
  var slug=notion.replace(/[\u0027\u2019]/g,' ');
  try{slug=slug.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  slug=slug.split(/[^A-Za-z0-9]+/).filter(function(w){return w&&!stop[w.toLowerCase()];}).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');
  if(!slug)slug=t.replace(/[^A-Za-z0-9]/g,'')||'qcm';
  return (cls?cls:'')+mmdd+'-'+slug;
}

/* Enregistre la page HTML complète avec le QCM modifié :
   exige que la déclaration « var QUIZ = {...}; » occupe une ligne unique. */
function downloadHtml(){
  applyEdit();
  var sc=document.getElementsByTagName('script'),si=-1;
  for(var i=0;i<sc.length;i++){if(sc[i].textContent.indexOf('var QUIZ = ')>=0){si=i;break;}}
  if(si<0){alert('Enregistrement impossible : script du QCM introuvable.');return;}
  var lines=sc[si].textContent.split('\n'),done=false;
  for(var L=0;L<lines.length;L++){
    if(lines[L].indexOf('var QUIZ = ')===0){lines[L]='var QUIZ = '+JSON.stringify(QUIZ)+';';done=true;break;}
  }
  if(!done){alert('Enregistrement impossible : la déclaration du QCM doit rester sur une ligne unique.');return;}
  for(var L2=0;L2<lines.length;L2++){
    if(lines[L2].indexOf('var HELP_DEF = ')===0){lines[L2]='var HELP_DEF = '+JSON.stringify(HELP)+';';break;}
  }
  var clone=document.documentElement.cloneNode(true);
  clone.getElementsByTagName('script')[si].textContent=lines.join('\n');
  var c=clone.querySelector('#quizcard'); if(c)c.innerHTML='';
  var ed=clone.querySelector('#editor'); if(ed){ed.classList.add('hidden');var ep=clone.querySelector('#editpanel');if(ep)ep.innerHTML='';}
  var blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
