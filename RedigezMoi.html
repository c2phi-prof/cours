<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RédigezMoi — Atelier d'aide à la rédaction (dissertation, explication de texte, essai)</title>
<style>
:root{
  --bg:#ffffff;
  --card:#fafafa;
  --ink:#333333;
  --acc:#006400;
  --acc2:#4a9d4a;
  --ok:#2e7d32;
  --bad:#b03030;
  --line:#c9c9c9;
  --font:Arial,Helvetica,'Segoe UI',sans-serif;
  --shadow:rgba(0,0,0,.08);
  --papier:#ffffff;
  --taille-corps:18px;
  --interligne:1.72;
}
body[data-theme="pronote"]{--bg:#ffffff;--card:#fafafa;--ink:#333333;--acc:#006400;--acc2:#4a9d4a;--ok:#2e7d32;--bad:#b03030;--line:#c9c9c9;--font:Arial,Helvetica,'Segoe UI',sans-serif;--shadow:rgba(0,0,0,.08);--papier:#ffffff}
body[data-theme="moderne"]{--bg:#eaf2fb;--card:#ffffff;--ink:#1b2a3a;--acc:#1c5d99;--acc2:#3f8fd6;--ok:#1e7a46;--bad:#c0392b;--line:#c4d4e8;--font:Verdana,Geneva,sans-serif;--shadow:rgba(28,93,153,.15);--papier:#ffffff}
body[data-theme="machine"]{--bg:#e6e6e2;--card:#f7f7f2;--ink:#222222;--acc:#0a6b3c;--acc2:#0e8f54;--ok:#0a6b3c;--bad:#b03030;--line:#b8b8ae;--font:'Courier New',Courier,monospace;--shadow:rgba(0,0,0,.12);--papier:#fdfdf9}
body[data-theme="manuscrit"]{--bg:#f0e6d6;--card:#fbf3e4;--ink:#3b2f1e;--acc:#7a5b1e;--acc2:#a3823a;--ok:#4e6b2f;--bad:#8f3a2a;--line:#d9c9a8;--font:Georgia,'Times New Roman',serif;--shadow:rgba(90,70,40,.15);--papier:#fdf9f0}
body[data-theme="nuit"]{--bg:#12141a;--card:#1c1f28;--ink:#e8e6e0;--acc:#7fa8ff;--acc2:#a8c2ff;--ok:#7fd695;--bad:#ff8a8a;--line:#343947;--font:'Segoe UI',Helvetica,Arial,sans-serif;--shadow:rgba(0,0,0,.5);--papier:#181b23}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  transition:background .3s,color .3s;
}

#plateau{
  display:flex;
  width:100%;
  min-height:100vh;
  align-items:stretch;
}

/* ---------- Colonne de gauche : La Feuille ---------- */
#feuille{
  position:relative;
  flex:1 1 56%;
  min-width:0;
  min-height:100vh;
  background:var(--papier);
  border-right:1px solid var(--line);
  padding:42px 54px 72px 58px;
  cursor:text;
}
#regle-h,#regle-v{position:absolute;user-select:none;pointer-events:none;color:var(--ink);opacity:.32}
#regle-h{top:10px;left:58px;right:126px;height:16px}
#regle-v{left:12px;top:42px;bottom:42px;width:16px}
.graduation{position:absolute;background:currentColor}
#regle-h .graduation{bottom:0;width:1px;height:5px}
#regle-h .graduation.majeure{height:9px}
#regle-v .graduation{right:0;height:1px;width:5px}
#regle-v .graduation.majeure{width:9px}
.nombre{position:absolute;font-size:8px;transform:translateX(-50%)}

#commandes-historique{
  position:absolute;
  top:7px;
  right:54px;
  display:flex;
  gap:4px;
  z-index:20;
  user-select:none;
}
#commandes-historique button{
  width:24px;
  height:22px;
  margin:0;
  padding:0;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:4px;
  font-family:var(--font);
  font-size:12px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
#commandes-historique button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#commandes-historique button:disabled{opacity:.35;cursor:default}

#bloc-titre-sujet{
  position:relative;
  width:100%;
  margin-bottom:16px;
  user-select:none;
}
.btn-titre-pleine-ligne{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--acc);
  border-radius:6px;
  padding:14px 18px;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink);
}
.btn-titre-pleine-ligne:hover{border-color:var(--acc)}
.btn-titre-pleine-ligne .texte-titre{
  font-size:1.35em;
  font-weight:700;
  line-height:1.3;
  color:var(--acc);
  flex:1;
}
.btn-titre-pleine-ligne .fleche-titre{
  font-size:1.1em;
  color:var(--acc);
  font-weight:700;
}
#liste-sujets-generes{
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:0;
  z-index:35;
  background:var(--papier);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 10px 28px var(--shadow);
  max-height:62vh;
  overflow-y:auto;
}
#liste-sujets-generes[hidden]{display:none}
.option-sujet{
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink);
  display:block;
}
.option-sujet:last-child{border-bottom:none}
.option-sujet:hover{background:color-mix(in srgb,var(--acc) 8%,var(--papier))}
.option-sujet.actif{background:color-mix(in srgb,var(--acc) 12%,var(--papier));border-left:4px solid var(--acc)}
.option-sujet .intitule-sujet{font-size:1em;font-weight:700;line-height:1.35;display:block}

details.extrait-doc{
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--acc);
  padding:10px 14px;
  margin-bottom:22px;
  border-radius:0 5px 5px 0;
  font-size:.88em;
  line-height:1.55;
  color:var(--ink);
}
details.extrait-doc summary{
  cursor:pointer;
  font-weight:700;
  color:var(--acc);
  user-select:none;
}
.grille-support{
  display:flex;
  gap:16px;
  margin-top:12px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.bloc-video-mini{
  flex:0 0 280px;
  width:280px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.cadre-player{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  border:1px solid var(--line);
}
.cadre-player iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
.vignette-repli{
  position:relative;
  width:100%;
  height:100%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#181818;
}
.vignette-repli img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.vignette-repli .btn-play-overlay{
  position:absolute;
  width:46px;
  height:32px;
  border-radius:8px;
  background:rgba(0,0,0,.78);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  border:1px solid rgba(255,255,255,.35);
}
.vignette-repli:hover .btn-play-overlay{background:var(--acc)}
.controles-timestamps{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.btn-ts{
  background:var(--papier);
  border:1px solid var(--line);
  border-radius:4px;
  padding:2px 6px;
  font-family:inherit;
  font-size:.78em;
  color:var(--acc);
  font-weight:700;
  cursor:pointer;
}
.btn-ts:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.bloc-texte-support{flex:1 1 240px;min-width:0}
.bloc-texte-support blockquote{font-style:italic;margin-bottom:8px}
.lien-source-yt{
  display:inline-block;
  font-size:.82em;
  color:var(--acc);
  text-decoration:none;
  border-bottom:1px dotted var(--acc);
}

#editeur-km{
  position:relative;
  outline:none;
  min-height:58vh;
  font-size:var(--taille-corps);
  line-height:var(--interligne);
  color:var(--ink);
  caret-color:transparent;
  white-space:pre-wrap;
  word-wrap:break-word;
}
#editeur-km p{margin:0 0 .9em;text-indent:1.25em}
#curseur-bloc{
  position:absolute;
  width:10px;
  height:1.12em;
  background:var(--acc);
  opacity:.82;
  pointer-events:none;
  z-index:15;
  animation:curseurCarre 1s steps(1,end) infinite;
  display:none;
}
@keyframes curseurCarre{0%,49%{opacity:.82}50%,100%{opacity:0}}
.insertion-fraiche{
  background:color-mix(in srgb,var(--acc) 16%,var(--papier));
  border-radius:2px;
  transition:background 1.4s ease;
}

/* ---------- Colonne de droite ---------- */
#volet-droit{
  flex:1 1 44%;
  min-width:340px;
  min-height:100vh;
  background:var(--bg);
  padding:18px 22px 48px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.entete-volet-droit{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

#zone-cascade-tags{
  flex:1;
  min-height:40px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#cascade-liste{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:240px;
  overflow-y:auto;
  padding-right:4px;
}
.strate-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  transition:opacity .35s ease;
}
.tag-nuage{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:5px 11px;
  font-family:var(--font);
  font-size:.86em;
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
}
.tag-nuage:hover{border-color:var(--acc)}
.tag-nuage.selectionne{
  background:var(--acc);
  color:#ffffff;
  border-color:var(--acc);
  font-weight:700;
}
.actions-cascade{display:flex;gap:8px;align-items:center}
#btn-selectionner-tags{
  margin:0;
  background:var(--acc);
  color:#ffffff;
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-family:var(--font);
  font-size:.85em;
  font-weight:700;
  cursor:pointer;
}
#btn-deselectionner-tags{
  margin:0;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 10px;
  font-family:var(--font);
  font-size:.82em;
  cursor:pointer;
}

.actions-droite-haut{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.badge-google{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 12px 5px 8px;
  border-radius:18px;
  border:1px solid var(--line);
  background:var(--card);
  font-size:.82em;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  max-width:225px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.badge-google:hover{border-color:var(--acc);color:var(--acc)}
.badge-google .point-g{
  width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;
}
.badge-google.connecte{border-color:var(--ok)}
.badge-google.connecte .point-g{background:var(--ok)}
.badge-google.syncing .point-g{background:#e09f1f}

button.burgerbtn{
  margin:0;
  width:38px;
  height:38px;
  flex-shrink:0;
  padding:0;
  border-radius:9px;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  font:700 1.15em/1 var(--font);
  cursor:pointer;
  box-shadow:0 1px 4px var(--shadow);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
button.burgerbtn:hover{border-color:var(--acc);color:var(--acc)}

.menuwrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:60;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  padding:56px 18px 18px;
  overflow:auto;
}
.menubox{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:14px;
  min-width:265px;
  max-width:320px;
  padding:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  font-family:var(--font);
}
.menubox .mtitle{
  font-weight:700;
  padding:8px 12px 6px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:8px;
}
.menubox button{
  display:flex;
  width:100%;
  margin:0;
  background:transparent;
  color:var(--ink);
  border:none;
  border-radius:8px;
  padding:10px 12px;
  font-size:.92em;
  text-align:left;
  align-items:center;
  gap:10px;
  cursor:pointer;
}
.menubox button:hover{
  background:color-mix(in srgb,var(--acc) 10%,var(--card));
  color:var(--acc);
}
.menubox .mic{width:20px;text-align:center;font-weight:700}

/* ---------- Carte QCM ---------- */
#zone-qcm-wrapper{display:flex;flex-direction:column;gap:10px}
#zone-qcm-wrapper[hidden]{display:none}
.barre-qcm-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini-tags-qcm{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.mini-tag{
  font-size:.74em;
  padding:2px 7px;
  border-radius:10px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  opacity:.85;
}
.mini-tag.actif{border-color:var(--acc);color:var(--acc);font-weight:700;opacity:1}
.nav-qcm-btns{display:flex;align-items:center;gap:4px}
.nav-qcm-btns button{
  margin:0;padding:4px 9px;font-size:.82em;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:5px;cursor:pointer;
}
.nav-qcm-btns button:hover{border-color:var(--acc);color:var(--acc)}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px 22px 22px;
  box-shadow:0 3px 10px var(--shadow);
  animation:cardIn .45s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}

.qcm-header-graphique{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.qcm-header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.qcm-titre-court{
  font-size:1.02em;
  font-weight:700;
  color:var(--acc);
  line-height:1.25;
  flex:1;
}
.qcm-actions-header{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.badge-cat-graphique{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:12px;
  font-size:.74em;
  font-weight:700;
  letter-spacing:.02em;
  background:color-mix(in srgb,var(--cat-color,var(--acc)) 14%,var(--papier));
  color:var(--cat-color,var(--acc));
  border:1px solid color-mix(in srgb,var(--cat-color,var(--acc)) 45%,transparent);
}
.badge-cat-graphique .dot-cat{
  width:7px;height:7px;border-radius:50%;background:var(--cat-color,var(--acc));
}
.btn-favori-qcm{
  margin:0 !important;
  padding:3px 9px !important;
  border-radius:12px !important;
  font-size:.8em !important;
  font-weight:700 !important;
  background:var(--papier) !important;
  color:var(--ink) !important;
  border:1px solid var(--line) !important;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:all .18s ease;
}
.btn-favori-qcm:hover{
  border-color:#e09f1f !important;
  color:#b87d0a !important;
}
.btn-favori-qcm.actif{
  background:#fff8e6 !important;
  border-color:#e09f1f !important;
  color:#b87d0a !important;
}

.jauge-segments{
  display:flex;
  align-items:center;
  gap:4px;
  width:100%;
  height:7px;
}
.segment-prog{
  flex:1;
  height:100%;
  border-radius:4px;
  background:var(--line);
  cursor:pointer;
  transition:background .3s ease,transform .15s ease;
}
.segment-prog:hover{transform:scaleY(1.35)}
.segment-prog.fait-ok{background:var(--ok)}
.segment-prog.fait-ko{background:var(--bad)}
.segment-prog.courant{background:var(--cat-color,var(--acc));box-shadow:0 0 0 1px color-mix(in srgb,var(--cat-color,var(--acc)) 40%,transparent)}

.bloc-copiable{position:relative;padding-right:30px}
.btn-inserer-curseur{
  position:absolute;top:4px;right:4px;width:22px;height:22px;margin:0 !important;padding:0 !important;
  border-radius:4px !important;background:transparent !important;color:var(--ink) !important;
  border:1px solid transparent !important;font-size:13px !important;line-height:1 !important;
  opacity:.32;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.bloc-copiable:hover .btn-inserer-curseur{opacity:.95;color:var(--acc) !important;border-color:var(--line) !important;background:var(--papier) !important}
.btn-inserer-curseur:hover{background:var(--acc) !important;color:#ffffff !important;border-color:var(--acc) !important}

.qtext{font-size:1.08em;margin:0 0 14px;line-height:1.5}
label.opt,div.opt{
  display:block;border:1px solid var(--line);border-radius:5px;
  padding:10px 34px 10px 12px;margin:8px 0;cursor:pointer;line-height:1.4;
}
label.opt.sel,div.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
label.opt.good,div.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
label.opt.bad,div.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}

input[type=text],input[type=email]{
  font-family:var(--font);font-size:1em;color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;background:var(--card);
}
.blank input{display:inline-block;min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
select.pairsel{width:100%;margin:6px 0;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-family:var(--font)}

.card button:not(.btn-inserer-curseur):not(.btn-favori-qcm):not(.btn-demander-ia){
  font-family:var(--font);font-size:1em;font-weight:bold;background:var(--acc);color:#fff;
  border:none;border-radius:6px;padding:11px 24px;cursor:pointer;margin-top:14px;
}
.card button.ghost{background:var(--ink)}

.fb{
  margin-top:14px;padding:12px 34px 12px 14px;border-radius:9px;line-height:1.5;font-size:.95em;
}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid var(--bad)}

/* ---------- Barre de recherche IA minimaliste ---------- */
.barre-recherche-ia{
  margin-top:10px;
  display:flex;
  gap:6px;
  align-items:stretch;
}
.barre-recherche-ia input[type="text"]{
  flex:1;
  min-width:0;
  padding:7px 10px !important;
  font-size:.9em !important;
  border-radius:6px !important;
  background:var(--papier) !important;
}
.barre-recherche-ia input[type="text"]:disabled{
  opacity:.65;
  cursor:not-allowed;
}
button.btn-demander-ia{
  margin:0 !important;
  padding:7px 14px !important;
  font-family:var(--font) !important;
  font-size:.88em !important;
  font-weight:700 !important;
  background:var(--acc) !important;
  color:#ffffff !important;
  border:none !important;
  border-radius:6px !important;
  cursor:pointer;
  white-space:nowrap;
}
button.btn-demander-ia:hover:not(:disabled){
  background:var(--acc2) !important;
}
button.btn-demander-ia:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.reponse-ia-simple{
  margin-top:8px;
  padding:10px 12px;

function norm(s){
  return String(s||"")
    .replace(/[\u00A0\u202F]/g," ")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[''`’]/g," ")
    .replace(/[^a-z0-9 -]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function extraireTokensSignificatifs(texte){
  const mots = String(texte||"").match(/[A-Za-zÀ-ÖØ-öø-ÿ-]{4,}/g) || [];
  const res = [];
  mots.forEach(m => {
    const clean = m.toLowerCase();
    const n = norm(clean);
    if(n.length >= 4 && !STOPWORDS.has(n)){
      res.push({ label: clean, radical: n.slice(0, 6) });
    }
  });
  return res;
}

function construireIndexTags(baseQCM, transcript){
  const map = new Map();
  baseQCM.forEach(qcm => {
    const sources = [qcm.name];
    if(Array.isArray(qcm.options)){
      qcm.options.forEach(o => { if(o.correct) sources.push(o.text, o.feedback || ""); });
    }
    if(Array.isArray(qcm.answers)) sources.push(qcm.answers.join(" "), qcm.feedback || "");
    if(Array.isArray(qcm.pairs)) qcm.pairs.forEach(p => sources.push(p.q, p.a));
    if(Array.isArray(qcm.segs)) qcm.segs.forEach(s => sources.push(s.t || (s.blank ? s.blank.join(" ") : "")));

    sources.forEach((src, sIdx) => {
      extraireTokensSignificatifs(src).forEach(t => {
        if(!map.has(t.radical)){
          map.set(t.radical, { radical: t.radical, label: t.label, poids: 0, qcmIds: new Set() });
        }
        const entry = map.get(t.radical);
        entry.poids += (sIdx === 0 ? 2 : 3);
        entry.qcmIds.add(qcm.id);
        if(t.label.length < entry.label.length) entry.label = t.label;
      });
    });
  });

  if(Array.isArray(transcript)){
    transcript.forEach(seg => {
      const normSeg = norm(seg.s);
      map.forEach(entry => { if(normSeg.includes(entry.radical)) entry.poids += 1; });
    });
  }
  return Array.from(map.values()).sort((a, b) => b.poids - a.poids);
}

function genererSujetsDepuisQCM(baseQCM){
  const sujets = [];
  const vus = new Set();

  function ajouterSujet(id, titre, qcmIds, attendusTexte){
    const cle = norm(titre);
    if(!cle || vus.has(cle)) return;
    vus.add(cle);
    const motsCles = Array.from(new Set(extraireTokensSignificatifs(attendusTexte).map(t => t.radical)));
    sujets.push({ id, titre, qcmIds, motsCles });
  }

  if(baseQCM.length >= 2){
    const tousIds = baseQCM.map(q => q.id);
    const toutCorpus = baseQCM.map(q => q.name + " " + (q.options ? (q.options.find(o => o.correct)?.feedback || "") : "")).join(" ");
    ajouterSujet("s-principal", "L'homme vaut-il plus qu'un animal ?", tousIds, toutCorpus);
  }

  const parScenario = new Map();
  baseQCM.forEach(q => {
    const sc = q.scenario || "Parcours général";
    if(!parScenario.has(sc)) parScenario.set(sc, []);
    parScenario.get(sc).push(q);
  });
  parScenario.forEach((qs, nomSc) => {
    const ids = qs.map(x => x.id);
    const corpus = qs.map(x => x.name + " " + (x.options ? (x.options.find(o => o.correct)?.text || "") : "")).join(" ");
    const titreCourt = nomSc.replace(/^Scénario \d+\s*—\s*/i, "");
    ajouterSujet(`s-sc-${ids[0]}`, `${titreCourt} : quelle place pour l'animal dans notre communauté morale et politique ?`, ids, corpus);
  });

  baseQCM.forEach((q, idx) => {
    let bonneRep = "", explication = "";
    if(Array.isArray(q.options)){
      const b = q.options.find(o => o.correct) || q.options[0];
      bonneRep = b ? b.text : "";
      explication = b ? (b.feedback || "") : "";
    } else if(Array.isArray(q.answers)){
      bonneRep = q.answers[0] || "";
      explication = q.feedback || "";
    } else if(Array.isArray(q.pairs)){
      bonneRep = q.pairs.map(p => `${p.q} : ${p.a}`).join(" ; ");
    }

    const corpus = `${q.name} ${bonneRep} ${explication}`;
    const titrePropre = q.name.replace(/\s*\([0-9: –-]+\)/g, "").replace(/\s*\(plusieurs réponses\)/gi, "");
    ajouterSujet(`s-q-${idx}`, titrePropre, [q.id], corpus);

    if(bonneRep && q.type !== "matching"){
      const prop = bonneRep.charAt(0).toLowerCase() + bonneRep.slice(1).replace(/\.$/, "");
      ajouterSujet(`s-d-${idx}`, `Peut-on soutenir que ${prop} ?`, [q.id], corpus);
    }
    if(explication){
      const premierePhrase = explication.split(/[.!?]/)[0].trim();
      if(premierePhrase.length > 25){
        ajouterSujet(`s-e-${idx}`, `Expliquez et discutez : « ${premierePhrase}. »`, [q.id], corpus);
      }
    }
  });

  for(let i = 0; i < baseQCM.length - 1; i++){
    const q1 = baseQCM[i], q2 = baseQCM[i + 1];
    const t1 = extraireTokensSignificatifs(q1.name).slice(0, 2).map(x => x.label).join(" et ");
    const t2 = extraireTokensSignificatifs(q2.name).slice(0, 2).map(x => x.label).join(" et ");
    if(t1 && t2){
      const b1 = q1.options ? (q1.options.find(o => o.correct)?.text || "") : "";
      const b2 = q2.options ? (q2.options.find(o => o.correct)?.text || "") : "";
      ajouterSujet(`s-x-${i}`, `Quel rapport établir entre ${t1} et ${t2} ?`, [q1.id, q2.id], `${q1.name} ${b1} ${q2.name} ${b2}`);
    }
  }
  return sujets;
}

function placerCurseurBloc(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || document.activeElement !== editeur){
    curseurBloc.style.display = "none";
    return;
  }
  const range = sel.getRangeAt(0);
  if(!editeur.contains(range.commonAncestorContainer)){
    curseurBloc.style.display = "none";
    return;
  }
  const clone = range.cloneRange();
  clone.collapse(true);
  let rect = clone.getBoundingClientRect();

  if(!rect || (rect.width === 0 && rect.height === 0)){
    const repere = document.createElement("span");
    repere.textContent = "\u200B";
    clone.insertNode(repere);
    rect = repere.getBoundingClientRect();
    repere.remove();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  const feuilleRect = feuille.getBoundingClientRect();
  curseurBloc.style.left = (rect.left - feuilleRect.left) + "px";
  curseurBloc.style.top = (rect.top - feuilleRect.top) + "px";
  curseurBloc.style.display = "block";
}

function insererAuCurseur(texteBrut){
  const propre = String(texteBrut || "").replace(/\s+/g, " ").trim();
  if(!propre) return;

  enregistrerSnapshot(true);
  editeur.focus();
  const sel = window.getSelection();
  let range = derniereSelectionRange;

  if(!range || !editeur.contains(range.commonAncestorContainer)){
    range = document.createRange();
    range.selectNodeContents(editeur);
    range.collapse(false);
  }

  sel.removeAllRanges();
  sel.addRange(range);

  let prefixe = "";
  const sc = range.startContainer;
  const so = range.startOffset;
  if(sc.nodeType === Node.TEXT_NODE && so > 0){
    const ch = sc.textContent[so - 1];
    if(ch && !/\s/.test(ch)) prefixe = " ";
  }

  const span = document.createElement("span");
  span.className = "insertion-fraiche";
  span.textContent = prefixe + propre + " ";

  range.deleteContents();
  range.insertNode(span);

  const apres = document.createRange();
  apres.setStartAfter(span);
  apres.collapse(true);
  sel.removeAllRanges();
  sel.addRange(apres);
  derniereSelectionRange = apres.cloneRange();
  placerCurseurBloc();

  setTimeout(()=> span.classList.remove("insertion-fraiche"), 1400);

  etat.contenuHTML = editeur.innerHTML;
  enregistrerSnapshot(true);
  sauverEtat();
  planifierSyncDrive();
}

function analyserParagrapheEtAjouterStrate(texteParagraphe){
  const clean = norm(texteParagraphe);
  if(clean.length < 3) return;

  const matches = indexTags.filter(t => clean.includes(t.radical));
  if(matches.length === 0) return;

  const rads = matches.slice(0, 6).map(m => m.radical);
  const derniere = etat.stratesTags[etat.stratesTags.length - 1];
  if(derniere && derniere.tags.join(",") === rads.join(",")) return;

  etat.stratesTags.push({
    id: Date.now() + Math.random(),
    extrait: texteParagraphe.slice(0, 60),
    tags: rads
  });

  sauverEtat();
  rendreCascadeTags();
}

function initialiserEditeur(){
  try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(e){}
  if(etat.contenuHTML){
    editeur.innerHTML = etat.contenuHTML;
  }
  nbParagraphesPrecedents = editeur.querySelectorAll("p").length;
  enregistrerSnapshot(true);

  document.getElementById("btn-undo").addEventListener("click", executerUndo);
  document.getElementById("btn-redo").addEventListener("click", executerRedo);

  feuille.addEventListener("click", (e)=>{
    if(e.target === feuille){
      editeur.focus();
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(editeur);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
      derniereSelectionRange = range.cloneRange();
      placerCurseurBloc();
    }
  });

  editeur.addEventListener("keyup", sauverPositionCurseur);
  editeur.addEventListener("mouseup", sauverPositionCurseur);
  editeur.addEventListener("focus", sauverPositionCurseur);
  editeur.addEventListener("blur", ()=>{ curseurBloc.style.display = "none"; });
  window.addEventListener("resize", placerCurseurBloc);

  editeur.addEventListener("keydown", (e)=>{
    if((e.ctrlKey || e.metaKey) && !e.altKey){
      if(e.key.toLowerCase() === "z"){
        e.preventDefault();
        if(e.shiftKey) executerRedo();
        else executerUndo();
        return;
      }
      if(e.key.toLowerCase() === "y"){
        e.preventDefault();
        executerRedo();
        return;
      }
    }

    if(e.key === "Enter" && !e.shiftKey){
      enregistrerSnapshot(true);
      const sel = window.getSelection();
      let texteBloc = "";
      if(sel && sel.rangeCount > 0){
        let node = sel.getRangeAt(0).startContainer;
        while(node && node !== editeur && node.nodeName !== "P" && node.nodeName !== "DIV"){
          node = node.parentNode;
        }
        if(node && node !== editeur){
          texteBloc = node.innerText || node.textContent || "";
        } else {
          const lignes = (editeur.innerText || "").split("\n").filter(Boolean);
          texteBloc = lignes[lignes.length - 1] || "";
        }
      }
      setTimeout(()=>{
        analyserParagrapheEtAjouterStrate(texteBloc);
        sauverPositionCurseur();
        etat.contenuHTML = editeur.innerHTML;
        enregistrerSnapshot(true);
        sauverEtat();
        planifierSyncDrive();
      }, 20);
    }
  });

  editeur.addEventListener("input", ()=>{
    sauverPositionCurseur();
    etat.contenuHTML = editeur.innerHTML;
    clearTimeout(timerSnapshot);
    timerSnapshot = setTimeout(()=> enregistrerSnapshot(false), 600);

    const paras = Array.from(editeur.querySelectorAll("p, div"));
    if(paras.length > nbParagraphesPrecedents && paras.length >= 2){
      const avantDernier = paras[paras.length - 2];
      analyserParagrapheEtAjouterStrate(avantDernier.innerText || "");
    }
    nbParagraphesPrecedents = paras.length;
    sauverEtat();
    planifierSyncDrive();
  });
}

function rendreCascadeTags(){
  cascadeListe.innerHTML = "";
  const totalStrates = etat.stratesTags.length;

  if(totalStrates === 0){
    actionsCascade.hidden = true;
    return;
  }

  actionsCascade.hidden = false;

  etat.stratesTags.forEach((strate, idx) => {
    const distanceDuPresent = (totalStrates - 1) - idx;
    const opacite = Math.max(0.32, 1 - distanceDuPresent * 0.22);

    const ligne = document.createElement("div");
    ligne.className = "strate-tags";
    ligne.style.opacity = opacite.toFixed(2);

    strate.tags.forEach(rad => {
      const info = indexTags.find(t => t.radical === rad);
      if(!info) return;
      const btn = document.createElement("button");
      btn.type = "button";
      const estSel = etat.tagsSelectionnes.includes(rad);
      btn.className = "tag-nuage" + (estSel ? " selectionne" : "");
      btn.textContent = info.label;
      btn.addEventListener("click", ()=>{
        const pos = etat.tagsSelectionnes.indexOf(rad);
        if(pos >= 0){
          etat.tagsSelectionnes.splice(pos, 1);
        } else {
          etat.tagsSelectionnes.push(rad);
        }
        sauverEtat();
        rendreCascadeTags();
      });
      ligne.appendChild(btn);
    });

    cascadeListe.appendChild(ligne);
  });

  cascadeListe.scrollTop = cascadeListe.scrollHeight;
}

btnSelectionnerTags.addEventListener("click", ()=>{
  if(etat.tagsSelectionnes.length === 0){
    etat.qcmActifsIds = [];
    zoneQcmWrapper.hidden = true;
    sauverEtat();
    return;
  }

  const idsSet = new Set();
  etat.tagsSelectionnes.forEach(rad => {
    const info = indexTags.find(t => t.radical === rad);
    if(info) info.qcmIds.forEach(id => idsSet.add(id));
  });

  etat.qcmActifsIds = Array.from(idsSet);
  etat.qIndex = 0;
  etat.score = 0;
  etat.ans = {};
  etat.answered = false;

  etat.performances.historique.push({
    action: "validation_tags",
    tags: [...etat.tagsSelectionnes],
    qcmIds: [...etat.qcmActifsIds],

  }
});

btnDeselectionnerTags.addEventListener("click", ()=>{
  etat.tagsSelectionnes = [];
  etat.qcmActifsIds = [];
  zoneQcmWrapper.hidden = true;
  sauverEtat();
  rendreCascadeTags();
});

/* ---------- Recherche IA minimaliste (1 question max par question QCM) ---------- */
function formaterReponseSimple(texteBrut){
  return String(texteBrut || "")
    .split(/\n+/)
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => `<p>${esc(p)}</p>`)
    .join("");
}

function construireBlocRechercheIa(qcm){
  if(!etat.performances.recherchesIA) etat.performances.recherchesIA = {};
  const dejaPosee = etat.performances.recherchesIA[qcm.id] || null;

  const blocReponseIa = dejaPosee
    ? `<div class="reponse-ia-simple bloc-copiable" id="rep-ia-${esc(qcm.id)}">${formaterReponseSimple(dejaPosee.reponse)}${boutonCopieDiscret()}</div>`
    : `<div id="rep-ia-${esc(qcm.id)}"></div>`;

  return `
    <div class="barre-recherche-ia" id="zone-ia-${esc(qcm.id)}">
      <input
        type="text"
        id="input-ia-${esc(qcm.id)}"
        value="${dejaPosee ? esc(dejaPosee.question) : ""}"
        ${dejaPosee || requeteIaEnCours ? "disabled" : ""}
        onkeydown="if(event.key==='Enter'){event.preventDefault();soumettreRechercheIa('${esc(qcm.id)}');}"
      >
      <button
        type="button"
        class="btn-demander-ia"
        id="btn-ia-${esc(qcm.id)}"
        ${dejaPosee || requeteIaEnCours ? "disabled" : ""}
        onclick="soumettreRechercheIa('${esc(qcm.id)}')"
      >Demander</button>
    </div>
    ${blocReponseIa}
  `;
}

async function soumettreRechercheIa(qcmId){
  if(requeteIaEnCours) return;
  if(!etat.performances.recherchesIA) etat.performances.recherchesIA = {};
  if(etat.performances.recherchesIA[qcmId]) return;

  const qcm = etat.baseQCM.find(x => x.id === qcmId);
  if(!qcm) return;

  const inputEl = document.getElementById("input-ia-" + qcmId);
  const btnEl = document.getElementById("btn-ia-" + qcmId);
  const repContainer = document.getElementById("rep-ia-" + qcmId);

  const questionEleve = (inputEl ? inputEl.value : "").trim();
  if(!questionEleve){
    if(inputEl) inputEl.focus();
    return;
  }

  requeteIaEnCours = true;
  if(inputEl) inputEl.disabled = true;
  if(btnEl) btnEl.disabled = true;

  let bonneRepTexte = "";
  let feedbackTexte = "";
  if(Array.isArray(qcm.options)){
    const b = qcm.options.find(o => o.correct) || qcm.options[0];
    bonneRepTexte = b ? b.text : "";
    feedbackTexte = b ? (b.feedback || "") : "";
  } else if(Array.isArray(qcm.answers)){
    bonneRepTexte = qcm.answers.join(" ; ");
    feedbackTexte = qcm.feedback || "";
  } else if(Array.isArray(qcm.pairs)){
    bonneRepTexte = qcm.pairs.map(p => `${p.q} → ${p.a}`).join(" ; ");
  }

  const promptUtilisateur = [
    `Question du QCM : ${qcm.name}`,
    `Réponse / explication : ${bonneRepTexte} ${feedbackTexte}`.trim(),
    `Demande : ${questionEleve}`
  ].join("\n");

  const bodyPayload = {
    systemInstruction: {
      parts: [{
        text: "Professeur de philosophie en Terminale. Style académique clair, rigoureux et accessible à un élève de Terminale. Développe une explication complète et achevée sans coupure."
      }]
    },
    contents: [{ role: "user", parts: [{ text: promptUtilisateur }] }],
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 1200
    }
  };

  let reponseFinale = "";
  let succesRequete = false;
  const modelesCandidats = ["gemini-2.5-flash", "gemini-2.0-flash"];

  for(const modele of modelesCandidats){
    const controller = new AbortController();
    const timerAbort = setTimeout(()=> controller.abort(), 35000);
    try{
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modele}:generateContent?key=${encodeURIComponent(CLE_API_GEMINI)}`;
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyPayload),
        signal: controller.signal
      });
      clearTimeout(timerAbort);
      if(!res.ok){
        const errObj = await res.json().catch(()=>({}));
        throw new Error(errObj.error?.message || `HTTP ${res.status}`);
      }
      const json = await res.json();
      const texteGenere = json?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
      if(texteGenere){
        reponseFinale = texteGenere;
        succesRequete = true;
        break;
      }
    }catch(err){
      clearTimeout(timerAbort);
      reponseFinale = err.name === "AbortError" ? "Délai dépassé." : err.message;
    }
  }

  requeteIaEnCours = false;

  if(succesRequete){
    etat.performances.recherchesIA[qcmId] = {
      question: questionEleve,
      reponse: reponseFinale,
      date: new Date().toISOString()
    };
    sauverEtat();
    planifierSyncDrive();
    if(inputEl) inputEl.disabled = true;
    if(btnEl) btnEl.disabled = true;
    if(repContainer){
      repContainer.className = "reponse-ia-simple bloc-copiable";
      repContainer.innerHTML = formaterReponseSimple(reponseFinale) + boutonCopieDiscret();
    }
  } else {
    if(inputEl) inputEl.disabled = false;
    if(btnEl) btnEl.disabled = false;
    if(repContainer){
      repContainer.className = "reponse-ia-simple";
      repContainer.innerHTML = `<p>${esc(reponseFinale)}</p>`;
    }
  }
}

function obtenirQcmActifs(){
  return etat.qcmActifsIds
    .map(id => etat.baseQCM.find(q => q.id === id))
    .filter(Boolean);
}

function nettoyerTitreScenario(sc){
  return String(sc || "").replace(/^Scénario\s*\d*\s*[—:-]\s*/i, "").trim();
}

function basculerFavoriQcm(qcmId){
  if(!Array.isArray(etat.favorisQcmIds)) etat.favorisQcmIds = [];
  const idx = etat.favorisQcmIds.indexOf(qcmId);
  if(idx >= 0){
    etat.favorisQcmIds.splice(idx, 1);
  } else {
    etat.favorisQcmIds.push(qcmId);
  }
  sauverEtat();
  planifierSyncDrive();
  renderQCM();
}

function ouvrirFavorisQcm(){
  if(!Array.isArray(etat.favorisQcmIds) || etat.favorisQcmIds.length === 0){
    alert("Aucun QCM enregistré dans vos favoris pour le moment.");
    return;
  }
  etat.qcmActifsIds = [...etat.favorisQcmIds];
  etat.qIndex = 0;
  etat.score = 0;
  etat.ans = {};
  etat.answered = false;
  sauverEtat();
  zoneQcmWrapper.hidden = false;
  renderQCM();
}

function nbsp(s){
  return String(s).replace(/ ([;:!?])/g,"\u00A0$1").replace(/« /g,"«\u00A0").replace(/ »/g,"\u00A0»");
}
function esc(s){
  return nbsp(String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"));
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)), t=a[i];
    a[i]=a[j]; a[j]=t;
  }
  return a;
}
function melangeOptions(opts){
  const perm = shuffle(opts.map((o,k)=>k));
  const nbGood = opts.filter(o=>o.correct).length;
  if(nbGood >= opts.length) return perm;
  let essais = 0;
  while(essais < 20){
    let firstGood = perm.length;
    for(let i=0;i<perm.length;i++){ if(opts[perm[i]].correct){ firstGood=i; break; } }
    if(firstGood > 0) return perm;
    const bads = [];
    for(let j=1;j<perm.length;j++){ if(!opts[perm[j]].correct) bads.push(j); }
    if(!bads.length) return perm;
    const pick = bads[Math.floor(Math.random()*bads.length)];
    const t = perm[0]; perm[0] = perm[pick]; perm[pick] = t;
    essais++;
  }
  return perm;
}

function boutonCopieDiscret(){
  return '<button type="button" class="btn-inserer-curseur" onclick="copierBlocVersCurseur(event, this)" title="Insérer au curseur dans le document">↵</button>';
}

function copierBlocVersCurseur(e, btn){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const conteneur = btn.closest(".bloc-copiable");
  if(!conteneur) return;

  const clone = conteneur.cloneNode(true);
  clone.querySelectorAll(".btn-inserer-curseur, input, select").forEach(el => el.remove());

  const titreFb = clone.querySelector("strong");
  if(titreFb && /^(Réponse acceptée|Explication)/i.test(titreFb.textContent.trim())){
    const nextBr = titreFb.nextSibling;
    if(nextBr && nextBr.nodeName === "BR") nextBr.remove();
    titreFb.remove();
  }

  const texte = (clone.textContent || "").replace(/^[✔✖]\s*/, "").replace(/\s*\(votre réponse\)\s*$/i, "").trim();
  insererAuCurseur(texte);
}

function rendreBarreMetaQCM(listeQcm, qCourant){
  miniTagsQcm.innerHTML = "";
  const tagsLies = indexTags.filter(t => t.qcmIds.has(qCourant.id)).slice(0, 7);
  tagsLies.forEach(t => {
    const sp = document.createElement("span");
    const estMatch = etat.tagsSelectionnes.includes(t.radical);
    sp.className = "mini-tag" + (estMatch ? " actif" : "");
    sp.textContent = t.label;
    miniTagsQcm.appendChild(sp);
  });

  navQcmBtns.innerHTML = "";
  if(listeQcm.length > 1){
    const bPrev = document.createElement("button");
    bPrev.type = "button"; bPrev.textContent = "◀";
    bPrev.addEventListener("click", ()=>{
      etat.qIndex = (etat.qIndex - 1 + listeQcm.length) % listeQcm.length;
      renderQCM();
    });
    const bNext = document.createElement("button");
    bNext.type = "button"; bNext.textContent = "▶";
    bNext.addEventListener("click", ()=>{
      etat.qIndex = (etat.qIndex + 1) % listeQcm.length;
      renderQCM();
    });
    navQcmBtns.appendChild(bPrev);
    navQcmBtns.appendChild(bNext);
  }
}

function renderQCM(){
  const Q = obtenirQcmActifs();
  if(Q.length === 0){ zoneQcmWrapper.hidden = true; return; }
  zoneQcmWrapper.hidden = false;
  if(etat.qIndex >= Q.length) etat.qIndex = 0;

  etat.answered = false;
  const q = Q[etat.qIndex];
  rendreBarreMetaQCM(Q, q);

  const titreCourt = nettoyerTitreScenario(q.scenario) || "Questionnaire";
  const cat = q.categorie || "Concepts";
  const couleurCat = COULEURS_CATEGORIES[cat] || "var(--acc)";
  const estFavori = Array.isArray(etat.favorisQcmIds) && etat.favorisQcmIds.includes(q.id);

  const segmentsHTML = Q.map((item, idx) => {
    const rep = etat.ans[idx];
    let cls = "segment-prog";
    if(idx === etat.qIndex) cls += " courant";
    else if(rep && rep.ok) cls += " fait-ok";
    else if(rep && !rep.ok) cls += " fait-ko";
    return `<span class="${cls}" data-qidx="${idx}" title="Question ${idx + 1}/${Q.length}"></span>`;
  }).join("");

  let h = `<div class="qcm-header-graphique" style="--cat-color:${couleurCat}">
    <div class="qcm-header-top">
      <span class="qcm-titre-court">${esc(titreCourt)}</span>
      <div class="qcm-actions-header">
        <span class="badge-cat-graphique"><span class="dot-cat"></span>${esc(cat)}</span>
        <button type="button" class="btn-favori-qcm ${estFavori ? "actif" : ""}" id="btn-toggle-favori" title="Ajouter ou retirer des favoris">
          ${estFavori ? "★ Favori" : "☆ Favori"}
        </button>
      </div>
    </div>
    <div class="jauge-segments" aria-label="Progression">${segmentsHTML}</div>
  </div>`;

  if(q.type === "single" || q.type === "multi"){
    etat.perm = melangeOptions(q.options);
    h += '<p class="qtext bloc-copiable">' + esc(q.name) + boutonCopieDiscret() + '</p>';
    etat.perm.forEach((orig, d) => {
      h += '<label class="opt bloc-copiable" id="opt' + d + '"><input type="' + (q.type === "single" ? "radio" : "checkbox") + '" name="q" value="' + d + '" onchange="markSel()"> ' + esc(q.options[orig].text) + boutonCopieDiscret() + '</label>';
    });
  } else if(q.type === "short"){
    h += '<p class="qtext bloc-copiable">' + esc(q.name) + boutonCopieDiscret() + '</p><input type="text" id="shortin" onkeydown="if(event.key===\'Enter\'){event.preventDefault();validate();}">';
  } else if(q.type === "matching"){
    h += '<p class="qtext bloc-copiable">' + esc(q.name) + boutonCopieDiscret() + '</p>';
    const pool = shuffle(q.pairs.map(p => p.a));
    q.pairs.forEach((p, k) => {
      h += '<div class="bloc-copiable" style="margin:10px 0"><strong>' + esc(p.q) + '</strong>' + boutonCopieDiscret() + '<select class="pairsel" id="sel' + k + '"><option value="">— Choisir —</option>' + pool.map(a => '<option>' + esc(a) + '</option>').join("") + '</select></div>';
    });
  } else if(q.type === "cloze"){
    h += '<p class="qtext bloc-copiable" style="white-space:pre-wrap">';
    q.segs.forEach((s, k) => {
      if(s.t !== undefined) h += esc(s.t);
      else h += '<span class="blank"><input type="text" id="cz' + k + '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();validate();}"></span>';
    });
    h += boutonCopieDiscret() + '</p>';
  }

  h += '<button id="valbtn" onclick="validate()">Valider</button>';
  card.innerHTML = h;

  const btnFav = document.getElementById("btn-toggle-favori");
  if(btnFav) btnFav.addEventListener("click", ()=> basculerFavoriQcm(q.id));

  card.querySelectorAll(".segment-prog").forEach(seg => {
    seg.addEventListener("click", ()=>{
      etat.qIndex = Number(seg.dataset.qidx);
      renderQCM();
    });
  });
}

function markSel(){
  document.querySelectorAll("label.opt").forEach(l => l.classList.remove("sel"));
  document.querySelectorAll("input[name=q]").forEach(inp => {
    if(inp.checked) inp.closest("label").classList.add("sel");
  });
}

function validate(){
  if(etat.answered) return;
  const Q = obtenirQcmActifs();
  const q = Q[etat.qIndex];
  let ok = false, fb = "";

  if(q.type === "single" || q.type === "multi"){
    const selD = [].slice.call(document.querySelectorAll("input[name=q]:checked")).map(i => +i.value);
    const sel = selD.map(d => etat.perm[d]);
    const corr = q.options.map((o, k) => o.correct ? k : -1).filter(k => k >= 0);
    if(q.type === "single") ok = sel.length === 1 && corr.indexOf(sel[0]) >= 0;
    else ok = sel.length === corr.length && sel.every(s => corr.indexOf(s) >= 0);

    etat.perm.forEach((orig, d) => {
      const el = document.getElementById("opt" + d);
      if(q.options[orig].correct) el.classList.add("good");
      else if(selD.indexOf(d) >= 0) el.classList.add("bad");
      el.querySelector("input").disabled = true;
    });
    etat.ans[etat.qIndex] = { ok, given: sel };
    fb = corr.map(k => q.options[k].feedback || "").join("<br><br>") || ("Réponse attendue : " + corr.map(k => q.options[k].text).join(" ; "));
  } else if(q.type === "short"){
    const inp = document.getElementById("shortin");
    ok = q.answers.some(a => norm(a) === norm(inp.value));
    inp.disabled = true;
    etat.ans[etat.qIndex] = { ok, given: inp.value };
    fb = q.feedback || ("Réponses acceptées : " + q.answers.join(" ; "));
  } else if(q.type === "matching"){
    let allOk = true;
    q.pairs.forEach((p, k) => {
      const v = document.getElementById("sel" + k).value;
      if(norm(v) !== norm(p.a)) allOk = false;
      document.getElementById("sel" + k).disabled = true;
    });
    ok = allOk;
    etat.ans[etat.qIndex] = { ok, given: q.pairs.map((p, k) => document.getElementById("sel" + k).value) };
    fb = "Associations correctes : " + q.pairs.map(p => p.q + " → " + p.a).join(" ; ");
  } else if(q.type === "cloze"){
    let allOk2 = true;
    q.segs.forEach((s, k) => {
      if(s.blank === undefined) return;
      const gv = document.getElementById("cz" + k).value;
      if(!s.blank.some(a => norm(a) === norm(gv))) allOk2 = false;
      document.getElementById("cz" + k).disabled = true;
    });
    ok = allOk2;
    etat.ans[etat.qIndex] = { ok, given: q.segs.map((s, k) => s.blank === undefined ? null : document.getElementById("cz" + k).value) };
    fb = "La réponse complète : « " + q.segs.map(s => s.blank !== undefined ? s.blank[0] : s.t).join("") + " »";
  }

  if(ok) etat.score++;
  etat.answered = true;
  etat.performances.reponses[q.id] = { ok, question: q.name, date: new Date().toISOString() };

  const segCourant = card.querySelector(`.segment-prog[data-qidx="${etat.qIndex}"]`);
  if(segCourant){
    segCourant.classList.remove("courant");
    segCourant.classList.add(ok ? "fait-ok" : "fait-ko");
  }

  sauverEtat();
  planifierSyncDrive();

  let h = '<div class="fb bloc-copiable ' + (ok ? "ok" : "no") + '"><strong>' + (ok ? "Réponse acceptée. ✅" : "Explication") + '</strong><br>' + fb + boutonCopieDiscret() + '</div>' + construireBlocRechercheIa(q);
  h += '<button class="ghost" onclick="redoQ()" style="margin-top:10px">← Refaire cette question</button> ';
  h += '<button onclick="nextQ()">' + (etat.qIndex + 1 < Q.length ? "Question suivante →" : "Voir le score") + '</button>';
  card.insertAdjacentHTML("beforeend", h);
}

function redoQ(){
  const a = etat.ans[etat.qIndex];
  if(a && a.ok) etat.score--;
  delete etat.ans[etat.qIndex];
  renderQCM();
}

function nextQ(){
  const Q = obtenirQcmActifs();
  etat.qIndex++;
  if(etat.qIndex < Q.length){ renderQCM(); return; }
  renderScoreQCM();
}

function renderScoreQCM(){
  const Q = obtenirQcmActifs();
  const n = Q.length, s = etat.score, pct = Math.round(100 * s / Math.max(1, n));

  const sujetActif = listeSujets.find(x => x.id === etat.sujetActifId);
  const normTexte = norm(editeur.innerText || "");
  let trouves = 0;
  if(sujetActif && sujetActif.motsCles.length > 0){
    sujetActif.motsCles.forEach(rad => { if(normTexte.includes(rad)) trouves++; });
  }
  const pctTexte = (sujetActif && sujetActif.motsCles.length > 0)
    ? Math.round((trouves / sujetActif.motsCles.length) * 100) : 0;

  card.innerHTML = `
    <h2 class="score">${pct >= 80 ? "🏆 " : ""}Score<span class="big">${s} / ${n}</span>${pct}%</h2>
    <div class="bar"><div id="scorebar" style="width:0%"></div></div>
    <div class="fb ok bloc-copiable" style="text-align:left">
      <strong>Concordance texte rédigé / sujet :</strong> ${pctTexte}% des notions clés mobilisées sur la feuille.${boutonCopieDiscret()}
    </div>
    <div style="text-align:center">
      <button onclick="reviewQCM()">Revoir les réponses</button>
      <button class="ghost" onclick="restartQCM()">Refaire</button>
    </div>
  `;
  setTimeout(()=>{ const sb = document.getElementById("scorebar"); if(sb) sb.style.width = pct + "%"; }, 100);
  planifierSyncDrive();
}

function reviewQCM(){
  const Q = obtenirQcmActifs();
  let h = '<div class="qcm-titre-court" style="margin-bottom:10px">Récapitulatif</div>';
  Q.forEach((q, k) => {
    const a = etat.ans[k] || { ok: false, given: null };
    h += '<div class="rq"><p class="qtext bloc-copiable">' + (k+1) + '. ' + esc(q.name) + boutonCopieDiscret() + '</p>';
    if(q.type === "single" || q.type === "multi"){
      q.options.forEach((o, j) => {
        const picked = a.given && a.given.indexOf(j) >= 0;
        const cls = o.correct ? "good" : (picked ? "bad" : "");
        h += '<div class="opt bloc-copiable ' + cls + '">' + (o.correct ? "✔ " : "") + esc(o.text) + (picked ? " <em>(votre réponse)</em>" : "") + boutonCopieDiscret() + '</div>';
      });
      const corrText = q.options.filter(o => o.correct).map(o => o.feedback || o.text).join("<br><br>");
      h += '<div class="fb bloc-copiable ' + (a.ok ? "ok" : "no") + '">' + corrText + boutonCopieDiscret() + '</div>' + construireBlocRechercheIa(q);
    } else if(q.type === "matching"){
      q.pairs.forEach((p, j) => {
        const gv = a.given ? a.given[j] : "";
        h += '<p class="bloc-copiable">' + esc(p.q) + ' → <em>' + esc(gv || "—") + '</em>' + (norm(gv) === norm(p.a) ? ' ✔' : ' (' + esc(p.a) + ')') + boutonCopieDiscret() + '</p>';
      });
    }
    h += '</div>';
  });
  h += '<div style="text-align:center"><button onclick="restartQCM()">Refaire</button> <button class="ghost" onclick="renderScoreQCM()">Retour au score</button></div>';
  card.innerHTML = h;
}

function restartQCM(){
  etat.qIndex = 0; etat.score = 0; etat.ans = {};
  renderQCM();
}

function lancerAuthentificationGoogle(onSuccess, onError){
  if(!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.startsWith("REMPLACER_")){
    if(onError) onError("Saisissez votre adresse courriel ci-dessous pour enregistrer votre espace de travail.");
    return;
  }
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    if(onError) onError("Le service de connexion Google est indisponible hors ligne.");
    return;
  }

  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile",
    hint: etat.googleConfig.email || undefined,
    callback: async (resp)=>{
      if(resp && resp.access_token){
        googleAccessToken = resp.access_token;
        googleTokenExpiration = Date.now() + ((Number(resp.expires_in) || 3500) * 1000);

        try{
          const resUser = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + googleAccessToken }
          });
          if(resUser.ok){
            const info = await resUser.json();
            if(info.email) etat.googleConfig.email = info.email;
            if(info.name) etat.googleConfig.nomUtilisateur = info.name;
          }
        }catch(e){}

        sauverEtat();
        majBadgeGoogle();
        if(onSuccess) onSuccess();
      } else {
        if(onError) onError("La connexion a été interrompue.");
      }
    }
  });

  tokenClient.requestAccessToken({ prompt: estConnecteGoogle() ? "" : "select_account" });
}

async function obtenirOuCreerDossierDrive(nomDossier){
  const headers = { Authorization: "Bearer " + googleAccessToken };
  const q = encodeURIComponent(`name='${nomDossier.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers });
  if(!res.ok) throw new Error("Accès à Google Drive refusé (" + res.status + ")");
  const data = await res.json();
  if(data.files && data.files[0]) return data.files[0].id;

  const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { ...headers, "Content-Type": "application/json" },
    body: JSON.stringify({ name: nomDossier, mimeType: "application/vnd.google-apps.folder" })
  });
  if(!createRes.ok) throw new Error("Création du répertoire refusée");
  const created = await createRes.json();
  return created.id;
}

async function sauvegarderDansGoogleDrive(msgEl){
  const cfg = etat.googleConfig;
  const payload = construirePayloadSauvegarde();

  if(estConnecteGoogle()){
    majBadgeGoogle("syncing");
    if(msgEl) msgEl.innerHTML = "Enregistrement sur votre espace Google Drive en cours...";

    const folderId = await obtenirOuCreerDossierDrive(cfg.dossierDrive || "RédigezMoi_Philosophie");
    const contenuStr = JSON.stringify(payload, null, 2);
    const identifiantFichier = (cfg.email || "session").split("@")[0];
    const fileName = `redigezmoi-${identifiantFichier}.json`;
    const headers = { Authorization: "Bearer " + googleAccessToken };
    const form = new FormData();

    if(cfg.driveFileId){
      form.append("metadata", new Blob([JSON.stringify({ name: fileName, mimeType: "application/json" })], { type: "application/json" }));
      form.append("file", new Blob([contenuStr], { type: "application/json" }));
      const resPatch = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${cfg.driveFileId}?uploadType=multipart`, {
        method: "PATCH", headers, body: form
      });
      if(!resPatch.ok){
        cfg.driveFileId = "";
        return sauvegarderDansGoogleDrive(msgEl);
      }
    } else {
      form.append("metadata", new Blob([JSON.stringify({ name: fileName, mimeType: "application/json", parents: [folderId] })], { type: "application/json" }));
      form.append("file", new Blob([contenuStr], { type: "application/json" }));
      const resPost = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name", {
        method: "POST", headers, body: form
      });
      if(!resPost.ok) throw new Error("Échec de l'envoi vers Google Drive");
      const createdFile = await resPost.json();
      cfg.driveFileId = createdFile.id;
    }

    cfg.dernierSync = new Date().toLocaleString("fr-FR");
    sauverEtat();
    majBadgeGoogle();
    if(msgEl) msgEl.innerHTML = `✓ Travail enregistré sur Google Drive dans <strong>${esc(cfg.dossierDrive)}/${esc(fileName)}</strong>.`;
    return;
  }

  if(APPS_SCRIPT_URL){
    majBadgeGoogle("syncing");
    if(msgEl) msgEl.innerHTML = "Enregistrement en ligne en cours...";
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    cfg.dernierSync = new Date().toLocaleString("fr-FR");
    sauverEtat();
    majBadgeGoogle();
    if(msgEl) msgEl.innerHTML = `✓ Session enregistrée pour <strong>${esc(cfg.email)}</strong> (${esc(cfg.dernierSync)}).`;
  }
}

async function listerSauvegardesDrive(){
  if(!estConnecteGoogle()) return [];
  const folderId = await obtenirOuCreerDossierDrive(etat.googleConfig.dossierDrive || "RédigezMoi_Philosophie");
  const q = encodeURIComponent(`'${folderId}' in parents and mimeType='application/json' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if(!res.ok) return [];
  const data = await res.json();
  return data.files || [];
}

  const sujetActif = listeSujets.find(x => x.id === etat.sujetActifId);
  const normTexte = norm(editeur.innerText || "");
  let trouves = 0;
  if(sujetActif && sujetActif.motsCles.length > 0){
    sujetActif.motsCles.forEach(rad => { if(normTexte.includes(rad)) trouves++; });
  }
  const pctTexte = (sujetActif && sujetActif.motsCles.length > 0)
    ? Math.round((trouves / sujetActif.motsCles.length) * 100) : 0;

  const w = document.createElement("div");
  w.className = "modalwrap";
  w.onclick = (e)=>{ if(e.target === w) w.remove(); };
  w.innerHTML = `
    <div class="modalbox">
      <h2>Bilan des performances — RédigezMoi</h2>
      <div>• Compte Google : <strong>${esc(etat.googleConfig.email || "Non connecté")}</strong></div>
      <div>• Base QCM active : <strong>${etat.baseQCM.length}</strong> questions (${listeSujets.length} sujets générés)</div>
      <div>• QCM favoris enregistrés : <strong>${(etat.favorisQcmIds || []).length}</strong></div>
      <div>• QCM réussis : <strong>${bonnes} / ${reps.length}</strong></div>
      <div>• Questions IA posées : <strong>${nbIa} / ${etat.baseQCM.length}</strong></div>
      <div>• Vérification du texte par rapport au sujet choisi : <strong>${pctTexte}%</strong> (${trouves} / ${sujetActif ? sujetActif.motsCles.length : 0} concepts clés)</div>
      <div>• Strates de tags générées : <strong>${etat.stratesTags.length}</strong></div>
      <button type="button" onclick="this.closest('.modalwrap').remove()">Fermer</button>
    </div>
  `;
  document.body.appendChild(w);
}

function ouvrirModalParametres(){
  const themes = ["pronote", "moderne", "machine", "manuscrit", "nuit"];
  const w = document.createElement("div");
  w.className = "modalwrap";
  w.onclick = (e)=>{ if(e.target === w) w.remove(); };

  w.innerHTML = `
    <div class="modalbox">
      <h2>Paramètres — RédigezMoi</h2>
      <div>Thème visuel : <button type="button" class="val-param" id="p-theme">${etat.theme}</button></div>
      <div>Règle graduée : <button type="button" class="val-param" id="p-regle">${etat.regle ? "visible" : "masquée"}</button></div>
      <div>Taille du texte : <button type="button" class="val-param" id="p-taille">${etat.taille} px</button></div>
      <div style="margin-top:14px">
        <button type="button" id="p-google">Compte Google</button>
        <button type="button" class="danger" id="p-reset">Réinitialiser la session</button>
        <button type="button" class="ghost" onclick="this.closest('.modalwrap').remove()">Fermer</button>
      </div>
    </div>
  `;
  document.body.appendChild(w);

  document.getElementById("p-theme").onclick = (e)=>{
    etat.theme = themes[(themes.indexOf(etat.theme) + 1) % themes.length];
    e.target.textContent = etat.theme;
    appliquerApparence(); sauverEtat();
  };
  document.getElementById("p-regle").onclick = (e)=>{
    etat.regle = !etat.regle;
    e.target.textContent = etat.regle ? "visible" : "masquée";
    appliquerApparence(); sauverEtat();
  };
  document.getElementById("p-taille").onclick = (e)=>{
    const tailles = [16, 18, 20];
    etat.taille = tailles[(tailles.indexOf(etat.taille) + 1) % tailles.length];
    e.target.textContent = etat.taille + " px";
    appliquerApparence(); sauverEtat();
  };
  document.getElementById("p-google").onclick = ()=>{ w.remove(); ouvrirModalGoogleDrive(); };
  document.getElementById("p-reset").onclick = ()=>{ localStorage.removeItem(CLE_STORAGE); location.reload(); };
}

function exporterJSON(){
  const payload = construirePayloadSauvegarde();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "redigezmoi-" + payload.date.slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function fusionnerDocumentImporte(doc){
  const candidats = Array.isArray(doc.baseQCM) ? doc.baseQCM : (Array.isArray(doc.questions) ? doc.questions : []);
  const existants = new Set(etat.baseQCM.map(q => norm(q.name)));
  candidats.forEach((item, i) => {
    if(item && item.name && !existants.has(norm(item.name))){
      etat.baseQCM.push({
        id: item.id && !etat.baseQCM.some(x => x.id === item.id) ? item.id : `qcm-imp-${Date.now()}-${i}`,
        categorie: item.categorie || "Concepts",
        scenario: item.scenario || "Parcours importé",
        type: item.type || "single",
        name: item.name,
        options: item.options,
        answers: item.answers,
        pairs: item.pairs,
        segs: item.segs,
        feedback: item.feedback
      });
      existants.add(norm(item.name));
    }
  });

  if(Array.isArray(doc.favorisQcmIds)){
    etat.favorisQcmIds = Array.from(new Set([...(etat.favorisQcmIds || []), ...doc.favorisQcmIds]));
  }

  if(doc.contenuHTML || doc.texteBrut){
    enregistrerSnapshot(true);
    const ajout = doc.contenuHTML || `<p>${esc(doc.texteBrut)}</p>`;
    editeur.innerHTML = editeur.innerHTML ? (editeur.innerHTML + ajout) : ajout;
    etat.contenuHTML = editeur.innerHTML;
    enregistrerSnapshot(true);
  }

  if(Array.isArray(doc.stratesTags)) etat.stratesTags.push(...doc.stratesTags);
  if(doc.performances){
    if(doc.performances.reponses){
      etat.performances.reponses = Object.assign({}, etat.performances.reponses, doc.performances.reponses);
    }
    if(doc.performances.recherchesIA){
      etat.performances.recherchesIA = Object.assign({}, etat.performances.recherchesIA, doc.performances.recherchesIA);
    }
    if(Array.isArray(doc.performances.historique)){
      etat.performances.historique.push(...doc.performances.historique);
    }
  }

  reconstruireIndex();
  sauverEtat();
  rendreMenuTitres();
  rendreCascadeTags();
}

document.getElementById("fichier-import").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  try{
    fusionnerDocumentImporte(JSON.parse(await file.text()));
  }catch(err){
    alert("Fichier JSON invalide.");
  }
});

const sauve = chargerEtat();
if(sauve && Array.isArray(sauve.baseQCM)){
  etat = Object.assign(etat, sauve);
  if(!Array.isArray(etat.favorisQcmIds)) etat.favorisQcmIds = [];
  if(!etat.performances) etat.performances = { historique: [], reponses: {}, recherchesIA: {} };
  if(!etat.performances.recherchesIA) etat.performances.recherchesIA = {};
  etat.googleConfig = Object.assign({
    dossierDrive: "RédigezMoi_Philosophie",
    email: "",
    nomUtilisateur: "",
    driveFileId: "",
    dernierSync: ""
  }, sauve.googleConfig || {});
}

reconstruireIndex();
appliquerApparence();
window.addEventListener("resize", dessinerRegles);

dessinerRegles();
rendreMenuTitres();
rendreSupport();
initialiserEditeur();
rendreCascadeTags();

if(etat.qcmActifsIds && etat.qcmActifsIds.length > 0){
  renderQCM();
}
</script>
