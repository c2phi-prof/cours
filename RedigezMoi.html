<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Feuille Blanche — Étude documentaire &amp; Saisie au kilomètre (Pronote)</title>
<style>
:root{
  --papier:#ffffff;
  --fond:#e9eef2;
  --encre:#1f2d3d;
  --encre-esprit:#1f6f50;
  --accent-pronote:#2b8a64;
  --accent-pronote-clair:#e6f3ed;
  --encre-fantome:#9fb0bf;
  --filet:#cfd9e2;
  --taille-corps:18px;
  --interligne:1.72;
  --police-principale:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#eef3f7 0%,var(--fond) 45%,#dfe7ee 100%);
  font-family:var(--police-principale);
  color:var(--encre);
  overflow-x:hidden;
}

/* ---------- Bandeau institutionnel Pronote ---------- */
#barre-pronote{
  position:fixed;top:0;left:0;right:0;height:44px;z-index:42;
  background:var(--encre-esprit);color:#ffffff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:13px;letter-spacing:.03em;
  box-shadow:0 2px 8px rgba(20,45,35,.15);
}
#barre-pronote .titre-app{display:flex;align-items:center;gap:10px;font-weight:600}
#barre-pronote .badge{
  background:rgba(255,255,255,.18);padding:2px 8px;border-radius:3px;
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;
}
#couche{display:flex;align-items:center;gap:14px}
#commandes,#gestes{display:flex;gap:10px;align-items:center}
#commandes button,#gestes button{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:3px;
  cursor:pointer;font-family:inherit;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:#ffffff;padding:4px 10px;
  transition:background .2s ease,border-color .2s ease;
  display:flex;align-items:center;gap:6px;
}
#commandes button:hover,#gestes button:hover{background:rgba(255,255,255,.26);border-color:#ffffff}
#gestes svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}

/* Menu des apparences */
#menu-modeles{
  position:fixed;top:52px;right:24px;z-index:45;width:330px;
  background:var(--papier);border:1px solid var(--filet);border-radius:4px;
  box-shadow:0 12px 32px rgba(25,40,55,.16);
  padding:18px 20px 14px;
}
#menu-modeles[hidden]{display:none}
#menu-modeles h3{
  font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--encre-esprit);margin-bottom:10px;
}
#menu-modeles .item{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  font-family:inherit;padding:8px 4px;border-top:1px solid var(--filet);
}
#menu-modeles .item:hover{padding-left:8px;background:var(--accent-pronote-clair)}
#menu-modeles .item .nom{font-size:.92em;font-weight:600;color:var(--encre)}
#menu-modeles .item .devise{font-size:.8em;color:#5a6b7c}
#menu-modeles .item.actif .nom::after{content:"  ●";font-size:.7em;color:var(--encre-esprit)}

/* ---------- La scène et le plateau ---------- */
#scene{padding:68px 24px 120px}
#plateau{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1360px;margin:0 auto}

/* ---------- La feuille centrale ---------- */
#feuille{
  position:relative;max-width:820px;flex:1 1 580px;min-height:84vh;
  background:var(--papier);
  border:1px solid var(--filet);
  border-top:4px solid var(--encre-esprit);
  padding:46px 70px 92px 74px;
  box-shadow:0 4px 18px rgba(31,45,61,.07);
  border-radius:3px;
  cursor:text;
}
/* Règles graduées */
#regle-h,#regle-v{position:absolute;user-select:none;pointer-events:none;color:var(--encre-fantome)}
#regle-h{top:12px;left:74px;right:70px;height:18px}
#regle-v{left:14px;top:46px;bottom:60px;width:18px}
.graduation{position:absolute;background:var(--encre-fantome);opacity:.7}
#regle-h .graduation{bottom:0;width:1px;height:5px}
#regle-h .graduation.majeure{height:9px}
#regle-v .graduation{right:0;height:1px;width:5px}
#regle-v .graduation.majeure{width:9px}
.nombre{position:absolute;font-size:8.5px;transform:translateX(-50%)}

/* ---------- Menu-Titre pleine largeur au-dessus du texte ---------- */
#bloc-titre-sujet{
  position:relative;
  width:100%;
  margin-bottom:1.2em;
  border-bottom:2px solid var(--encre-esprit);
  padding-bottom:10px;
  user-select:none;
}
.barre-meta-sujet{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--encre-esprit);font-weight:700;margin-bottom:6px;
}
.btn-titre-pleine-ligne{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--accent-pronote-clair);
  border:1px solid #b5d8c8;
  border-radius:4px;
  padding:14px 18px;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  color:var(--encre);
  transition:all .2s ease;
}
.btn-titre-pleine-ligne:hover{
  background:#d5ece1;border-color:var(--encre-esprit);
}
.btn-titre-pleine-ligne .texte-titre{
  font-size:1.38em;
  font-weight:700;
  line-height:1.28;
  letter-spacing:-.01em;
  flex:1;
}
.btn-titre-pleine-ligne .icone-menu{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  background:var(--encre-esprit);color:#ffffff;padding:5px 10px;border-radius:3px;
  white-space:nowrap;
}
#liste-sujets-generes{
  position:absolute;top:100%;left:0;right:0;z-index:35;
  background:#ffffff;border:1px solid var(--encre-esprit);border-top:none;
  border-radius:0 0 4px 4px;
  box-shadow:0 16px 36px rgba(25,40,55,.18);
  max-height:420px;overflow-y:auto;
}
#liste-sujets-generes[hidden]{display:none}
.option-sujet{
  width:100%;text-align:left;background:#ffffff;border:none;border-bottom:1px solid #e6edf3;
  padding:12px 18px;cursor:pointer;font-family:inherit;display:block;
  transition:background .15s ease;
}
.option-sujet:hover{background:var(--accent-pronote-clair)}
.option-sujet.actif{background:#eaf5f0;border-left:4px solid var(--encre-esprit)}
.option-sujet .type-sujet{
  display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;color:var(--encre-esprit);background:#dceee5;padding:2px 6px;border-radius:2px;
  margin-bottom:4px;
}
.option-sujet .intitule-sujet{
  display:block;font-size:1.05em;font-weight:700;color:var(--encre);line-height:1.35;
}
.option-sujet .cibles-sujet{
  display:block;font-size:11.5px;color:#5a6b7c;margin-top:4px;
}

/* Extrait du documentaire repliable */
details.extrait-doc{
  background:#f6f9fb;
  border:1px solid var(--filet);
  border-left:3px solid var(--encre-esprit);
  padding:9px 14px;margin-bottom:1.1em;border-radius:0 3px 3px 0;
  font-size:.84em;line-height:1.52;color:#2b3e50;
}
details.extrait-doc summary{
  cursor:pointer;font-weight:700;color:var(--encre-esprit);
  font-size:.86em;text-transform:uppercase;letter-spacing:.05em;
}
details.extrait-doc blockquote{font-style:italic;margin-top:7px;color:#1f2d3d}

/* ---------- Nuage de tags dynamique au-dessus de l'éditeur ---------- */
#zone-nuage-tags{
  background:#f8fbfa;
  border:1px solid #d4e4dc;
  border-radius:4px;
  padding:11px 14px;
  margin-bottom:1.3em;
  user-select:none;
}
.entete-nuage{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  margin-bottom:8px;
}
.entete-nuage .titre-nuage{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--encre-esprit);
}
.actions-nuage{display:flex;gap:8px;align-items:center}
#btn-valider-tags{
  background:var(--encre-esprit);color:#ffffff;border:none;border-radius:3px;
  padding:5px 12px;font-family:inherit;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  transition:background .2s ease,transform .1s ease;
}
#btn-valider-tags:hover{background:var(--accent-pronote)}
#btn-valider-tags:active{transform:scale(.98)}
#btn-vider-tags{
  background:transparent;color:#5a6b7c;border:1px solid var(--filet);border-radius:3px;
  padding:4px 9px;font-family:inherit;font-size:11px;cursor:pointer;
}
#btn-vider-tags:hover{border-color:#5a6b7c;color:var(--encre)}
#nuage-tags{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}
.tag-nuage{
  background:#ffffff;border:1px solid #c5d6ce;border-radius:14px;
  padding:4px 11px;font-family:inherit;color:#2c3e50;
  cursor:pointer;touch-action:manipulation;
  transition:all .18s ease;
  line-height:1.2;
}
.tag-nuage:hover{border-color:var(--encre-esprit);background:#eef7f3}
.tag-nuage.active-texte{
  border-style:solid;border-color:#52a37f;background:#f0f9f5;color:#185a3f;
}
.tag-nuage.selectionne{
  background:var(--encre-esprit) !important;
  color:#ffffff !important;
  border-color:var(--encre-esprit) !important;
  font-weight:700;
  box-shadow:0 2px 6px rgba(31,111,80,.25);
}

/* ---------- Éditeur continu au kilomètre ---------- */
#editeur-km{
  outline:none;
  min-height:46vh;
  font-size:var(--taille-corps);
  line-height:var(--interligne);
  color:var(--encre);
  caret-color:var(--encre-esprit);
  white-space:pre-wrap;
  word-wrap:break-word;
}
#editeur-km p{
  margin:0 0 .85em;
  text-indent:1.25em;
}
#editeur-km:empty::before{
  content:"Rédigez votre dissertation, essai ou explication de texte au kilomètre ici (Entrée pour changer de paragraphe)...";
  color:var(--encre-fantome);
  font-style:italic;
  pointer-events:none;
}
.insertion-fraiche{
  background:var(--accent-pronote-clair);
  border-radius:2px;
  transition:background 1.6s ease;
}

/* Barre de statut bas de feuille */
#statut-frappe{
  position:absolute;bottom:14px;right:26px;left:74px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:11.5px;color:#6c7e90;pointer-events:none;
  border-top:1px solid #eef2f6;padding-top:8px;
}
#statut-frappe .etat-sync{display:flex;align-items:center;gap:6px}
#statut-frappe .point{
  width:7px;height:7px;border-radius:50%;background:var(--accent-pronote);
}
#statut-frappe.en-frappe .point{opacity:.45;transform:scale(.8)}

/* ---------- Volet de droite : QCM filtrés & vérification ---------- */
#zone-esprit{
  position:sticky;top:60px;
  flex:0 0 415px;width:415px;
  padding:20px 20px 18px;
  background:var(--papier);
  border:1px solid var(--filet);
  border-top:4px solid var(--accent-pronote);
  border-radius:3px;
  box-shadow:0 4px 18px rgba(31,45,61,.08);
  max-height:calc(100vh - 76px);
  overflow-y:auto;
}
.entete-qcm{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--filet);
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  color:var(--encre-esprit);
}
.nav-qcm-rapide{display:flex;align-items:center;gap:5px}
.btn-nav-qcm{
  background:#f1f6f9;border:1px solid var(--filet);border-radius:3px;
  padding:3px 8px;font-family:inherit;font-size:11px;font-weight:700;
  color:var(--encre);cursor:pointer;
}
.btn-nav-qcm:hover{background:var(--encre-esprit);color:#ffffff;border-color:var(--encre-esprit)}
.select-qcm-direct{
  font-family:inherit;font-size:11px;padding:3px 6px;max-width:165px;
  border:1px solid var(--filet);border-radius:3px;background:#f7fafc;color:var(--encre);
  cursor:pointer;
}

/* Panneau de vérification de la réponse écrite par rapport au sujet choisi */
.verif-sujet{
  background:#f5f9f7;border:1px solid #cde2d7;border-radius:3px;
  padding:9px 11px;margin-bottom:10px;font-size:12px;
}
.verif-sujet .verif-header{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  color:var(--encre-esprit);margin-bottom:5px;
}
.jauge-barre{
  height:6px;background:#dce8e2;border-radius:3px;overflow:hidden;margin-bottom:6px;
}
.jauge-remplissage{
  height:100%;background:var(--encre-esprit);transition:width .35s ease;
}
.verif-detail{font-size:11.5px;line-height:1.42;color:#2c3e50}

/* Petits tags affichés dans le volet de droite pour le QCM actif */
.tags-volet-droit{
  display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;
}
.mini-tag{
  font-size:10px;padding:2px 6px;border-radius:10px;
  background:#eef3f7;color:#4a5d70;border:1px solid #d5dfe8;
}
.mini-tag.match{
  background:var(--accent-pronote-clair);color:var(--encre-esprit);border-color:#9fd0ba;font-weight:700;
}

#zone-esprit .sujet{font-size:.93em;font-weight:700;line-height:1.38;margin-bottom:.5em;color:var(--encre)}
#zone-esprit .vignette{
  font-size:.8em;line-height:1.45;background:#f4f7f9;padding:7px 10px;
  border-radius:3px;margin-bottom:.75em;color:#3d4f60;
}
#zone-esprit .reponse{
  font-size:.83em;line-height:1.48;margin-bottom:.85em;padding:9px 11px;
  background:var(--accent-pronote-clair);border-left:3px solid var(--encre-esprit);
  border-radius:0 3px 3px 0;color:#173b2d;
}
.btn-inserer-amorce{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:6px;background:#ffffff;border:1px solid var(--encre-esprit);
  color:var(--encre-esprit);border-radius:3px;padding:4px 9px;
  font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;
}
.btn-inserer-amorce:hover{background:var(--encre-esprit);color:#ffffff}

/* ---------- Barre de recherche IA (1 question par question QCM) ---------- */
.zone-ia-qcm{
  margin-top:10px;
  padding-top:9px;
  border-top:1px dashed #b5d8c8;
}
.ia-entete{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;color:var(--encre-esprit);margin-bottom:6px;
}
.ia-form-ligne{
  display:flex;gap:6px;align-items:stretch;
}
.ia-input{
  flex:1;min-width:0;
  background:#ffffff;border:1px solid #b5d8c8;border-radius:3px;
  padding:6px 9px;font-family:inherit;font-size:12px;color:var(--encre);
  outline:none;
}
.ia-input:focus{border-color:var(--encre-esprit);box-shadow:0 0 0 2px rgba(31,111,80,.12)}
.ia-input:disabled{background:#edf3f0;color:#6c7e90;cursor:not-allowed}
.ia-btn{
  background:var(--encre-esprit);color:#ffffff;border:none;border-radius:3px;
  padding:6px 11px;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
  transition:background .18s ease;
}
.ia-btn:hover:not(:disabled){background:var(--accent-pronote)}
.ia-btn:disabled{background:#8fa99e;cursor:not-allowed}
.ia-reponse-academique{
  margin-top:8px;padding:9px 11px;
  background:#ffffff;border:1px solid #cde2d7;border-left:3px solid var(--accent-pronote);
  border-radius:3px;font-size:12.2px;line-height:1.55;color:var(--encre);
}
.ia-reponse-academique .ia-badge-prof{
  display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;color:var(--encre-esprit);margin-bottom:4px;
}
.ia-reponse-academique p{margin-bottom:6px}
.ia-reponse-academique p:last-child{margin-bottom:0}

#zone-esprit .question{font-size:.9em;font-weight:600;line-height:1.45;margin-bottom:.65em}
#zone-esprit .qcm{display:flex;flex-direction:column;gap:6px}
#zone-esprit .choix{
  background:#f8fafc;border:1px solid var(--filet);border-radius:3px;
  cursor:pointer;font-family:inherit;text-align:left;
  font-size:12.2px;line-height:1.36;color:var(--encre);
  padding:7px 10px;transition:all .18s ease;
}
#zone-esprit .choix:hover{
  background:var(--accent-pronote-clair);border-color:var(--encre-esprit);padding-left:13px;
}

/* Variantes visuelles */
.modele-pronote{color:var(--encre)}
.modele-enigme{background:#1e262c !important;color:#e6eef4 !important;border-top-color:#48b88a !important}
.modele-enigme .sujet{color:#ffffff !important}
.modele-enigme .vignette,.modele-enigme .verif-sujet{background:#28333b !important;color:#bfd0de !important;border-color:#3b4a56 !important}
.modele-enigme .verif-detail{color:#d5e2ec !important}
.modele-enigme .reponse{background:#213a31 !important;color:#bfe8d5 !important}
.modele-enigme .ia-reponse-academique{background:#28333b !important;color:#e6eef4 !important;border-color:#3b4a56 !important}
.modele-enigme .ia-input{background:#1e262c !important;color:#ffffff !important;border-color:#3b4a56 !important}
.modele-enigme .choix{background:#28333b !important;border-color:#3b4a56 !important;color:#e6eef4 !important}
.modele-cartel{background:#ffffff !important;color:#111111 !important;border:2px solid #111111 !important;font-family:Georgia,serif}
.modele-voix{background:#f9fbf9 !important;border:1px dashed var(--encre-esprit) !important;font-family:Georgia,serif;font-style:italic}
.modele-maitre{border:3px double var(--encre-esprit) !important;font-family:Georgia,serif}

/* ---------- Panneau du contrat ---------- */
#panneau{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(31,45,61,.55);backdrop-filter:blur(5px);
  overflow-y:auto;padding:64px 24px;
}
#panneau[hidden]{display:none}
#panneau .plume{
  background:var(--papier);max-width:740px;width:100%;border-radius:4px;
  border-top:4px solid var(--encre-esprit);
  padding:34px 44px 32px;box-shadow:0 14px 40px rgba(20,35,50,.22);
}
.petit-capital{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--encre-esprit);margin-bottom:1em;font-weight:700;
}
.article-param{font-size:.9em;line-height:1.58;margin:.55em 0}
.valeur{
  background:var(--accent-pronote-clair);border:1px solid #b5d8c8;border-radius:3px;
  cursor:pointer;font-family:inherit;font-size:inherit;font-weight:600;
  color:var(--encre-esprit);padding:1px 7px;
}
.stats-perf{
  margin-top:1em;padding:12px 14px;background:#f4f8fa;border:1px solid var(--filet);
  border-radius:4px;font-size:.85em;line-height:1.6;
}
.actions-contrat{margin-top:1.4em;padding-top:1em;border-top:1px solid var(--filet);display:flex;flex-wrap:wrap;gap:10px 16px}
.action{
  background:#f2f6f9;border:1px solid var(--filet);border-radius:3px;cursor:pointer;font-family:inherit;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--encre);
  padding:6px 12px;
}
.action:hover{background:var(--encre-esprit);color:#ffffff;border-color:var(--encre-esprit)}
.action.dangereuse:hover{background:#b83b2b;border-color:#b83b2b;color:#ffffff}

@media (max-width:1140px){
  #zone-esprit{position:static;flex-basis:100%;width:100%;max-height:none}
  #feuille{min-height:55vh}
}
@media (max-width:640px){
  #feuille{padding:40px 20px 64px}
  #regle-h{left:20px;right:20px}
  #regle-v{display:none}
  #barre-pronote .badge{display:none}
  .btn-titre-pleine-ligne .texte-titre{font-size:1.1em}
}
</style>
</head>
<body>

<header id="barre-pronote">
  <div class="titre-app">
    <span>Espace Philosophie &amp; Analyse Média</span>
    <span class="badge">Pronote · Frappe km</span>
  </div>
  <div id="couche">
    <div id="commandes"></div>
    <div id="gestes">
      <button id="btn-importer" title="Importer et fusionner une base JSON">
        <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 12.5h11"/></svg>Importer (+Base)
      </button>

/* ==========================================================================
   ALGORITHME 1 : EXTRACTION DES TAGS & CONCEPTS DEPUIS LES QCM
   ========================================================================== */
const STOPWORDS = new Set([
  "dans","pour","avec","sans","sous","vers","chez","entre","comme","ainsi","donc","mais","or","ni","car",
  "que","qui","quoi","dont","où","quel","quelle","quels","quelles","lequel","laquelle","lesquels",
  "les","des","une","uns","unes","aux","par","sur","est","sont","être","avoir","fait","faire","peut",
  "plus","moins","très","tout","tous","toute","toutes","autre","autres","même","mêmes","leur","leurs",
  "cette","cet","ces","celui","celle","ceux","celles","notre","votre","mon","ton","son","ses","nos","vos",
  "dire","dit","parler","parle","permet","permettre","mettre","met","aller","va","vont","venir","vient",
  "alors","tandis","lorsque","quand","comment","pourquoi","combien","seulement","uniquement","vraiment",
  "exact","inexact","pertinent","non","oui","critique","analyse","question","réponse","texte","documentaire"
]);

function normaliserMot(m){
  return m.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9-]/g, "");
}

function extraireTagsDepuisBase(baseQCM){
  const mapTags = new Map();

  baseQCM.forEach(qcm => {
    const bonneRep = qcm.options.find(o => o.correct) || qcm.options[0];
    const sources = [
      { texte: bonneRep ? bonneRep.texte : "", poids: 3 },
      { texte: bonneRep ? bonneRep.feedback : "", poids: 2 },
      { texte: qcm.question + " " + qcm.axe, poids: 2 }
    ];

    sources.forEach(src => {
      const tokens = src.texte.match(/[A-Za-zÀ-ÖØ-öø-ÿ-]{4,}/g) || [];
      tokens.forEach(tok => {
        const clean = tok.toLowerCase();
        const norm = normaliserMot(clean);
        if(norm.length < 4 || STOPWORDS.has(clean) || STOPWORDS.has(norm)) return;

        const cle = norm.slice(0, 6);
        if(!mapTags.has(cle)){
          mapTags.set(cle, {
            cle,
            label: clean,
            poids: 0,
            qcmIds: new Set(),
            formes: new Set()
          });
        }
        const entry = mapTags.get(cle);
        entry.poids += src.poids;
        entry.qcmIds.add(qcm.id);
        entry.formes.add(clean);
        if(clean.length < entry.label.length) entry.label = clean;
      });
    });
  });

  return Array.from(mapTags.values())
    .sort((a, b) => b.poids - a.poids)
    .slice(0, 36);
}

/* ==========================================================================
   ALGORITHME 2 : GÉNÉRATION DES SUJETS DE RÉDACTION
   ========================================================================== */
function genererSujetsDepuisQCM(baseQCM){
  const sujets = [];

  baseQCM.forEach((q) => {
    const bonne = q.options.find(o => o.correct) || q.options[0];
    const motsCles = extraireMotsClesItem(q);

    const titreDissert = q.question.endsWith("?")
      ? `${q.axe} : ${q.question}`
      : `Peut-on soutenir que ${bonne.texte.charAt(0).toLowerCase() + bonne.texte.slice(1).replace(/\.$/, "")} ?`;

    sujets.push({
      id: `sujet-unit-${q.id}`,
      type: "Question problématisée",
      titre: titreDissert,
      qcmIds: [q.id],
      attendus: [bonne.texte, bonne.feedback],
      motsCles
    });

    if(q.vignette){
      const citation = q.vignette.replace(/^[0-9:]+\s*—\s*/, "");
      sujets.push({
        id: `sujet-expl-${q.id}`,
        type: "Explication de témoignage",
        titre: `Expliquez et discutez : ${citation}`,
        qcmIds: [q.id],
        attendus: [bonne.texte, bonne.feedback],
        motsCles
      });
    }
  });

  for(let i = 0; i < baseQCM.length - 1; i++){
    const q1 = baseQCM[i];
    const q2 = baseQCM[i + 1];
    const b1 = q1.options.find(o => o.correct) || q1.options[0];
    const b2 = q2.options.find(o => o.correct) || q2.options[0];
    const mots12 = Array.from(new Set([...extraireMotsClesItem(q1), ...extraireMotsClesItem(q2)]));

    sujets.push({
      id: `sujet-croise-${q1.id}-${q2.id}`,
      type: "Dissertation croisée (2 axes)",
      titre: `De « ${q1.axe.toLowerCase()} » à « ${q2.axe.toLowerCase()} » : comment penser l'articulation entre pratique et conscience ?`,
      qcmIds: [q1.id, q2.id],
      attendus: [b1.texte, b1.feedback, b2.texte, b2.feedback],
      motsCles: mots12
    });
  }

  if(baseQCM.length >= 3){
    const tousIds = baseQCM.map(q => q.id);
    const tousAttendus = baseQCM.flatMap(q => {
      const b = q.options.find(o => o.correct);
      return b ? [b.texte, b.feedback] : [];
    });
    const tousMots = Array.from(new Set(baseQCM.flatMap(q => extraireMotsClesItem(q))));
    sujets.push({
      id: "sujet-synthese-globale",
      type: "Essai / Dissertation intégrale",
      titre: "La mise en scène d'une « transe contrôlée » abolit-elle la conscience de soi ou révèle-t-elle son dédoublement ?",
      qcmIds: tousIds,
      attendus: tousAttendus,
      motsCles: tousMots
    });
  }

  return sujets;
}

function extraireMotsClesItem(qcm){
  const bonne = qcm.options.find(o => o.correct) || qcm.options[0];
  const brut = `${qcm.question} ${bonne ? bonne.texte + " " + bonne.feedback : ""}`;
  const tokens = brut.match(/[A-Za-zÀ-ÖØ-öø-ÿ-]{4,}/g) || [];
  const uniques = new Map();
  tokens.forEach(t => {
    const clean = t.toLowerCase();
    const norm = normaliserMot(clean);
    if(norm.length >= 4 && !STOPWORDS.has(clean) && !STOPWORDS.has(norm)){
      uniques.set(norm.slice(0, 6), clean);
    }
  });
  return Array.from(uniques.values());
}

/* ==========================================================================
   ALGORITHME 3 : VÉRIFICATION DE LA RÉPONSE ÉCRITE CONTRE LES QCM ATTENDUS
   ========================================================================== */
function verifierTexteContreSujet(texteUtilisateur, sujetActif){
  const normTexte = normaliserMot(texteUtilisateur);
  if(!sujetActif || !sujetActif.motsCles || sujetActif.motsCles.length === 0){
    return { score: 0, trouves: [], manquants: [] };
  }
  const trouves = [];
  const manquants = [];
  sujetActif.motsCles.forEach(mot => {
    const radical = normaliserMot(mot).slice(0, 6);
    if(radical && normTexte.includes(radical)){
      trouves.push(mot);
    } else {
      manquants.push(mot);
    }
  });
  const score = Math.round((trouves.length / sujetActif.motsCles.length) * 100);
  return { score, trouves, manquants };
}

let requeteIaEnCours = false;

async function interrogerIaPhilosophie(qcmCourant, questionEleve){
  const qNettoyee = (questionEleve || "").trim();
  if(!qNettoyee || requeteIaEnCours) return;
  if(etat.performances.recherchesIA && etat.performances.recherchesIA[qcmCourant.id]) return;

  requeteIaEnCours = true;
  rendreVoletDroit();

  const bonneRep = qcmCourant.options.find(o => o.correct);
  const consignesSysteme = [
    "Tu es un professeur agrégé de philosophie en classe de Terminale (lycée français).",
    "Réponds dans un style académique rigoureux, structuré et limpide, parfaitement adapté à un élève de Terminale préparant le baccalauréat de philosophie.",
    "Appuie-toi sur la distinction conceptuelle précise, l'analyse du lexique et les repères philosophiques du programme (conscience, inconscient, liberté, art, culture, vérité), en lien direct avec la question du QCM étudiée.",
    "Rédige 2 paragraphes denses et pédagogiques (130 à 190 mots maximum), sans listes à puces ni titres Markdown."
  ].join(" ");

  const contexteQuestion = [
    `Support documentaire : ${SEQUENCE_DOC.titre} (${SEQUENCE_DOC.sequence}).`,
    `Axe d'étude : ${qcmCourant.axe}.`,
    `Extrait : ${qcmCourant.vignette || SEQUENCE_DOC.verbatim}.`,
    `Question du QCM : ${qcmCourant.question}`,
    `Réponse attendue au QCM : ${bonneRep ? bonneRep.texte : ""} (${bonneRep ? bonneRep.feedback : ""}).`,
    `Réponse choisie par l'élève : ${etat.dernierFeedback || "non précisée"}.`,
    `Question complémentaire posée par l'élève : « ${qNettoyee} »`
  ].join("\n");

  const payload = {
    systemInstruction: { parts: [{ text: consignesSysteme }] },
    contents: [{ role: "user", parts: [{ text: contexteQuestion }] }],
    generationConfig: {
      temperature: 0.45,
      maxOutputTokens: 450
    }
  };

  let texteReponse = "";
  const modeles = ["gemini-2.5-flash", "gemini-2.0-flash"];

  for(const modele of modeles){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modele}:generateContent?key=${encodeURIComponent(CLE_API_GEMINI)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error?.message || `Erreur HTTP ${res.status}`);
      }
      const data = await res.json();
      const candidat = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "";
      if(candidat.trim()){
        texteReponse = candidat.trim();
        break;
      }
    }catch(err){
      texteReponse = `Impossible de joindre le service d'analyse philosophique (${err.message}). Vérifiez la connexion réseau ou la validité de la clé API.`;
    }
  }

  if(!etat.performances.recherchesIA) etat.performances.recherchesIA = {};
  etat.performances.recherchesIA[qcmCourant.id] = {
    question: qNettoyee,
    reponse: texteReponse,
    date: new Date().toISOString()
  };

  requeteIaEnCours = false;
  magasin.save();
  rendreVoletDroit();
}

/* ---------- Reconstruction des index dérivés ---------- */
function reconstruireCatalogues(){
  catalogueTags = extraireTagsDepuisBase(etat.baseQCM);
  catalogueSujets = genererSujetsDepuisQCM(etat.baseQCM);

  if(!etat.sujetActifId || !catalogueSujets.some(s => s.id === etat.sujetActifId)){
    etat.sujetActifId = catalogueSujets[0] ? catalogueSujets[0].id : null;
  }
  if(!etat.qcmFiltresIds || etat.qcmFiltresIds.length === 0){
    const sujet = obtenirSujetActif();
    etat.qcmFiltresIds = sujet ? [...sujet.qcmIds] : etat.baseQCM.map(q => q.id);
  }
  if(!etat.performances.recherchesIA){
    etat.performances.recherchesIA = {};
  }
}

function obtenirSujetActif(){
  return catalogueSujets.find(s => s.id === etat.sujetActifId) || catalogueSujets[0] || null;
}

/* ---------- Rendu de l'apparence & des règles ---------- */
function appliquerParams(p){
  const r = document.documentElement.style;
  r.setProperty("--encre-esprit", MARQUAGES[p.marquage] || p.marquage);
  r.setProperty("--interligne", p.interligne);
  r.setProperty("--taille-corps", p.taille + "px");
  r.setProperty("--papier", PAPIERS[p.papier] || "#ffffff");
  document.getElementById("regle-h").style.display = p.regle ? "" : "none";
  document.getElementById("regle-v").style.display = p.regle ? "" : "none";
}

function dessinerRegles(){
  const px = 37.8;
  const h = document.getElementById("regle-h");
  const v = document.getElementById("regle-v");
  h.innerHTML = ""; v.innerHTML = "";
  const largCm = Math.floor((feuille.clientWidth - 144) / px);
  const hautCm = Math.floor((feuille.clientHeight - 108) / px);
  for(let c=0; c<=largCm; c++){
    const t = document.createElement("div");
    t.className = "graduation" + (c%2===0 ? " majeure" : "");
    t.style.left = (c*px) + "px";
    h.appendChild(t);
    if(c>0 && c%2===0){
      const n = document.createElement("div");
      n.className = "nombre"; n.textContent = c;
      n.style.left = (c*px) + "px";
      h.appendChild(n);
    }
  }
  for(let c=0; c<=hautCm; c++){
    const t = document.createElement("div");
    t.className = "graduation" + (c%2===0 ? " majeure" : "");
    t.style.top = (c*px) + "px";
    v.appendChild(t);
  }
}

/* ---------- Rendu du Nuage de tags dynamique ---------- */
function rendreNuageTags(){
  const texteActuel = normaliserMot(editeur.innerText || "");
  conteneurNuage.innerHTML = "";

  const tagsDynamiques = catalogueTags.map(tag => {
    let presentDansTexte = false;
    for(const f of tag.formes){
      if(texteActuel.includes(normaliserMot(f))){
        presentDansTexte = true;
        break;
      }
    }
    return {
      ...tag,
      presentDansTexte,
      scoreDynamique: tag.poids + (presentDansTexte ? 6 : 0)
    };
  }).sort((a, b) => b.scoreDynamique - a.scoreDynamique);

  const maxScore = Math.max(...tagsDynamiques.map(t => t.scoreDynamique), 1);

  tagsDynamiques.forEach(tag => {
    const btn = document.createElement("button");
    btn.type = "button";
    const estPreselect = etat.tagsPreselectionnes.includes(tag.cle);
    btn.className = "tag-nuage"
      + (tag.presentDansTexte ? " active-texte" : "")
      + (estPreselect ? " selectionne" : "");

    const ratio = tag.scoreDynamique / maxScore;
    const taillePx = Math.round(11.5 + ratio * 5);
    btn.style.fontSize = taillePx + "px";
    btn.textContent = tag.label;
    btn.title = `${tag.qcmIds.size} QCM lié(s) — cliquez ou touchez pour sélectionner/désélectionner`;

    btn.addEventListener("click", ()=>{
      const pos = etat.tagsPreselectionnes.indexOf(tag.cle);
      if(pos >= 0){
        etat.tagsPreselectionnes.splice(pos, 1);
      } else {
        etat.tagsPreselectionnes.push(tag.cle);
      }
      rendreNuageTags();
    });

    conteneurNuage.appendChild(btn);
  });

  const nb = etat.tagsPreselectionnes.length;
  btnValiderTags.textContent = nb > 0 ? `Sélectionner (${nb})` : "Sélectionner";
}

btnValiderTags.addEventListener("click", ()=>{
  etat.tagsSelectionnes = [...etat.tagsPreselectionnes];
  if(etat.tagsSelectionnes.length === 0){
    const sujet = obtenirSujetActif();
    etat.qcmFiltresIds = sujet ? [...sujet.qcmIds] : etat.baseQCM.map(q => q.id);
  } else {
    const idsSet = new Set();
    etat.tagsSelectionnes.forEach(cle => {
      const tagObj = catalogueTags.find(t => t.cle === cle);
      if(tagObj){
        tagObj.qcmIds.forEach(id => idsSet.add(id));
      }
    });
    etat.qcmFiltresIds = idsSet.size > 0 ? Array.from(idsSet) : etat.baseQCM.map(q => q.id);
  }
  etat.indexQcmCourant = 0;
  etat.dernierFeedback = "";
  etat.performances.historiqueChoix.push({
    type: "selection_tags",
    tags: [...etat.tagsSelectionnes],
    qcmCibles: [...etat.qcmFiltresIds],
    date: new Date().toISOString()
  });
  magasin.save();
  rendreVoletDroit();
});

btnViderTags.addEventListener("click", ()=>{
  etat.tagsPreselectionnes = [];
  etat.tagsSelectionnes = [];
  const sujet = obtenirSujetActif();
  etat.qcmFiltresIds = sujet ? [...sujet.qcmIds] : etat.baseQCM.map(q => q.id);
  etat.indexQcmCourant = 0;
  etat.dernierFeedback = "";
  magasin.save();
  rendreNuageTags();
  rendreVoletDroit();
});

/* ---------- Éditeur continu au kilomètre ---------- */
function initialiserEditeurKm(){
  try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(e){}
  if(etat.contenuHTML){
    editeur.innerHTML = etat.contenuHTML;
  }

  feuille.addEventListener("click", (e)=>{
    if(e.target === feuille){
      editeur.focus();
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(editeur);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
      derniereSelectionRange = range.cloneRange();
    }
  });

  const sauverCurseur = ()=>{
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0){
      const r = sel.getRangeAt(0);
      if(editeur.contains(r.commonAncestorContainer)){
        derniereSelectionRange = r.cloneRange();
      }
    }
  };
  editeur.addEventListener("keyup", sauverCurseur);
  editeur.addEventListener("mouseup", sauverCurseur);
  editeur.addEventListener("focus", sauverCurseur);

  editeur.addEventListener("input", ()=>{
    statutFrappe.classList.add("en-frappe");
    libelleSync.textContent = "Frappe au kilomètre en cours...";
    majCompteurs();

    clearTimeout(timerFrappe);
    timerFrappe = setTimeout(()=>{
      etat.contenuHTML = editeur.innerHTML;
      magasin.save();
      statutFrappe.classList.remove("en-frappe");
      libelleSync.textContent = "Analyse & nuage de tags synchronisés";
      rendreNuageTags();
      rendreVoletDroit();
    }, 550);
  });

  majCompteurs();
}

function majCompteurs(){
  const txt = (editeur.innerText || "").trim();
  const nbMots = txt ? txt.split(/\s+/).length : 0;
  compteurMots.textContent = nbMots + (nbMots > 1 ? " mots" : " mot");

  const reponses = Object.values(etat.performances.reponsesQCM || {});
  const nbBonnes = reponses.filter(r => r.correct).length;
  scoreInline.textContent = `QCM : ${nbBonnes}/${reponses.length} réussi(s)`;
}

function insererDansTexte(phrase){
  editeur.focus();
  const sel = window.getSelection();
  let range = derniereSelectionRange;
  if(!range || !editeur.contains(range.commonAncestorContainer)){
    range = document.createRange();
    range.selectNodeContents(editeur);
    range.collapse(false);
  }
  sel.removeAllRanges();
  sel.addRange(range);

  const span = document.createElement("span");
  span.className = "insertion-fraiche";
  span.textContent = " " + phrase + " ";
  range.deleteContents();
  range.insertNode(span);

  const apres = document.createRange();
  apres.setStartAfter(span);
  apres.collapse(true);
  sel.removeAllRanges();
  sel.addRange(apres);
  derniereSelectionRange = apres.cloneRange();

  setTimeout(()=> span.classList.remove("insertion-fraiche"), 1600);
  etat.contenuHTML = editeur.innerHTML;
  magasin.save();
  majCompteurs();
  rendreNuageTags();
  rendreVoletDroit();
}

/* ---------- Volet de droite : vérification du devoir + QCM ciblés + barre de recherche IA ---------- */
function rendreVoletDroit(){
  zoneEsprit.className = "zone-esprit modele-" + (etat.params.modele || "pronote");
  zoneEsprit.innerHTML = "";

  const qcmList = etat.qcmFiltresIds
    .map(id => etat.baseQCM.find(q => q.id === id))
    .filter(Boolean);

  const listeActive = qcmList.length > 0 ? qcmList : etat.baseQCM;
  if(etat.indexQcmCourant >= listeActive.length) etat.indexQcmCourant = 0;
  const qcmCourant = listeActive[etat.indexQcmCourant];

  /* 1. Barre de bascule rapide d'un QCM à l'autre */
  const entete = document.createElement("div");
  entete.className = "entete-qcm";

  const navBox = document.createElement("div");
  navBox.className = "nav-qcm-rapide";

  const btnPrev = document.createElement("button");
  btnPrev.className = "btn-nav-qcm";
  btnPrev.textContent = "◀";
  btnPrev.title = "QCM précédent";
  btnPrev.addEventListener("click", ()=>{
    etat.indexQcmCourant = (etat.indexQcmCourant - 1 + listeActive.length) % listeActive.length;
    etat.dernierFeedback = "";
    magasin.save();
    rendreVoletDroit();
  });

  const indicateur = document.createElement("span");
  indicateur.textContent = `QCM ${etat.indexQcmCourant + 1}/${listeActive.length}`;

  const btnNext = document.createElement("button");
  btnNext.className = "btn-nav-qcm";
  btnNext.textContent = "▶";
  btnNext.title = "QCM suivant";
  btnNext.addEventListener("click", ()=>{
    etat.indexQcmCourant = (etat.indexQcmCourant + 1) % listeActive.length;
    etat.dernierFeedback = "";
    magasin.save();
    rendreVoletDroit();
  });

  navBox.appendChild(btnPrev);
  navBox.appendChild(indicateur);
  navBox.appendChild(btnNext);

  const selectDirect = document.createElement("select");
  selectDirect.className = "select-qcm-direct";
  selectDirect.title = "Basculer directement vers un QCM";
  listeActive.forEach((item, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${i + 1}. ${item.axe}`;
    if(i === etat.indexQcmCourant) opt.selected = true;
    selectDirect.appendChild(opt);
  });
  selectDirect.addEventListener("change", (e)=>{
    etat.indexQcmCourant = Number(e.target.value);
    etat.dernierFeedback = "";
    magasin.save();
    rendreVoletDroit();
  });

  entete.appendChild(navBox);
  entete.appendChild(selectDirect);
  zoneEsprit.appendChild(entete);

  /* 2. Vérification de la réponse écrite */
  const sujetActif = obtenirSujetActif();
  const verif = verifierTexteContreSujet(editeur.innerText || "", sujetActif);
  if(verif.score > (etat.performances.meilleurScoreRedaction || 0)){
    etat.performances.meilleurScoreRedaction = verif.score;
  }

  const blocVerif = document.createElement("div");
  blocVerif.className = "verif-sujet";
  blocVerif.innerHTML = `
    <div class="verif-header">
      <span>Vérification du texte / Sujet</span>
      <span>${verif.score}% des notions attendues</span>
    </div>
    <div class="jauge-barre"><div class="jauge-remplissage" style="width:${verif.score}%"></div></div>
    <div class="verif-detail">
      ${verif.trouves.length > 0
        ? `<strong>Concepts repérés :</strong> ${verif.trouves.slice(0, 6).join(", ")}.<br>`
        : `<strong>En attente :</strong> commencez à rédiger pour comparer votre texte aux attendus.<br>`}
      ${verif.manquants.length > 0
        ? `<strong>À mobiliser :</strong> ${verif.manquants.slice(0, 5).join(", ")}.`
        : `Tous les concepts attendus pour ce sujet sont présents !`}
    </div>
  `;
  zoneEsprit.appendChild(blocVerif);

  /* 3. Petits tags correspondant au QCM affiché */
  const tagsDuQcm = catalogueTags.filter(t => t.qcmIds.has(qcmCourant.id));
  if(tagsDuQcm.length > 0){
    const zonePetitsTags = document.createElement("div");
    zonePetitsTags.className = "tags-volet-droit";
    tagsDuQcm.forEach(t => {
      const sp = document.createElement("span");
      const estMatch = etat.tagsSelectionnes.includes(t.cle);
      sp.className = "mini-tag" + (estMatch ? " match" : "");
      sp.textContent = "#" + t.label;
      zonePetitsTags.appendChild(sp);
    });
    zoneEsprit.appendChild(zonePetitsTags);
  }

  /* 4. Question QCM active, feedback et barre de recherche IA (limitée à 1 question par question QCM) */
  const s = document.createElement("p");
  s.className = "sujet";
  s.textContent = qcmCourant.axe;
  zoneEsprit.appendChild(s);

  if(qcmCourant.vignette){
    const vg = document.createElement("p");
    vg.className = "vignette";
    vg.textContent = qcmCourant.vignette;
    zoneEsprit.appendChild(vg);
  }

  const rechercheIaExistante = etat.performances.recherchesIA
    ? etat.performances.recherchesIA[qcmCourant.id]
    : null;

  if(etat.dernierFeedback || rechercheIaExistante){
    const rp = document.createElement("div");
    rp.className = "reponse";

    if(etat.dernierFeedback){
      const txt = document.createElement("div");
      txt.textContent = etat.dernierFeedback;
      rp.appendChild(txt);

      if(qcmCourant.amorceInsertion){
        const btnIns = document.createElement("button");
        btnIns.type = "button";
        btnIns.className = "btn-inserer-amorce";
        btnIns.textContent = "+ Insérer cette idée au curseur";
        btnIns.addEventListener("click", ()=> insererDansTexte(qcmCourant.amorceInsertion));
        rp.appendChild(btnIns);
      }
    }

    /* Barre de recherche IA placée directement sous la réponse obtenue après la question QCM */
    const zoneIa = document.createElement("div");
    zoneIa.className = "zone-ia-qcm";

    const iaEntete = document.createElement("div");
    iaEntete.className = "ia-entete";
    iaEntete.innerHTML = `
      <span>Approfondissement philosophique (IA)</span>
      <span>${rechercheIaExistante ? "Quota utilisé (1/1)" : "1 question autorisée"}</span>
    `;
    zoneIa.appendChild(iaEntete);

    const formIa = document.createElement("form");
    formIa.className = "ia-form-ligne";

    const inputIa = document.createElement("input");
    inputIa.type = "text";
    inputIa.className = "ia-input";
    inputIa.placeholder = rechercheIaExistante
      ? "Question déjà posée pour ce QCM"
      : "Poser une question philosophique sur cette réponse...";
    inputIa.disabled = Boolean(rechercheIaExistante) || requeteIaEnCours;
    if(rechercheIaExistante){
      inputIa.value = rechercheIaExistante.question;
    }

    const btnDemander = document.createElement("button");
    btnDemander.type = "submit";
    btnDemander.className = "ia-btn";
    btnDemander.textContent = requeteIaEnCours ? "Analyse..." : "Demander";
    btnDemander.disabled = Boolean(rechercheIaExistante) || requeteIaEnCours;

    formIa.addEventListener("submit", (e)=>{
      e.preventDefault();
      if(!rechercheIaExistante && !requeteIaEnCours && inputIa.value.trim()){
        interrogerIaPhilosophie(qcmCourant, inputIa.value);
      }
    });

    formIa.appendChild(inputIa);
    formIa.appendChild(btnDemander);
    zoneIa.appendChild(formIa);

    if(rechercheIaExistante && rechercheIaExistante.reponse){
      const blocRepIa = document.createElement("div");
      blocRepIa.className = "ia-reponse-academique";

      const badgeProf = document.createElement("span");
      badgeProf.className = "ia-badge-prof";
      badgeProf.textContent = "Éclairage philosophique — Niveau Terminale";
      blocRepIa.appendChild(badgeProf);

      rechercheIaExistante.reponse.split(/\n+/).filter(Boolean).forEach(para => {
        const p = document.createElement("p");
        p.textContent = para;
        blocRepIa.appendChild(p);
      });

      zoneIa.appendChild(blocRepIa);
    }

    rp.appendChild(zoneIa);
    zoneEsprit.appendChild(rp);
  }

  const q = document.createElement("p");
  q.className = "question";
  q.textContent = qcmCourant.question;
  zoneEsprit.appendChild(q);

  const boite = document.createElement("div");
  boite.className = "qcm";
  qcmCourant.options.forEach((opt, optIdx) => {
    const b = document.createElement("button");
    b.className = "choix";
    b.textContent = opt.texte;
    b.addEventListener("click", ()=>{
      etat.dernierFeedback = (opt.correct ? "✓ " : "✗ ") + opt.feedback;
      etat.performances.reponsesQCM[qcmCourant.id] = {
        optionIndex: optIdx,
        correct: Boolean(opt.correct),
        question: qcmCourant.question,
        date: new Date().toISOString()
      };
      magasin.save();
      majCompteurs();
      rendreVoletDroit();
    });
    boite.appendChild(b);
  });
  zoneEsprit.appendChild(boite);
}

  Object.keys(MODELES).forEach(id => {

    b.innerHTML = `<span class='nom'>${M.nom}</span><br><span class='devise'>${M.devise}</span>`;
    b.addEventListener("click", ()=>{
      etat.params.modele = id;
      magasin.save();
      rendreVoletDroit();
      menuModeles.hidden = true;
    });
    liste.appendChild(b);
  });
  menuModeles.hidden = false;
}

/* ---------- Panneau Contrat & Bilan des Performances ---------- */
const PARAMS_LIBELLES = [
  {cle:"modele",   intitule:"apparence du volet QCM", options:Object.keys(MODELES)},
  {cle:"marquage", intitule:"couleur institutionnelle", options:Object.keys(MARQUAGES)},
  {cle:"regle",    intitule:"règle graduée autour de la feuille", options:[true, false]},
  {cle:"taille",   intitule:"taille de police (px)", options:[16, 18, 20]},
  {cle:"papier",   intitule:"fond de feuille", options:Object.keys(PAPIERS)}
];

function ouvrirPanneau(){
  const brouillonParams = Object.assign({}, etat.params);
  const zoneP = document.getElementById("articles-contrat");
  zoneP.innerHTML = "";

  PARAMS_LIBELLES.forEach((def, idx) => {
    const ligne = document.createElement("p");
    ligne.className = "article-param";
    ligne.innerHTML = `Article ${idx + 1} — ${def.intitule} : `;
    const val = document.createElement("button");
    val.className = "valeur";
    const affiche = ()=>{
      const v = brouillonParams[def.cle];
      val.textContent = (typeof v === "boolean") ? (v ? "visible" : "masquée") : String(v);
    };
    affiche();
    val.addEventListener("click", ()=>{
      const i = def.options.indexOf(brouillonParams[def.cle]);
      brouillonParams[def.cle] = def.options[(i + 1) % def.options.length];
      affiche();
    });
    ligne.appendChild(val);
    zoneP.appendChild(ligne);
  });

  const reps = Object.values(etat.performances.reponsesQCM || {});
  const bonnes = reps.filter(r => r.correct).length;
  const nbRecherchesIa = Object.keys(etat.performances.recherchesIA || {}).length;
  const verif = verifierTexteContreSujet(editeur.innerText || "", obtenirSujetActif());
  document.getElementById("stats-perf").innerHTML = `
    <strong>Bilan des performances enregistrées :</strong><br>
- QCM dans la base active : <strong>${etat.baseQCM.length}</strong> (${catalogueSujets.length} sujets générés)<br>
- Réponses QCM validées : <strong>${bonnes} / ${reps.length}</strong><br>
- Questions IA philosophiques utilisées : <strong>${nbRecherchesIa} / ${etat.baseQCM.length}</strong><br>
- Couverture notionnelle du texte actuel : <strong>${verif.score}%</strong> (record : ${etat.performances.meilleurScoreRedaction || verif.score}%)<br>
- Actions mémorisées (choix de sujets &amp; sélections de tags) : <strong>${etat.performances.historiqueChoix.length}</strong>
  `;

  const act = document.getElementById("actions-contrat");
  act.innerHTML = "";
  const faire = (txt, fn, cls)=>{
    const b = document.createElement("button");
    b.className = "action" + (cls ? " " + cls : "");
    b.textContent = txt;
    b.addEventListener("click", fn);
    act.appendChild(b);
  };
  faire("Appliquer", ()=>{
    etat.params = Object.assign({}, brouillonParams);
    magasin.save();
    appliquerParams(etat.params);
    rendreVoletDroit();
    panneau.hidden = true;
  });
  faire("Réinitialiser tout", ()=>{
    magasin.clear();
    location.reload();
  }, "dangereuse");
  faire("Fermer", ()=>{ panneau.hidden = true; });

  panneau.hidden = false;
}

/* ---------- Export & Import JSON avec fusion additive dans la base ---------- */
function exporter(){
  etat.contenuHTML = editeur.innerHTML;
  const verif = verifierTexteContreSujet(editeur.innerText || "", obtenirSujetActif());
  const doc = {
    format: "feuille-blanche-pronote-base",
    version: VERSION,
    date: new Date().toISOString(),
    params: etat.params,
    baseQCM: etat.baseQCM,
    sujetActifId: etat.sujetActifId,
    tagsSelectionnes: etat.tagsSelectionnes,
    texteBrut: editeur.innerText,
    contenuHTML: etat.contenuHTML,
    performances: {
      ...etat.performances,
      scoreVerificationActuel: verif.score,
      conceptsReperes: verif.trouves
    }
  };
  const blob = new Blob([JSON.stringify(doc, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "feuille-pronote-session-" + doc.date.slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function importer(file){
  try{
    const doc = JSON.parse(await file.text());
    let ajoutsQCM = 0;

    const qcmImportes = Array.isArray(doc.baseQCM) ? doc.baseQCM : (Array.isArray(doc.qcm) ? doc.qcm : []);
    if(qcmImportes.length > 0){
      const questionsExistantes = new Set(etat.baseQCM.map(q => q.question.trim().toLowerCase()));
      qcmImportes.forEach((item, i) => {
        if(item && item.question && Array.isArray(item.options)){
          const cleQ = item.question.trim().toLowerCase();
          if(!questionsExistantes.has(cleQ)){
            etat.baseQCM.push({
              id: item.id && !etat.baseQCM.some(e => e.id === item.id) ? item.id : `qcm-imp-${Date.now()}-${i}`,
              axe: item.axe || "Thème importé",
              question: item.question,
              vignette: item.vignette || "",
              amorceInsertion: item.amorceInsertion || "",
              options: item.options
            });
            questionsExistantes.add(cleQ);
            ajoutsQCM++;
          }
        }
      });
    }

    if(doc.contenuHTML || doc.texteBrut){
      const blocImport = doc.contenuHTML || `<p>${doc.texteBrut}</p>`;
      if(editeur.innerText.trim().length > 0){
        editeur.innerHTML += `<p><em>--- Document importé ---</em></p>` + blocImport;
      } else {
        editeur.innerHTML = blocImport;
      }
      etat.contenuHTML = editeur.innerHTML;
    }

    if(doc.performances){
      if(doc.performances.reponsesQCM){
        etat.performances.reponsesQCM = Object.assign({}, etat.performances.reponsesQCM, doc.performances.reponsesQCM);
      }
      if(doc.performances.recherchesIA){
        etat.performances.recherchesIA = Object.assign({}, etat.performances.recherchesIA, doc.performances.recherchesIA);
      }
      if(Array.isArray(doc.performances.historiqueChoix)){
        etat.performances.historiqueChoix.push(...doc.performances.historiqueChoix);
      }
    }

    reconstruireCatalogues();
    magasin.save();
    majCompteurs();
    rendreMenuSujets();
    rendreNuageTags();
    etat.dernierFeedback = `✓ Import réussi : +${ajoutsQCM} nouveau(x) QCM ajouté(s) à la base (${etat.baseQCM.length} au total) et nouveaux sujets générés.`;
    rendreVoletDroit();
  }catch(err){
    etat.dernierFeedback = "✗ Erreur d'importation : fichier JSON invalide.";
    rendreVoletDroit();
  }
}

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    if(!listeSujetsGeneres.hidden){ listeSujetsGeneres.hidden = true; return; }
    if(!menuModeles.hidden){ menuModeles.hidden = true; return; }
    if(!panneau.hidden) panneau.hidden = true;
    else ouvrirPanneau();
  }
});

document.getElementById("btn-sauvegarder").addEventListener("click", exporter);
document.getElementById("btn-importer").addEventListener("click", ()=>document.getElementById("fichier").click());
document.getElementById("fichier").addEventListener("change", (e)=>{
  if(e.target.files[0]) importer(e.target.files[0]);
  e.target.value = "";
});

const cmdZone = document.getElementById("commandes");
const btnApparence = document.createElement("button");
btnApparence.textContent = "Apparence";
btnApparence.addEventListener("click", ouvrirMenuModeles);
cmdZone.appendChild(btnApparence);

const btnContrat = document.createElement("button");

btnContrat.addEventListener("click", ouvrirPanneau);
cmdZone.appendChild(btnContrat);

const sauve = magasin.load();
if(sauve && sauve.version === VERSION){
  etat = Object.assign(etat, sauve);
}

reconstruireCatalogues();
appliquerParams(etat.params);
window.addEventListener("resize", dessinerRegles);

dessinerRegles();
rendreExtrait();
rendreMenuSujets();
initialiserEditeurKm();
rendreNuageTags();
rendreVoletDroit();
</script>
