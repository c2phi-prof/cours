ndrent dès qu'on les examine. Le sage, au contraire, est précisément celui qui sait qu'il ne sait pas. La maïeutique, l'art de faire « accoucher » les esprits, est la première démarche de la connaissance : se déprendre de ses fausses certitudes. Celui qui connaît ses limites en sait déjà davantage : la conscience des limites est une conquête du savoir, non son échec."}, {"text": "Le savoir et l'ignorance sont la même chose, puisque connaître ses limites revient à ne rien savoir.", "correct": false, "feedback": "Le paradoxe est une contradiction apparente : se demander si l'on peut tout connaître, c'est déjà distinguer ce que l'on sait et ce que l'on ne sait pas ; or, pour délimiter l'inconnu, il faut déjà en savoir quelque chose. Socrate, dans les dialogues de Platon (l'Alcibiade ou le Gorgias), montre que la plupart des hommes croient savoir alors qu'ils ne possèdent que des opinions (la doxa) sans fondement, qui s'effondrent dès qu'on les examine. Le sage, au contraire, est précisément celui qui sait qu'il ne sait pas. La maïeutique, l'art de faire « accoucher » les esprits, est la première démarche de la connaissance : se déprendre de ses fausses certitudes. Celui qui connaît ses limites en sait déjà davantage : la conscience des limites est une conquête du savoir, non son échec."}]}, {"type": "single", "name": "Vrai ou faux : chez Descartes, le doute méthodique du Discours de la méthode est un renoncement au savoir.", "options": [{"text": "Faux", "correct": true, "feedback": "Faux : le doute n'est pas ici le renoncement au savoir, mais son instrument. Descartes, dans le Discours de la méthode, propose de suspendre toute croyance jusqu'à atteindre une certitude indubitable : le doute est le moyen d'éliminer l'erreur pour ne retenir que des vérités solides. C'est pourquoi la connaissance commence par un travail sur soi : distinguer le savoir véritable des simples opinions non fondées. Loin d'être une puissance sans bornes, la connaissance commence par apprendre ce qu'elle ne sait pas ; le doute cartésien est une conquête du savoir sur l'illusion."}, {"text": "Vrai", "correct": false, "feedback": "Faux : le doute n'est pas ici le renoncement au savoir, mais son instrument. Descartes, dans le Discours de la méthode, propose de suspendre toute croyance jusqu'à atteindre une certitude indubitable : le doute est le moyen d'éliminer l'erreur pour ne retenir que des vérités solides. C'est pourquoi la connaissance commence par un travail sur soi : distinguer le savoir véritable des simples opinions non fondées. Loin d'être une puissance sans bornes, la connaissance commence par apprendre ce qu'elle ne sait pas ; le doute cartésien est une conquête du savoir sur l'illusion."}]}, {"type": "single", "name": "Selon Popper, à quelle condition une théorie est-elle scientifique, et quelle en est la conséquence ?", "options": [{"text": "Elle doit être falsifiable, c'est-à-dire réfutable par l'expérience ; donc aucune théorie scientifique n'est définitive.", "correct": true, "feedback": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}, {"text": "Elle doit être définitivement démontrée une fois pour toutes ; la science atteint alors des vérités immuables.", "correct": false, "feedback": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}, {"text": "Elle doit être acceptée par la majorité des savants, sans quoi elle est fausse.", "correct": false, "feedback": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}, {"text": "Elle doit être cohérente avec les théories dominantes, sans quoi elle est réfutée d'avance.", "correct": false, "feedback": "Popper montre qu'une théorie n'est scientifique que si elle est falsifiable, c'est-à-dire réfutable par l'expérience. Or cette exigence a une conséquence décisive : aucune théorie scientifique n'est définitive, puisque demeurer scientifique, c'est rester exposé à la réfutation. La science ne peut donc pas tout connaître au sens d'un savoir total et clos : elle est au contraire l'entreprise qui se réforme sans cesse. Kuhn le confirme : la science progresse par révolutions, où les paradigmes dominants sont remplacés par de nouveaux cadres théoriques, preuve que ce que nous appelons « connaissance » est toujours daté, relatif à un cadre, et jamais la chose même dans sa totalité."}]}, {"type": "short", "name": "Selon Kant, nous ne pouvons connaître que les phénomènes, et jamais les choses en soi. Quel terme désigne la chose en soi, ce qui échappe à la connaissance ?", "answers": ["le noumène", "noumène", "les noumènes", "la chose en soi", "choses en soi", "le phénomène"], "feedback": "Le noumène, c'est la chose en soi, par opposition au phénomène, la chose telle qu'elle apparaît à travers les structures de notre esprit. Kant soutient que nous ne pouvons connaître que les phénomènes : la connaissance humaine est toujours conditionnée, il n'existe pas de point de vue de nulle part d'où le réel serait saisi tel qu'il est indépendamment de nous. Ce n'est pas un défaut provisoire que la technique corrigerait, mais une condition de tout savoir possible : on ne peut pas tout connaître sans cesser d'être celui qui connaît. C'est une limite de droit, inscrite dans la nature même de la connaissance, non une limite de fait, provisoire et reculable. Attention à ne pas confondre les deux termes : phénomène et noumène."}, {"type": "single", "name": "Vrai ou faux : pour Kant, l'impossibilité de connaître les choses en soi est un défaut provisoire de la connaissance, que le progrès des techniques corrigera un jour.", "options": [{"text": "Faux", "correct": true, "feedback": "Faux : ce n'est pas là un défaut provisoire, que la technique corrigerait, mais une condition de tout savoir possible. Chez Kant, la limite de la connaissance aux phénomènes est une limite de droit, inscrite dans la nature même de la connaissance, qu'aucun progrès ne pourra dépasser. La connaissance humaine est toujours conditionnée : il n'existe pas de point de vue de nulle part, d'où le réel serait saisi tel qu'il est indépendamment de nous. On ne peut pas tout connaître sans cesser d'être celui qui connaît. La limitation des perspectives est la condition de tout savoir, non son échec. Ne pas confondre : une limite de fait est provisoire et reculable (perfection de nos instruments), une limite de droit ne peut pas être dépassée."}, {"text": "Vrai", "correct": false, "feedback": "Faux : ce n'est pas là un défaut provisoire, que la technique corrigerait, mais une condition de tout savoir possible. Chez Kant, la limite de la connaissance aux phénomènes est une limite de droit, inscrite dans la nature même de la connaissance, qu'aucun progrès ne pourra dépasser. La connaissance humaine est toujours conditionnée : il n'existe pas de point de vue de nulle part, d'où le réel serait saisi tel qu'il est indépendamment de nous. On ne peut pas tout connaître sans cesser d'être celui qui connaît. La limitation des perspectives est la condition de tout savoir, non son échec. Ne pas confondre : une limite de fait est provisoire et reculable (perfection de nos instruments), une limite de droit ne peut pas être dépassée."}]}, {"type": "single", "name": "Le désaccord séculaire entre empiristes (Locke, Hume) et rationalistes (Descartes, Spinoza) contredit-il la thèse des limites de droit de la connaissance ?", "options": [{"text": "Non : ce désaccord montre que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même.", "correct": true, "feedback": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou rationalistes comme Descartes et Spinoza (qui soutiennent que la raison atteint seule des vérités universelles), prouve que cette question n'est pas réglée et que ses limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}, {"text": "Oui : puisque les philosophes ne sont pas d'accord, les limites de la connaissance ne sont que des limites de fait, aisément reculables.", "correct": false, "feedback": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou rationalistes comme Descartes et Spinoza (qui soutiennent que la raison atteint seule des vérités universelles), prouve que cette question n'est pas réglée et que ses limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}, {"text": "Oui : le désaccord des philosophes prouve que la connaissance n'a aucune limite.", "correct": false, "feedback": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou rationalistes comme Descartes et Spinoza (qui soutiennent que la raison atteint seule des vérités universelles), prouve que cette question n'est pas réglée et que ses limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}, {"text": "La question est sans importance, car seules les sciences et non la philosophie peuvent trancher ce débat.", "correct": false, "feedback": "On peut objecter que le désaccord même des philosophes de la connaissance, empiristes comme Locke et Hume (qui fondent tout savoir sur l'expérience sensible) ou rationalistes comme Descartes et Spinoza (qui soutiennent que la raison atteint seule des vérités universelles), prouve que cette question n'est pas réglée et que ses limites sont peut-être de simple fait. Mais l'objection confirme l'analyse : ce désaccord, vieux de plusieurs siècles, montre précisément que la question des sources et des limites de la connaissance est constitutive de la connaissance elle-même. Une science qui ignorerait ce qu'elle peut savoir ne saurait pas ce qu'elle dit. Connaître ses limites, c'est déjà les mesurer, et le doute cartésien ou la critique kantienne sont des conquêtes du savoir sur l'illusion."}]}, {"type": "single", "name": "Que montre Lévi-Strauss à propos des mythes et des systèmes de parenté, et pourquoi cela limite-t-il la connaissance ?", "options": [{"text": "Chaque culture découpe le réel selon ses catégories, symboles et rites, et ce découpage précède toute recherche savante : aucun point de vue absolu n'existe pour un être culturel.", "correct": true, "feedback": "Lévi-Strauss a montré que les mythes et les systèmes de parenté sont des réponses élaborées par les sociétés humaines pour organiser et comprendre le monde : chaque culture découpe le réel selon ses catégories, ses symboles, ses rites, et ce découpage précède toute recherche savante. Nous n'appréhendons jamais le monde à partir de rien, mais à partir d'un héritage de mots, de valeurs, de croyances. C'est une raison pour laquelle l'on ne peut pas tout connaître : il faudrait pouvoir se dégager de ses propres cadres pour les comparer tous, et ce point de vue nt, situé, qui perçoit par des sens limités, depuis un corps situé, dans un temps et une culture qui ne sont pas toute l'histoire ni toute culture : la finitude est son point de départ."}, {"text": "La culture n'influence que les arts, et n'a aucune prise sur la démarche scientifique.", "correct": false, "feedback": "Lévi-Strauss a montré que les mythes et les systèmes de parenté sont des réponses élaborées par les sociétés humaines pour organiser et comprendre le monde : chaque culture découpe le réel selon ses catégories, ses symboles, ses rites, et ce découpage précède toute recherche savante. Nous n'appréhendons jamais le monde à partir de rien, mais à partir d'un héritage de mots, de valeurs, de croyances. C'est une raison pour laquelle l'on ne peut pas tout connaître : il faudrait pouvoir se dégager de ses propres cadres pour les comparer tous, et ce point de vue absolu n'existe pas pour un être culturel. Le connaissant est un vivant, situé, qui perçoit par des sens limités, depuis un corps situé, dans un temps et une culture qui ne sont pas toute l'histoire ni toute culture : la finitude est son point de départ."}]}, {"type": "short", "name": "Quelle notion, définie par Rousseau comme une « qualité qui, à l'aide des circonstances, développe successivement toutes les autres », désigne la spécificité de l'homme ?", "answers": ["la perfectibilité", "perfectibilité", "la perfectibilite"], "feedback": "Rousseau fait de la perfectibilité la spécificité de l'homme, cette « qualité qui, à l'aide des circonstances, développe successivement toutes les autres » : l'homme est le seul être qui s'améliore au cours du temps, qui transmet, qui invente, qui corrige ses erreurs accumulées. Contrairement à l'animal, dont l'intelligence est enfermée dans l'instinct de l'espèce, l'homme accumule ses savoirs (grâce à l'écriture, l'école, la science) et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'épeler exactement : perfectibilité."}, {"type": "single", "name": "Vrai ou faux : puisque l'homme est fini et situé, il ne peut pas connaître davantage d'une génération à l'autre ; les limites de la connaissance sont immobiles.", "options": [{"text": "Faux", "correct": true, "feedback": "Faux : la finitude de l'homme n'enferme pas l'humanité dans l'ignorance, car elle est doublée d'une capacité proprement humaine : puisque Rousseau, la perfectibilité. L'homme accumule ses savoirs grâce à l'écriture, l'école, la science, et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse, sans que l'on puisse fixer un point où elles s'arrêteraient définitivement. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'homme ne choisit pas son point de vue, il l'hérite ; et pourtant l'inconnu se déplace avec lui comme l'horizon avec le marcheur."}, {"text": "Vrai", "correct": false, "feedback": "Faux : la finitude de l'homme n'enferme pas l'humanité dans l'ignorance, car elle est doublée d'une capacité proprement humaine : puisque Rousseau, la perfectibilité. L'homme accumule ses savoirs grâce à l'écriture, l'école, la science, et chaque génération part de ce que les précédentes ont découvert. Les limites de fait de la connaissance sont donc réelles, mais mobiles : elles reculent sans cesse, sans que l'on puisse fixer un point où elles s'arrêteraient définitivement. En ce sens, l'on ne peut pas tout connaître, mais l'on peut toujours connaître davantage : l'inconnu n'est pas un mur, c'est un chantier. L'homme ne choisit pas son point de vue, il l'hérite ; et pourtant l'inconnu se déplace avec lui comme l'horizon avec le marcheur."}]}, {"type": "single", "name": "Pourquoi le recours à l'art montre-t-il que la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance ?", "options": [{"text": "Parce que l'art explore lui-même des vérités sur l'expérience humaine, sur le monde et sur soi, de manière sensible et intuitive, mais sans remplacer le savoir objectif de la science.", "correct": true, "feedback": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}, {"text": "Parce que l'art remplace la science : seul l'art parvient à la connaissance totale du réel.", "correct": false, "feedback": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}, {"text": "Parce que l'art n'a rien à voir avec la connaissance : il ne produit que du plaisir esthétique.", "correct": false, "feedback": "Le cours sur la connaissance invite à considérer que l'art est lui-même une forme de recherche de la connaissance : contrairement à la science, qui vise des connaissances objectives par des méthodes systématiques, l'art explore des vérités sur l'expérience humaine, sur le monde et sur soi de manière sensible et intuitive. Une œuvre littéraire peut faire comprendre des relations humaines, des dilemmes moraux, des émotions complexes ; la peinture ou la musique explorent des dimensions de l'existence (souffrance, beauté, émerveillement) qui échappent à la seule rationalité. Si l'art révèle des aspects du réel difficiles d'accès par les concepts, alors la prétention de tout connaître par la seule science repose sur une idée trop pauvre de la connaissance. Mais l'inverse est vrai aussi : l'art ne remplace pas le savoir objectif. L'un et l'autre éclairent le réel chacun selon leur voie, sans jamais l'épuiser ensemble."}]}, {"type": "single", "name": "Sous la perspective de la morale et de la politique, que vient signifier le « peut-on » de « peut-on tout connaître » ?", "options": [{"text": "Le questionnement porte sur le droit : « en a-t-on le droit ? » ; le savoir devient une question de légitimité, car connaître c'est aussi pouvoir agir, prévoir, contrôler.", "correct": true, "feedback": "Sous la perspective morale et politique, le sens de la question change : « peut-on » ne signifie plus seulement « en est-on ca var HELP_DEF = "## Comment fonctionne ce QCM ?\n\n**Déroulement.** Le QCM présente les questions une par une. Choisissez votre réponse puis cliquez sur **Valider** : un encart affiche alors « Réponse acceptée. » ou l'explication du cours (encart « Explication » si la réponse ne convient pas). La barre de progression en haut indique votre avancement.\n\n**Types de questions.** Cinq formes possibles : choix unique (une seule bonne réponse), choix multiple (plusieurs bonnes réponses), réponse courte (tapez votre réponse, les variantes proches sont acceptées), association (relier chaque élément à sa définition) et texte à trous (complétez la phrase). Dans les questions à trous et les réponses courtes, la touche **Entrée** valide directement la réponse.\n\n**Écran de score.** À la fin, votre score s'affiche accompagné d'un bilan de votre performance : une appréciation d'ensemble, les types d'erreurs à corriger et deux conseils pour progresser.\n\n## L'écran « Revoir les réponses du QCM »\n\nDepuis l'écran de score, le bouton **Revoir les réponses du QCM** affiche le récapitulatif complet : pour chaque question, votre réponse, la bonne réponse mise en évidence et l'explication du cours.\n\n**Poser une question.** Sous chaque question du récapitulatif, le bouton **Poser une question** ouvre une recherche : la réponse est cherchée dans des sources en ligne (des pages consultées sont indiquées sous chaque réponse). Vous pouvez poser **plusieurs questions successives** : elles s'empilent les unes sous les autres et restent enregistrées dans le navigateur, même après avoir fermé la page. La touche Entrée envoie la question, le bouton **Réduire** referme la conversation.\n\n**Enregistrer.** Deux exports sont possibles :\n- **Enregistrer les questions et réponses (texte)** (en haut du récapitulatif) : enregistre uniquement les questions que vous avez posées et les réponses obtenues.\n- **Enregistrer mon résultat** (en bas de page) : enregistre tout votre résultat (chaque question, votre réponse, la réponse attendue, l'explication du cours) ainsi que toutes les questions posées et les réponses obtenues.\n\nLes fichiers obtenus sont des fichiers texte que vous pouvez conserver, imprimer ou consulter plus tard.\n\n## Apparence et navigation\n\n\n- Les deux boutons ronds à droite de l'écran permettent de **remonter tout en haut** (flèche du haut) ou de **descendre tout en bas** (flèche du bas) du QCM.\n- Chaque appareil dispose d'une **limite quotidienne d'utilisation** pour un QCM donné : au-delà, les recherches de réponses ne sont plus possibles jusqu'au lendemain, mais le QCM reste utilisable.";

function nbsp(s){return String(s).replace(/ ([;:!?])/g,'\u00A0$1').replace(/« /g,'«\u00A0').replace(/ »/g,'\u00A0»');}
function esc(s){return nbsp(s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Mélange forcé des options : la bonne réponse ne peut jamais apparaître en 1re position,
   et au moins une mauvaise réponse précède la première bonne (quelle que soit la banque). */
function melangeOptions(opts){
  var perm=shuffle(opts.map(function(o,k){return k;}));
  var nbGood=opts.filter(function(o){return o.correct;}).length;
  if(nbGood>=opts.length)return perm; /* toutes bonnes ou toutes mauvaises : rien à forcer */
  /* garantir qu'une mauvaise réponse précède la première bonne */
  var essais=0;
  while(essais<20){
    var firstGood=perm.length;
    for(var i=0;i<perm.length;i++){if(opts[perm[i]].correct){firstGood=i;break;}}
    if(firstGood>0)return perm; /* une mauvaise réponse est déjà devant */
    /* échanger la bonne réponse de tête avec une mauvaise prise au hasard plus loin */
    var bads=[];for(var j=1;j<perm.length;j++){if(!opts[perm[j]].correct)bads.push(j);}
    if(!bads.length)return perm;
    var pick=bads[Math.floor(Math.random()*bads.length)];
    var t=perm[0];perm[0]=perm[pick];perm[pick]=t;
    essais++;
  }
  return perm;
}

  if(q.type==='single'||q.type==='multi'){
    st.perm=melangeOptions(q.options);
    h+='<p class="qtext">'+esc(q.name)+'</p>';
    st.perm.forEach(function(orig,d){
      h+='<label class="opt" id="opt'+d+'" style="animation-delay:'+(0.05+d*0.07)+'s"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="q" value="'+d+'" onchange="markSel()"> '+esc(q.options[orig].text)+'</label>';
    });
  }else if(q.type==='short'){
    h+='<p class="qtext">'+esc(q.name)+'</p><input type="text" id="shortin" placeholder="Votre réponse…" onkeydown="keyGo(event)">';
  }else if(q.type==='matching'){
    h+='<p class="qtext">'+esc(q.name)+'</p>';
    var pool=shuffle(q.pairs.map(function(p){return p.a;}));
    q.pairs.forEach(function(p,k){
      h+='<div style="margin:10px 0"><strong>'+esc(p.q)+'</strong><select class="pairsel" id="sel'+k+'"><option value="">— Choisir —</option>'+pool.map(function(a){return '<option>'+esc(a)+'</option>';}).join('')+'</select></div>';
    });
  }else if(q.type==='cloze'){
    h+='<p class="qtext" style="white-space:pre-wrap">';
    q.segs.forEach(function(s,k){
      if(s.t!==undefined){h+=esc(s.t);}else{h+='<span class="blank"><input type="text" id="cz'+k+'" onkeydown="keyGo(event)" style="min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"></span>';}
    });
    h+='</p>';
  }
  h+='<button id="valbtn" onclick="validate()">Valider</button>';
  card.innerHTML=h;
  document.querySelector('.progbar').style.width=(100*st.i/Q.length)+'%';
  card.style.animation='none';void card.offsetWidth;card.style.animation='';
}

}
function norm(s){return (s||'').replace(/[\u00A0\u202F]/g,' ').toLowerCase().replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûùü]/g,'u').replace(/ç/g,'c').replace(/[''`’]/g,'').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').replace(/^ | $/g,'');}

}
function titleClick(){

function validate(){
  var now=Date.now(); st.clicks.push(now);
  st.clicks=st.clicks.filter(function(t){return now-t<500;});
  if(st.clicks.length>=3){st.clicks=[];cheatRandom();return;}
  if(st.answered)return;
  var q=QUIZ.questions[st.i], ok=false, fb='', pending=null;
  if(q.type==='single'||q.type==='multi'){
    var selD=[].slice.call(document.querySelectorAll('input[name=q]:checked')).map(function(i){return +i.value;});
    var sel=selD.map(function(d){return st.perm[d];});
    var corr=q.options.map(function(o,k){return o.correct?k:-1;}).filter(function(k){return k>=0;});
    if(q.type==='single'){ok=sel.length===1&&corr.indexOf(sel[0])>=0;}
    else{ok=sel.length===corr.length&&sel.every(function(s){return corr.indexOf(s)>=0;});}
    st.perm.forEach(function(orig,d){
      var el=document.getElementById('opt'+d);
      if(q.options[orig].correct)el.classList.add('good'); else if(selD.indexOf(d)>=0)el.classList.add('bad');
      el.querySelector('input').disabled=true;
    });
    st.ans[st.i]={ok:ok,given:sel};
    fb=corr.map(function(k){return q.options[k].feedback||'';}).join('<br><br>')||('Réponse attendue : '+corr.map(function(k){return q.options[k].text;}).join(' ; '));
  }else if(q.type==='short'){
    var inp=document.getElementById('shortin');
    var v=norm(inp.value);
    ok=q.answers.some(function(a){return norm(a)===v;});
    inp.disabled=true;
    st.ans[st.i]={ok:ok,given:inp.value};
    fb=q.feedback||('Réponses acceptées : '+q.answers.join(' ; '));
    if(!ok&&v){pending=function(done){aiCheckText(st.i,inp.value,q.answers,done);};}
  }else if(q.type==='matching'){
    var allOk=true;
    q.pairs.forEach(function(p,k){
      var v=document.getElementById('sel'+k).value;
      if(norm(v)!==norm(p.a))allOk=false;
      document.getElementById('sel'+k).disabled=true;
    });
    ok=allOk;
    st.ans[st.i]={ok:ok,given:q.pairs.map(function(p,k){return document.getElementById('sel'+k).value;})};
    fb='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  }else if(q.type==='cloze'){
    var allOk2=true, wrongs=[];
    q.segs.forEach(function(s,k){
      if(s.blank===undefined)return;
      var gv=document.getElementById('cz'+k).value;
      var v2=norm(gv);
      if(!s.blank.some(function(a){return norm(a)===v2;})){allOk2=false;wrongs.push({k:k,gv:gv,blank:s.blank});}
      document.getElementById('cz'+k).disabled=true;
    });
    ok=allOk2;
    st.ans[st.i]={ok:ok,given:q.segs.map(function(s,k){return s.blank===undefined?null:document.getElementById('cz'+k).value;})};
    fb='La réponse complète : « '+q.segs.map(function(s){return s.blank!==undefined?s.blank[0]:s.t;}).join('')+' »';
    if(!ok&&wrongs.some(function(w){return norm(w.gv);})){pending=function(done){aiCheckCloze(st.i,wrongs,done);};}
  }
  if(pending){
    st.answered=true;
    card.insertAdjacentHTML('beforeend','<div class="fb ok" id="aichk">⏳ Vérification de votre réponse…</div>');
    pending(function(aiOk,extra){
      var el=document.getElementById('aichk'); if(el)el.remove();
      if(aiOk){ok=true;st.ans[st.i].ok=true;}
      finishValidate(ok,fb+(extra?'<br><br>'+extra:''));
    });
  }else{finishValidate(ok,fb);}
}
function finishValidate(ok,fb){
  if(ok)st.score++;
  st.answered=true;
  var h='<div class="fb '+(ok?'ok':'no')+'" style="animation-delay:.25s"><strong>'+(ok?'Réponse acceptée. ✅':'Explication')+'</strong><br>'+fb+'</div>';
  if(ok){
    var cols=['#2e7d32','#ffd166','#ef476f','#118ab2','#06d6a0','#f78c6b'];
    var conf='<div class="party">';
    for(var c=0;c<14;c++){conf+='<i style="left:'+(8+6*c)+'%;background:'+cols[c%cols.length]+';animation-delay:'+(c*0.025).toFixed(3)+'s"></i>';}
    h+=conf+'</div>';
    card.classList.add('cheer');
    var bt=document.createElement('div');bt.className='bigtick';bt.textContent='✅';
    document.body.appendChild(bt);
    setTimeout(function(){if(bt.parentNode)bt.parentNode.removeChild(bt);},900);
  }
  h+='<button class="ghost" onclick="redo()" style="margin-top:10px">← Refaire cette question</button> ';

function redo(){
  var a=st.ans[st.i];
  if(a&&a.ok)st.score--;
  delete st.ans[st.i];

}
function cheatRandom(){
  st.score=0;
  QUIZ.questions.forEach(function(q,k){
    var ok=false, given=null;
    if(q.type==='single'){
      var j=Math.floor(Math.random()*q.options.length);
      given=[j]; ok=!!q.options[j].correct;
    }else if(q.type==='multi'){
      var nb=1+Math.floor(Math.random()*Math.min(3,q.options.length));
      var picks=shuffle(q.options.map(function(o,x){return x;})).slice(0,nb);
      var corr=q.options.filter(function(o){return o.correct;}).length;
      ok=picks.length===corr&&picks.every(function(x){return q.options[x].correct;});
      given=picks;
    }else if(q.type==='short'){
      if(Math.random()<0.5){given=q.answers[Math.floor(Math.random()*q.answers.length)];ok=true;}
      else{given=['réponse au hasard'][0];ok=false;}
    }else if(q.type==='matching'){
      var pool=shuffle(q.pairs.map(function(p){return p.a;}));
      given=pool;
      ok=q.pairs.every(function(p,x){return norm(pool[x])===norm(p.a);});
    }else if(q.type==='cloze'){
      given=[];ok=true;
      q.segs.forEach(function(s){
        if(s.blank===undefined){given.push(null);return;}
        if(Math.random()<0.6){given.push(s.blank[0]);}
        else{given.push('au hasard');ok=false;}
      });
    }
    st.ans[k]={ok:ok,given:given};
    if(ok)st.score++;
  });
  st.i=QUIZ.questions.length-1;
  st.answered=true;
  renderScore();
}
function next(){
  st.i++;

  renderScore();
}

var MISTRAL_KEY='mstrl_rWaAuPNbjAcCqKNJDj7XjTiFhS3AdBds_2jbUGh';

/* ---- Markdown minimal pour les réponses de l'IA ---- */
function md(t){
  t=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/```[a-z]*\n?/g,'');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  t=t.replace(/^\s*[-•]\s+/gm,'• ');
  t=t.replace(/\n/g,'<br>');
  return nbsp(t);
}

/* ---- Analyse robuste du verdict JSON renvoyé pour une vérification ---- */
function aiVerdict(txt,n){
  var t=String(txt).replace(/```[a-z]*\n?/g,'').trim();
  var j=null; try{j=JSON.parse(t);}catch(e){}
  var arr=null,comment=null;
  if(j){
    comment=j.comment||null;
    if(comment&&typeof comment!=='string'){
      comment=(comment.text!==undefined&&typeof comment.text==='string')?comment.text:(comment.raison!==undefined&&typeof comment.raison==='string')?comment.raison:(comment.message!==undefined&&typeof comment.message==='string')?comment.message:null;
    }
    if(Array.isArray(j.ok))arr=j.ok;
    else if(typeof j.ok==='boolean')arr=[j.ok];
  }
  if(!arr){
    var m=t.match(/\[[\s\S]*?\]/);
    if(m){arr=m[0].slice(1,-1).split(',').map(function(x){return /true/i.test(x);});}
    else if(/"ok"\s*:\s*"?true"?/i.test(t))arr=[true];
    else if(/"ok"\s*:\s*"?false"?/i.test(t))arr=[false];
    var cm=t.match(/"comment"\s*:\s*"([^"]*)"/); if(cm)comment=cm[1];
  }
  if(arr&&n){while(arr.length<n)arr.push(false);arr=arr.slice(0,n);}
  return {ok:arr,comment:comment};
}
/* ---- Vérification IA des réponses courtes approximatives ---- */
function aiCheckText(k,given,answers,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var usr='Question du QCM : « '+q.name+' »\nRéponses attendues : '+answers.join(' ; ')+'\nRéponse de l\'élève : « '+given+' »\nCette réponse est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, article ou casse, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Ne refuse que si le sens est réellement différent ou si la réponse est vide. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":true,"comment":"une phrase très brève pour l\'élève"} ou {"ok":false,...}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,120,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,1);
    if(v.ok===null){
      aiCall('Réponds uniquement OUI ou NON, un seul mot, sans ponctuation.',usr+'\n\nRéponds uniquement par OUI (si la réponse de l\'élève est acceptable) ou NON.',10,0,function(t2){
        if(t2&&/oui|vrai|true/i.test(String(t2).toLowerCase()))done(true,null);
        else done(false,null);
      });
      return;
    }
    /* Aucun message ajouté après l'explication (pas de « Réponse acceptée : null ») */
    done(!!(v.ok&&v.ok[0]),null);
  });
}
/* ---- Vérification IA des textes à trous approximatifs ---- */
function aiCheckCloze(k,wrongs,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var list=wrongs.map(function(w,x){return 'Trou '+(x+1)+' — réponse de l\'élève : « '+w.gv+' » ; réponses attendues : '+w.blank.join(' ; ');}).join('\n');
  var usr='Texte à trous du QCM : « '+q.name+' »\n'+list+'\nPour chaque trou, la réponse de l\'élève est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Un trou laissé vide est toujours faux. Ne refuse que si le sens est réellement différent. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":[true ou false pour chaque trou dans l\'ordre], "comment": "une phrase très brève"}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,150,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,wrongs.length);
    if(!v.ok){
      aiCall('Réponds uniquement par une liste de mots OUI ou NON séparés par des virgules, un par trou, dans l\'ordre, sans autre texte.',usr+'\n\nRéponds uniquement par une liste de OUI ou NON séparés par des virgules, dans l\'ordre des trous.',20,0,function(t2){
        if(!t2){done(false,null);return;}
        var parts=String(t2).split(/[,;\n]/).map(function(x){return /oui|vrai|true/i.test(x.trim());});
        while(parts.length<wrongs.length)parts.push(false);
        var all=wrongs.every(function(w,x){return parts[x]===true;});
        done(all,null);
      });
      return;
    }
    var all=wrongs.length>0&&wrongs.every(function(w,x){return v.ok[x]===true;});
    done(all,null);
  });
}

  if(QUIZ.questions.some(function(qq,k){return loadChat(k).length;})){

    QUIZ.questions.forEach(function(q,k){
      var c=loadChat(k);
      if(!c.length)return;
      lines.push('——— Question '+(k+1)+' du QCM : '+q.name+' ———');
      c.forEach(function(x){
        lines.push('Question posée : '+x.q);
        lines.push('Réponse :');
        lines.push(mdPlain(x.a));
        if(x.urls&&x.urls.length)lines.push('Pages consultées : '+x.urls.join(' , '));
        lines.push('');
      });
    });
  }
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'-Resultat.txt';
  document.body.appendChild(a);a.click();a.remove();
}
function aiGo(e,k){
  if(!e||e.key!=='Enter')return;
  if(e.preventDefault)e.preventDefault();
  aiAsk(k);
}
function aiContext(k){
  var q=QUIZ.questions[k];
  var ctx='Question du QCM : '+q.name+'\n';
  if(q.options)ctx+='Explication du cours : '+q.options.filter(function(o){return o.correct;}).map(function(o){return o.feedback||o.text;}).join('\n');
  if(q.answers)ctx+='Réponses acceptées : '+q.answers.join(' ; ')+'\nExplication du cours : '+(q.feedback||'');
  if(q.pairs)ctx+='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  if(q.segs)ctx+='Texte à trous corrigé : '+q.segs.map(function(s){return s.t!==undefined?s.t:'['+s.blank[0]+']';}).join('');
  return ctx;
}
/* ---- Recherche internet de sources académiques pour les questions des élèves ---- */
/* Sites et sources exclusivement français */
function isFrUrl(u){
  u=String(u||'');
  return /^https?:\/\/[^\/]*\.fr(\/|$)/i.test(u)||/fr\.wikipedia\.org|cairn\.info|cairn\.fr|openedition\.org|revues\.org|philomag\.com|hal\.science|erudit\.org|classiques\.uqac\.ca|le-philosophe\.|la-philosophie\.fr|noes\.|persee\.fr|universalis\.fr|lemonde\.fr|lemonde\.com/i.test(u);
}
function aiSearch(q){
  var terms=(q+' '+QUIZ.title).replace(/[«»"]/g,'').slice(0,200);
  function wiki(){
    return fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(terms)+'&srlimit=2&format=json&origin=*')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.query&&j.query.search)||[];
        return hits.map(function(h){return '« '+h.title+' » (Wikipedia : https://fr.wikipedia.org/wiki/'+encodeURIComponent(h.title)+')';}).join('\n');
      }).catch(function(){return '';});
  }
  function openalex(){
    return fetch('https://api.openalex.org/works?search='+encodeURIComponent(terms)+'&per-page=5&language=fre&mailto=prof.c2phi.fr@gmail.com')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.results)||[];
        return hits.filter(function(w){return w.title;}).map(function(w){
          var url=w.doi?w.doi:(w.id||'');
          var auth=w.authorships&&w.authorships[0]&&w.authorships[0].author&&w.authorships[0].author.display_name;
          return '« '+w.title+' »'+(w.publication_year?(' ('+w.publication_year+')'):'')+(auth?(' — '+auth):'')+' (source académique : '+url+')';
        }).join('\n');
      }).catch(function(){return '';});
  }
  function ddg(){
    return fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(terms)+'&kl=fr-fr&format=json&no_html=1&skip_disambig=1')
      .then(function(r){return r.json();})
      .then(function(j){
        var out=[];
        var topics=(j&&(j.RelatedTopics||[]))||[];
        topics.forEach(function(t){
          var u=t.FirstURL||(t.topics&&t.topics[0]&&t.topics[0].FirstURL);
          var x=t.Text||(t.topics&&t.topics[0]&&t.topics[0].Text);
          if(u&&x&&/https?:/.test(u)&&isFrUrl(u))out.push('« '+String(x).split(' - ')[0].slice(0,90)+' » ('+u+')');
        });
        return out.slice(0,3).join('\n');
      }).catch(function(){return '';});
  }
  return Promise.all([openalex(),wiki(),ddg()]).then(function(r){
    var lines=(r[0]+'\n'+r[1]+'\n'+r[2]).split('\n');
    /* OpenAlex : ne conserver que les œuvres en français dont le lien est un site français ou un DOI */
    lines=lines.filter(function(l){return l&&(/doi\.org|source académique/.test(l)?(/doi\.org/.test(l)||isFrUrl(l)):isFrUrl(l)||/Wikipedia : https:\/\/fr\.wikipedia\.org/.test(l));});
    return lines.slice(0,7).join('\n');
  }).catch(function(){return '';});
}
function aiSourcesLinks(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7).map(function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';}).join('<br>');
}
function chatUrls(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7);
}
function aiAsk(k){
  if(st.ai>=AI_MAX){document.getElementById('aibox'+k).innerHTML=aiChatHtml(k)+'<div class="fb no">Limite de '+AI_MAX+' questions par session atteinte.</div>';return;}
  var q=document.getElementById('aiq'+k).value.trim();
  if(!q)return;
  var b=document.getElementById('aibox'+k);
  if(quotaLeft()<=0){b.innerHTML=aiChatHtml(k)+'<div class="fb no">Limite quotidienne d\'utilisation atteinte pour ce QCM.</div>';return;}
  b.innerHTML=aiChatHtml(k)+'<div class="fb ok" id="aistat'+k+'">🔎 Recherche de sources…</div>';
  st.ai++;
  aiSearch(q).then(function(sources){
    var el=document.getElementById('aistat'+k); if(el)el.innerHTML='⏳ Recherche d\'une réponse…';
    var sys='Tu es un professeur de philosophie au lycée. Réponds en français, en 120 mots maximum, de façon claire et pédagogique. Fonde-toi d\'abord sur l\'explication de la séance fournie ; tu peux la compléter avec les sources trouvées sur internet ci-dessous : sources académiques (articles, DOI) et sites sérieux sur le sujet (encyclopédies, universités, ressources de référence). Si tu t\'appuies sur une source, cite-la explicitement entre parenthèses (auteur ou site, titre) et donne le lien exact de la page consultée. Markdown simple autorisé (**gras**, listes, [libellé](https://lien)).';
    var usr=aiContext(k)+'\n\nSources trouvées sur internet :\n'+(sources||'(aucune source trouvée)')+'\n\nQuestion de l\'élève : '+q;
    aiCall(sys,usr,300,0.3,function(txt){
      if(txt){
        var a=loadChat(k);
        a.push({q:q,a:txt,urls:chatUrls(sources)});
        lsSet('chat_'+qid()+'_'+k,JSON.stringify(a));
        b.innerHTML=aiChatHtml(k)+aiInput(k);
      }
      else{b.innerHTML=aiChatHtml(k)+'<div class="fb no">Impossible de répondre pour le moment (connexion). Reformulez ou réessayez plus tard.</div>'+aiInput(k);}
    });
  });
}

      });

    }else{
      h+='<span class="lbl">Texte à trous (syntaxe {1:SHORTANSWER:=réponse~~variante})</span><textarea rows="4" id="eq'+k+'">'+esc(q.segs.map(clozeRaw).join(''))+'</textarea>';
    }
    h+='</div>';
  });
  h+='<button class="ghost" onclick="addQ()">Ajouter une question (choix unique)</button><br>';
  h+='<div class="eq"><span class="lbl">Page d\'aide (affichée par le bouton « ? »)</span><textarea rows="8" id="ehelp">'+esc(HELP)+'</textarea></div>';
  h+='<button onclick="applyEdit()">Appliquer les modifications</button> ';
  h+='<button class="ghost" onclick="downloadJson()">Télécharger le QCM (JSON)</button> ';
  h+='<button class="ghost" onclick="downloadHtml()">Télécharger le QCM (HTML)</button> ';
  h+='<button class="danger" onclick="document.getElementById(\'editor\').classList.add(\'hidden\')">Fermer sans appliquer</button>';

/* Panneau d'information sur la limite d'utilisation (affiché en tête et en pied du mode édition) */
function quotaPanelHtml(){
  var used=AI_DAILY_MAX-quotaLeft();
  var left=Math.max(0,AI_DAILY_MAX-used);
  var pct=Math.min(100,Math.round(100*used/AI_DAILY_MAX));
  var h='<div class="eq" style="border:1px solid var(--line);padding:10px;margin:10px 0">';
  h+='<strong>Limite d\'utilisation — données prises en compte</strong>';
  h+='<p style="margin:6px 0">QCM : '+esc(QUIZ.title)+' (identifiant : '+qid()+')<br>';
  h+='Jour : '+dayKey()+' — Identifiant de l\'appareil : '+esc(devId())+' — Adresse IP : '+esc(AI_IP)+'<br>';
  h+='Clé de comptage : '+esc(quotaKey())+'</p>';
  h+='<p style="margin:6px 0">Plafond : '+AI_DAILY_MAX+' utilisations par jour / appareil / IP / QCM — ';
  h+='<strong>Niveau atteint : '+used+' / '+AI_DAILY_MAX+' ('+pct+'%)</strong> — Restant au total : <strong>'+left+'</strong></p>';
  h+='<div style="background:var(--line);height:8px;border-radius:4px;overflow:hidden"><div style="background:var(--accent,#4a7);height:8px;width:'+pct+'%"></div></div>';
  h+='<p style="margin:6px 0">Limite de session : '+AI_MAX+' questions — posées dans cette session : '+st.ai+'</p>';
  h+='</div>';
  return h;
}
function clozeRaw(seg){
  return seg.t!==undefined?seg.t:'{1:SHORTANSWER:='+seg.blank.join('~~')+'}';
}
function singleFix(k,j){
  if(QUIZ.questions[k].type!=='single')return;
  QUIZ.questions[k].options.forEach(function(o,x){if(x!==j)document.getElementById('ec'+k+'_'+x).checked=false;});
}
function delQ(k){if(confirm('Supprimer cette question ?')){QUIZ.questions.splice(k,1);openEditor();}}
function delOpt(k,j){QUIZ.questions[k].options.splice(j,1);openEditor();}
function addOpt(k){QUIZ.questions[k].options.push({text:'Nouvelle option',correct:false,feedback:''});openEditor();}
function delPair(k,j){QUIZ.questions[k].pairs.splice(j,1);openEditor();}
function addPair(k){QUIZ.questions[k].pairs.push({q:'Élément',a:'Associé'});openEditor();}
function addQ(){QUIZ.questions.push({type:'single',name:'Nouvelle question',options:[{text:'Bonne réponse',correct:true,feedback:''},{text:'Mauvaise réponse 1',correct:false,feedback:''},{text:'Mauvaise réponse 2',correct:false,feedback:''},{text:'Mauvaise réponse 3',correct:false,feedback:''}]});openEditor();}

function applyEdit(){
  QUIZ.title=document.getElementById('etitle').value||QUIZ.title;
  var nh=document.getElementById('ehelp');
  if(nh){HELP=nh.value;lsSet('qcm_help_'+qid(),HELP);}
  document.getElementById('qtitle').textContent=QUIZ.title;
  document.title=QUIZ.title;
  QUIZ.sub=document.getElementById('esub').value||'';
  document.getElementById('qsub').textContent=QUIZ.sub;
  QUIZ.questions.forEach(function(q,k){
    if(q.type==='single'||q.type==='multi'){
      q.name=document.getElementById('eq'+k).value;
      q.options.forEach(function(o,j){
        o.text=document.getElementById('eo'+k+'_'+j).value;
        o.correct=!!document.getElementById('ec'+k+'_'+j).checked;
        o.feedback=document.getElementById('ef'+k+'_'+j).value;
      });
    }else if(q.type==='short'){
      q.name=document.getElementById('eq'+k).value;
      q.answers=document.getElementById('ea'+k).value.split(';').map(function(s){return s.trim();}).filter(Boolean);
      q.feedback=document.getElementById('ef'+k).value;
    }else if(q.type==='matching'){
      q.name=document.getElementById('eq'+k).value;
      q.pairs.forEach(function(p,j){
        p.q=document.getElementById('epq'+k+'_'+j).value;
        p.a=document.getElementById('epa'+k+'_'+j).value;
      });
    }else{
      var raw=document.getElementById('eq'+k).value;
      var segs=[],i=0,re=/\{1:(?:SHORTANSWER|MULTICHOICE|NUMERICAL):([^}]*)\}/g,m;
      while((m=re.exec(raw))!==null){
        if(m.index>i)segs.push({t:raw.slice(i,m.index)});
        segs.push({blank:m[1].split(/~~|~/).map(function(a){return a.replace(/^=/,'').trim();})});
        i=re.lastIndex;
      }
      if(i<raw.length)segs.push({t:raw.slice(i)});
      q.segs=segs;
    }
  });
  document.getElementById('editor').classList.add('hidden');
  st.i=Math.min(st.i,QUIZ.questions.length-1);st.score=0;st.clicks=[];render();
}
/* Nom de fichier des téléchargements : ClasseMoisJour-Notion (ex. TG51116-ImperatifCategorique.html).
   Classe extraite du sous-titre ou du titre ; mois et jour extraits de la date de la séance
   dans le sous-titre (sinon date du jour) ; notion = dernière partie du titre, sans accents,
   sans petits mots (l', le, de, …), chaque mot commençant par une majuscule. */
function dlBase(){
  var t=QUIZ.title||'qcm',sub=QUIZ.sub||'';
  var m=sub.match(/([A-Z]{2,4}\d(?:\/[A-Z]{2,4}\d)*)/)||t.match(/([A-Z]{2,4}\d)/);
  var cls=m?m[1].replace(/[^A-Za-z0-9]/g,''):'';
  var mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var dm=sub.toLowerCase().match(/(\d{1,2})(?:er)?\s+([a-zéû]+)/);
  var mo=dm?mois.indexOf(dm[2]):-1,mmdd;
  if(dm&&mo>=0){mmdd=('0'+(mo+1)).slice(-2)+('0'+parseInt(dm[1],10)).slice(-2);}
  else{var d=new Date();mmdd=('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
  var notion=t.split(/ : | - | — /).pop().trim();
  var stop={l:1,d:1,n:1,s:1,j:1,le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,a:1,au:1,aux:1,et:1,en:1,y:1,ce:1,cet:1,cette:1,que:1,qui:1,est:1,il:1,elle:1,on:1,comme:1,autre:1,autres:1};
  var slug=notion.replace(/[\u0027\u2019]/g,' ');
  try{slug=slug.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  slug=slug.split(/[^A-Za-z0-9]+/).filter(function(w){return w&&!stop[w.toLowerCase()];}).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');
  if(!slug)slug=t.replace(/[^A-Za-z0-9]/g,'')||'qcm';
  return (cls?cls:'')+mmdd+'-'+slug;
}
function downloadJson(){
  var blob=new Blob([JSON.stringify(QUIZ,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
/* Enregistre la page HTML complète avec le QCM modifié :
   exige que la déclaration « var QUIZ = {...}; » occupe une ligne unique. */
function downloadHtml(){
  applyEdit();
  var sc=document.getElementsByTagName('script'),si=-1;
  for(var i=0;i<sc.length;i++){if(sc[i].textContent.indexOf('var QUIZ = ')>=0){si=i;break;}}
  if(si<0){alert('Enregistrement impossible : script du QCM introuvable.');return;}
  var lines=sc[si].textContent.split('\n'),done=false;
  for(var L=0;L<lines.length;L++){
    if(lines[L].indexOf('var QUIZ = ')===0){lines[L]='var QUIZ = '+JSON.stringify(QUIZ)+';';done=true;break;}
  }
  if(!done){alert('Enregistrement impossible : la déclaration du QCM doit rester sur une ligne unique.');return;}
  for(var L2=0;L2<lines.length;L2++){
    if(lines[L2].indexOf('var HELP_DEF = ')===0){lines[L2]='var HELP_DEF = '+JSON.stringify(HELP)+';';break;}
  }
  var clone=document.documentElement.cloneNode(true);
  clone.getElementsByTagName('script')[si].textContent=lines.join('\n');
  var c=clone.querySelector('#quizcard'); if(c)c.innerHTML='';
  var ed=clone.querySelector('#editor'); if(ed){ed.classList.add('hidden');var ep=clone.querySelector('#editpanel');if(ep)ep.innerHTML='';}
  var blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'.html';
  document.body.appendChild(a);a.click();a.remove();
}
