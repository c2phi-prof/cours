la formule « comme les autres ». Se demander si l'homme est un animal comme les autres, c'est donner la réponse dans la question, car seul l'homme, doté d'une conscience, se pose cette question : l'animal ne fait pas de philosophie."}]}, {"type": "single", "name": "Problématique : quel problème la conscience pose-t-elle exactement ?", "options": [{"text": "Savoir si la conscience introduit une différence de nature ou une simple différence de degré, et si ce privilège confère à l'homme un droit sur la nature ou lui impose des devoirs.", "correct": true, "feedback": "Correct. La conscience donne à l'homme le pouvoir de transformer la nature selon ses projets ; on doit se demander si ce pouvoir introduit une différence de nature ou une simple différence de degré, et s'il confère un droit sur la nature et les autres animaux ou impose au contraire des devoirs."}, {"text": "Savoir si la conscience est un don reçu de la nature ou une construction culturelle : l'homme naîtrait avec elle dans un cas, il l'acquerrait par l'éducation et le langage dans l'autre, et tout le statut de la pensée dépendrait de cette origine.", "correct": false, "feedback": "Non : le problème est double — différence de nature ou de degré ? droit sur la nature ou devoirs envers elle ? La conscience donne le pouvoir de transformer la nature selon ses projets, et c'est ce pouvoir qui rend la différence problématique."}, {"text": "Savoir si l'animal possède lui aussi une forme de conscience, même réduite : la douleur, la peur et l'attachement observés chez la bête suggèrent une vie intérieure, et la limite entre l'homme et l'animal deviendrait alors une simple frontière floue.", "correct": false, "feedback": "Non : la question n'est pas de savoir si l'animal a une conscience. Le problème est : la conscience humaine introduit-elle une différence de nature ou une simple différence de degré, et ce privilège confère-t-il un droit sur la nature ou impose-t-il des devoirs ?"}, {"text": "Savoir si l'homme peut perdre sa conscience dans des situations extrêmes : le sommeil, le coma ou l'ivresse montrent un être qui cesse momentanément de penser, ce qui suggérerait que la conscience est un état variable plutôt qu'une nature fixée.", "correct": false, "feedback": "Non : le problème est double — la conscience introduit-elle une différence de nature ou une simple différence de degré ? Et ce privilège donne-t-il un droit sur la nature ou impose-t-il des devoirs qu'aucune bête ne connaît ?"}]}, {"type": "single", "name": "Problématique : que montre l'exemple de l'alimentation ?", "options": [{"text": "À travers le même besoin biologique qui vaut pour tout animal, l'homme introduit des coutumes, des rituels et du sens : il prépare, cuisine et partage ses repas selon des principes culturels ou religieux.", "correct": true, "feedback": "Correct. Le loup dévore sa proie par instinct, sous l'impulsion de la faim ; l'homme dépasse cette fonction vitale en préparant ses repas, en cuisinant, en les partageant selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}, {"text": "Que le régime alimentaire suffit à distinguer les vivants : l'homme serait carnivore quand la vache rumine et le loup dévore, et ce critère biologique classerait chaque espèce dans la chaîne alimentaire sans rien dire d'autre.", "correct": false, "feedback": "Non : ce n'est pas une question de régime alimentaire. Le loup dévore sa proie par instinct ; l'homme cuisine et partage ses repas selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}, {"text": "Que l'homme sait résister à la faim plus longtemps que l'animal : une performance physiologique de jeûne qui tiendrait à la taille du corps et au métabolisme, comme l'ours qui traverse l'hiver sans manger.", "correct": false, "feedback": "Non : l'exemple ne porte pas sur la performance biologique. Le loup dévore sa proie par instinct ; l'homme dépasse la fonction vitale en préparant, cuisinant et partageant ses repas selon des principes culturels ou religieux : par le même besoin biologique, il introduit coutumes, rituels et sens."}, {"text": "Que l'alimentation serait le seul domaine où l'homme transforme la nature : partout ailleurs il subirait, comme la naissance, la croissance et la mort, tandis que seule la cuisine lui appartiendrait en propre.", "correct": false, "feedback": "Non : l'alimentation est un exemple parmi d'autres, non le seul domaine distinctif. Le loup dévore par instinct ; l'homme cuisine et partage selon des principes culturels ou religieux : à travers le même besoin biologique, il introduit des coutumes, des rituels et du sens."}]}, {"type": "single", "name": "I. Culture : quel est le premier indice d'une différence qui ne serait pas seulement de degré ?", "options": [{"text": "L'inversion du rapport au milieu : l'ours blanc développe une fourrure au fil de l'évolution, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature.", "correct": true, "feedback": "Correct. L'homme ne s'adapte pas à son environnement : il adapte la nature à ses besoins en la transformant (villes, outils, machines, domestication). L'ours blanc a développé une fourrure ; l'homme a conçu le vêtement : cette inversion du rapport au milieu est le premier indice d'une différence qui ne serait pas seulement de degré."}, {"text": "La taille du cerveau humain, supérieure à celle de tous les animaux : un plus grand volume cortical donnerait plus de neurones, donc plus d'habileté, comme un muscle plus développé donne plus de force.", "correct": false, "feedback": "Non : ce serait précisément une simple différence de degré. Le premier indice d'une autre différence est l'inversion du rapport au milieu : l'ours blanc développe une fourrure au fil de l'évolution, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}, {"text": "La capacité de l'homme à courir plus vite que ses proies sur de longues distances : la chasse à l'épuisement serait l'indice d'une supériorité biologique de l'espèce, l'homme étant le mammifère terrestre le plus endurant.", "correct": false, "feedback": "Non : c'est une performance biologique, donc une question de degré. Le premier indice est l'inversion du rapport au milieu : l'ours blanc développe une fourrure, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}, {"text": "L'absence totale de besoins vitaux chez l'homme : affranchi de la faim, de la soif et du sommeil par la technique, il vivrait désormais hors du vivant, dans un milieu artificiel qui le dispenserait de la nature.", "correct": false, "feedback": "Non : l'homme a, comme tout vivant, des besoins vitaux. Le premier indice est l'inversion du rapport au milieu : l'ours développe une fourrure, l'homme conçoit le vêtement — il n'attend pas que la nature le modifie, il modifie la nature."}]}, {"type": "short", "name": "Quel concept de Rousseau, opposé à la fixation de l'animal par l'instinct, désigne la capacité de l'homme de se transformer lui-même ? (Un mot.)", "answers": ["la perfectibilite", "perfectibilite", "perfectibilité", "la perfectibilité"], "feedback": "La perfectibilité est, selon Rousseau, la définition même de l'homme : « qualité qui, à l'aide des circonstances, développe successivement toutes les autres ». Tout est bien chez l'animal, parfaitement adapté à sa condition ; l'homme, lui, est perfectible : son existence n'a pas de forme fixée, elle est un projet, non une fonction."}, {"type": "single", "name": "I. Culture : que signifie homo faber chez Bergson ?", "options": [{"text": "Avant de raisonner (homo sapiens), l'homme fabrique ; et cette fabrication déborde toujours la simple survie : le pot devient vase décoré, le chant de travail devient musique.", "correct": true, "feedback": "Correct. Bergson définit l'homme comme homo faber : avant de raisonner, l'homme fabrique. Et cette fabrication déborde toujours la simple survie : le pot qui conserve la nourriture devient vase décoré, le chant qui rythme le travail devient musique, le récit qui transmet l'expérience devient littérature et mythe. La transformation du monde vise à apporter du sens à l'existence."}, {"text": "L'homme est d'abord un fabricant d'outils et rien d'autre : définir l'homme par la seule production technique, l'outillage étant l'unique activité qui compte, et Bergson réduirait ainsi l'esprit humain à la main.", "correct": false, "feedback": "Non : homo faber ne réduit pas l'homme à l'outil. Avant de raisonner (homo sapiens), l'homme fabrique ; et cette fabrication déborde toujours la simple survie : le pot devient vase décoré, le chant devient musique — elle apporte du sens à l'existence par des symboles et des valeurs partagées."}, {"text": "Seul l'homme moderne, industrialisé, fabrique des objets : les sociétés anciennes ou dites « primitives » n'auraient produit que des gestes instinctifs, la fabrication exigeant usines et machines sophistiquées.", "correct": false, "feedback": "Non : l'animal aussi fabrique (outils des chimpanzés), mais ses fabrications demeurent enfermées dans la fonction vitale. Homo faber signifie : avant de raisonner, l'homme fabrique ; et cette fabrication déborde toujours la simple survie pour apporter du sens (le pot devient vase décoré, le chant devient musique)."}, {"text": "La fabrication humaine vise uniquement la survie, comme celle de l'animal : le pot ne servirait qu'à conserver, le chant qu'à rythmer l'effort, et jamais le fabriqué ne s'émanciperait de la fonction vitale qui l'a fait naître.", "correct": false, "feedback": "Non : c'est l'inverse — la fabrication humaine déborde toujours la simple survie. Avant de raisonner, l'homme fabrique ; le pot devient vase décoré, le chant devient musique, le récit devient littérature : la transformation du monde apporte du sens à l'existence."}]}, {"type": "multi", "name": "I. Culture : sélectionnez les exemples qui, dans le corrigé, montrent que la fabrication humaine déborde la simple survie. (Plusieurs réponses correctes.)", "options": [{"text": "Le pot qui conserve la nourriture devient vase décoré.", "feedback": "Oui : le pot devient vase décoré, la fabrication déborde la simple survie pour apporter du sens.", "correct": true}, {"text": "Le chant qui rythme le travail devient musique.", "feedback": "Oui : le chant devient musique, la transformation du monde vise à apporter du sens à l'existence par des symboles, des idéaux et des valeurs partagées.", "correct": true}, {"text": "Le récit qui transmet l'expérience devient littérature et mythe.", "feedback": "Oui : le récit devient littérature et mythe, déjà dépassement de la fonction vitale.", "correct": true}, {"text": "La fabrication humaine reste strictement utilitaire, comme celle de l'animal.", "feedback": "Non : c'est l'inverse, la fabrication humaine déborde toujours la simple survie ; celle de l'animal demeure enfermée dans sa fonction vitale.", "correct": false}, {"text": "L'homme ne fabrique que pour survivre, sans jamais produire d'œuvres.", "feedback": "Non : le pot devient vase décoré, le chant devient musique, le récit devient littérature : la fabrication humaine déborde toujours la simple survie.", "correct": false}]}, {"type": "single", "name": "I. Culture : quelle est la différence entre le signal animal et le mot humain ?", "options": [{"text": "Le signal animal est rivé à la situation présente ; le mot humain peut parler de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet.", "correct": true, "feedback": "Correct. Les animaux communiquent de façon instinctive : le chant de l'oiseau annonce son territoire, l'abeille danse pour indiquer le pollen. Le langage humain exprime des pensées abstraites et fonde des institutions. Le signal animal est rivé à la situation présente ; le mot humain rend possible la promesse, la règle, la fiction, le projet. C'est pourquoi Lévi-Strauss montre que même les sociétés dites « primitives » organisent le monde par des symboles et des règles."}, {"text": "L'animal ne posséderait aucun moyen de communication : seul l'homme aurait un langage, l'abeille ne danserait pas vraiment, le chant de l'oiseau n'annoncerait rien, et la communication entre bêtes serait une illusion d'observateur.", "correct": false, "feedback": "Non : les animaux communiquent de façon instinctive (le chant de l'oiseau annonce son territoire, l'abeille danse). Mais le signal animal est rivé à la situation présente, tandis que le mot humain peut parler de ce qui n'existe pas ou devrait être : promesse, règle, fiction, projet."}, {"text": "La différence serait uniquement quantitative : l'homme disposerait de davantage de signaux que l'animal, quelques milliers de mots contre quelques cris, la structure du langage restant strictement la même des uns aux autres.", "correct": false, "feedback": "Non : ce serait une différence de degré, or la différence est de structure. Le signal animal est rivé à la situation présente ; le mot humain parle de ce qui n'existe pas, a disparu ou devrait être : il rend possible la promesse, la règle, la fiction, le projet."}, {"text": "Le langage animal serait plus précis que le langage humain : rivé à l'instinct, le signal de l'abeille ne peut pas se tromper, là où la parole humaine multiplie malentendus, ambiguïtés et contresens.", "correct": false, "feedback": "Non : la précision du signal animal est justement sa limite — il est rivé à la situation présente. Le mot humain parle de ce qui n'existe pas, de ce qui a disparu, de ce qui devrait être : il rend possible la promesse, la règle, la fiction, le projet."}]}, {"type": "single", "name": "I. Culture : pourquoi l'éthologie (Jane Goodall, corbeaux calédoniens) renforce-t-elle plutôt la distinction homme / animal ?", "options": [{"text": "Parce que les traditions animales demeurent enfermées dans leur fonction vitale, sans conscience de transmettre, désir d'innover ou question du sens : seul l'homme accumule ses inventions, les critique, les dépasse.", "correct": true, "feedback": "Correct. Depuis Jane Goodall (1960), on sait que les chimpanzés fabriquent et utilisent des outils, que les corbeaux calédoniens améliorent leurs outils et que ces techniques se transmettent par apprentissage social. On peut parler avec précaution de « cultures animales ». Mais ces traditions demeurent enfermées dans leur fonction vitale : la différence entre le chimpanzé qui casse une noix et l'homme qui écrit un traité de balistique n'est pas seulement quantitative — l'homme seul accumule ses inventions, les critique, les dépasse."}, {"text": "Parce que ces observations se seraient révélées fausses : les chimpanzés n'utiliseraient pas d'outils, les corbeaux n'amélioreraient rien, et l'éthologie contemporaine aurait été entraînée dans une erreur collective d'interprétation.", "correct": false, "feedback": "Non : ces observations sont exactes (chimpanzés, corbeaux calédoniens) et l'on peut parler avec précaution de « cultures animales ». Mais ces traditions demeurent enfermées dans leur fonction vitale, sans conscience de transmettre ni question du sens : l'homme seul accumule ses inventions, les critique, les dépasse."}, {"text": "Parce qu'elles montreraient la supériorité animale dans la fabrication technique : la brindille du chimpanzé atteindrait une efficacité que l'outil humain n'égale pas, et c'est la bête qui donnerait la leçon à l'ingénieur.", "correct": false, "feedback": "Non : elles montrent seulement des fabrications techniques enfermées dans la fonction vitale. La différence entre le chimpanzé qui casse une noix et l'homme qui écrit un traité de balistique n'est pas seulement quantitative : l'homme seul accumule ses inventions, les critique, les dépasse."}, {"text": "Parce que ces cultures animales prouveraient l'identité complète : la transmission, l'innovation et la question du sens existeraient aussi chez la bête, et l'homme serait exactement un animal comme les autres, sans reste.", "correct": false, "feedback": "Non : ces aveux renforcent la distinction. Les « cultures animales » demeurent enfermées dans leur fonction vitale, sans conscience de transmettre ni question du sens : l'homme seul accumule ses inventions, les critique, les dépasse."}]}, {"type": "single", "name": "II. Morale et politique : comment comprendre la citation de Rousseau « l'impulsion du seul appétit est esclavage, et l'obéissance à la loi qu'on s'est prescrite est liberté » ?", "options": [{"text": "Paradoxalement, c'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions : le lion affamé chasse, l'homme peut jeûner par conviction.", "correct": true, "feedback": "Correct. Là où l'animal est déterminé par l'impulsion du seul appétit, l'homme peut s'interroger sur le bien et le mal, résister à ses désirs immédiats, s'imposer des devoirs et des lois. Le lion affamé chasse ; l'homme peut jeûner par conviction religieuse, politique ou médicale. C'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions. Cette capacité fonde la responsabilité : on ne loue ni ne blâme le loup qui tue, on juge l'homme qui assassine."}, {"text": "Rousseau défendrait la spontanéité naturelle : suivre ses désirs sans entrave serait la seule vraie liberté, la loi n'étant qu'une chaîne sociale, et l'homme le plus libre serait celui qui obéit le moins possible.", "correct": false, "feedback": "Non : c'est l'inverse. L'impulsion du seul appétit est esclavage ; l'obéissance à la loi qu'on s'est prescrite est liberté. C'est en s'imposant des règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions."}, {"text": "Rousseau justifierait la contrainte tant que la loi n'est pas écrite par le peuple : l'obéissance à un autre vaudrait servitude, et seule la soumission au souverain collectif mériterait le nom de liberté civile.", "correct": false, "feedback": "Non : Rousseau ne défend aucun esclavage. La citation est un paradoxe : l'impulsion du seul appétit est esclavage (l'animal y est soumis), l'obéissance à la loi qu'on s'est prescrite est liberté — c'est en s'imposant des règles que l'homme se rend libre."}, {"text": "Toute loi serait en soi un signe de liberté : peu importe qu'on se l'ait prescrite ou qu'un autre l'impose, obéir témoignerait du consentement des gouvernés, et la règle commune vaudrait toujours affranchissement.", "correct": false, "feedback": "Non : Rousseau précise « la loi qu'on s'est prescrite ». Ce n'est pas l'obéissance à n'importe quelle loi qui libère, mais l'auto-prescription : c'est en s'imposant ses propres règles que l'homme se rend libre, alors que l'animal, libre de toute loi, est esclave de ses pulsions."}]}, {"type": "single", "name": "II. Morale et politique : quelle distinction Kant établit-il entre le prix et la dignité ?", "options": [{"text": "Le prix est la valeur des choses qui se troquent ; la dignité est la valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen.", "correct": true, "feedback": "Correct. La capacité d'agir contre ses penchants immédiats fonde la responsabilité et la dignité de la personne humaine : on ne loue ni ne blâme le loup qui tue, on juge l'homme qui assassine, parce que seul l'homme aurait pu agir autrement. Kant oppose le prix, valeur des choses qui se troquent, à la dignité, valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"text": "Le prix serait la valeur des êtres humains eux-mêmes : le salaire mesurerait la dignité d'une personne sur le marché du travail, et l'on pourrait comparer les individus comme on compare des marchandises selon leur rareté.", "correct": false, "feedback": "Non : c'est l'inverse. Le prix est la valeur des choses qui se troquent ; la dignité est la valeur inconditionnelle de la personne, qui doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"text": "La dignité serait un mérite qui se gagne et se perd : elle dépendrait de la conduite de chacun, le crime la dégraderait, l'héroïsme l'élèverait, et le prix viendrait seulement consacrer ce classement intérieur.", "correct": false, "feedback": "Non : la dignité est inconditionnelle, précisément parce qu'elle ne se troque pas comme le prix des choses. La personne doit toujours être traitée comme une fin et jamais seulement comme un moyen."}, {"text": "Kant réserverait la dignité aux seuls membres d'une cité idéale : hors de la communauté politique, les individus n'auraient qu'une valeur marchande, et le statut de personne se confondrait avec celui de citoyen.", "correct": false, "feedback": "Non : la dignité est la valeur inconditionnelle de toute personne humaine, par opposition au prix, valeur des choses qui se troquent. Elle exige que la personne soit toujours traitée comme une fin et jamais seulement comme un moyen."}]}, {"type": "short", "name": "Selon Bentham, la question pertinente à poser au sujet des animaux n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? ». Laquelle ? (Reprendre sa formule.)", "answers": ["peuvent-ils souffrir?", "peuvent ils souffrir", "peuvent-ils souffrir", "peuvent ils souffrir?", "sont-ils sensibles à la souffrance"], "feedback": "Bentham retourne l'argument de Descartes : la question pertinente n'est pas « peuvent-ils raisonner ? » ni « peuvent-ils parler ? », mais « peuvent-ils souffrir ? ». Or l'animal souffre, éprouve la douleur, la peur, c'est pourquoi sa souffrance compte moralement."}, {"type": "matching", "name": "II-III. Associez chaque auteur à la thèse du corrigé.", "pairs": [{"q": "Descartes", "a": "Les animaux sont de simples machines ; l'homme « maître et possesseur de la nature »"}, {"q": "Bentham", "a": "« Peuvent-ils souffrir ? » : la seule question pertinente"}, {"q": "Kant", "a": "Prix (des choses) contre dignité (de la personne) ; devoirs à l'égard des animaux"}, {"q": "Rousseau", "a": "Perfectibilité ; « l'obéissance à la loi qu'on s'est prescrite est liberté »"}, {"q": "Aristote", "a": "L'homme est un « animal politique »"}, {"q": "Bergson", "a": "Homo faber : avant de raisonner, l'homme fabrique"}, {"q": "Popper", "a": "Une théorie n'est scientifique que si elle peut être réfutée"}]}, {"type": "multi", "name": "II. Morale et politique : sélectionnez les affirmations exactes sur la position de Kant au sujet des animaux. (Plusieurs réponses correctes.)", "options": [{"text": "Nous n'avons pas de devoirs directs « envers » les animaux, mais nous en avons « à l'égard » d'eux.", "feedback": "Exact : Kant distingue les devoirs envers les personnes et les devoirs à l'égard des animaux.", "correct": true}, {"text": "La cruauté envers la bête déshumanise celui qui la commet et prépare la cruauté envers les hommes.", "feedback": "Exact : la conscience ne légitime pas la domination, elle fonde une responsabilité.", "correct": true}, {"text": "Kant accorde aux animaux exactement les mêmes droits qu'aux personnes humaines.", "feedback": "Non : Kant refuse les devoirs directs « envers » les animaux ; les nôtres sont « à l'égard » d'eux.", "correct": false}, {"text": "Kant légitime toute expérimentation sans limite, comme Descartes.", "feedback": "Non : c'est la position cartésienne des animaux-machines ; Kant y voit au contraire une responsabilité.", "correct": false}, {"text": "La distinction « envers » / « à l'égard » s'inscrit dans un débat contemporain qui aboutit au Code civil de 2015.", "feedback": "Exact : le corrigé relie ce débat à Peter Singer et au Code civil français (2015), qui reconnaît les animaux comme « êtres vivants doués de sensibilité ».", "correct": true}]}, {"type": "single", "name": "III. Connaissance : pourquoi le doute est-il impossible à l'animal ?", "options": [{"text": "Parce que le doute suppose de se représenter ses propres représentations, de prendre ses croyances pour objet : seul l'homme sait qu'il sait, et peut donc aussi savoir qu'il se trompe.", "correct": true, "feedback": "Correct. La mouche perçoit la lumière, la chauve-souris localise ses proies, le pigeon retrouve son pigeonnier ; mais aucun animal ne se demande si sa perception est fidèle à la réalité. Descartes a fait du doute une méthode : suspendre toute croyance jusqu'à la certitude indubitable « je pense, donc je suis ». L'animal ne doute pas, car le doute suppose de se représenter ses propres représentations : seul l'homme sait qu'il sait, et peut savoir qu'il se trompe."}, {"text": "Parce que l'animal n'aurait aucune perception de son milieu : privé de regard et d'ouïe attentifs, la bête errerait dans un monde confus, ce qui expliquerait qu'elle ne puisse rien mettre en question de ce qui l'entoure.", "correct": false, "feedback": "Non : l'animal perçoit très bien son milieu (la mouche perçoit la lumière, le pigeon retrouve son pigeonnier), mais pour y survivre. Aucun animal ne se demande si sa perception est fidèle à la réalité : le doute suppose de se représenter ses propres représentations — seul l'homme sait qu'il sait."}, {"text": "Parce que l'animal douterait en permanence : sans certitude jamais fixée, hésitant sur chaque proie et chaque sentier, la bête serait paralysée par un soupçon permanent, incapable de la sûreté de l'instinct.", "correct": false, "feedback": "Non : l'animal ne doute pas. Le doute suppose de se représenter ses propres représentations, de prendre ses croyances pour objet : seul l'homme sait qu'il sait, et peut donc aussi savoir qu'il se trompe."}, {"text": "Parce que les animaux détiendraient des certitudes supérieures aux nôtres : l'instinct ne se tromperait jamais là où la raison doute et se corrige, et la mouche, la chauve-souris et le pigeon en sauraient plus que nous.", "correct": false, "feedback": "Non : l'animal n'a pas des certitudes mais des perceptions réglées par l'instinct, sans questionnement. Le doute exige de se représenter ses propres représentations : seul l'homme sait qu'il sait, et peut donc savoir qu'il se trompe."}]}, {"type": "single", "name": "III. Connaissance : que montre Popper à propos de la science ?", "options": [{"text": "Une théorie n'est scientifique que si elle peut être réfutée : pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison.", "correct": true, "feedback": "Correct. La science moderne articule l'expérience (empiristes : Locke, Hume) et la raison (rationalistes : Descartes, Spinoza) par la méthode expérimentale, dont Popper montre le caractère critique : une théorie n'est scientifique que si elle peut être réfutée. Toute cette entreprise est impensable dans la conscience animale : pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison."}, {"text": "Une théorie serait scientifique si personne ne peut jamais la contester : admise par la communauté des savants, elle deviendrait inattaquable, et sa solidité se mesurerait au nombre de ses partisans.", "correct": false, "feedback": "Non : c'est l'inverse. Pour Popper, une théorie n'est scientifique que si elle peut être réfutée : une théorie qu'aucune observation ne pourrait contester n'est pas scientifique. Pour chercher la vérité, il faut pouvoir préférer être démenti que d'avoir raison."}, {"text": "La science ne reposerait que sur l'expérience : la raison n'y jouerait aucun rôle, contre les rationalistes comme Descartes et Spinoza, et l'observation seule établirait une vérité définitive.", "correct": false, "feedback": "Non : la science moderne articule les deux — l'expérience (Locke, Hume) et la raison (Descartes, Spinoza) — par la méthode expérimentale. Popper montre son caractère critique : une théorie n'est scientifique que si elle peut être réfutée."}, {"text": "Popper prouverait que les animaux pratiquent aussi la méthode expérimentale : le rat testerait ses hypothèses comme le chercheur, et la frontière entre la science et l'ingéniosité de la bête s'effacerait.", "correct": false, "feedback": "Non : cette exigence de preuve et de réfutation est impensable dans la conscience animale. Popper montre le caractère critique de la science : une théorie n'est scientifique que si elle peut être réfutée — il faut pouvoir préférer être démenti que d'avoir raison."}]}, {"type": "matching", "name": "Concepts : associez chaque notion du corrigé à sa définition.", "pairs": [{"q": "Perfectibilité", "a": "Capacité de se transformer soi-même ; l'existence est un projet, non une fonction"}, {"q": "Homo faber", "a": "Avant de raisonner, l'homme fabrique, et sa fabrication déborde la survie"}, {"q": "Dignité", "a": "Valeur inconditionnelle de la personne, au-dessus du prix des choses"}, {"q": "Culture", "a": "Tout ce qui est acquis, construit, transmis : la « seconde nature »"}, {"q": "Nature", "a": "L'inné, le biologique, ce qui soumet aux lois de la vie"}, {"q": "Essence", "a": "Nature propre d'un être : l'ensemble des caractéristiques fondamentales qui font qu'il est ce qu'il est"}]}, {"type": "cloze", "name": "II. La citation de Rousseau (texte à trous)", "segs": [{"t": "« L'impulsion du seul "}, {"blank": ["appétit", "appetit"]}, {"t": " est "}, {"blank": ["esclavage", "l'esclavage"]}, {"t": ", et l'obéissance à la "}, {"blank": ["loi"]}, {"t": " qu'on s'est "}, {"blank": ["prescrite", "prescrite", "donnee", "donnée"]}, {"t": " est "}, {"blank": ["liberté", "la liberté"]}]}, {"type": "single", "name": "Conclusion : quelle est la réponse du corrigé à la question posée ?", "options": [{"text": "L'homme demeure un animal né de l'évolution, mais sa différence est une différence de nature ; et cette différence ne lui donne pas un privilège de domination, elle lui impose une responsabilité.", "correct": true, "feedback": "Correct. L'homme demeure en fait un animal né de l'évolution, soumis au vivant, mortel ; mais la conscience fait de lui le seul vivant qui se fait lui-même par la culture, se donne des lois par la morale et la politique, et cherche la vérité par la connaissance : différence de nature. Et cette différence ne lui donne pas un privilège de domination mais lui impose une responsabilité : sa grandeur se mesure à la hauteur de ses responsabilités."}, {"text": "L'homme serait un animal exactement comme les autres : la conscience n'ajouterait qu'un degré d'habileté de plus, la culture une habitude prise, et se poser la question ne serait qu'une singulière manie d'animal bavard.", "correct": false, "feedback": "Non : la conclusion refuse les deux excès. Si l'homme demeure un animal né de l'évolution, sa différence est de nature (culture, lois, vérité), non un simple degré supplémentaire d'habileté — et elle impose une responsabilité plutôt qu'un privilège de domination."}, {"text": "L'homme ne serait pas du tout un animal : il échapperait entièrement au vivant, à la naissance, à la mort et à l'évolution, et sa conscience le placerait d'emblée dans un ordre de réalité séparé, celui de l'esprit pur.", "correct": false, "feedback": "Non : l'homme demeure un animal né de l'évolution, soumis au vivant, mortel. Mais sa différence est de nature — culture, lois, quête de vérité — et elle lui impose une responsabilité, non un privilège de domination."}, {"text": "La question n'aurait pas de réponse : confronté à la limite de ses propres concepts, le philosophe devrait suspendre le jugement, constater l'impasse et laisser chacun croire ce qu'il veut sur l'animalité humaine.", "correct": false, "feedback": "Non : le corrigé tranche. L'homme demeure un animal, mais sa différence est de nature ; et cette différence ne lui donne pas un privilège de domination mais lui impose une responsabilité : sa grandeur se mesure à la hauteur de ses responsabilités."}]}], "comps": ["4.4", "5.5", "5.10"]};

    });
  }else if(q.type==='cloze'){
    h+='<p class="qtext" style="white-space:pre-wrap">';
    q.segs.forEach(function(s,k){
      if(s.t!==undefined){h+=esc(s.t);}else{h+='<span class="blank"><input type="text" id="cz'+k+'" onkeydown="keyGo(event)" style="min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"></span>';}
    });
    h+='</p>';
  }
  h+='<button id="valbtn" onclick="validate()">Valider</button>';
  card.innerHTML=h;
  document.querySelector('.progbar').style.width=(100*st.i/Q.length)+'%';
  card.style.animation='none';void card.offsetWidth;card.style.animation='';
}
function markSel(){
  document.querySelectorAll('label.opt').forEach(function(l){l.classList.remove('sel');});
  document.querySelectorAll('input[name=q]').forEach(function(inp){if(inp.checked)inp.closest('label').classList.add('sel');});
}
function norm(s){return (s||'').toLowerCase().replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûùü]/g,'u').replace(/ç/g,'c').replace(/[''`’]/g,'').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').replace(/^ | $/g,'');}

function keyGo(e){
  if(!e||e.key!=='Enter')return;
  if(e.preventDefault)e.preventDefault();
  validate();
}
function titleClick(){
  var now=Date.now();
  st.tclicks.push(now);
  st.tclicks=st.tclicks.filter(function(t){return now-t<700;});
  if(st.tclicks.length>=3){st.tclicks=[];openEditor();}
}
function validate(){
  var now=Date.now(); st.clicks.push(now);
  st.clicks=st.clicks.filter(function(t){return now-t<500;});
  if(st.clicks.length>=3){st.clicks=[];cheatRandom();return;}
  if(st.answered)return;
  var q=QUIZ.questions[st.i], ok=false, fb='', pending=null;
  if(q.type==='single'||q.type==='multi'){
    var selD=[].slice.call(document.querySelectorAll('input[name=q]:checked')).map(function(i){return +i.value;});
    var sel=selD.map(function(d){return st.perm[d];});
    var corr=q.options.map(function(o,k){return o.correct?k:-1;}).filter(function(k){return k>=0;});
    if(q.type==='single'){ok=sel.length===1&&corr.indexOf(sel[0])>=0;}
    else{ok=sel.length===corr.length&&sel.every(function(s){return corr.indexOf(s)>=0;});}
    st.perm.forEach(function(orig,d){
      var el=document.getElementById('opt'+d);
      if(q.options[orig].correct)el.classList.add('good'); else if(selD.indexOf(d)>=0)el.classList.add('bad');
      el.querySelector('input').disabled=true;
    });
    st.ans[st.i]={ok:ok,given:sel};
    fb=corr.map(function(k){return q.options[k].feedback||'';}).join('<br><br>')||('Bonne réponse : '+corr.map(function(k){return q.options[k].text;}).join(' ; '));
  }else if(q.type==='short'){
    var inp=document.getElementById('shortin');
    var v=norm(inp.value);
    ok=q.answers.some(function(a){return norm(a)===v;});
    inp.disabled=true;
    st.ans[st.i]={ok:ok,given:inp.value};
    fb=q.feedback||('Réponses acceptées : '+q.answers.join(' ; '));
    if(!ok&&v){pending=function(done){aiCheckText(st.i,inp.value,q.answers,done);};}
  }else if(q.type==='matching'){
    var allOk=true;
    q.pairs.forEach(function(p,k){
      var v=document.getElementById('sel'+k).value;
      if(norm(v)!==norm(p.a))allOk=false;
      document.getElementById('sel'+k).disabled=true;
    });
    ok=allOk;
    st.ans[st.i]={ok:ok,given:q.pairs.map(function(p,k){return document.getElementById('sel'+k).value;})};
    fb='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  }else if(q.type==='cloze'){
    var allOk2=true, wrongs=[];
    q.segs.forEach(function(s,k){
      if(s.blank===undefined)return;
      var gv=document.getElementById('cz'+k).value;
      var v2=norm(gv);
      if(!s.blank.some(function(a){return norm(a)===v2;})){allOk2=false;wrongs.push({k:k,gv:gv,blank:s.blank});}
      document.getElementById('cz'+k).disabled=true;
    });
    ok=allOk2;
    st.ans[st.i]={ok:ok,given:q.segs.map(function(s,k){return s.blank===undefined?null:document.getElementById('cz'+k).value;})};
    fb=q.segs.filter(function(s){return s.blank!==undefined;}).map(function(s){return s.blank[0];}).join(' ; ');
    if(!ok&&wrongs.some(function(w){return norm(w.gv);})){pending=function(done){aiCheckCloze(st.i,wrongs,done);};}
  }
  if(pending){
    st.answered=true;
    card.insertAdjacentHTML('beforeend','<div class="fb ok" id="aichk">⏳ Vérification de votre réponse…</div>');
    pending(function(aiOk,extra){
      var el=document.getElementById('aichk'); if(el)el.remove();
      if(aiOk){ok=true;st.ans[st.i].ok=true;}
      finishValidate(ok,fb+(extra?'<br><br>'+extra:''));
    });
  }else{finishValidate(ok,fb);}
}
function finishValidate(ok,fb){
  if(ok)st.score++;
  st.answered=true;
  var h='<div class="fb '+(ok?'ok':'no')+'" style="animation-delay:.25s"><strong>'+(ok?'Bonne réponse. ✅':'Réponse incorrecte. ✖')+'</strong><br>'+fb+'</div>';
  if(ok){
    var cols=['#2e7d32','#ffd166','#ef476f','#118ab2','#06d6a0','#f78c6b'];
    var conf='<div class="party">';
    for(var c=0;c<14;c++){conf+='<i style="left:'+(8+6*c)+'%;background:'+cols[c%cols.length]+';animation-delay:'+(c*0.025).toFixed(3)+'s"></i>';}
    h+=conf+'</div>';
    card.classList.add('cheer');
    var bt=document.createElement('div');bt.className='bigtick';bt.textContent='✅';
    document.body.appendChild(bt);
    setTimeout(function(){if(bt.parentNode)bt.parentNode.removeChild(bt);},900);
  }
  h+='<button class="ghost" onclick="redo()" style="margin-top:10px">← Refaire cette question</button> ';
  h+='<button onclick="next()">'+(st.i+1<QUIZ.questions.length?'Question suivante →':'Voir le score')+'</button>';
  card.insertAdjacentHTML('beforeend',h);
}
function redo(){
  var a=st.ans[st.i];

  delete st.ans[st.i];

function cheatRandom(){
  st.score=0;
  QUIZ.questions.forEach(function(q,k){
    var ok=false, given=null;
    if(q.type==='single'){
      var j=Math.floor(Math.random()*q.options.length);
      given=[j]; ok=!!q.options[j].correct;
    }else if(q.type==='multi'){
      var nb=1+Math.floor(Math.random()*Math.min(3,q.options.length));
      var picks=shuffle(q.options.map(function(o,x){return x;})).slice(0,nb);
      var corr=q.options.filter(function(o){return o.correct;}).length;
      ok=picks.length===corr&&picks.every(function(x){return q.options[x].correct;});
      given=picks;
    }else if(q.type==='short'){
      if(Math.random()<0.5){given=q.answers[Math.floor(Math.random()*q.answers.length)];ok=true;}
      else{given=['réponse au hasard'][0];ok=false;}
    }else if(q.type==='matching'){
      var pool=shuffle(q.pairs.map(function(p){return p.a;}));
      given=pool;
      ok=q.pairs.every(function(p,x){return norm(pool[x])===norm(p.a);});
    }else if(q.type==='cloze'){
      given=[];ok=true;
      q.segs.forEach(function(s){
        if(s.blank===undefined){given.push(null);return;}
        if(Math.random()<0.6){given.push(s.blank[0]);}
        else{given.push('au hasard');ok=false;}
      });
    }
    st.ans[k]={ok:ok,given:given};
    if(ok)st.score++;
  });
  st.i=QUIZ.questions.length-1;
  st.answered=true;
  renderScore();
}

/* ---- Couche IA minimaliste (Ministral 3B, repli Mistral Small) ---- */
var MISTRAL_KEY='mstrl_rWaAuPNbjAcCqKNJDj7XjTiFhS3AdBds_2jbUGh';
var AI_MAX=10;
var AI_MODELS=['ministral-3b-latest','mistral-small-latest'];
/* ---- Markdown minimal pour les réponses de l'IA ---- */
function md(t){
  t=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/```[a-z]*\n?/g,'');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  t=t.replace(/^\s*[-•]\s+/gm,'• ');
  t=t.replace(/\n/g,'<br>');
  return t;
}
/* ---- Quota IA quotidien, par élève et par QCM (sans connexion) ---- */
function lsGet(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return 'h'+(h>>>0).toString(36);}
function devId(){var d=lsGet('ai_dev','');if(!d){d=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));lsSet('ai_dev',d);}return d;}
var AI_IP='na';
try{fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(j){if(j&&j.ip)AI_IP=String(j.ip);}).catch(function(){});}catch(e){}
function qid(){return hash(QUIZ.title);}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function quotaKey(){return 'aiq_'+qid()+'_'+hash(AI_IP)+'_'+devId()+'_'+dayKey();}
var AI_DAILY_MAX=25;
function quotaLeft(){return AI_DAILY_MAX-(+lsGet(quotaKey(),'0')||0);}
function quotaUse(){lsSet(quotaKey(),String((+lsGet(quotaKey(),'0')||0)+1));}
/* ---- Appel générique à l'IA (Ministral 3B, repli Mistral Small) ---- */
function aiCall(sys,usr,maxtok,temp,cb){
  if(quotaLeft()<=0){cb(null);return;}
  quotaUse();
  function call(model){
    return fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+MISTRAL_KEY},body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:maxtok,temperature:temp})});
  }
  call(AI_MODELS[0])
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok)return cb((res.j&&res.j.choices&&res.j.choices[0]&&res.j.choices[0].message&&res.j.choices[0].message.content)||null);
      var m=String((res.j&&res.j.message)||'');
      if(m.indexOf('model')>=0||m.indexOf('not found')>=0){
        return call(AI_MODELS[1]).then(function(r){return r.json();}).then(function(j){return cb((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||null);}).catch(function(){cb(null);});
      }
      cb(null);
    })
    .catch(function(){cb(null);});
}
/* ---- Analyse robuste du verdict JSON renvoyé pour une vérification ---- */
function aiVerdict(txt,n){
  var t=String(txt).replace(/```[a-z]*\n?/g,'').trim();
  var j=null; try{j=JSON.parse(t);}catch(e){}
  var arr=null,comment=null;
  if(j){
    comment=j.comment||null;
    if(comment&&typeof comment!=='string'){
      comment=(comment.text!==undefined&&typeof comment.text==='string')?comment.text:(comment.raison!==undefined&&typeof comment.raison==='string')?comment.raison:(comment.message!==undefined&&typeof comment.message==='string')?comment.message:null;
    }
    if(Array.isArray(j.ok))arr=j.ok;
    else if(typeof j.ok==='boolean')arr=[j.ok];
  }
  if(!arr){
    var m=t.match(/\[[\s\S]*?\]/);
    if(m){arr=m[0].slice(1,-1).split(',').map(function(x){return /true/i.test(x);});}
    else if(/"ok"\s*:\s*"?true"?/i.test(t))arr=[true];
    else if(/"ok"\s*:\s*"?false"?/i.test(t))arr=[false];
    var cm=t.match(/"comment"\s*:\s*"([^"]*)"/); if(cm)comment=cm[1];
  }
  if(arr&&n){while(arr.length<n)arr.push(false);arr=arr.slice(0,n);}
  return {ok:arr,comment:comment};
}
/* ---- Vérification IA des réponses courtes approximatives ---- */
function aiCheckText(k,given,answers,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var usr='Question du QCM : « '+q.name+' »\nRéponses attendues : '+answers.join(' ; ')+'\nRéponse de l\'élève : « '+given+' »\nCette réponse est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, article ou casse, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Ne refuse que si le sens est réellement différent ou si la réponse est vide. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":true,"comment":"une phrase très brève pour l\'élève"} ou {"ok":false,...}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,120,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,1);
    if(v.ok===null){
      aiCall('Réponds uniquement OUI ou NON, un seul mot, sans ponctuation.',usr+'\n\nRéponds uniquement par OUI (si la réponse de l\'élève est acceptable) ou NON.',10,0,function(t2){
        if(t2&&/oui|vrai|true/i.test(String(t2).toLowerCase()))done(true,'✨ Réponse acceptée.');
        else done(false,null);
      });
      return;
    }
    var c=v.comment?md(v.comment):null;
    done(!!(v.ok&&v.ok[0]),v.ok&&v.ok[0]?('✨ Réponse acceptée : '+c):c);
  });
}
/* ---- Vérification IA des textes à trous approximatifs ---- */
function aiCheckCloze(k,wrongs,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var list=wrongs.map(function(w,x){return 'Trou '+(x+1)+' — réponse de l\'élève : « '+w.gv+' » ; réponses attendues : '+w.blank.join(' ; ');}).join('\n');
  var usr='Texte à trous du QCM : « '+q.name+' »\n'+list+'\nPour chaque trou, la réponse de l\'élève est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Un trou laissé vide est toujours faux. Ne refuse que si le sens est réellement différent. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":[true ou false pour chaque trou dans l\'ordre], "comment": "une phrase très brève"}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,150,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,wrongs.length);
    if(!v.ok){
      aiCall('Réponds uniquement par une liste de mots OUI ou NON séparés par des virgules, un par trou, dans l\'ordre, sans autre texte.',usr+'\n\nRéponds uniquement par une liste de OUI ou NON séparés par des virgules, dans l\'ordre des trous.',20,0,function(t2){
        if(!t2){done(false,null);return;}
        var parts=String(t2).split(/[,;\n]/).map(function(x){return /oui|vrai|true/i.test(x.trim());});
        while(parts.length<wrongs.length)parts.push(false);
        var all=wrongs.every(function(w,x){return parts[x]===true;});
        done(all,all?'✨ Réponse acceptée.':null);
      });
      return;
    }
    var all=wrongs.length>0&&wrongs.every(function(w,x){return v.ok[x]===true;});
    done(all,(all||v.comment)?((all?'✨ Réponse acceptée. ':'')+(v.comment?md(v.comment):'')):null);
  });
}
/* ---- Bilan IA de fin de QCM ---- */
function aiBilan(){
  try{if(!navigator.onLine){bilanFallback();return;}}catch(e){}
  if(quotaLeft()<=0){bilanFallback();return;}
  var n=QUIZ.questions.length;
  var det=QUIZ.questions.map(function(q,k){
    var a=st.ans[k]||{ok:false,given:null};
    var g=Array.isArray(a.given)?a.given.filter(Boolean).join(' ; '):(a.given||'—');
    return 'Q'+(k+1)+' : '+(a.ok?'réussie':'manquée (réponse donnée : '+g+')');
  }).join('\n');
  var sys='Tu es un professeur de philosophie au lycée. Rédige un bilan de révision pour un élève de terminale, en français : un mot d\'ensemble sur sa performance, le ou les types d\'erreurs observés, puis 2 conseils précis pour progresser. 150 mots maximum. STYLE IMPERSONNEL OBLIGATOIRE : ne jamais t\'adresser à l\'élève, ni « tu » ni « vous » ni impératifs ; employer des tournures neutres du type « Le score obtenu montre… », « Les erreurs portent sur… », « Il convient de… », « Il serait utile de… ». Markdown simple autorisé (**gras**, listes).';
  var usr='Score : '+st.score+'/'+n+'\nDétail question par question :\n'+det;
  aiCall(sys,usr,400,0.3,function(txt){
    var el=document.getElementById('bilan');
    if(!el)return;
    if(txt){st.bilan=txt;lsSet('bilan_'+qid(),txt);el.innerHTML='<strong>Bilan de votre performance</strong><br>'+md(txt);}
    else bilanFallback();
  });
}
function bilanFallback(){
  var el=document.getElementById('bilan'); if(!el)return;
  var missed=QUIZ.questions.map(function(q,k){return st.ans[k]&&st.ans[k].ok?-1:k;}).filter(function(x){return x>=0;});
  var t='<strong>Bilan</strong><br>';
  if(!missed.length)t+='Sans faute : le cours est maîtrisé. La simple relecture des explications suffit à consolider l\'ensemble.';
  else t+='À réviser en priorité : '+missed.map(function(x){return 'question '+(x+1);}).join(', ')+'. Relire les explications correspondantes, puis refaire le QCM.';
  if(quotaLeft()<=0)t+='<br><em>Bilan détaillé indisponible : limite quotidienne atteinte pour ce QCM.</em>';
  else t+='<br><em>Bilan détaillé indisponible (pas de connexion).</em>';
  el.innerHTML=t;
}
function aiBox(k){
  return '<div class="aibox" id="aibox'+k+'"><button class="ghost" onclick="aiOpen('+k+')">Poser une question</button></div>';
}
function aiOpen(k){
  document.getElementById('aibox'+k).innerHTML='<input type="text" id="aiq'+k+'" placeholder="Votre question sur ce point du cours…" onkeydown="aiGo(event,'+k+')" style="margin-bottom:8px"><button onclick="aiAsk('+k+')">Envoyer</button> <button class="ghost" onclick="document.getElementById(\'aibox'+k+'\').innerHTML=aiBox('+k+')">Annuler</button>';
}
function aiGo(e,k){
  if(!e||e.key!=='Enter')return;
  if(e.preventDefault)e.preventDefault();
  aiAsk(k);
}
function aiContext(k){
  var q=QUIZ.questions[k];
  var ctx='Question du QCM : '+q.name+'\n';
  if(q.options)ctx+='Explication du cours : '+q.options.filter(function(o){return o.correct;}).map(function(o){return o.feedback||o.text;}).join('\n');
  if(q.answers)ctx+='Réponses acceptées : '+q.answers.join(' ; ')+'\nExplication du cours : '+(q.feedback||'');
  if(q.pairs)ctx+='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  if(q.segs)ctx+='Texte à trous corrigé : '+q.segs.map(function(s){return s.t!==undefined?s.t:'['+s.blank[0]+']';}).join('');
  return ctx;
}
/* ---- Recherche internet de sources académiques pour les questions des élèves ---- */
/* Sites et sources exclusivement français */
function isFrUrl(u){
  u=String(u||'');
  return /^https?:\/\/[^\/]*\.fr(\/|$)/i.test(u)||/fr\.wikipedia\.org|cairn\.info|cairn\.fr|openedition\.org|revues\.org|philomag\.com|hal\.science|erudit\.org|classiques\.uqac\.ca|le-philosophe\.|la-philosophie\.fr|noes\.|persee\.fr|universalis\.fr|lemonde\.fr|lemonde\.com/i.test(u);
}
function aiSearch(q){
  var terms=(q+' '+QUIZ.title).replace(/[«»"]/g,'').slice(0,200);
  function wiki(){
    return fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(terms)+'&srlimit=2&format=json&origin=*')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.query&&j.query.search)||[];
        return hits.map(function(h){return '« '+h.title+' » (Wikipedia : https://fr.wikipedia.org/wiki/'+encodeURIComponent(h.title)+')';}).join('\n');
      }).catch(function(){return '';});
  }
  function openalex(){
    return fetch('https://api.openalex.org/works?search='+encodeURIComponent(terms)+'&per-page=5&language=fre&mailto=prof.c2phi.fr@gmail.com')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.results)||[];
        return hits.filter(function(w){return w.title;}).map(function(w){
          var url=w.doi?w.doi:(w.id||'');
          var auth=w.authorships&&w.authorships[0]&&w.authorships[0].author&&w.authorships[0].author.display_name;
          return '« '+w.title+' »'+(w.publication_year?(' ('+w.publication_year+')'):'')+(auth?(' — '+auth):'')+' (source académique : '+url+')';
        }).join('\n');
      }).catch(function(){return '';});
  }
  function ddg(){
    return fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(terms)+'&kl=fr-fr&format=json&no_html=1&skip_disambig=1')
      .then(function(r){return r.json();})
      .then(function(j){
        var out=[];
        var topics=(j&&(j.RelatedTopics||[]))||[];
        topics.forEach(function(t){
          var u=t.FirstURL||(t.topics&&t.topics[0]&&t.topics[0].FirstURL);
          var x=t.Text||(t.topics&&t.topics[0]&&t.topics[0].Text);
          if(u&&x&&/https?:/.test(u)&&isFrUrl(u))out.push('« '+String(x).split(' - ')[0].slice(0,90)+' » ('+u+')');
        });
        return out.slice(0,3).join('\n');
      }).catch(function(){return '';});
  }
  return Promise.all([openalex(),wiki(),ddg()]).then(function(r){
    var lines=(r[0]+'\n'+r[1]+'\n'+r[2]).split('\n');
    /* OpenAlex : ne conserver que les œuvres en français dont le lien est un site français ou un DOI */
    lines=lines.filter(function(l){return l&&(/doi\.org|source académique/.test(l)?(/doi\.org/.test(l)||isFrUrl(l)):isFrUrl(l)||/Wikipedia : https:\/\/fr\.wikipedia\.org/.test(l));});
    return lines.slice(0,7).join('\n');
  }).catch(function(){return '';});
}
function aiSourcesLinks(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7).map(function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';}).join('<br>');
}
function aiAsk(k){
  if(st.ai>=AI_MAX){document.getElementById('aibox'+k).innerHTML='<div class="fb no">Limite de '+AI_MAX+' questions par session atteinte.</div>';return;}
  var q=document.getElementById('aiq'+k).value.trim();
  if(!q)return;
  var b=document.getElementById('aibox'+k);
  if(quotaLeft()<=0){b.innerHTML='<div class="fb no">Limite quotidienne d\'utilisation atteinte pour ce QCM.</div>';return;}
  b.innerHTML='<div class="fb ok">🔎 Recherche de sources…</div>';
  st.ai++;
  aiSearch(q).then(function(sources){
    b.innerHTML='<div class="fb ok">⏳ Recherche d\'une réponse…</div>';
    var sys='Tu es un professeur de philosophie au lycée. Réponds en français, en 120 mots maximum, de façon claire et pédagogique. Fonde-toi d\'abord sur l\'explication de la séance fournie ; tu peux la compléter avec les sources trouvées sur internet ci-dessous : sources académiques (articles, DOI) et sites sérieux sur le sujet (encyclopédies, universités, ressources de référence). Si tu t\'appuies sur une source, cite-la explicitement entre parenthèses (auteur ou site, titre) et donne le lien exact de la page consultée. Markdown simple autorisé (**gras**, listes, [libellé](https://lien)).';
    var usr=aiContext(k)+'\n\nSources trouvées sur internet :\n'+(sources||'(aucune source trouvée)')+'\n\nQuestion de l\'élève : '+q;
    aiCall(sys,usr,300,0.3,function(txt){
      if(txt){
        var links=aiSourcesLinks(sources);
        var sh='<div class="fb ok"><strong>Explication</strong><br>'+md(txt);
        if(links)sh+='<br><span class="lbl">Pages consultées :</span><br>'+links;
        sh+='</div>'+aiBox(k);
        b.innerHTML=sh;
      }
      else{b.innerHTML='<div class="fb no">Impossible de répondre pour le moment (connexion). Reformulez ou réessayez plus tard.</div>'+aiBox(k);}
    });
  });
}

/* ---- Cheat code : 3 clics rapides sur Valider -> mode édition ---- */
function openEditor(){
  var p=document.getElementById('editpanel');
  var h='<h2>Mode édition du QCM</h2>';
  h+=quotaPanelHtml();
  h+='<span class="lbl">Titre</span><input type="text" id="etitle" value="'+esc(QUIZ.title)+'">';
  h+='<span class="lbl">Sous-titre (classe et date)</span><input type="text" id="esub" value="'+esc(QUIZ.sub||document.getElementById('qsub').textContent)+'">';
  QUIZ.questions.forEach(function(q,k){
    h+='<div class="eq"><button class="mini danger" onclick="delQ('+k+')">Supprimer cette question</button>';
    h+='<span class="lbl">Intitulé / texte de la question</span><textarea rows="3" id="eq'+k+'">'+esc(q.type==='cloze'?q.segs.map(clozeRaw).join(''):q.name)+'</textarea>';
    h+='<span class="lbl">Type : '+(q.type==='single'?'choix unique':q.type==='multi'?'choix multiple':q.type==='short'?'réponse courte':q.type==='matching'?'association':'texte à trous')+'</span>';
    if(q.type==='single'||q.type==='multi'){
      q.options.forEach(function(o,j){
        h+='<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px">';
        h+='<span class="lbl">Option '+(j+1)+'</span>';
        h+='<input type="text" id="eo'+k+'_'+j+'" value="'+esc(o.text)+'">';
        h+='<label><input type="'+(q.type==='single'?'radio':'checkbox')+'" id="ec'+k+'_'+j+'" '+(o.correct?'checked':'')+' onchange="singleFix('+k+','+j+')"> Bonne réponse</label> ';
        h+='<span class="lbl">Explication (feedback)</span><textarea rows="2" id="ef'+k+'_'+j+'">'+esc(o.feedback)+'</textarea>';
        h+='<button class="mini" onclick="delOpt('+k+','+j+')">Retirer cette option</button></div>';
      });
      h+='<button class="mini" onclick="addOpt('+k+')">Ajouter une option</button>';
    }else if(q.type==='short'){
      h+='<span class="lbl">Réponses acceptées (séparées par des points-virgules)</span><input type="text" id="ea'+k+'" value="'+esc(q.answers.join(' ; '))+'">';
      h+='<span class="lbl">Explication</span><textarea rows="3" id="ef'+k+'">'+esc(q.feedback)+'</textarea>';
    }else if(q.type==='matching'){
      q.pairs.forEach(function(pr,j){
        h+='<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px"><input type="text" id="epq'+k+'_'+j+'" value="'+esc(pr.q)+'"> <input type="text" id="epa'+k+'_'+j+'" value="'+esc(pr.a)+'"> <button class="mini" onclick="delPair('+k+','+j+')">Retirer</button></div>';
      });
      h+='<button class="mini" onclick="addPair('+k+')">Ajouter une paire</button>';
    }else{
      h+='<span class="lbl">Texte à trous (syntaxe {1:SHORTANSWER:=réponse~~variante})</span><textarea rows="4" id="eq'+k+'">'+esc(q.segs.map(clozeRaw).join(''))+'</textarea>';
    }
    h+='</div>';
  });
  h+='<button class="ghost" onclick="addQ()">Ajouter une question (choix unique)</button><br>';
  h+='<button onclick="applyEdit()">Appliquer les modifications</button> ';
  h+='<button class="ghost" onclick="downloadJson()">Télécharger le QCM (JSON)</button> ';
  h+='<button class="ghost" onclick="downloadHtml()">Télécharger le QCM (HTML)</button> ';
  h+='<button class="danger" onclick="document.getElementById(\'editor\').classList.add(\'hidden\')">Fermer sans appliquer</button>';
  h+=quotaPanelHtml();
  p.innerHTML=h;
  document.getElementById('editor').classList.remove('hidden');
}
/* Panneau d'information sur la limite d'utilisation (affiché en tête et en pied du mode édition) */
function quotaPanelHtml(){
  var used=AI_DAILY_MAX-quotaLeft();
  var left=Math.max(0,AI_DAILY_MAX-used);
  var pct=Math.min(100,Math.round(100*used/AI_DAILY_MAX));
  var h='<div class="eq" style="border:1px solid var(--line);padding:10px;margin:10px 0">';
  h+='<strong>Limite d\'utilisation — données prises en compte</strong>';
  h+='<p style="margin:6px 0">QCM : '+esc(QUIZ.title)+' (identifiant : '+qid()+')<br>';
  h+='Jour : '+dayKey()+' — Identifiant de l\'appareil : '+esc(devId())+' — Adresse IP : '+esc(AI_IP)+'<br>';
  h+='Clé de comptage : '+esc(quotaKey())+'</p>';
  h+='<p style="margin:6px 0">Plafond : '+AI_DAILY_MAX+' utilisations par jour / appareil / IP / QCM — ';
  h+='<strong>Niveau atteint : '+used+' / '+AI_DAILY_MAX+' ('+pct+'%)</strong> — Restant au total : <strong>'+left+'</strong></p>';
  h+='<div style="background:var(--line);height:8px;border-radius:4px;overflow:hidden"><div style="background:var(--accent,#4a7);height:8px;width:'+pct+'%"></div></div>';
  h+='<p style="margin:6px 0">Limite de session : '+AI_MAX+' questions — posées dans cette session : '+st.ai+'</p>';
  h+='</div>';
  return h;
}
function clozeRaw(seg){
  return seg.t!==undefined?seg.t:'{1:SHORTANSWER:='+seg.blank.join('~~')+'}';
}
function singleFix(k,j){
  if(QUIZ.questions[k].type!=='single')return;
  QUIZ.questions[k].options.forEach(function(o,x){if(x!==j)document.getElementById('ec'+k+'_'+x).checked=false;});
}
function delQ(k){if(confirm('Supprimer cette question ?')){QUIZ.questions.splice(k,1);openEditor();}}
function delOpt(k,j){QUIZ.questions[k].options.splice(j,1);openEditor();}
function addOpt(k){QUIZ.questions[k].options.push({text:'Nouvelle option',correct:false,feedback:''});openEditor();}
function delPair(k,j){QUIZ.questions[k].pairs.splice(j,1);openEditor();}
function addPair(k){QUIZ.questions[k].pairs.push({q:'Élément',a:'Associé'});openEditor();}
function addQ(){QUIZ.questions.push({type:'single',name:'Nouvelle question',options:[{text:'Bonne réponse',correct:true,feedback:''},{text:'Mauvaise réponse 1',correct:false,feedback:''},{text:'Mauvaise réponse 2',correct:false,feedback:''},{text:'Mauvaise réponse 3',correct:false,feedback:''}]});openEditor();}

function applyEdit(){
  QUIZ.title=document.getElementById('etitle').value||QUIZ.title;
  document.getElementById('qtitle').textContent=QUIZ.title;
  document.title=QUIZ.title;
  QUIZ.sub=document.getElementById('esub').value||'';
  document.getElementById('qsub').textContent=QUIZ.sub;
  QUIZ.questions.forEach(function(q,k){
    if(q.type==='single'||q.type==='multi'){
      q.name=document.getElementById('eq'+k).value;
      q.options.forEach(function(o,j){
        o.text=document.getElementById('eo'+k+'_'+j).value;
        o.correct=!!document.getElementById('ec'+k+'_'+j).checked;
        o.feedback=document.getElementById('ef'+k+'_'+j).value;
      });
    }else if(q.type==='short'){
      q.name=document.getElementById('eq'+k).value;
      q.answers=document.getElementById('ea'+k).value.split(';').map(function(s){return s.trim();}).filter(Boolean);
      q.feedback=document.getElementById('ef'+k).value;
    }else if(q.type==='matching'){
      q.name=document.getElementById('eq'+k).value;
      q.pairs.forEach(function(p,j){
        p.q=document.getElementById('epq'+k+'_'+j).value;
        p.a=document.getElementById('epa'+k+'_'+j).value;
      });
    }else{
      var raw=document.getElementById('eq'+k).value;
      var segs=[],i=0,re=/\{1:(?:SHORTANSWER|MULTICHOICE|NUMERICAL):([^}]*)\}/g,m;
      while((m=re.exec(raw))!==null){
        if(m.index>i)segs.push({t:raw.slice(i,m.index)});
        segs.push({blank:m[1].split(/~~|~/).map(function(a){return a.replace(/^=/,'').trim();})});
        i=re.lastIndex;
      }
      if(i<raw.length)segs.push({t:raw.slice(i)});
      q.segs=segs;
    }
  });
  document.getElementById('editor').classList.add('hidden');
  st.i=Math.min(st.i,QUIZ.questions.length-1);st.score=0;st.clicks=[];render();
}
/* Nom de fichier des téléchargements : ClasseMoisJour-Notion (ex. TG51116-ImperatifCategorique.html).
   Classe extraite du sous-titre ou du titre ; mois et jour extraits de la date de la séance
   dans le sous-titre (sinon date du jour) ; notion = dernière partie du titre, sans accents,
   sans petits mots (l', le, de, …), chaque mot commençant par une majuscule. */
function dlBase(){
  var t=QUIZ.title||'qcm',sub=QUIZ.sub||'';
  var m=sub.match(/([A-Z]{2,4}\d(?:\/[A-Z]{2,4}\d)*)/)||t.match(/([A-Z]{2,4}\d)/);
  var cls=m?m[1].replace(/[^A-Za-z0-9]/g,''):'';
  var mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var dm=sub.toLowerCase().match(/(\d{1,2})(?:er)?\s+([a-zéû]+)/);
  var mo=dm?mois.indexOf(dm[2]):-1,mmdd;
  if(dm&&mo>=0){mmdd=('0'+(mo+1)).slice(-2)+('0'+parseInt(dm[1],10)).slice(-2);}
  else{var d=new Date();mmdd=('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
  var notion=t.split(/ : | - | — /).pop().trim();
  var stop={l:1,d:1,n:1,s:1,j:1,le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,a:1,au:1,aux:1,et:1,en:1,y:1,ce:1,cet:1,cette:1,que:1,qui:1,est:1,il:1,elle:1,on:1,comme:1,autre:1,autres:1};
  var slug=notion.replace(/[\u0027\u2019]/g,' ');
  try{slug=slug.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  slug=slug.split(/[^A-Za-z0-9]+/).filter(function(w){return w&&!stop[w.toLowerCase()];}).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');
  if(!slug)slug=t.replace(/[^A-Za-z0-9]/g,'')||'qcm';
  return (cls?cls:'')+mmdd+'-'+slug;
}
function downloadJson(){
  var blob=new Blob([JSON.stringify(QUIZ,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
/* Enregistre la page HTML complète avec le QCM modifié :
   exige que la déclaration « var QUIZ = {...}; » occupe une ligne unique. */
function downloadHtml(){
  applyEdit();
  var sc=document.getElementsByTagName('script'),si=-1;
  for(var i=0;i<sc.length;i++){if(sc[i].textContent.indexOf('var QUIZ = ')>=0){si=i;break;}}
  if(si<0){alert('Enregistrement impossible : script du QCM introuvable.');return;}
  var lines=sc[si].textContent.split('\n'),done=false;
  for(var L=0;L<lines.length;L++){
    if(lines[L].indexOf('var QUIZ = ')===0){lines[L]='var QUIZ = '+JSON.stringify(QUIZ)+';';done=true;break;}
  }
  if(!done){alert('Enregistrement impossible : la déclaration du QCM doit rester sur une ligne unique.');return;}
  var clone=document.documentElement.cloneNode(true);
  clone.getElementsByTagName('script')[si].textContent=lines.join('\n');
  var c=clone.querySelector('#quizcard'); if(c)c.innerHTML='';
  var ed=clone.querySelector('#editor'); if(ed){ed.classList.add('hidden');var ep=clone.querySelector('#editpanel');if(ep)ep.innerHTML='';}
  var blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'.html';
  document.body.appendChild(a);a.click();a.remove();
}
render();
