<style>

body[data-theme="pronote"]{--bg:#ffffff;--card:#fafafa;--ink:#333333;--acc:#006400;--acc2:#4a9d4a;--ok:#2e7d32;--bad:#b03030;--line:#c9c9c9;--font:Arial,Helvetica,'Segoe UI',sans-serif;--shadow:rgba(0,0,0,.08);--papier:#ffffff}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{

  background:var(--bg);
  color:var(--ink);

}

#plateau{
  display:flex;
  width:100%;
  min-height:100vh;
  align-items:stretch;
}

/* ---------- Colonne de gauche : La Feuille ---------- */
#feuille{

  min-width:0;

  background:var(--papier);

}
#regle-h{position:absolute;user-select:none;pointer-events:none;color:var(--ink);opacity:.32;top:10px;left:58px;right:126px;height:16px}
.graduation{position:absolute;background:currentColor}
#regle-h .graduation{bottom:0;width:1px;height:5px}
#regle-h .graduation.majeure{height:9px}

#bloc-titre-sujet{
  position:relative;
  width:100%;
  margin-bottom:16px;
  user-select:none;
}
.btn-titre-pleine-ligne{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--acc);
  border-radius:6px;
  padding:14px 18px;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink);
}
.btn-titre-pleine-ligne:hover{border-color:var(--acc)}
.btn-titre-pleine-ligne .texte-titre{
  font-size:1.35em;
  font-weight:700;
  line-height:1.3;
  color:var(--acc);
  flex:1;
}
.btn-titre-pleine-ligne .fleche-titre{
  font-size:1.1em;
  color:var(--acc);
  font-weight:700;
}
#liste-sujets-generes{
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:0;
  z-index:35;
  background:var(--papier);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 10px 28px var(--shadow);
  max-height:62vh;
  overflow-y:auto;
}
#liste-sujets-generes[hidden]{display:none}
.option-sujet{
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink);
  display:block;
}
.option-sujet:last-child{border-bottom:none}
.option-sujet:hover{background:color-mix(in srgb,var(--acc) 8%,var(--papier))}
.option-sujet.actif{background:color-mix(in srgb,var(--acc) 12%,var(--papier));border-left:4px solid var(--acc)}
.option-sujet .intitule-sujet{font-size:1em;font-weight:700;line-height:1.35;display:block}

details.extrait-doc{
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--acc);
  padding:10px 14px;
  margin-bottom:22px;
  border-radius:0 5px 5px 0;
  font-size:.88em;
  line-height:1.55;
  color:var(--ink);
}
details.extrait-doc summary{
  cursor:pointer;
  font-weight:700;
  color:var(--acc);
  user-select:none;
}
details.extrait-doc h4{margin:12px 0 4px;color:var(--acc)}
details.extrait-doc blockquote{font-style:italic;margin-bottom:8px}

#editeur-km{
  position:relative;
  outline:none;
  min-height:58vh;
  font-size:var(--taille-corps);
  line-height:var(--interligne);
  color:var(--ink);
  white-space:pre-wrap;
  word-wrap:break-word;
}
#editeur-km p{margin:0 0 .9em;text-indent:1.25em}

/* ---------- Colonne de droite ---------- */
#volet-droit{
  flex:1 1 44%;
  min-width:340px;
  min-height:100vh;
  background:var(--bg);
  padding:18px 22px 48px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.entete-volet-droit{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

#zone-cascade-tags{
  flex:1;
  min-height:40px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#cascade-liste{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:240px;
  overflow-y:auto;
  padding-right:4px;
}
.strate-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  transition:opacity .35s ease;
}
.tag-nuage{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:5px 11px;
  font-family:var(--font);
  font-size:.86em;
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
}
.tag-nuage:hover{border-color:var(--acc)}
.tag-nuage.selectionne{
  background:var(--acc);
  color:#ffffff;
  border-color:var(--acc);
  font-weight:700;
}
.actions-cascade{display:flex;gap:8px;align-items:center}
#btn-selectionner-tags{
  margin:0;
  background:var(--acc);
  color:#ffffff;
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-family:var(--font);
  font-size:.85em;
  font-weight:700;
  cursor:pointer;
}
#btn-deselectionner-tags{
  margin:0;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 10px;
  font-family:var(--font);
  font-size:.82em;
  cursor:pointer;
}

.actions-droite-haut{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
button.burgerbtn{
  margin:0;
  width:38px;
  height:38px;
  flex-shrink:0;
  padding:0;
  border-radius:9px;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  font:700 1.15em/1 var(--font);
  cursor:pointer;
  box-shadow:0 1px 4px var(--shadow);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
button.burgerbtn:hover{border-color:var(--acc);color:var(--acc)}

.menuwrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:60;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  padding:56px 18px 18px;
  overflow:auto;
}
.menubox{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:14px;
  min-width:265px;
  max-width:320px;
  padding:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  font-family:var(--font);
}
.menubox .mtitle{
  font-weight:700;
  padding:8px 12px 6px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:8px;
}
.menubox button{
  display:flex;
  width:100%;
  margin:0;
  background:transparent;
  color:var(--ink);
  border:none;
  border-radius:8px;
  padding:10px 12px;
  font-size:.92em;
  text-align:left;
  align-items:center;
  gap:10px;
  cursor:pointer;
}
.menubox button:hover{
  background:color-mix(in srgb,var(--acc) 10%,var(--card));
  color:var(--acc);
}
.menubox .mic{width:20px;text-align:center;font-weight:700}

/* ---------- Carte QCM ---------- */
#zone-qcm-wrapper{display:flex;flex-direction:column;gap:10px}
#zone-qcm-wrapper[hidden]{display:none}
.barre-qcm-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini-tags-qcm{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.mini-tag{
  font-size:.74em;
  padding:2px 7px;
  border-radius:10px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  opacity:.85;
}
.mini-tag.actif{border-color:var(--acc);color:var(--acc);font-weight:700;opacity:1}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px 22px 22px;
  box-shadow:0 3px 10px var(--shadow);
  animation:cardIn .45s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}

.qcm-header-graphique{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.qcm-header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.qcm-titre-court{
  font-size:1.02em;
  font-weight:700;
  color:var(--acc);
  line-height:1.25;
  flex:1;
}
.badge-cat-graphique{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:12px;
  font-size:.74em;
  font-weight:700;
  letter-spacing:.02em;
  background:color-mix(in srgb,var(--cat-color,var(--acc)) 14%,var(--papier));
  color:var(--cat-color,var(--acc));
  border:1px solid color-mix(in srgb,var(--cat-color,var(--acc)) 45%,transparent);
  width:fit-content;
}
.badge-cat-graphique .dot-cat{
  width:7px;height:7px;border-radius:50%;background:var(--cat-color,var(--acc));
}

.jauge-segments{
  display:flex;
  align-items:center;
  gap:4px;
  width:100%;
  height:7px;
}
.segment-prog{
  flex:1;
  height:100%;
  border-radius:4px;
  background:var(--line);
  cursor:pointer;
  transition:background .3s ease,transform .15s ease;
}
.segment-prog:hover{transform:scaleY(1.35)}
.segment-prog.fait-ok{background:var(--ok)}
.segment-prog.fait-ko{background:var(--bad)}
.segment-prog.courant{background:var(--cat-color,var(--acc));box-shadow:0 0 0 1px color-mix(in srgb,var(--cat-color,var(--acc)) 40%,transparent)}

.qtext{font-size:1.08em;margin:0 0 14px;line-height:1.5}
label.opt,div.opt{
  display:block;border:1px solid var(--line);border-radius:5px;
  padding:10px 12px;margin:8px 0;cursor:pointer;line-height:1.4;
}
label.opt.sel,div.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
label.opt.good,div.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
label.opt.bad,div.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}

input[type=text],textarea.essai-area{
  font-family:var(--font);font-size:1em;color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;background:var(--card);
}
textarea.essai-area{
  min-height:150px;
  line-height:1.58;
  resize:vertical;
}
select.pairsel{width:100%;margin:6px 0;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-family:var(--font)}

.card button{
  font-family:var(--font);font-size:1em;font-weight:bold;background:var(--acc);color:#fff;
  border:none;border-radius:6px;padding:11px 24px;cursor:pointer;margin-top:14px;
}
.card button.ghost{background:var(--ink)}

.fb{
  margin-top:14px;padding:12px 14px;border-radius:9px;line-height:1.5;font-size:.95em;
}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid var(--bad)}

.score{font-size:1.25em;text-align:center;margin:10px 0}
.score .big{font-size:2em;color:var(--acc);display:block}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:var(--ok);transition:width 1.1s cubic-bezier(.25,.9,.3,1)}
.rq{border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;background:color-mix(in srgb,var(--acc) 3%,var(--card))}

@media (max-width:960px){
  #plateau{flex-direction:column}
  #feuille,#volet-droit{flex:none;width:100%;min-height:auto}
  #feuille{border-right:none;border-bottom:1px solid var(--line);padding:36px 24px 48px}
  #regle-h{left:24px;right:96px}
}
</style>

<script>
"use strict";
var CLE_STORAGE = "tg-marx-etat";
var CATEGORIES_COULEURS = {
  "Matérialisme historique": "#1c5d99",
  "Aliénation": "#b03030",
  "Travail et production": "#7a5b1e",
  "Individu et société": "#4a9d4a",
  "Association": "#8f3a9e",
  "Synthèse": "#2e7d32"
};
var TEXTES = [
  { id:"t1", titre:"Texte 1 — Marx, Avant-propos de la Contribution à la critique de l'économie politique (1859)",
    corps:"Dans la production sociale de leur existence, les hommes entrent en des rapports déterminés, nécessaires, indépendants de leur volonté ; ces rapports de production correspondent à un degré de développement déterminé de leurs forces productives matérielles. L'ensemble de ces rapports de production constitue la structure économique de la société, la base réelle sur laquelle s'élève une superstructure juridique et politique, et à laquelle correspondent des formes de conscience sociales déterminées. […] Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience. À un certain degré de leur développement, les forces productives matérielles de la société entrent en collision avec les rapports de production existants, ou, ce qui n'en est que l'expression juridique, avec les rapports de propriété au sein desquels elles s'étaient mues jusqu'alors. De formes de développement des forces productives qu'ils étaient, ces rapports en deviennent des entraves. Alors commence une ère de révolution sociale." },
  { id:"t2", titre:"Texte 2 — Marx, Manuscrits de 1844 : le travail aliéné",
    corps:"En quoi consiste maintenant l'aliénation du travail ? D'abord en ceci que le travail est extérieur à l'ouvrier, c'est-à-dire qu'il n'appartient pas à son essence ; donc que, dans son travail, celui-ci ne s'affirme pas, mais se nie, ne se sent pas à l'aise, mais malheureux ; il n'y déploie pas une libre activité physique et intellectuelle, mais mortifie son corps et ruine son esprit. En conséquence, l'ouvrier ne se sent auprès de lui-même qu'en dehors du travail ; dans le travail, il se sent en dehors de soi. Il est comme chez lui quand il ne travaille pas, et quand il travaille, il ne se sent pas chez lui. Son travail n'est pas volontaire, mais contraint ; c'est du travail forcé ; il n'est pas la satisfaction d'un besoin, mais un simple moyen de satisfaire des besoins extérieurs à lui. Son caractère étranger ressort clairement de ce que, dès qu'il n'existe aucune contrainte physique ou autre, le travail est fui comme la peste. […] Dans son travail, l'homme se rabaisse au rang de bête : l'activité la plus libre, celle qui constitue son essence, devient pour lui un simple moyen de subsistance. Il ne se sent plus librement actif que dans ses fonctions animales (manger, boire, procréer), et se sent rabaisse et esclave dans ses fonctions proprement humaines — qui sont pourtant les seules qui le définissent." },
  { id:"t3", titre:"Texte 3 — Marx, Le Capital, livre I : le moyen de travail",
    corps:"La terre est son magasin de vivres primitif, et elle est en même temps son arsenal primitif des moyens de travail. […] La chose (ou l'ensemble complexe de choses) que l'homme interpose entre lui et l'objet de son travail comme conducteur de son activité, il l'utilise pour en tirer un effet conforme à son but. […] Il n'en reste pas moins que, du point de vue du procès de production, l'élément essentiel n'est pas l'objet de travail, mais le moyen de travail. […] L'animal, au demeurant, est loin de faire de l'emploi des moyens de travail, à proprement parler, une caractéristique de son espèce : l'emploi et la création de moyens de travail, bien qu'ils soient, chez certains animaux, embryonnaires, caractérisent éminemment le travail humain. C'est pourquoi Franklin définit l'homme comme « un animal qui fabrique des outils »." },
  { id:"t4", titre:"Texte 4 — Marx, Grundrisse (1857-1858) : zôon politikon",
    corps:"L'être humain est au sens littéral un zôon politikon, non seulement un animal sociable, mais un animal qui ne peut s'isoler que dans la société. La production par des individus isolés hors de la société — production qui serait aussi absurde que le développement du langage sans individus vivant et parlant ensemble — n'existe que rarement : elle serait le fait de sauvages déjà équipés, en puissance, des forces sociales, d'individus civilisés tombés par accident dans les ténèbres de la nature. […] L'individu particularisé de la société civile n'est rien sans la société : ses forces, ses besoins, son langage même sont des produits sociaux — même quand il croit se suffire à lui-même, c'est la société qui parle et produit en lui." }

{ id:"d2", categorie:"Individu et société", scenario:"Texte 4 — L'individu et la société", type:"single", name:"Pourquoi la production en dehors de la société est-elle chose aussi absurde que le développement du langage sans individus parlant ensemble ?", options:[ {text:"Parce que le langage et la production ne sont réalisables qu'ensemble et par des êtres en relation : l'individualité humaine n'existe que comme réalité sociale, même quand la société n'est pas là pour l'entourer.", correct:true, feedback:"Marx vise le mythe de Robinson Crusoé, utilisé par l'économie politique pour faire croire à un producteur solitaire. Un civilisé transporté dans un lieu désert ne peut produire seul que parce qu'il possède déjà en puissance les forces propres à la société : la société est en lui, même quand elle n'est pas autour de lui."}, {text:"Parce que le langage peut se développer par écrit, sans jamais personne autour.", correct:false, feedback:""}, {text:"Parce que le travail solitaire est plus productif que le travail collectif.", correct:false, feedback:""}, {text:"Parce que Marx estime qu'il faut toujours travailler à plusieurs pour la bonne forme.", correct:false, feedback:""}]},

function nbsp(s){ return String(s).replace(/ ([;:!?])/g,"\u00A0$1"); }
function esc(s){
  return nbsp(String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"));
}
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  var s = [];
  s.push({ id:"s-tous", titre:"Marx et le matérialisme historique : l'homme, un être de rapports ?", qcmIds: BASE_QCM.map(function(q){ return q.id; }) });

}

var MOTSCLES = ["forces productives","rapports de production","superstructure","conscience","être social","aliénation","extérieur","travail forcé","moyen de travail","outil","animal","société","individu","base","révolution","propriété","langage","essence","contrainte","entraves"];

function analyserParagraphe(texte){
  var n = norm(texte);
  if(n.length < 4) return;
  var trouves = MOTSCLES.filter(function(m){ return n.indexOf(norm(m)) !== -1; }).slice(0, 8);
  if(!trouves.length) return;
  var derniere = etat.stratesTags[etat.stratesTags.length - 1];
  if(derniere && derniere.tags.join(",") === trouves.join(",")) return;
  etat.stratesTags.push({ extrait: texte.slice(0, 60), tags: trouves });
  sauverEtat();
  rendreCascadeTags();
}

function rendreCascadeTags(){
  var l = document.getElementById('cascade-liste');
  l.innerHTML = "";
  var total = etat.stratesTags.length;
  etat.stratesTags.forEach(function(strate, i){
    var ligne = document.createElement('div');
    ligne.className = "strate-tags";
    ligne.style.opacity = Math.max(0.32, 1 - ((total - 1 - i) * 0.22)).toFixed(2);
    strate.tags.forEach(function(m){
      var b = document.createElement('button');
      b.type = "button";
      var sel = etat.tagsSelectionnes.indexOf(m) !== -1;
      b.className = "tag-nuage" + (sel ? " selectionne" : "");
      b.textContent = m;
      b.onclick = function(){
        var p = etat.tagsSelectionnes.indexOf(m);
        if(p >= 0) etat.tagsSelectionnes.splice(p, 1);
        else etat.tagsSelectionnes.push(m);
        sauverEtat();
        rendreCascadeTags();
      };
      ligne.appendChild(b);
    });
    l.appendChild(ligne);
  });
  l.scrollTop = l.scrollHeight;
}

document.getElementById('btn-selectionner-tags').onclick = function(){
  if(!etat.tagsSelectionnes.length){ etat.qcmActifsIds = []; zoneQcmWrapper.hidden = true; sauverEtat(); return; }
  var ens = {};
  BASE_QCM.forEach(function(q){
    var sources = [q.name];
    if(q.options) q.options.forEach(function(o){ if(o.correct) sources.push(o.text, o.feedback || ""); });
    if(q.answers) sources.push(q.answers.join(" "));
    if(q.pairs) q.pairs.forEach(function(p){ sources.push(p.q, p.a); });
    var blob = norm(sources.join(" "));
    etat.tagsSelectionnes.forEach(function(t){ if(blob.indexOf(norm(t)) !== -1) ens[q.id] = true; });
  });
  etat.qcmActifsIds = Object.keys(ens);
  etat.qIndex = 0; etat.score = 0; etat.ans = {}; etat.answered = false;
  sauverEtat();
  if(etat.qcmActifsIds.length){ zoneQcmWrapper.hidden = false; renderQCM(); }
  else zoneQcmWrapper.hidden = true;
};
document.getElementById('btn-deselectionner-tags').onclick = function(){
  etat.tagsSelectionnes = [];
  sauverEtat();
  rendreCascadeTags();
};

editeur.addEventListener('input', function(){

});

function obtenirQcmActifs(){
  return etat.qcmActifsIds.map(function(id){ return BASE_QCM.filter(function(q){ return q.id === id; })[0]; }).filter(Boolean);
}

function renderQCM(){
  var Q = obtenirQcmActifs();
  if(!Q.length){ zoneQcmWrapper.hidden = true; return; }
  zoneQcmWrapper.hidden = false;
  if(etat.qIndex >= Q.length) etat.qIndex = 0;
  etat.answered = false;
  var q = Q[etat.qIndex];
  var segments = Q.map(function(item, idx){
    var a = etat.ans[idx];
    var cls = "segment-prog";
    if(idx === etat.qIndex) cls += " courant";
    else if(a && a.ok) cls += " fait-ok";
    else if(a && !a.ok) cls += " fait-ko";
    return '<div class="' + cls + '" data-qidx="' + idx + '" title="Question ' + (idx + 1) + '"></div>';
  }).join("");
  var couleurCat = CATEGORIES_COULEURS[q.categorie] || "var(--acc)";
  var h = '';
  h += '<div class="qcm-header-graphique"><div class="jauge-segments">' + segments + '</div>';
  h += '<div class="qcm-header-top"><div class="qcm-titre-court">Question ' + (etat.qIndex + 1) + ' / ' + Q.length + '</div></div>';
  h += '<span class="badge-cat-graphique" style="--cat-color:' + couleurCat + '"><span class="dot-cat"></span>' + esc(q.categorie) + '</span>';
  h += '<div style="font-size:.8em;opacity:.7">' + esc(q.scenario) + '</div></div>';
  h += '<p class="qtext">' + esc(q.name) + '</p>';

  if(q.type === "single" || q.type === "multi"){
    var perm = shuffle(q.options.map(function(o, k){ return k; }));
    etat.perm = perm;
    perm.forEach(function(orig, d){
      h += '<label class="opt" id="opt' + d + '"><input type="' + (q.type === "multi" ? "checkbox" : "radio") + '" name="q" value="' + d + '" onchange="markSel()"> ' + esc(q.options[orig].text) + '</label>';
    });
  } else if(q.type === "short"){
    h += '<input type="text" id="shortin" placeholder="Votre réponse…">';
  } else if(q.type === "long"){
    h += '<textarea class="essai-area" id="longin" placeholder="Rédigez ici (au moins quelques phrases)…"></textarea>';
  } else if(q.type === "matching"){
    var pool = shuffle(q.pairs.map(function(p){ return p.a; }));
    q.pairs.forEach(function(p, k){
      h += '<p style="margin:8px 0"><strong>' + esc(p.q) + '</strong></p>';
      h += '<select class="pairsel" id="sel' + k + '"><option value="">— Choisir —</option>';
      pool.forEach(function(rep){
        h += '<option value="' + esc(rep) + '">' + esc(rep) + '</option>';
      });
      h += '</select>';
    });
  }
  h += '<button type="button" id="btn-valider" onclick="validate()">Valider</button>';
  card.innerHTML = h;
}

function markSel(){
  Array.prototype.forEach.call(document.querySelectorAll('label.opt'), function(l){ l.classList.remove('sel'); });
  Array.prototype.forEach.call(document.querySelectorAll('input[name=q]'), function(inp){
    if(inp.checked) inp.closest('label').classList.add('sel');
  });
}

function validate(){
  if(etat.answered) return;
  var Q = obtenirQcmActifs();
  var q = Q[etat.qIndex];
  var ok = false, fb = "";
  if(q.type === "single" || q.type === "multi"){
    var selD = Array.prototype.map.call(document.querySelectorAll('input[name=q]:checked'), function(i){ return +i.value; });
    var sel = selD.map(function(d){ return etat.perm[d]; });
    var corr = q.options.map(function(o, k){ return o.correct ? k : -1; }).filter(function(k){ return k >= 0; });
    ok = q.type === "single" ? (sel.length === 1 && corr.indexOf(sel[0]) >= 0)
                            : (sel.length === corr.length && sel.every(function(s){ return corr.indexOf(s) >= 0; }));
    etat.perm.forEach(function(orig, d){
      var el = document.getElementById('opt' + d);
      if(q.options[orig].correct) el.classList.add('good');
      else if(selD.indexOf(d) >= 0) el.classList.add('bad');
      el.querySelector('input').disabled = true;
    });
    etat.ans[etat.qIndex] = { ok: ok, given: sel };
    fb = corr.map(function(k){ return q.options[k].feedback; }).filter(Boolean).join("<br><br>");
  } else if(q.type === "short" || q.type === "long"){
    var inp = document.getElementById(q.type === "short" ? 'shortin' : 'longin');
    var v = (inp.value || "").trim();
    if(q.type === "long"){
      if(v.length < 40){ alert("Rédigez au moins quelques phrases avant de valider."); return; }
      fb = q.feedback || ""; ok = true;
    } else {
      ok = q.answers.some(function(a){ return norm(a) === norm(v); });
      fb = q.feedback || ("Réponse attendue : " + q.answers[0]);
    }
    inp.disabled = true;
    etat.ans[etat.qIndex] = { ok: ok, given: v };
  } else if(q.type === "matching"){
    var allOk = true;
    q.pairs.forEach(function(p, k){
      var s = document.getElementById('sel' + k);
      if(norm(s.value) !== norm(p.a)) allOk = false;
      s.disabled = true;
    });
    ok = allOk;
    etat.ans[etat.qIndex] = { ok: ok, given: q.pairs.map(function(p, k){ return document.getElementById('sel' + k).value; }) };
    fb = "Associations correctes : " + q.pairs.map(function(p){ return p.q + " → " + p.a; }).join(" ; ");
  }
  if(ok) etat.score++;
  etat.answered = true;
  etat.performances.reponses[q.id] = { ok: ok, question: q.name, date: new Date().toISOString() };
  var seg = card.querySelector('.segment-prog[data-qidx="' + etat.qIndex + '"]');
  if(seg){ seg.classList.remove('courant'); seg.classList.add(ok ? 'fait-ok' : 'fait-ko'); }
  sauverEtat();
  var rep = '<button type="button" class="ghost" onclick="redoQ()">← Refaire cette question</button> '
          + '<button type="button" onclick="nextQ()">' + (etat.qIndex + 1 < Q.length ? "Question suivante →" : "Voir le score") + '</button>';
  var bv = document.getElementById('btn-valider');
  if(bv) bv.style.display = 'none';
  card.insertAdjacentHTML('afterbegin', '<div class="fb ' + (ok ? "ok" : "no") + '"><strong>' + (ok ? "Réponse acceptée ✔" : "Explication") + '</strong><br>' + fb + '</div>');
  card.insertAdjacentHTML('beforeend', '<div style="text-align:center;margin-top:12px">' + rep + '</div>');
}

function redoQ(){
  var a = etat.ans[etat.qIndex];
  if(a && a.ok) etat.score--;
  delete etat.ans[etat.qIndex];
  sauverEtat();
  renderQCM();
}
function nextQ(){
  var Q = obtenirQcmActifs();
  etat.qIndex++;
  sauverEtat();
  if(etat.qIndex < Q.length) renderQCM();
  else renderScoreQCM();
}

function renderScoreQCM(){
  var Q = obtenirQcmActifs();
  var n = Q.length, s = etat.score, pct = Math.round(100 * s / Math.max(1, n));
  card.innerHTML = '<div class="qcm-header-graphique"><span class="badge-cat-graphique">' + (pct >= 80 ? "🏆 " : "") + 'Score — ' + n + ' question' + (n > 1 ? 's' : '') + '</span></div>'
    + '<div class="score"><span class="big">' + s + ' / ' + n + '</span>' + pct + '%</div>'
    + '<div class="bar"><div id="scorebar" style="width:0%"></div></div>'
    + '<div style="text-align:center"><button type="button" onclick="reviewQCM()">Revoir les réponses</button> <button type="button" class="ghost" onclick="restartQCM()">Refaire</button></div>';
  setTimeout(function(){ var b = document.getElementById('scorebar'); if(b) b.style.width = pct + "%"; }, 100);
}

function reviewQCM(){
  var Q = obtenirQcmActifs();
  var h = '<div class="qcm-titre-court" style="margin-bottom:10px">Récapitulatif</div>';
  Q.forEach(function(q, k){
    var a = etat.ans[k] || { ok: false, given: null };
    h += '<div class="rq"><p class="qtext">' + (k + 1) + '. ' + esc(q.name) + '</p>';
    if(q.options){
      q.options.forEach(function(o, j){
        var picked = a.given && a.given.indexOf(j) >= 0;
        var cls = o.correct ? 'good' : (picked ? 'bad' : '');
        h += '<div class="opt ' + cls + '">' + (o.correct ? "✔ " : "") + esc(o.text) + (picked ? ' <em>(votre réponse)</em>' : '') + '</div>';
      });
      var corr = q.options.filter(function(o){ return o.correct; }).map(function(o){ return o.feedback || o.text; }).join("<br><br>");
      h += '<div class="fb ' + (a.ok ? 'ok' : 'no') + '">' + corr + '</div>';
    } else if(q.pairs){
      q.pairs.forEach(function(p, j){
        var gv = a.given ? a.given[j] : "";
        h += '<p>' + esc(p.q) + ' → <em>' + esc(gv || "—") + '</em>' + (norm(gv) === norm(p.a) ? ' ✔' : ' <em>(attendu : ' + esc(p.a) + ')</em>') + '</p>';
      });
    } else {
      h += '<p>' + esc(a.given || "") + (q.feedback ? '<br><br><em>' + esc(q.feedback) + '</em>' : '') + '</p>';
    }
    h += '</div>';
  });
  h += '<div style="text-align:center"><button type="button" onclick="restartQCM()">Refaire</button> <button type="button" class="ghost" onclick="renderScoreQCM()">Retour au score</button></div>';
  card.innerHTML = h;
}

function restartQCM(){
  etat.qIndex = 0; etat.score = 0; etat.ans = {};
  sauverEtat();
  renderQCM();
}

document.getElementById('btn-hamburger').onclick = function(){
  fermerMenu();
  var w = document.createElement('div');
  w.className = 'menuwrap';
  w.id = 'menuwrap';
  w.onclick = function(e){ if(e.target === w) w.remove(); };
  var themes = ["pronote","moderne","manuscrit","nuit"];
  var box = document.createElement('div');
  box.className = 'menubox';
  box.innerHTML = '<div class="mtitle"><span>TG — Marx : liberté et matérialisme</span></div>'
    + '<button type="button" id="m-theme"><span class="mic">🎨</span>Thème : ' + esc(etat.theme) + '</button>'
    + '<button type="button" id="m-taille"><span class="mic">🔎</span>Taille : ' + etat.taille + ' px</button>'
    + '<button type="button" id="m-export"><span class="mic">📤</span>Sauvegarde (JSON)</button>'
    + '<button type="button" id="m-import"><span class="mic">📥</span>Importer (JSON)</button>'
    + '<button type="button" id="m-bilan"><span class="mic">✓</span>Bilan des performances</button>';
  w.appendChild(box);
  document.body.appendChild(w);
  box.querySelector('#m-theme').onclick = function(){
    etat.theme = themes[(themes.indexOf(etat.theme) + 1) % themes.length];
    document.body.setAttribute('data-theme', etat.theme);
    this.innerHTML = '<span class="mic">🎨</span>Thème : ' + esc(etat.theme);
    sauverEtat();
  };
  box.querySelector('#m-taille').onclick = function(){
    var t = [16,18,20];
    etat.taille = t[(t.indexOf(etat.taille) + 1) % t.length];
    document.documentElement.style.setProperty('--taille-corps', etat.taille + 'px');
    this.innerHTML = '<span class="mic">🔎</span>Taille : ' + etat.taille + ' px';
    sauverEtat();
  };
  box.querySelector('#m-export').onclick = function(){ w.remove(); exporterJSON(); };
  box.querySelector('#m-import').onclick = function(){ w.remove(); document.getElementById('fichier-import').click(); };
  box.querySelector('#m-bilan').onclick = function(){
    w.remove();
    var reps = Object.keys(etat.performances.reponses).map(function(k){ return etat.performances.reponses[k]; });
    var bonnes = reps.filter(function(r){ return r.ok; }).length;
    alert("BILAN — TG Marx : matérialisme historique\n\nQuestions traitées : " + reps.length + "\nRéponses justes : " + bonnes + "\nRédaction en cours : " + (editeur.innerText || "").length + " caractères\nStrates de mots-clés : " + etat.stratesTags.length);
  };
};
function fermerMenu(){ var w = document.getElementById('menuwrap'); if(w) w.remove(); }

function exporterJSON(){
  etat.contenuHTML = editeur.innerHTML;
  var payload = {
    application: "TG — LiberteMarx",
    site: "https://c2phi.fr",
    github: "https://github.com/c2phi-prof",
    date: new Date().toISOString(),
    sujetActifId: etat.sujetActifId,
    texteBrut: editeur.innerText,
    contenuHTML: etat.contenuHTML,
    stratesTags: etat.stratesTags,
    tagsSelectionnes: etat.tagsSelectionnes,
    performances: etat.performances
  };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
  a.download = "tg-marx-" + payload.date.slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById('fichier-import').addEventListener('change', function(e){
  var f = e.target.files[0];
  e.target.value = "";
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var doc = JSON.parse(fr.result);
      if(doc.contenuHTML){
        editeur.innerHTML = editeur.innerHTML + doc.contenuHTML;
        etat.contenuHTML = editeur.innerHTML;
      }
      if(Array.isArray(doc.stratesTags)) etat.stratesTags = etat.stratesTags.concat(doc.stratesTags);
      if(doc.performances && doc.performances.reponses)
        etat.performances.reponses = Object.assign({}, etat.performances.reponses, doc.performances.reponses);
      sauverEtat();
      rendreCascadeTags();
      alert("Session restaurée.");
    } catch(err){ alert("Fichier JSON invalide."); }
  };
  fr.readAsText(f);
});

function dessinerRegle(){
  var h = document.getElementById('regle-h');
  if(!h) return;
  var px = 37.8;
  h.innerHTML = "";
  var largCm = Math.floor((feuille.clientWidth - 184) / px);
  for(var c = 0; c <= largCm; c++){
    var t = document.createElement('span');
    t.style.cssText = "position:absolute;bottom:0;width:1px;height:" + (c % 2 === 0 ? 9 : 5) + "px;left:" + (c * px) + "px;background:currentColor";
    h.appendChild(t);
  }
}

document.body.setAttribute('data-theme', etat.theme || "pronote");
document.documentElement.style.setProperty('--taille-corps', (etat.taille || 18) + "px");
if(etat.contenuHTML) editeur.innerHTML = etat.contenuHTML;
genererSujets();
rendreMenuTitres();
rendreTextes();
rendreCascadeTags();
dessinerRegle();
window.addEventListener('resize', dessinerRegle);
if(!etat.qcmActifsIds || !etat.qcmActifsIds.length){
  etat.qcmActifsIds = listeSujets[0].qcmIds.slice();
  sauverEtat();
}
zoneQcmWrapper.hidden = false;
renderQCM();
</script>
