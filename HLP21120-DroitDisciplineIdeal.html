var HELP_DEF = "## Comment fonctionne ce QCM ?\n\n**Déroulement.** Le QCM présente les questions une par une. Choisissez votre réponse puis cliquez sur **Valider** : un encart affiche alors « Réponse acceptée. » ou l'explication du cours (encart « Explication » si la réponse ne convient pas). La barre de progression en haut indique votre avancement.\n\n**Types de questions.** Cinq formes possibles : choix unique (une seule bonne réponse), choix multiple (plusieurs bonnes réponses), réponse courte (tapez votre réponse, les variantes proches sont acceptées), association (relier chaque élément à sa définition) et texte à trous (complétez la phrase). Dans les questions à trous et les réponses courtes, la touche **Entrée** valide directement la réponse.\n\n**Écran de score.** À la fin, votre score s'affiche accompagné d'un bilan de votre performance : une appréciation d'ensemble, les types d'erreurs à corriger et deux conseils pour progresser.\n\n## L'écran « Revoir les réponses du QCM »\n\nDepuis l'écran de score, le bouton **Revoir les réponses du QCM** affiche le récapitulatif complet : pour chaque question, votre réponse, la bonne réponse mise en évidence et l'explication du cours.\n\n**Poser une question.** Sous chaque question du récapitulatif, le bouton **Poser une question** ouvre une recherche : la réponse est cherchée dans des sources en ligne (des pages consultées sont indiquées sous chaque réponse). Vous pouvez poser **plusieurs questions successives** : elles s'empilent les unes sous les autres et restent enregistrées dans le navigateur, même après avoir fermé la page. La touche Entrée envoie la question, le bouton **Réduire** referme la conversation.\n\n**Enregistrer.** Deux exports sont possibles :\n- **Enregistrer les questions et réponses (texte)** (en haut du récapitulatif) : enregistre uniquement les questions que vous avez posées et les réponses obtenues.\n- **Enregistrer mon résultat** (en bas de page) : enregistre tout votre résultat (chaque question, votre réponse, la réponse attendue, l'explication du cours) ainsi que toutes les questions posées et les réponses obtenues.\n\nLes fichiers obtenus sont des fichiers texte que vous pouvez conserver, imprimer ou consulter plus tard.\n\n## Apparence et navigation\n\n\n- Les deux boutons ronds à droite de l'écran permettent de **remonter tout en haut** (flèche du haut) ou de **descendre tout en bas** (flèche du bas) du QCM.\n- Chaque appareil dispose d'une **limite quotidienne d'utilisation** pour un QCM donné : au-delà, les recherches de réponses ne sont plus possibles jusqu'au lendemain, mais le QCM reste utilisable.";

function nbsp(s){return String(s).replace(/ ([;:!?])/g,'\u00A0$1').replace(/« /g,'«\u00A0').replace(/ »/g,'\u00A0»');}
function esc(s){return nbsp(s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* Mélange forcé des options : la bonne réponse ne peut jamais apparaître en 1re position,
   et au moins une mauvaise réponse précède la première bonne (quelle que soit la banque). */
function melangeOptions(opts){
  var perm=shuffle(opts.map(function(o,k){return k;}));
  var nbGood=opts.filter(function(o){return o.correct;}).length;
  if(nbGood>=opts.length)return perm; /* toutes bonnes ou toutes mauvaises : rien à forcer */
  /* garantir qu'une mauvaise réponse précède la première bonne */
  var essais=0;
  while(essais<20){
    var firstGood=perm.length;
    for(var i=0;i<perm.length;i++){if(opts[perm[i]].correct){firstGood=i;break;}}
    if(firstGood>0)return perm; /* une mauvaise réponse est déjà devant */
    /* échanger la bonne réponse de tête avec une mauvaise prise au hasard plus loin */
    var bads=[];for(var j=1;j<perm.length;j++){if(!opts[perm[j]].correct)bads.push(j);}
    if(!bads.length)return perm;
    var pick=bads[Math.floor(Math.random()*bads.length)];
    var t=perm[0];perm[0]=perm[pick];perm[pick]=t;
    essais++;
  }
  return perm;
}

      h+='<label class="opt" id="opt'+d+'" style="animation-delay:'+(0.05+d*0.07)+'s"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="q" value="'+d+'" onchange="markSel()"> '+esc(q.options[orig].text)+'</label>';

  }else if(q.type==='matching'){

    });
  }else if(q.type==='cloze'){

      if(s.t!==undefined){h+=esc(s.t);}else{h+='<span class="blank"><input type="text" id="cz'+k+'" onkeydown="keyGo(event)" style="min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"></span>';}

    });
    st.ans[st.i]={ok:ok,given:sel};
    fb=corr.map(function(k){return q.options[k].feedback||'';}).join('<br><br>')||('Réponse attendue : '+corr.map(function(k){return q.options[k].text;}).join(' ; '));
  }else if(q.type==='short'){
    var inp=document.getElementById('shortin');
    var v=norm(inp.value);
    ok=q.answers.some(function(a){return norm(a)===v;});
    inp.disabled=true;
    st.ans[st.i]={ok:ok,given:inp.value};
    fb=q.feedback||('Réponses acceptées : '+q.answers.join(' ; '));
    if(!ok&&v){pending=function(done){aiCheckText(st.i,inp.value,q.answers,done);};}
  }else if(q.type==='matching'){
    var allOk=true;
    q.pairs.forEach(function(p,k){
      var v=document.getElementById('sel'+k).value;
      if(norm(v)!==norm(p.a))allOk=false;
      document.getElementById('sel'+k).disabled=true;
    });
    ok=allOk;
    st.ans[st.i]={ok:ok,given:q.pairs.map(function(p,k){return document.getElementById('sel'+k).value;})};
    fb='Associations correctes : '+q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
  }else if(q.type==='cloze'){
    var allOk2=true, wrongs=[];
    q.segs.forEach(function(s,k){
      if(s.blank===undefined)return;
      var gv=document.getElementById('cz'+k).value;
      var v2=norm(gv);
      if(!s.blank.some(function(a){return norm(a)===v2;})){allOk2=false;wrongs.push({k:k,gv:gv,blank:s.blank});}
      document.getElementById('cz'+k).disabled=true;
    });
    ok=allOk2;
    st.ans[st.i]={ok:ok,given:q.segs.map(function(s,k){return s.blank===undefined?null:document.getElementById('cz'+k).value;})};
    fb='La réponse complète : « '+q.segs.map(function(s){return s.blank!==undefined?s.blank[0]:s.t;}).join('')+' »';
    if(!ok&&wrongs.some(function(w){return norm(w.gv);})){pending=function(done){aiCheckCloze(st.i,wrongs,done);};}
  }
  if(pending){
    st.answered=true;
    card.insertAdjacentHTML('beforeend','<div class="fb ok" id="aichk">⏳ Vérification de votre réponse…</div>');
    pending(function(aiOk,extra){
      var el=document.getElementById('aichk'); if(el)el.remove();
      if(aiOk){ok=true;st.ans[st.i].ok=true;}
      finishValidate(ok,fb+(extra?'<br><br>'+extra:''));
    });
  }else{finishValidate(ok,fb);}
}
function finishValidate(ok,fb){
  if(ok)st.score++;
  st.answered=true;
  var h='<div class="fb '+(ok?'ok':'no')+'" style="animation-delay:.25s"><strong>'+(ok?'Réponse acceptée. ✅':'Explication')+'</strong><br>'+fb+'</div>';
  if(ok){
    var cols=['#2e7d32','#ffd166','#ef476f','#118ab2','#06d6a0','#f78c6b'];
    var conf='<div class="party">';
    for(var c=0;c<14;c++){conf+='<i style="left:'+(8+6*c)+'%;background:'+cols[c%cols.length]+';animation-delay:'+(c*0.025).toFixed(3)+'s"></i>';}
    h+=conf+'</div>';
    card.classList.add('cheer');
    var bt=document.createElement('div');bt.className='bigtick';bt.textContent='✅';
    document.body.appendChild(bt);
    setTimeout(function(){if(bt.parentNode)bt.parentNode.removeChild(bt);},900);
  }
  h+='<button class="ghost" onclick="redo()" style="margin-top:10px">← Refaire cette question</button> ';
  h+='<button onclick="next()">'+(st.i+1<QUIZ.questions.length?'Question suivante →':'Voir le score')+'</button>';
  card.insertAdjacentHTML('beforeend',h);
}
function redo(){
  var a=st.ans[st.i];
  if(a&&a.ok)st.score--;
  delete st.ans[st.i];
  render();
}
function cheatRandom(){
  st.score=0;
  QUIZ.questions.forEach(function(q,k){
    var ok=false, given=null;
    if(q.type==='single'){
      var j=Math.floor(Math.random()*q.options.length);
      given=[j]; ok=!!q.options[j].correct;
    }else if(q.type==='multi'){
      var nb=1+Math.floor(Math.random()*Math.min(3,q.options.length));
      var picks=shuffle(q.options.map(function(o,x){return x;})).slice(0,nb);
      var corr=q.options.filter(function(o){return o.correct;}).length;
      ok=picks.length===corr&&picks.every(function(x){return q.options[x].correct;});
      given=picks;
    }else if(q.type==='short'){
      if(Math.random()<0.5){given=q.answers[Math.floor(Math.random()*q.answers.length)];ok=true;}
      else{given=['réponse au hasard'][0];ok=false;}
    }else if(q.type==='matching'){
      var pool=shuffle(q.pairs.map(function(p){return p.a;}));
      given=pool;
      ok=q.pairs.every(function(p,x){return norm(pool[x])===norm(p.a);});
    }else if(q.type==='cloze'){
      given=[];ok=true;
      q.segs.forEach(function(s){
        if(s.blank===undefined){given.push(null);return;}
        if(Math.random()<0.6){given.push(s.blank[0]);}
        else{given.push('au hasard');ok=false;}
      });
    }
    st.ans[k]={ok:ok,given:given};
    if(ok)st.score++;
  });
  st.i=QUIZ.questions.length-1;
  st.answered=true;
  renderScore();
}

/* ---- Couche IA minimaliste (Ministral 3B, repli Mistral Small) ---- */
var MISTRAL_KEY='mstrl_rWaAuPNbjAcCqKNJDj7XjTiFhS3AdBds_2jbUGh';
var AI_MAX=10;

/* ---- Markdown minimal pour les réponses de l'IA ---- */
function md(t){
  t=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/```[a-z]*\n?/g,'');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  t=t.replace(/^\s*[-•]\s+/gm,'• ');
  t=t.replace(/\n/g,'<br>');
  return nbsp(t);
}
/* ---- Quota IA quotidien, par élève et par QCM (sans connexion) ---- */
function lsGet(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return 'h'+(h>>>0).toString(36);}
function devId(){var d=lsGet('ai_dev','');if(!d){d=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));lsSet('ai_dev',d);}return d;}
var AI_IP='na';
try{fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(j){if(j&&j.ip)AI_IP=String(j.ip);}).catch(function(){});}catch(e){}
function qid(){return hash(QUIZ.title);}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function quotaKey(){return 'aiq_'+qid()+'_'+hash(AI_IP)+'_'+devId()+'_'+dayKey();}
var AI_DAILY_MAX=25;
function quotaLeft(){return AI_DAILY_MAX-(+lsGet(quotaKey(),'0')||0);}

/* ---- Appel générique à l'IA (Ministral 3B, repli Mistral Small) ---- */
function aiCall(sys,usr,maxtok,temp,cb){
  if(quotaLeft()<=0){cb(null);return;}
  quotaUse();
  function call(model){
    return fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+MISTRAL_KEY},body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:maxtok,temperature:temp})});
  }
  call(AI_MODELS[0])
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok)return cb((res.j&&res.j.choices&&res.j.choices[0]&&res.j.choices[0].message&&res.j.choices[0].message.content)||null);
      var m=String((res.j&&res.j.message)||'');
      if(m.indexOf('model')>=0||m.indexOf('not found')>=0){
        return call(AI_MODELS[1]).then(function(r){return r.json();}).then(function(j){return cb((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||null);}).catch(function(){cb(null);});
      }
      cb(null);
    })
    .catch(function(){cb(null);});
}
/* ---- Analyse robuste du verdict JSON renvoyé pour une vérification ---- */
function aiVerdict(txt,n){
  var t=String(txt).replace(/```[a-z]*\n?/g,'').trim();
  var j=null; try{j=JSON.parse(t);}catch(e){}
  var arr=null,comment=null;
  if(j){
    comment=j.comment||null;
    if(comment&&typeof comment!=='string'){
      comment=(comment.text!==undefined&&typeof comment.text==='string')?comment.text:(comment.raison!==undefined&&typeof comment.raison==='string')?comment.raison:(comment.message!==undefined&&typeof comment.message==='string')?comment.message:null;
    }
    if(Array.isArray(j.ok))arr=j.ok;
    else if(typeof j.ok==='boolean')arr=[j.ok];
  }
  if(!arr){
    var m=t.match(/\[[\s\S]*?\]/);
    if(m){arr=m[0].slice(1,-1).split(',').map(function(x){return /true/i.test(x);});}
    else if(/"ok"\s*:\s*"?true"?/i.test(t))arr=[true];
    else if(/"ok"\s*:\s*"?false"?/i.test(t))arr=[false];
    var cm=t.match(/"comment"\s*:\s*"([^"]*)"/); if(cm)comment=cm[1];
  }
  if(arr&&n){while(arr.length<n)arr.push(false);arr=arr.slice(0,n);}
  return {ok:arr,comment:comment};
}
/* ---- Vérification IA des réponses courtes approximatives ---- */
function aiCheckText(k,given,answers,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var usr='Question du QCM : « '+q.name+' »\nRéponses attendues : '+answers.join(' ; ')+'\nRéponse de l\'élève : « '+given+' »\nCette réponse est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, article ou casse, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Ne refuse que si le sens est réellement différent ou si la réponse est vide. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":true,"comment":"une phrase très brève pour l\'élève"} ou {"ok":false,...}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,120,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,1);
    if(v.ok===null){
      aiCall('Réponds uniquement OUI ou NON, un seul mot, sans ponctuation.',usr+'\n\nRéponds uniquement par OUI (si la réponse de l\'élève est acceptable) ou NON.',10,0,function(t2){
        if(t2&&/oui|vrai|true/i.test(String(t2).toLowerCase()))done(true,null);
        else done(false,null);
      });
      return;
    }
    /* Aucun message ajouté après l'explication (pas de « Réponse acceptée : null ») */
    done(!!(v.ok&&v.ok[0]),null);
  });
}
/* ---- Vérification IA des textes à trous approximatifs ---- */
function aiCheckCloze(k,wrongs,done){
  try{if(!navigator.onLine){done(false,null);return;}}catch(e){done(false,null);return;}
  var q=QUIZ.questions[k];
  var list=wrongs.map(function(w,x){return 'Trou '+(x+1)+' — réponse de l\'élève : « '+w.gv+' » ; réponses attendues : '+w.blank.join(' ; ');}).join('\n');
  var usr='Texte à trous du QCM : « '+q.name+' »\n'+list+'\nPour chaque trou, la réponse de l\'élève est-elle correcte ou une variante acceptable ? Accepte toute variante fidèle au sens : faute d\'orthographe, majuscules, ponctuation en début ou en fin de réponse (points, virgules, guillemets), pluriel, espaces, synonyme fidèle au sens (par exemple « emprunt » au lieu de « prêt »). Un trou laissé vide est toujours faux. Ne refuse que si le sens est réellement différent. Réponds STRICTEMENT en JSON sans autre texte ni bloc de code : {"ok":[true ou false pour chaque trou dans l\'ordre], "comment": "une phrase très brève"}';
  aiCall('Tu es un correcteur de philosophie. Réponds uniquement en JSON, sans texte autour.',usr,150,0,function(txt){
    if(!txt){done(false,null);return;}
    var v=aiVerdict(txt,wrongs.length);
    if(!v.ok){
      aiCall('Réponds uniquement par une liste de mots OUI ou NON séparés par des virgules, un par trou, dans l\'ordre, sans autre texte.',usr+'\n\nRéponds uniquement par une liste de OUI ou NON séparés par des virgules, dans l\'ordre des trous.',20,0,function(t2){
        if(!t2){done(false,null);return;}
        var parts=String(t2).split(/[,;\n]/).map(function(x){return /oui|vrai|true/i.test(x.trim());});
        while(parts.length<wrongs.length)parts.push(false);
        var all=wrongs.every(function(w,x){return parts[x]===true;});
        done(all,null);
      });
      return;
    }
    var all=wrongs.length>0&&wrongs.every(function(w,x){return v.ok[x]===true;});
    done(all,null);
  });
}
/* ---- Bilan IA de fin de QCM ---- */
function aiBilan(){
  try{if(!navigator.onLine){bilanFallback();return;}}catch(e){}
  if(quotaLeft()<=0){bilanFallback();return;}
  var n=QUIZ.questions.length;
  var det=QUIZ.questions.map(function(q,k){
    var a=st.ans[k]||{ok:false,given:null};
    var g=Array.isArray(a.given)?a.given.filter(Boolean).join(' ; '):(a.given||'—');
    return 'Q'+(k+1)+' : '+(a.ok?'réussie':'manquée (réponse donnée : '+g+')');
  }).join('\n');
  var sys='Tu es un professeur de philosophie au lycée. Rédige un bilan de révision pour un élève de terminale, en français : un mot d\'ensemble sur sa performance, le ou les types d\'erreurs observés, puis 2 conseils précis pour progresser. 150 mots maximum. STYLE IMPERSONNEL OBLIGATOIRE : ne jamais t\'adresser à l\'élève, ni « tu » ni « vous » ni impératifs ; employer des tournures neutres du type « Le score obtenu montre… », « Les erreurs portent sur… », « Il convient de… », « Il serait utile de… ». Markdown simple autorisé (**gras**, listes).';
  var usr='Score : '+st.score+'/'+n+'\nDétail question par question :\n'+det;
  aiCall(sys,usr,400,0.3,function(txt){
    var el=document.getElementById('bilan');
    if(!el)return;
    if(txt){st.bilan=txt;lsSet('bilan_'+qid(),txt);el.innerHTML='<strong>Bilan de votre performance</strong><br>'+md(txt);}

}
function bilanFallback(){
  var el=document.getElementById('bilan'); if(!el)return;
  var missed=QUIZ.questions.map(function(q,k){return st.ans[k]&&st.ans[k].ok?-1:k;}).filter(function(x){return x>=0;});
  var t='<strong>Bilan</strong><br>';
  if(!missed.length)t+='Sans faute : le cours est maîtrisé. La simple relecture des explications suffit à consolider l\'ensemble.';
  else t+='À réviser en priorité : '+missed.map(function(x){return 'question '+(x+1);}).join(', ')+'. Relire les explications correspondantes, puis refaire le QCM.';

/* Enregistre toutes les questions-réponses de l'écran de révision en fichier texte */
function saveChat(){
  var lines=[QUIZ.title+(QUIZ.sub?' — '+QUIZ.sub:''),'Questions posées et réponses obtenues',''];
  var n=0;
  QUIZ.questions.forEach(function(q,k){
    var c=loadChat(k);
    if(!c.length)return;
    n++;
    lines.push('——— Question '+(k+1)+' du QCM : '+q.name+' ———');
    c.forEach(function(x){
      lines.push('Question posée : '+x.q);
      lines.push('Réponse :');
      var t=String(x.a).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)').replace(/\*\*/g,'').replace(/^\s*#+\s*/gm,'').replace(/^\s*[-*]\s+/gm,'- ');
      lines.push(t);
      if(x.urls&&x.urls.length)lines.push('Pages consultées : '+x.urls.join(' , '));
      lines.push('');
    });
  });
  if(!n){alert('Aucune question posée pour le moment.');return;}
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'-QuestionsReponses.txt';
  document.body.appendChild(a);a.click();a.remove();
}
/* Convertit le markdown des réponses en texte brut pour les exports texte */
function mdPlain(t){
  return String(t).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)').replace(/\*\*/g,'').replace(/^\s*#+\s*/gm,'').replace(/^\s*[-*]\s+/gm,'- ').replace(/^\s*•\s+/gm,'- ');
}
/* Enregistre tout le résultat du QCM (réponses, explications) + toutes les questions posées et leurs réponses */
function saveResult(){
  var n=QUIZ.questions.length;
  var lines=[QUIZ.title+(QUIZ.sub?' — '+QUIZ.sub:''),'Résultat du QCM : '+st.score+' / '+n+' ('+Math.round(100*st.score/Math.max(1,n))+'%)',''];
  QUIZ.questions.forEach(function(q,k){
    var a=st.ans[k]||{ok:false,given:null};
    var g=Array.isArray(a.given)?a.given.filter(Boolean).join(' ; '):(a.given||'—');
    lines.push('——— Question '+(k+1)+' : '+q.name+' ———');
    lines.push('Réponse donnée : '+g);
    lines.push(a.ok?'Résultat : réussie ✔':'Résultat : manquée ✖');
    var exp='',corr='';
    if(q.type==='single'||q.type==='multi'){
      corr=q.options.filter(function(o){return o.correct;}).map(function(o){return o.text;}).join(' ; ');
      exp=q.options.filter(function(o){return o.correct&&o.feedback;}).map(function(o){return o.feedback;}).join('\n\n');
    }else if(q.type==='short'){
      corr=q.answers.join(' ; ');
      exp=q.feedback||'';
    }else if(q.type==='matching'){
      corr=q.pairs.map(function(p){return p.q+' → '+p.a;}).join(' ; ');
    }else{
      corr=q.segs.map(function(s){return s.t!==undefined?s.t:(s.blank?s.blank[0]:'');}).join('');
    }
    lines.push('Réponse attendue : '+corr);
    if(exp)lines.push('Explication : '+mdPlain(exp));
    lines.push('');
  });
  if(QUIZ.questions.some(function(qq,k){return loadChat(k).length;})){
    lines.push('====================','Questions posées et réponses obtenues','');
    QUIZ.questions.forEach(function(q,k){
      var c=loadChat(k);
      if(!c.length)return;
      lines.push('——— Question '+(k+1)+' du QCM : '+q.name+' ———');
      c.forEach(function(x){
        lines.push('Question posée : '+x.q);
        lines.push('Réponse :');
        lines.push(mdPlain(x.a));
        if(x.urls&&x.urls.length)lines.push('Pages consultées : '+x.urls.join(' , '));
        lines.push('');
      });
    });
  }
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'-Resultat.txt';
  document.body.appendChild(a);a.click();a.remove();
}

function aiContext(k){

  if(q.options)ctx+='Explication du cours : '+q.options.filter(function(o){return o.correct;}).map(function(o){return o.feedback||o.text;}).join('\n');

/* ---- Recherche internet de sources académiques pour les questions des élèves ---- */
/* Sites et sources exclusivement français */
function isFrUrl(u){
  u=String(u||'');
  return /^https?:\/\/[^\/]*\.fr(\/|$)/i.test(u)||/fr\.wikipedia\.org|cairn\.info|cairn\.fr|openedition\.org|revues\.org|philomag\.com|hal\.science|erudit\.org|classiques\.uqac\.ca|le-philosophe\.|la-philosophie\.fr|noes\.|persee\.fr|universalis\.fr|lemonde\.fr|lemonde\.com/i.test(u);
}
function aiSearch(q){
  var terms=(q+' '+QUIZ.title).replace(/[«»"]/g,'').slice(0,200);
  function wiki(){
    return fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(terms)+'&srlimit=2&format=json&origin=*')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.query&&j.query.search)||[];
        return hits.map(function(h){return '« '+h.title+' » (Wikipedia : https://fr.wikipedia.org/wiki/'+encodeURIComponent(h.title)+')';}).join('\n');
      }).catch(function(){return '';});
  }
  function openalex(){
    return fetch('https://api.openalex.org/works?search='+encodeURIComponent(terms)+'&per-page=5&language=fre&mailto=prof.c2phi.fr@gmail.com')
      .then(function(r){return r.json();})
      .then(function(j){
        var hits=(j&&j.results)||[];
        return hits.filter(function(w){return w.title;}).map(function(w){
          var url=w.doi?w.doi:(w.id||'');
          var auth=w.authorships&&w.authorships[0]&&w.authorships[0].author&&w.authorships[0].author.display_name;
          return '« '+w.title+' »'+(w.publication_year?(' ('+w.publication_year+')'):'')+(auth?(' — '+auth):'')+' (source académique : '+url+')';
        }).join('\n');
      }).catch(function(){return '';});
  }
  function ddg(){
    return fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(terms)+'&kl=fr-fr&format=json&no_html=1&skip_disambig=1')
      .then(function(r){return r.json();})
      .then(function(j){
        var out=[];
        var topics=(j&&(j.RelatedTopics||[]))||[];
        topics.forEach(function(t){
          var u=t.FirstURL||(t.topics&&t.topics[0]&&t.topics[0].FirstURL);
          var x=t.Text||(t.topics&&t.topics[0]&&t.topics[0].Text);
          if(u&&x&&/https?:/.test(u)&&isFrUrl(u))out.push('« '+String(x).split(' - ')[0].slice(0,90)+' » ('+u+')');
        });
        return out.slice(0,3).join('\n');
      }).catch(function(){return '';});
  }
  return Promise.all([openalex(),wiki(),ddg()]).then(function(r){
    var lines=(r[0]+'\n'+r[1]+'\n'+r[2]).split('\n');
    /* OpenAlex : ne conserver que les œuvres en français dont le lien est un site français ou un DOI */
    lines=lines.filter(function(l){return l&&(/doi\.org|source académique/.test(l)?(/doi\.org/.test(l)||isFrUrl(l)):isFrUrl(l)||/Wikipedia : https:\/\/fr\.wikipedia\.org/.test(l));});
    return lines.slice(0,7).join('\n');
  }).catch(function(){return '';});
}
function aiSourcesLinks(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7).map(function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';}).join('<br>');
}
function chatUrls(sources){
  var urls=String(sources||'').match(/https?:\/\/[^\s)»]+/g)||[];
  var seen={},out=[];
  urls.forEach(function(u){if(!seen[u]){seen[u]=1;out.push(u);}});
  return out.slice(0,7);
}
function aiAsk(k){
  if(st.ai>=AI_MAX){document.getElementById('aibox'+k).innerHTML=aiChatHtml(k)+'<div class="fb no">Limite de '+AI_MAX+' questions par session atteinte.</div>';return;}
  var q=document.getElementById('aiq'+k).value.trim();
  if(!q)return;
  var b=document.getElementById('aibox'+k);
  if(quotaLeft()<=0){b.innerHTML=aiChatHtml(k)+'<div class="fb no">Limite quotidienne d\'utilisation atteinte pour ce QCM.</div>';return;}
  b.innerHTML=aiChatHtml(k)+'<div class="fb ok" id="aistat'+k+'">🔎 Recherche de sources…</div>';
  st.ai++;
  aiSearch(q).then(function(sources){
    var el=document.getElementById('aistat'+k); if(el)el.innerHTML='⏳ Recherche d\'une réponse…';
    var sys='Tu es un professeur de philosophie au lycée. Réponds en français, en 120 mots maximum, de façon claire et pédagogique. Fonde-toi d\'abord sur l\'explication de la séance fournie ; tu peux la compléter avec les sources trouvées sur internet ci-dessous : sources académiques (articles, DOI) et sites sérieux sur le sujet (encyclopédies, universités, ressources de référence). Si tu t\'appuies sur une source, cite-la explicitement entre parenthèses (auteur ou site, titre) et donne le lien exact de la page consultée. Markdown simple autorisé (**gras**, listes, [libellé](https://lien)).';
    var usr=aiContext(k)+'\n\nSources trouvées sur internet :\n'+(sources||'(aucune source trouvée)')+'\n\nQuestion de l\'élève : '+q;
    aiCall(sys,usr,300,0.3,function(txt){
      if(txt){
        var a=loadChat(k);
        a.push({q:q,a:txt,urls:chatUrls(sources)});
        lsSet('chat_'+qid()+'_'+k,JSON.stringify(a));
        b.innerHTML=aiChatHtml(k)+aiInput(k);
      }
      else{b.innerHTML=aiChatHtml(k)+'<div class="fb no">Impossible de répondre pour le moment (connexion). Reformulez ou réessayez plus tard.</div>'+aiInput(k);}
    });
  });
}

function clozeRaw(seg){
  return seg.t!==undefined?seg.t:'{1:SHORTANSWER:='+seg.blank.join('~~')+'}';
}
function singleFix(k,j){
  if(QUIZ.questions[k].type!=='single')return;
  QUIZ.questions[k].options.forEach(function(o,x){if(x!==j)document.getElementById('ec'+k+'_'+x).checked=false;});
}
function delQ(k){if(confirm('Supprimer cette question ?')){QUIZ.questions.splice(k,1);openEditor();}}
function delOpt(k,j){QUIZ.questions[k].options.splice(j,1);openEditor();}
function addOpt(k){QUIZ.questions[k].options.push({text:'Nouvelle option',correct:false,feedback:''});openEditor();}
function delPair(k,j){QUIZ.questions[k].pairs.splice(j,1);openEditor();}

function applyEdit(){
  QUIZ.title=document.getElementById('etitle').value||QUIZ.title;
  var nh=document.getElementById('ehelp');
  if(nh){HELP=nh.value;lsSet('qcm_help_'+qid(),HELP);}
  document.getElementById('qtitle').textContent=QUIZ.title;
  document.title=QUIZ.title;
  QUIZ.sub=document.getElementById('esub').value||'';
  document.getElementById('qsub').textContent=QUIZ.sub;
  QUIZ.questions.forEach(function(q,k){
    if(q.type==='single'||q.type==='multi'){
      q.name=document.getElementById('eq'+k).value;
      q.options.forEach(function(o,j){
        o.text=document.getElementById('eo'+k+'_'+j).value;
        o.correct=!!document.getElementById('ec'+k+'_'+j).checked;
        o.feedback=document.getElementById('ef'+k+'_'+j).value;
      });
    }else if(q.type==='short'){
      q.name=document.getElementById('eq'+k).value;
      q.answers=document.getElementById('ea'+k).value.split(';').map(function(s){return s.trim();}).filter(Boolean);
      q.feedback=document.getElementById('ef'+k).value;
    }else if(q.type==='matching'){
      q.name=document.getElementById('eq'+k).value;
      q.pairs.forEach(function(p,j){
        p.q=document.getElementById('epq'+k+'_'+j).value;
        p.a=document.getElementById('epa'+k+'_'+j).value;
      });
    }else{
      var raw=document.getElementById('eq'+k).value;
      var segs=[],i=0,re=/\{1:(?:SHORTANSWER|MULTICHOICE|NUMERICAL):([^}]*)\}/g,m;
      while((m=re.exec(raw))!==null){
        if(m.index>i)segs.push({t:raw.slice(i,m.index)});
        segs.push({blank:m[1].split(/~~|~/).map(function(a){return a.replace(/^=/,'').trim();})});
        i=re.lastIndex;
      }
      if(i<raw.length)segs.push({t:raw.slice(i)});
      q.segs=segs;
    }
  });
  document.getElementById('editor').classList.add('hidden');
  st.i=Math.min(st.i,QUIZ.questions.length-1);st.score=0;st.clicks=[];render();
}
/* Nom de fichier des téléchargements : ClasseMoisJour-Notion (ex. TG51116-ImperatifCategorique.html).
   Classe extraite du sous-titre ou du titre ; mois et jour extraits de la date de la séance
   dans le sous-titre (sinon date du jour) ; notion = dernière partie du titre, sans accents,
   sans petits mots (l', le, de, …), chaque mot commençant par une majuscule. */
function dlBase(){
  var t=QUIZ.title||'qcm',sub=QUIZ.sub||'';
  var m=sub.match(/([A-Z]{2,4}\d(?:\/[A-Z]{2,4}\d)*)/)||t.match(/([A-Z]{2,4}\d)/);
  var cls=m?m[1].replace(/[^A-Za-z0-9]/g,''):'';
  var mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var dm=sub.toLowerCase().match(/(\d{1,2})(?:er)?\s+([a-zéû]+)/);
  var mo=dm?mois.indexOf(dm[2]):-1,mmdd;
  if(dm&&mo>=0){mmdd=('0'+(mo+1)).slice(-2)+('0'+parseInt(dm[1],10)).slice(-2);}
  else{var d=new Date();mmdd=('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
  var notion=t.split(/ : | - | — /).pop().trim();
  var stop={l:1,d:1,n:1,s:1,j:1,le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,a:1,au:1,aux:1,et:1,en:1,y:1,ce:1,cet:1,cette:1,que:1,qui:1,est:1,il:1,elle:1,on:1,comme:1,autre:1,autres:1};
  var slug=notion.replace(/[\u0027\u2019]/g,' ');
  try{slug=slug.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  slug=slug.split(/[^A-Za-z0-9]+/).filter(function(w){return w&&!stop[w.toLowerCase()];}).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join('');
  if(!slug)slug=t.replace(/[^A-Za-z0-9]/g,'')||'qcm';
  return (cls?cls:'')+mmdd+'-'+slug;
}

/* Enregistre la page HTML complète avec le QCM modifié :
   exige que la déclaration « var QUIZ = {...}; » occupe une ligne unique. */
function downloadHtml(){
  applyEdit();
  var sc=document.getElementsByTagName('script'),si=-1;
  for(var i=0;i<sc.length;i++){if(sc[i].textContent.indexOf('var QUIZ = ')>=0){si=i;break;}}
  if(si<0){alert('Enregistrement impossible : script du QCM introuvable.');return;}
  var lines=sc[si].textContent.split('\n'),done=false;
  for(var L=0;L<lines.length;L++){
    if(lines[L].indexOf('var QUIZ = ')===0){lines[L]='var QUIZ = '+JSON.stringify(QUIZ)+';';done=true;break;}
  }
  if(!done){alert('Enregistrement impossible : la déclaration du QCM doit rester sur une ligne unique.');return;}
  for(var L2=0;L2<lines.length;L2++){
    if(lines[L2].indexOf('var HELP_DEF = ')===0){lines[L2]='var HELP_DEF = '+JSON.stringify(HELP)+';';break;}
  }
  var clone=document.documentElement.cloneNode(true);
  clone.getElementsByTagName('script')[si].textContent=lines.join('\n');
  var c=clone.querySelector('#quizcard'); if(c)c.innerHTML='';
  var ed=clone.querySelector('#editor'); if(ed){ed.classList.add('hidden');var ep=clone.querySelector('#editpanel');if(ep)ep.innerHTML='';}
  var blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dlBase()+'.html';
  document.body.appendChild(a);a.click();a.remove();
}
