<style>
:root{--bg:#f7f5ef;--ink:#232323;--mut:#0000002e;--mg:120px;--mono:"Space Mono",Consolas,"Courier New",monospace;--serif:Lora,Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.75 var(--serif);-webkit-text-size-adjust:100%}
#app{display:grid;grid-template-columns:minmax(0,1fr) 250px;max-width:1200px;margin:0 auto;padding:0 20px}
#flow{padding:56px 0 40vh}
.row{display:grid;grid-template-columns:var(--mg) minmax(0,1fr);column-gap:18px;margin:0 0 1.5em}
.row.first{margin-top:4em}
.mg{position:relative}
.mx{position:relative;margin-left:auto;margin-top:3px}
.dot{position:absolute;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 13%,rgba(255,255,255,0) 15%),radial-gradient(circle at 50% 50%,var(--c) 55%,color-mix(in srgb,var(--c) 62%,#000) 100%);box-shadow:0 1px 2px #0006;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--bd,0s);transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1),width .5s,height .5s,transform .15s}
.dot:hover{transform:scale(1.18)}
.dot.inc{opacity:0;animation:none}
.dot.onfil{box-shadow:0 0 0 2px #d1495b,0 1px 2px #0006}
.mg::before{content:"";position:absolute;left:1px;top:0;width:2px;height:calc(var(--fil,0)*100%);background:#d1495b;border-radius:2px;transition:height .9s cubic-bezier(.3,.7,.3,1)}
.row.filok .mg::before{box-shadow:0 0 8px #d1495b;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px 2px #d1495b}}
.bar .ia{width:22px;height:22px;border-radius:50%;background:conic-gradient(#d1495b,#e0b42d,#5aa469,#3a86c8,#6a4c93,#d1495b);color:#fff;font-size:12px;line-height:22px;opacity:1;padding:0;box-shadow:0 1px 3px #0004;text-align:center}
.bar .ia:hover{opacity:1;transform:scale(1.12)}
.ia.wait{animation:spin 1s linear infinite}
.ia.err{animation:shake .4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dot.pop{animation:pop .6s ease-out;animation-delay:0s}
.dot.jump{animation:jump .7s cubic-bezier(.3,.7,.4,1) both;animation-delay:var(--jd,0s)}
.dot.jig{animation:jig .5s ease both;animation-delay:var(--jd,0s)}
@keyframes bob{50%{translate:0 -2px}}
@keyframes jump{0%{translate:0 0;scale:1}35%{translate:0 -14px;scale:1.35}70%{translate:0 0;scale:.88}100%{translate:0 0;scale:1}}
@keyframes pop{0%{scale:.2}55%{scale:1.55}75%{scale:.85}100%{scale:1}}
@keyframes jig{25%{translate:3px 0}50%{translate:-3px 0}75%{translate:2px 0}}
html,body{transition:background-color 1.2s}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
#jar{position:fixed;left:12px;bottom:12px;width:40px;height:132px;border:2px solid #00000030;border-top-color:transparent;border-radius:0 0 20px 20px;background:linear-gradient(90deg,#ffffff66,#ffffff00 45%,#ffffff33);z-index:39;pointer-events:none}
#lv{position:fixed;left:12px;bottom:152px;width:40px;display:flex;flex-wrap:wrap;gap:3px;z-index:39;pointer-events:none}
.pip{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 -1px 2px #0005;animation:pop .7s ease-out}
#st{position:fixed;left:60px;bottom:12px;display:flex;flex-direction:column-reverse;gap:3px;z-index:39;pointer-events:none;transition:opacity .6s}
#st.out{opacity:0}
#st .sp{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 13%,rgba(255,255,255,0) 15%),radial-gradient(circle at 50% 50%,var(--c) 55%,color-mix(in srgb,var(--c) 62%,#000) 100%);animation:pop .5s ease-out both}
@media (max-width:860px){#jar{width:30px;height:92px;bottom:104px;left:8px}#lv{left:8px;bottom:200px;width:30px}#st{left:44px;bottom:104px}}
.pt{margin:0;max-width:38em;white-space:pre-wrap;overflow-wrap:break-word;-webkit-user-select:text;user-select:text}
.mk{cursor:pointer;background-repeat:no-repeat;padding-bottom:3px}
.mk.hl{box-shadow:0 0 0 2px #00000022}
.mk.fl{animation:fl 1s}
@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px #0000002e}}
.lap{height:1px;background:var(--mut);margin:5em 0 4em;border:0;width:40px;margin-left:calc(var(--mg) + 18px)}
#side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:46px 0 24px 22px;font-family:var(--mono);scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
#cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-content:flex-start}
#mtx{margin-top:28px;overflow-x:auto;scrollbar-width:none}
#mtx.stale{opacity:.5}
.gx{display:grid;gap:2px;align-items:center;justify-items:center;font:10px/1.2 var(--mono)}
.gx .rl{justify-self:start;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:0;background:none;font:inherit;padding:0;text-align:left}
.gx .cl{writing-mode:vertical-rl;transform:rotate(180deg);max-height:62px;overflow:hidden;white-space:nowrap;opacity:.55;font-size:9px}
.gx .cr{border:0;background:none;font:13px var(--mono);cursor:pointer;opacity:.5;color:var(--ink);padding:0}
.gx .cr:hover{opacity:1}
.gx .c{width:100%;height:16px;display:flex;align-items:center;justify-content:center}
.sh{display:block;background:currentColor;flex:none}
.sh.dot{border-radius:50%}
.sh.ring{background:none;border:2px solid currentColor;border-radius:50%}
.sh.diamond{transform:rotate(45deg)}
#ctl #bt{border:1px solid currentColor;border-radius:50%;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;touch-action:none;opacity:.55}
#ctl #bt.tx{opacity:1;color:#d1495b;animation:pu .8s infinite}
#ctl #bt.wait{opacity:1;animation:bl .9s infinite}
#ctl #bt.ok{opacity:1;color:#5aa469}
#ctl #bt.err{opacity:1;color:#d1495b}
@keyframes pu{50%{box-shadow:0 0 0 6px #d1495b33}}
@keyframes bl{50%{opacity:.25}}
.pc{display:inline-flex;gap:4px;align-items:center;padding:1px 4px 1px 8px;border:1px solid #0002;border-radius:11px;margin:2px;font-size:12px}
.pc button{border:0;background:none;cursor:pointer;font:13px var(--mono);opacity:.5;padding:0 2px;color:var(--ink)}
.pc button:hover{opacity:1}
.pcs{max-height:110px;overflow:auto;margin-top:4px}
.tg{border:0;background:none;font:inherit;line-height:1.35;cursor:pointer;padding:0;color:inherit}
.tg sup{font-size:.6em;opacity:.55;margin-left:2px}
.tg:hover{text-decoration:underline}
#ctl{position:fixed;top:8px;right:14px;z-index:15;display:flex;gap:6px;font-family:var(--mono)}
#ctl button{border:0;background:none;font:18px/1 var(--mono);cursor:pointer;opacity:.35;padding:4px 6px;color:var(--ink)}
#ctl button:hover{opacity:.9}
.pop{position:fixed;z-index:30;background:#fffdf8;border:1px solid #00000026;box-shadow:0 8px 28px #00000026;border-radius:7px;font:13px/1.4 var(--mono);padding:8px;max-width:310px;min-width:150px;display:none}
.pop.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:2px;max-height:118px;overflow:auto;margin-bottom:2px}
.chip{border:0;background:none;font:inherit;cursor:pointer;padding:2px 7px;border-radius:11px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip:hover{background:#0000000d}
.chip i,.tl i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.bar button,.tl button{border:0;background:none;font:15px var(--mono);cursor:pointer;opacity:.55;color:var(--ink);padding:0 5px}
.bar button:hover,.tl button:hover{opacity:1}
.frm{display:none;flex-direction:column;gap:6px;margin-top:6px}
.frm.on{display:flex}
.frm input{font:inherit;border:0;border-bottom:1px solid #00000030;background:none;padding:3px 2px;outline:0;color:var(--ink)}
.frm input:focus{border-color:#000a}
.sw{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.sw b{width:18px;height:18px;border-radius:50%;cursor:pointer;display:block}
.sw b.on{outline:2px solid #000;outline-offset:2px}
.tl{display:flex;gap:7px;align-items:flex-start;padding:3px 0}
.tl span{flex:1}
.tl em{display:block;font-style:normal;opacity:.65;font-size:12px;font-family:var(--serif)}
@media (max-width:860px){
:root{--mg:42px}
body{font-size:17px;line-height:1.7}
#app{grid-template-columns:minmax(0,1fr);padding:0 12px 96px}
.row{column-gap:10px}
#side{position:fixed;left:0;right:0;bottom:0;height:auto;max-height:90px;padding:8px 14px;background:#f7f5efee;border-top:1px solid #0000001a;z-index:12}
#mtx{margin-top:12px}
}

<script>
(()=>{
'use strict';
const KEY='tagflow.v1';
const PAL=['#d1495b','#ed8a3b','#e0b42d','#5aa469','#2a9d8f','#3a86c8','#6a4c93','#c06c9d','#8a5a44','#4a4e57'];
const SEED=[
['déterminisme','Tout événement est l’effet nécessaire de causes antérieures.'],
['libre arbitre','Pouvoir de choisir, y compris contre ce que la raison recommande.'],
['autonomie','Se donner à soi-même sa loi : liberté fondée sur la raison.'],
['responsabilité','Assumer ses actes, voire ce dont on n’est pas cause.'],
['contrainte','Ce qui s’impose du dehors à la volonté.']
];
const RETIRED=['sujet'];
const CORPUS=[
{id:'descartes',paragraphs:[
`« L'indifférence me semble signifier proprement l'état dans lequel se trouve la volonté lorsqu'elle n'est pas poussée d'un côté plutôt que de l'autre par la perception du vrai ou du bien ; et c'est en ce sens que je l'ai prise lorsque j'ai écrit que le plus bas degré de la liberté est celui où nous nous déterminons aux choses pour lesquelles nous sommes indifférents. Mais peut-être d'autres entendent-ils par indifférence la faculté positive de se déterminer pour l'un ou l'autre de deux contraires, c'est-à-dire de poursuivre ou de fuir, d'affirmer ou de nier. Cette faculté positive, je n'ai pas nié qu'elle fût dans la volonté. Bien plus, j'estime qu'elle s'y trouve, non seulement dans ces actes où elle n'est poussée par aucune raison évidente d'un côté plutôt que de l'autre, mais aussi dans tous les autres ; à tel point que, lorsqu'une raison très évidente nous porte d'un côté, bien que, moralement parlant, nous ne puissions guère choisir le parti contraire, absolument parlant, néanmoins, nous le pouvons. Car il nous est toujours possible de nous retenir de poursuivre un bien clairement connu ou d'admettre une vérité évidente, pourvu que nous pensions que c'est un bien d'affirmer par là notre libre arbitre ».`,
`René Descartes, Lettre au Père Mesland.`,
`L'ambiguïté de la liberté d'indifférence est analysée par Descartes. Il fait dans cet extrait une distinction implicite entre la liberté d'indifférence et le libre-arbitre. En un premier sens, l'indifférence est l'indétermination de la volonté qui ne se décide en faveur d'aucun choix lorsqu'aucune raison ne vient la pousser dans une direction ou dans une autre. Mais on peut se demander dans ce cas si la liberté a encore quelque chose à voir avec l'action de la volonté puisqu'elle ne se fonde sur aucun jugement. C'est pourquoi Descartes considère qu'elle est le plus bas degré de liberté, car la volonté n'y a aucune part.`,
`En un autre sens cependant, Descartes accorde à l'indifférence de la volonté la valeur d'une capacité positive, quand elle est définie comme la faculté de choisir une chose ou son contraire. Nous expérimentons alors l'étendue infinie de la volonté. Nous l'expérimentons surtout lorsque la raison, dans le double sens de ratio et de logos dicte les principes de notre action et que nous choisissons cependant de faire le contraire.`,
`Le texte de Descartes nous montre que la liberté est fondée sur la raison, mais que notre volonté a toujours le pouvoir absolu de choisir le contraire de ce que la raison recommande. La liberté d'indifférence est une première forme de liberté négative, au sens d'une liberté qui ne serait pas fondée sur un choix.`,
`Le libre arbitre est à la fois la liberté de choisir par indifférence et de choisir le contraire de ce que la raison nous recommande. C'est donc une liberté positive mais aussi le plus bas degré de liberté.`
]},
{id:'marx',paragraphs:[
`« Dans la production sociale de leur existence, les hommes entrent en des rapports déterminés, nécessaires, indépendants de leur volonté, rapports de production qui correspondent à un degré de développement déterminé de leurs forces productives matérielles. L'ensemble de ces rapports de production constitue la structure économique de la société, la base concrète sur laquelle s'élève une superstructure juridique et politique et à laquelle correspondent des formes de conscience sociales déterminées. Le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel en général. Ce n'est pas la conscience des hommes qui détermine leur être ; c'est inversement leur être social qui détermine leur conscience ».`,
`Karl Marx, Contribution à la critique de l'économie politique.`,
`Nous agissons également sans avoir le choix dans notre existence sociale parce que celle-ci résulte, selon Marx, d'un rapport de production indépendant de notre volonté. La société correspond à un certain stade de développement des moyens de production économiques entièrement dépendant des conditions matérielles. Cette structure économique de la société sert de fondement aux discours qui composent le reste de la vie humaine : les différentes idéologies qui structurent les valeurs philosophiques, éthiques, politiques et scientifiques de la société. Le fondement économique détermine ainsi la conscience collective.`,
`Les deux structures : l'infrastructure (ou base) est l'ensemble des rapports de production, correspondant à un degré de développement des forces productives. La superstructure comprend les institutions juridiques et politiques (État, droit) et les formes de conscience sociales (religion, morale, philosophie, art). C'est l'infrastructure qui détermine la superstructure.`,
`Les hommes sont d'abord des êtres sociaux : ils entrent dans des rapports nécessaires, indépendants de leur volonté. On naît dans une société déjà structurée par des rapports de production donnés ; la conscience est le produit, non le point de départ.`,
`La conscience est déterminée par l'être social, mais pas inerte : elle est le lieu où les hommes prennent conscience des contradictions et peuvent mener le conflit jusqu'au bout. Déterminée en dernière instance, elle peut devenir lucide sur ses propres déterminations : c'est le germe de la liberté. La liberté marxienne n'est pas celle du libre arbitre, ni celle du sage, mais celle de la praxis : comprendre ce qui nous détermine pour agir sur la structure elle-même.`
]},
{id:'kant',paragraphs:[
`« Il n'y a donc qu'un unique impératif catégorique, et c'est celui-ci : Agis seulement d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle.`,
`[Par exemple, un individu] se voit pressé par le besoin d'emprunter de l'argent. Il sait parfaitement qu'il ne pourra rembourser, mais voit aussi qu'on ne lui accordera aucun prêt s'il ne promet pas avec fermeté de rendre l'argent à un moment déterminé. Il a envie de faire une telle promesse ; mais il conserve encore assez de conscience morale pour se demander : n'est-il pas interdit et contraire au devoir de se tirer d'affaire par un tel expédient ? À supposer qu'il se résolve pourtant à y recourir, la maxime de son action s'énoncerait ainsi : quand je me crois à court d'argent, j'accepte d'en emprunter et de promettre de le rendre, bien que je sache que tel ne sera jamais le cas. Sans doute ce principe de l'amour de soi ou de l'utilité personnelle est-il compatible, éventuellement, avec tout mon bien-être futur, mais pour l'instant la seule question est de savoir si c'est juste. Je transforme donc la prétention de l'amour de soi en une loi universelle et construis la question suivante : qu'adviendrait-il dès lors que ma maxime serait érigée en loi universelle ? Mais dans ce cas je vois d'emblée qu'elle ne pourrait jamais acquérir la valeur d'une loi universelle de la nature et s'accorder avec elle-même, mais qu'inévitablement, il lui faudrait se contredire. Car universaliser une loi selon laquelle chaque individu croyant être dans le besoin pourrait promettre tout ce qui lui vient à l'esprit, avec l'intention de ne pas tenir ses promesses, cela reviendrait à rendre même impossible le fait de promettre, ainsi que le but qu'on peut lui associer, dans la mesure où personne ne croirait à ce qu'on lui promet, et qu'au contraire tout le monde rirait de telle déclaration en n'y voyant que de vains subterfuges ».`,
`Emmanuel Kant, Fondation de la métaphysique des mœurs.`,
`L'argumentation de Kant est construite à partir d'un exemple : celui d'un homme qui désire emprunter une somme d'argent sans être certain de pouvoir rembourser le prêt qu'il demande. Ce que montre Kant c'est que cette action est justifiée par une règle de conduite qu'il nomme maxime subjective parce qu'elle s'appuie sur l'amour de soi, et le bien-être (bonheur) futur que l'on peut espérer d'un tel emprunt.`,
`Mais cette maxime subjective ne semble pas suffisante car elle contient une contradiction qui apparaît si on la généralise au genre humain. L'universalisation est l'opération de la raison qui consiste à faire d'une règle de conduite subjective une loi morale comparable dans sa nécessité aux lois qui gouvernent la nature. La fausse promesse rend impossible toute promesse future car elle ruine la confiance qu'elle présuppose. C'est ainsi que les principes de nos actions doivent, selon Kant, être soumis au tribunal de la raison.`,
`Agir par devoir consiste à prendre comme principe de nos actions ceux qui peuvent être suivis par tous les hommes, universellement, sans aboutir à une contradiction dans la raison. Ce n'est qu'en suivant les principes de l'impératif catégorique que la volonté est libre. Nous agissons donc librement lorsque nous accomplissons notre devoir : l'obligation ne s'oppose pas à la liberté.`
]},
{id:'sartre',paragraphs:[
`« Me voilà tuberculeux par exemple. Ici apparaît la malédiction (et la grandeur). Cette maladie, qui m'infecte, m'affaiblit, me change, limite brusquement mes possibilités et mes horizons. J'étais acteur ou sportif ; avec mes deux pneumos, je ne puis plus l'être. Ainsi je suis déchargé de toute responsabilité touchant ces possibilités que le cours du monde vient de m'ôter. C'est ce que le langage populaire nomme être diminué. Et ce mot semble recouvrir une image correcte : j'étais un bouquet de possibilités, on ôte quelques fleurs, le bouquet reste dans le vase, diminué, réduit à quelques éléments.`,
`Mais en réalité il n'en est rien : cette image est [insuffisante]. La situation nouvelle, quoique venue du dehors, doit être vécue, c'est-à-dire assumée, dans un dépassement. Il est vrai de dire qu'on m'ôte ces possibilités mais il est aussi vrai de dire que j'y renonce ou que je m'y cramponne ou que je ne veux pas voir qu'elles me sont ôtées ou que je me soumets à un régime systématique pour les reconquérir. En un mot ces possibilités sont non pas supprimées mais remplacées par un choix d'attitudes possibles envers la disparition de ces possibilités. Et d'autre part surgissent avec mon état nouveau des possibilités nouvelles : possibilités à l'égard de ma maladie (être un bon ou un mauvais malade), possibilités vis-à-vis de ma condition (gagner tout de même ma vie, etc.), un malade ne possède ni plus ni moins de possibilités qu'un bien portant ; il a son éventail de possibles comme l'autre et il a à décider sur sa situation, c'est-à-dire à assumer sa condition de malade pour la dépasser (vers la guérison ou vers une vie humaine de malade avec de nouveaux horizons).`,
`Autrement dit, la maladie est une condition à l'intérieur de laquelle l'homme est de nouveau libre et sans excuses. Il a à prendre la responsabilité de sa maladie. Sa maladie est une excuse pour ne pas réaliser ses possibilités de non-malade mais elle n'en est pas une pour ses possibilités de malade qui sont aussi nombreuses... Ainsi suis-je sans repos : toujours transformé, miné, laminé, ruiné du dehors et toujours libre, toujours obligé de reprendre à mon compte, de prendre la responsabilité de ce dont je ne suis pas responsable ».`,
`Jean-Paul Sartre, Cahiers pour une morale.`,
`Ce texte propose une autre définition de la liberté que celle d'avoir le choix. Du point de vue des choix possibles, cette liberté est encore négative. Car l'exemple de la maladie qui fait irruption dans la vie du tuberculeux montre en apparence une diminution des possibilités offertes et par conséquent la diminution d'une forme de liberté fondée sur la volonté et le choix.`,
`À partir de cet exemple, Sartre va fonder la liberté humaine sur l'absence de choix, ou plus exactement sur leur disparition. Ma liberté est ainsi définie comme la capacité de transcender toute situation dont je reçois la responsabilité du dehors, c'est-à-dire sans l'avoir choisie. Il n'y a pas en soi de meilleure manière d'assumer la responsabilité d'une situation que l'on n'a pas choisie. Il y a seulement différentes attitudes qui sont toutes des manières d'être libre, c'est-à-dire de transcender les choses et le monde naturel.`,
`Les attitudes que le malade peut adopter face à sa maladie sont des attitudes possibles envers la disparition de ces possibilités. C'est cette liberté négative qui fait que le possible existe malgré la disparition des choix. Preuve que nous pouvons être libres sans avoir de choix, ou par disparition de nos choix, libre envers la disparition même.`
]},
{id:'dissertation',paragraphs:[

function mergeTags(raw){
  const map={};
  if(!raw)return map;
  const arr=Array.isArray(raw)?raw:Object.entries(raw).map(([k,v])=>Object.assign({id:k},v));
  arr.forEach(t=>{
    const name=String((t&&t.name)||'').trim();if(!name)return;
    const id=sid(t.id||uid());
    const ex=tagById(id)||db.tags.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(ex){map[id]=ex.id;return}
    db.tags.push({id,name,description:String(t.description||t.desc||''),pattern:String(t.pattern||t.motif||''),color:okc(t.color)||PAL[db.tags.length%PAL.length]});
    map[id]=id;
  });
  return map;
}
function normText(t,map){
  const id=sid(t.id||uid());
  const paragraphs=(t.paragraphs||[]).map((p,i)=>{
    if(typeof p==='string')p={text:p};
    const text=String(p.text==null?'':p.text);
    const sels=(p.sels||p.selections||p.tags||[]).map(s=>({
      id:sid(s.id||uid()),start:+s.start,end:+s.end,
      tag:(map&&map[sid(s.tag)])||sid(s.tag)
    })).filter(s=>Number.isFinite(s.start)&&Number.isFinite(s.end)&&s.start>=0&&s.end>s.start&&s.end<=text.length&&tagById(s.tag));
    const fil=Array.isArray(p.fil)?p.fil.map((f,j)=>({start:+f.start,end:+f.end,role:String(f.role||''),grp:String(f.grp||'a'+j)})).filter(f=>Number.isFinite(f.start)&&Number.isFinite(f.end)&&f.start>=0&&f.end>f.start&&f.end<=text.length):null;
    return{id:sid(p.id||id+'.'+i),text,sels,fil:(fil&&fil.length)?fil:undefined};
  });
  return{id,title:String(t.title||''),paragraphs};
}
function splitText(raw){return raw.split(/\n\s*\n/).map(s=>s.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean)}
function ingest(name,raw,onlyNew){
  let data;
  if(/\.json$/i.test(name)||/^\s*[\[{]/.test(raw)){try{data=JSON.parse(raw)}catch(e){return false}}
  else data={id:'f_'+sid(name),title:name,paragraphs:splitText(raw)};
  let tags=null,texts;
  if(Array.isArray(data))texts=data;else if(data&&data.texts){texts=data.texts;tags=data.tags}else texts=[data];
  const map=mergeTags(tags);
  let ch=false;
  texts.forEach((t,i)=>{
    if(!t||typeof t!=='object')return;
    if(!t.id)t=Object.assign({},t,{id:'f_'+sid(name)+'_'+i});
    const n=normText(t,map);
    const k=db.texts.findIndex(x=>x.id===n.id);
    if(k<0){db.texts.push(n);ch=true}else if(!onlyNew){db.texts[k]=n;ch=true}
  });
  return ch;
}

function reindex(){

function segments(p){
  const sels=p.sels;
  if(!sels.length)return[document.createTextNode(p.text)];
  const b=new Set([0,p.text.length]);
  sels.forEach(s=>{b.add(s.start);b.add(s.end)});
  const pts=[...b].sort((x,y)=>x-y),out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],z=pts[i+1],txt=p.text.slice(a,z);
    const cov=sels.filter(s=>s.start<=a&&s.end>=z);
    if(!cov.length){out.push(document.createTextNode(txt));continue}
    const sp=el('span','mk',txt);
    const tg=[];cov.forEach(s=>{if(!tg.includes(s.tag))tg.push(s.tag)});
    sp.dataset.tags=tg.join(' ');
    sp.dataset.sels=cov.map(s=>s.id).join(' ');
    const cs=tg.map(id=>(tagById(id)||{}).color||'#888');
    const imgs=cs.map(c=>`linear-gradient(${c},${c})`),sz=cs.map(()=>'100% 2px'),ps=cs.map((c,i)=>`0 calc(100% - ${i*3}px)`);
    imgs.push(`linear-gradient(${cs[0]}30,${cs[0]}30)`);sz.push('100% 100%');ps.push('0 0');
    sp.style.backgroundImage=imgs.join(',');sp.style.backgroundSize=sz.join(',');sp.style.backgroundPosition=ps.join(',');
    sp.title=tg.map(id=>{const t=tagById(id);return t?t.name+(t.description?' — '+t.description:''):''}).join('\n');
    out.push(sp);
  }
  return out;
}
function paint(r){

let tick=0;
setInterval(()=>{
  if(document.hidden)return;
  tick++;
  document.querySelectorAll('.row').forEach(layoutDots);
},5000);
function layoutDots(r){
  const m=idx[r.dataset.pid];if(!m)return;
  const mx=r.querySelector('.mx'),pt=r.querySelector('.pt');
  const old=new Map([...mx.children].map(o=>[o.dataset.sel,o]));
  const sels=m.p.sels.slice().sort((a,b)=>a.start-b.start||a.end-b.end),n=sels.length;
  if(!n){mx.replaceChildren();mx.style.cssText='';return}
  // formes de grille possibles, calculées d'après le nombre de pastilles du paragraphe
  const G=4,H=pt.offsetHeight,W=r.querySelector('.mg').clientWidth;
  const shapes=[];
  for(let c=1;c<=n;c++){
    const rw=Math.ceil(n/c);
    const d=Math.max(6,Math.min(18,Math.floor((W-(c-1)*G)/c),Math.floor((H-(rw-1)*G)/rw)));
    shapes.push({c,rw,d});
  }
  const top=Math.max(...shapes.map(s=>s.d));
  let cand=shapes.filter(s=>s.d>=Math.max(6,top*0.6)).sort((a,b)=>Math.abs(a.c-a.rw)-Math.abs(b.c-b.rw)||b.d-a.d);
  if(!cand.length)cand=shapes;
  // plus grande forme d'abord ; puis on fait tourner formes et sens de remplissage
  cand.sort((a,b)=>b.d-a.d||Math.abs(a.c-a.rw)-Math.abs(b.c-b.rw));
  const v=tick%(cand.length*3),sh=cand[v%cand.length],mode=Math.floor(v/cand.length);
  const {c:cols,rw:rows,d}=sh;
  mx.style.width=(cols*d+(cols-1)*G)+'px';
  mx.style.height=(rows*d+(rows-1)*G)+'px';
  const spans=threadSpans(m);
  sels.forEach((s,k)=>{
    const t=tagById(s.tag)||{color:'#888',name:'',description:''};
    let o=old.get(s.id);old.delete(s.id);
    if(!o){
      o=el('span','dot');o.dataset.sel=s.id;
      o.style.setProperty('--bd',(-Math.random()*3).toFixed(2)+'s');
      if((incomingId instanceof Set?incomingId.has(s.id):s.id===incomingId)&&r===incomingRow)o.classList.add('inc');
      mx.append(o);
    }
    o.style.setProperty('--c',t.color);
    o.dataset.tag=s.tag;
    o.classList.toggle('onfil',spans.length>0&&groupsHit(m.p,s.start,s.end,spans).size>0);
    o.title=t.name+(t.description?' — '+t.description:'');
    let rr,cc;
    if(mode===1){cc=Math.floor(k/rows);rr=k%rows}
    else{rr=Math.floor(k/cols);cc=k%cols;if(mode===2&&rr%2)cc=cols-1-cc}
    o.style.width=o.style.height=d+'px';
    o.style.left=cc*(d+G)+'px';o.style.top=rr*(d+G)+'px';
  });
  old.forEach(o=>o.remove());
}

let cur=null,touch=false,sT;
const off=(root,node,o)=>{const q=document.createRange();q.setStart(root,0);q.setEnd(node,o);return q.toString().length};
const ptOf=n=>{const e=n.nodeType===3?n.parentElement:n;return e&&e.closest?e.closest('.pt'):null};
function onSel(){
  if(md.classList.contains('on'))return;
  const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;
  const r=s.getRangeAt(0),a=ptOf(r.startContainer),b=ptOf(r.endContainer);
  if(!a)return;
  const text=a.textContent;
  let start=off(a,r.startContainer,r.startOffset);
  let end=(a===b)?off(a,r.endContainer,r.endOffset):text.length;
  while(start<end&&/\s/.test(text[start]))start++;
  while(end>start&&/\s/.test(text[end-1]))end--;
  if(end<=start)return;
  const pid0=a.closest('.row').dataset.pid,mm=idx[pid0],sp0=mm?threadSpans(mm):[];
  lastAct=Date.now();
  cur={pid:pid0,start,end,row:a.closest('.row'),range:r.cloneRange(),on:!!(mm&&sp0.length&&groupsHit(mm.p,start,end,sp0).size)};
  openModal(r.getBoundingClientRect());kick();
}

function stepJar(dt){

  jarAwake=Math.max(0,jarAwake-dt);
  bodies.forEach(b=>{
    b.vy+=1400*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<L+b.r){b.x=L+b.r;b.vx*=-.3}
    if(b.x>R-b.r){b.x=R-b.r;b.vx*=-.3}

/* harmonise la couleur (saturation/luminosité proches de la palette) et l'écarte des teintes déjà utilisées */
function fixColor(c){
  let hsl=okc(c)?hex2hsl(c):[Math.random()*360,.55,.5];
  let h=hsl[0],s=Math.min(.68,Math.max(.4,hsl[1])),l=Math.min(.56,Math.max(.4,hsl[2]));
  const hs=db.tags.map(t=>hex2hsl(t.color)[0]);
  const dist=(a,b)=>{const d=Math.abs(a-b)%360;return Math.min(d,360-d)};
  for(let i=0;i<14&&hs.some(x=>dist(x,h)<26);i++)h=(h+137.5)%360;
  return hsl2hex(h,s,l);
}
function mkTag(n){
  const name=String(n.nom||n.name||'').trim().slice(0,40);
  const ex=db.tags.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(ex)return{id:ex.id,fresh:false};
  const t={id:'t_'+uid(),name,description:String(n.description||'').slice(0,300),pattern:String(n.motif||'').slice(0,300),color:fixColor(n.couleur||n.color)};
  db.tags.push(t);return{id:t.id,fresh:true};
}

/* ---------- pastille IA : moisson de tags sur la sélection ---------- */
function harvestPayload(m,p,c){
  const T=stats();
  const tags=db.tags.map(t=>({id:t.id,nom:t.name,description:t.description||'',motif:t.pattern||'',couleur:t.color,termes_deja_selectionnes:Object.keys(T[t.id].terms).slice(0,10)}));
  const paras=m.tx.paragraphs,i=paras.indexOf(p);
  const contexte=paras.map((q,j)=>({n:j,courant:j===i,texte:q.text.length>800?q.text.slice(0,800)+'…':q.text})).filter(x=>Math.abs(x.n-i)<=2);
  return JSON.stringify({
    schema:'tagflow/moisson@1',
    instructions:"Tu aides un élève de terminale à annoter un texte de philosophie (notion : la liberté). Analyse selection.texte et attribue-lui les tags les plus pertinents. Sélectionne TOUJOURS dans le texte concerné les mots qui permettent de comprendre le fil logique du texte, la ligne rouge de la démonstration ou de l'argumentation : thèse, notions clés, connecteurs logiques qui articulent le raisonnement (donc, car, mais, or, ainsi…), objection, exemple, conclusion. Chaque citation est une sous-chaîne EXACTE de selection.texte, courte (1 à 6 mots), jamais une phrase entière ; vise 3 à 10 annotations. Préfère un tag existant (champ tag = son id) ; si aucun ne convient, laisse tag à null et décris un nouveau_tag (nom court en minuscules, description d'une phrase, motif = règle générale qui regroupe les termes de ce tag, couleur hexadécimale harmonieuse et bien distincte des couleurs déjà utilisées). fil_rouge liste en plus les mots clés de TOUT le paragraphe courant (sous-chaînes exactes de contexte_texte où courant vaut true). Réponds UNIQUEMENT par un objet JSON valide, sans texte autour.",
    reponse_attendue:{annotations:[{citation:'',tag:'id existant ou null',nouveau_tag:null,role:'thèse|notion|connecteur|objection|exemple|conclusion',pourquoi:''}],fil_rouge:[{citation:'',role:''}],synthese:''},
    nouveau_tag_forme:{nom:'',description:'',motif:'',couleur:'#rrggbb'},
    selection:{texte:m.p.text.slice(c.start,c.end)},
    tags_existants:tags,couleurs_utilisees:db.tags.map(t=>t.color),
    contexte_texte:contexte
  });
}
function localHarvest(p,c){
  const T=stats(),st=p.text.slice(c.start,c.end),out=[];
  db.tags.forEach(t=>{
    Object.keys(T[t.id].terms).forEach(term=>{
      if(term.length<3||out.length>=12)return;
      const re=new RegExp('(?<![\\p{L}])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','iu');
      const mm=re.exec(st);if(mm)out.push({citation:mm[0],tag:t.id});
    });
  });
  return out;
}
function applyHarvest(c,m,res){
  const p=m.p,row=c.row,base=c.start,st=p.text.slice(c.start,c.end),infos=[],filSp=[];
  (res.annotations||[]).slice(0,14).forEach(a=>{
    const q=String(a.citation||a.quote||'').trim();
    if(!q||q.length>200)return;
    let i=st.indexOf(q);if(i<0)i=st.toLowerCase().indexOf(q.toLowerCase());
    if(i<0)return;
    const start=base+i,end=start+q.length;
    let tag=null,fresh=false;
    if(a.tag!=null){
      const k=sid(a.tag);
      tag=tagById(k)?k:((db.tags.find(x=>x.name.toLowerCase()===String(a.tag).toLowerCase())||{}).id||null);
    }
    if(!tag&&a.nouveau_tag&&(a.nouveau_tag.nom||a.nouveau_tag.name)){const r=mkTag(a.nouveau_tag);tag=r.id;fresh=r.fresh}
    if(!tag)return;
    filSp.push({start,end,role:String(a.role||'')});
    if(p.sels.some(s=>s.start===start&&s.end===end&&s.tag===tag))return;
    const id='s_'+uid();
    p.sels.push({id,start,end,tag});
    infos.push({pid:c.pid,row,sel:id,tag,start,end,fresh,ai:true,batch:true});
  });
  if(!infos.length)return 0;
  /* le fil rouge de l'IA remplace l'heuristique locale pour ce paragraphe */
  (res.fil_rouge||[]).forEach(f=>{
    const q=String((f&&f.citation)||'').trim();if(!q)return;
    const i=p.text.indexOf(q);if(i>=0)filSp.push({start:i,end:i+q.length,role:String(f.role||'')});
  });
  const seen=new Set(),fl=[];
  filSp.sort((a,b)=>a.start-b.start).forEach(s=>{const k=s.start+'-'+s.end;if(!seen.has(k)){seen.add(k);fl.push({start:s.start,end:s.end,role:s.role,grp:'a'+fl.length})}});
  if(fl.length>=2){p.fil=fl;m.cache=null}
  save();
  incomingId=new Set(infos.map(x=>x.sel));incomingRow=row;
  refresh(c.pid);
  incomingId=null;incomingRow=null;
  infos.forEach((inf,i)=>setTimeout(()=>{const rs=rectsOf(row,inf.start,inf.end);inf.rect=rs[0]||null;gameOnTag(inf)},250+i*380));
  setTimeout(()=>document.querySelectorAll('.dot.inc').forEach(d=>d.classList.remove('inc')),250+infos.length*380+1600);
  return infos.length;
}
async function harvest(btn){
  if(!cur)return;
  const c=cur,m=idx[c.pid];if(!m)return;
  lastAct=Date.now();
  btn.classList.add('wait');md.replaceChildren(btn);
  let raw=null,fail=false;
  try{ab2&&ab2.abort();ab2=new AbortController();raw=await callAI(harvestPayload(m,m.p,c),ab2.signal)}catch(e){fail=true}
  let res=null;
  if(!fail){res=(raw==null)?{annotations:localHarvest(m.p,c)}:extractJSON(raw)}
  btn.classList.remove('wait');
  const n=(res&&Array.isArray(res.annotations))?applyHarvest(c,m,res):0;
  if(n){
    hide(md);const s=getSelection();s&&s.removeAllRanges();
    if(cur===c)cur=null;
  }else{
    btn.classList.add('err');
    setTimeout(()=>{btn.classList.remove('err');if(cur===c&&c.range)openModal(c.range.getBoundingClientRect())},700);
  }
}

/* ---------- démarrage ---------- */
(function init(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(saved&&Array.isArray(saved.texts)&&saved.texts.length){
    mergeTags(saved.tags);
    db.texts=saved.texts.map(t=>normText(t));
  }else{
    SEED.forEach(([name,description],i)=>db.tags.push({id:'t_'+sid(name),name,description,color:PAL[i%PAL.length]}));
  }
  db.texts=db.texts.filter(t=>!RETIRED.includes(t.id));
  CORPUS.forEach(t=>{if(!db.texts.some(x=>x.id===t.id))db.texts.push(normText(t))});
  rebuild();save();
  // corpus de dossier (cp2/docs ou c2phi/docs) : ajout silencieux des textes absents
  (async()=>{
    for(const base of ['cp2/docs','c2phi/docs']){
      try{
        const r=await fetch(base+'/manifest.json');if(!r.ok)continue;
        const j=await r.json();
        const files=(Array.isArray(j)?j:(j.files||j.textes||[])).map(f=>typeof f==='string'?f:(f.file||f.fichier||f.path)).filter(Boolean);
        let ch=false;
        for(const f of files){
          try{const x=await fetch(base+'/'+f);if(x.ok&&ingest(f,await x.text(),true))ch=true}catch(e){}
        }
        if(ch){save();const keep=rendered;reindex();renderCloud();if(!flow.querySelector('.row'))rebuild();else{const y=scrollY;flow.replaceChildren();rendered=0;more(Math.max(12,keep));scrollTo(0,y)}}
        break;
      }catch(e){}
    }
  })();
})();
