<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cartes du cours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with view tabs + class filter; one large stage; detail panel beside it (below on phones). */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#14181f; --ink2:#4a5260; --muted:#7b8494; --line:#dfe3ea; --grid:#eceff4; --accent:#2a78d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --seq0:#e8f0fb; --seq1:#2a78d6; --none:#9aa3b2;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1e26; --ink:#eef0f4; --ink2:#c0c6d2; --muted:#8e97a8; --line:#2c323d; --grid:#242a34; --accent:#3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  --seq0:#1f2a3b; --seq1:#3987e5; --none:#6f788a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1e26; --ink:#eef0f4; --ink2:#c0c6d2; --muted:#8e97a8; --line:#2c323d; --grid:#242a34; --accent:#3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  --seq0:#1f2a3b; --seq1:#3987e5; --none:#6f788a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-b);padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
h1{font:700 22px/1.15 var(--font-d);margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:2px 0 0;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.tabs button,.chip,.opt{font:500 13px var(--font-b);color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 13px var(--font-b);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
label.opt{display:inline-flex;gap:6px;align-items:center;padding:4px 10px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:14px;align-items:start}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.stage h2{font:700 16px var(--font-d);margin:2px 4px 2px}
.stage p.how{margin:0 4px 8px;color:var(--ink2);font-size:13px;max-width:70ch}
.tools{margin:0 4px 6px}
.canvas{overflow-x:auto}
svg{display:block;max-width:none}
svg text{font-family:var(--font-b);fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 2px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
aside{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;position:sticky;top:130px}
@media(max-width:860px){aside{position:static}}
aside h3{font:700 15px var(--font-d);margin:0 0 4px}
aside .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
aside .txt{white-space:pre-wrap;font-size:13px;color:var(--ink2);max-height:240px;overflow:auto;margin:0 0 8px}
aside .k{font:600 11px var(--font-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 3px}
aside ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink2)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;max-width:260px;display:none;line-height:1.35}
.empty{color:var(--muted);font-size:13px}
.node{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header>
  <div>
    <h1>Cartes du cours</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="row tabs" id="tabs" role="group" aria-label="Type de graphe"></div>
  <div class="row" id="chips" role="group" aria-label="Classes affichées"></div>
</header>
<main>
  <section class="stage">
    <h2 id="vt"></h2>
    <p class="how" id="vh"></p>
    <div class="row tools" id="tools"></div>
    <div class="canvas" id="cv"></div>
    <div class="legend" id="lg"></div>
  </section>
  <aside id="det"><p class="empty">Cliquez sur une séance, un devoir ou un document pour voir son contenu.</p></aside>
</main>
<div id="tip"></div>

de l'étude de la perspective de la connaissance: problème des limites de la connaissance","tx":"Dans la perspective de la connaissance, il y a aussi le problème des limites. La connaissance désintéressée est une activité purement théorique : on agit sans chercher à tirer profit de son acte, sans vouloir en tirer un intérêt. On rappelle que le terme de théorie vient de la theoria de Platon.       1. Les limites relatives de la connaissance   Il y a deux sortes de limites à la connaissance humaine.   Une première limite est relative. L'homme ne peut pas tout connaître : il y a des choses qu'il ne connaît pas, ou plutôt qu'il ne connaît pas encore. Mais à mesure que la connaissance progress","doc":"","ret":""},{"i":122,"n":"46.1","sn":46,"cl":"TG09","mat":"Philosophie","d":"2026-09-28","h":"10h05–11h00","k":"c","cat":"Cours","ti":"Les limites de la connaissance (perspective 3 la connaissance)","tx":"Dans la perspective de la connaissance, il y a aussi le problème des limites. La connaissance désintéressée est une activité purement théorique : on agit sans chercher à tirer profit de son acte, sans vouloir en tirer un intérêt. On rappelle que le terme de théorie vient de la theoria de Platon.       1. Les limites relatives de la connaissance   Il y a deux sortes de limites à la connaissance humaine.   Une première limite est relative. L'homme ne peut pas tout connaître : il y a des choses qu'il ne connaît pas, ou plutôt qu'il ne connaît pas encore. Mais à mesure que la connaissance progress","doc":"","ret":""},{"i":123,"n":"47.1","sn":47,"cl":"HLP A","mat":"HLP","d":"2026-09-28","h":"13h55–16h00","k":"c","cat":"Devoir sur table","ti":"Question d'interprétation sur l'éducation négative","tx":"","doc":"","ret":""},{"i":124,"n":"48.1","sn":48,"cl":"TG05","mat":"Philosophie","d":"2026-09-28","h":"16h00–16h55","k":"c","cat":"Cours","ti":"Suite de l'étude de la perspective de la connaissance: problème des limites de la connaissance","tx":"Rappel des points déjà étudiés. Une question que se posent les philosophes à propos de la connaissance humaine est : quelles sont les sources, quelle est l'origine de la connaissance humaine ? On avait distingué :      l'empirisme : la conception philosophique qui considère que les connaissances proviennent toutes de l'expérience, ce qui nous avait permis de définir les trois sens du mot « expérience » ;      le rationalisme : la conception philosophique qui considère que nos connaissances proviennent uniquement de l'usage que nous faisons de notre raison.       Les limites de la connaissance.","doc":"","ret":""},{"i":125,"n":"49.1","sn":49,"cl":"TG02","mat":"Philosophie","d":"2026-09-29","h":"10h05–11h00","k":"c","cat":"Cours","ti":"le troisième noumène — Dieu (perspective de la connaissance)","tx":"Après un bref rappel de la séance précédente (la perspective de la connaissance, les limites de la connaissance, et plus particulièrement ses limites absolues, c'est-à-dire des limites qui appartiennent à notre propre nature humaine et qu'on ne pourra jamais dépasser), on a poursuivi l'étude de la distinction que fait Kant entre le phénomène et le noumène. Après l'âme (premier noumène) et le monde (deuxième noumène), on a abordé le troisième noumène : Dieu.  De quel Dieu Kant parle-t-il ?  Il faut d'abord préciser de quel Dieu il est question. Kant ne parle pas des dieux des religions, c'est-à","doc":"","ret":""},{"i":126,"n":"50.1","sn":50,"cl":"TG05","mat":"Philosophie","d":"2026-09-29","h":"13h00–13h55","k":"c","cat":"Cours","ti":"Fin de la perspective « La connaissance » : la liberté, quatrième inconnaissable","tx":"La liberté comme quatrième inconnaissable       Pour essayer de connaître la liberté, on peut d'abord l'observer dans ses apparences extérieures (point de vue phénoménal) :   - Les actions spontanées. « Spontané » au sens propre = agir de soi-même, par soi-même, sans être provoqué ni contraint par une cause extérieure (≠ sens courant d'« immédiat »). Exemples : aveux spontanés (avouer de son eur. C'est le cœur de la dissertation : ce devoir est d'abord un devoir envers nous-mêmes, mais aussi un devoir envers les autres. Deux références l'ont établi :    Alain (texte p. 66 du manuel) réconcilie deux thèses en apparence opposées : le bonheur comme accomplissement personnel et la recherche du bonheur des autres. Nous avons le devoir d'être heureux pour nous-mêmes, m","doc":"Bhoutan la dictature du bonheur,  La poursuite du \"Bonheur national brut\" contribue-t-elle au développement du Bhoutan ?","ret":""},{"i":148,"n":"58.2","sn":58,"cl":"TG02","mat":"Philosophie","d":"2026-10-05","h":"08h55–10h05","k":"t","cat":"Sans catégorie","ti":"","tx":"Contrôle de connaissances sur le corrigé de la dissertation \"Peut-on être heureux quand les autres ne le sont pas?\". Revoir les principes de méthodes, la logique de l'argumentation des 3 parties, et les références expliquées (lire aussi les textes du livre).","doc":"","ret":"2026-10-12"},{"i":149,"n":"59.1","sn":59,"cl":"TG09","mat":"Philosophie","d":"2026-10-05","h":"10h05–11h00","k":"c","cat":"Correction","ti":"3eme partie: la nature politique du bonheur","tx":"Transition et rappel de la deuxième partie. On avait montré que la recherche du bonheur ne peut pas être uniquement individuelle : elle doit prendre la forme d'un devoir, d'abord envers nous-mêmes, puis envers les autres. Cette partie était importante car elle établissait que la recherche du bonheur n'est ni la simple recherche du plaisir ni celle d'une satisfaction égoïste : il y a une dimension morale, éthique — on ne peut pas chercher à être heureux à n'importe quel prix. Avec Kant (p. 66 du manuel), on avait vu que ce qui compte, c'est moins de réussir à être heureux que de mériter le bonh","doc":"La poursuite du \"Bonheur national brut\" contribue-t-elle au développement du Bhoutan ?, Bhoutan la dictature du bonheur","ret":""},{"i":150,"n":"59.2","sn":59,"cl":"TG09","mat":"Philosophie","d":"2026-10-05","h":"10h05–11h00","k":"t","cat":"Sans catégorie","  d'après la maxime grâce à laquelle tu peux vouloir en même temps qu'elle devienne une loi universelle. »   Cette citation est à connaître pour le baccalauréat. Conseil pour les fiches de révision, à établir en trois sortes :       • Fiches de citation : sur le recto, la citation seule (sans l'auteur) ; sur le verso, l'auteur et une explication très résumée (une ou deux phrases, trois maximum), avec le numéro de la page du cahier où la citation ","doc":"","ret":""},{"i":268,"n":"109.3","sn":109,"cl":"TG09","mat":"Philosophie","d":"2026-11-16","h":"10h05–11h00","k":"t","cat":"Sans catégorie","ti":"","tx":"Numéroter les pages de son cahier au fur et à mesure des révisions ; retenir la citation de l'impératif catégorique et commencer les fiches de révision (citations, concepts, repères).","doc":"","ret":"2026-11-17"},{"i":269,"n":"109.4","sn":109,"cl":"TG09","mat":"Philosophie","d":"2026-11-16","h":"10h05–11h00","k":"t","cat":"Sans catégorie","ti":"","tx":"QCM — Kant : l'impératif catégorique (TG09)","doc":"","ret":"2026-11-17"},{"i":270,"n":"110.1","sn":110,"cl":"HLP A","mat":"HLP","d":"2026-11-16","h":"13h55–16h00","k":"c","cat":"Travaux dirigés","ti":"Travail en groupe sur les questions des textes de Freud et Kant sur la culture","tx":"","doc":"thlp - textes freud et Kant education.pdf","ret":""},{"i":271,"n":"111.1","sn":111,"cl":"TG05","mat":"Philosophie","d":"2026-11-16","h":"16h00–16h55","k":"c","cat":"Cours","ti":"Texte 3. Kant : l'impératif catégorique et la fausse promesse","tx":"Rappel de méthode : les trois questions de base auxquelles il faut toujours répondre au brouillon pour préparer une explication de texte : Quelle est la thèse de l'auteur dans ce texte ? Quel est le problème ? Comment le texte est-il construit ?     La thèse de Kant   Attention : la dernière phrase (« universaliser une loi selon laquelle chaque individu croyant être dans le besoin pourrait promettre tout ce qui lui vient à l'esprit... cela reviendrait à rendre impossible le fait même de promettre ») ne doit pas être confondue avec la thèse : elle conclut le raisonnement, c'est-à-dire l'analyse","doc":"TG51116-ImperatifCategorique.html","ret":""},{"i":272,"n":"111.2","sn":111,"cl":"TG05","mat":"Philosophie","d":"2026-11-16","h":"16h00–16h55","k":"c","cat":"Méthodes","ti":"Méthode : la fonction de l'exemple en philosophie","tx":"Qu'est-ce qu'il y a de remarquable dans ce texte par rapport à ceux de Descartes et de Marx ? Tout le texte est fondé sur un exemple : toute l'argumentation se fait à partir d'un exemple développé par l'auteur, contrairement aux textes précédents, uniquement fondés sur une démonstration. Il y a deux manières d'utiliser un exemple :   • Première manière : l'exemple vient après l'argument, pour l'illustrer. Rappel : un argument, c'est une raison, plus exactement plusieurs raisons qui s'enchaînent logiquement pour défendre une thèse ; toute thèse philosophique est problématique et doit être argum","doc":"","ret":""},{"i":273,"n":"111.3","sn":111,"cl":"TG05","mat":"Philosophie","d":"2026-11-16","h":"16h00–16h55","k":"t","cat":"Sans catégorie","ti":"","tx":"• Apprendre la citation de l'impératif catégorique (citation à connaître pour le baccalauréat). • Réviser le repère universel / général / particulier / singulier (fiche « Découvrir les repères » sur Pronote ; livre p. 531). • Relire le texte 3 et le début de l'explication ; la suite du cours reprendra sur la question : a-t-il raison de mentir dans ce cas-là ?","doc":"","ret":"2026-11-17"},{"i":274,"n":"112.1","sn":112,"cl":"TG02","mat":"Philosophie","d":"2026-11-17","h":"10h05–11h00","k":"c","cat":"Cours","ti":"Explication du texte 3 de Kant (deuxième moment de l’argumentation: l’énoncé de la maxime) : le dilemme moral, la légitimité, la maxime","tx":"Reprise de l'explication du texte de Kant là où la séance précédente s'était arrêtée : la fin de l'exemple que Kant présente dans le premier moment de son argumentation. L'exemple s'achève sur un dilemme moral, un cas de conscience, que l'on trouve figuré dans le texte par les mots : « il conserve encore assez de conscience morale pour se demander n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient », c'est-à-dire par un tel moyen. Ce sont les mots précis de « conscience morale » et de « devoir » qui permettent de comprendre et d'expliquer la fin de cet exe","doc":"TG21117-Maxime.html","ret":""},{"i":275,"n":"112.2","sn":112,"cl":"TG02","mat":"Philosophie","d":"2026-11-17","h":"10h05–11h00","k":"t","cat":"Sans catégorie","ti":"","tx":"Lire la page 528 du livre : le repère légal / légitime (pour la fin de la semaine). Lire la page 529 environ du livre : le repère universel / général / particulier / singulier. Lire la définition de ces repères dans la fiche « Découvrir les repères » sur Pronote, et l'utiliser chaque fois qu'un repère est rencontré en cours. Réviser les temps de conjugaison (subjonctif après « à supposer que », conditionnel, imparfait, passé simple, participe) pour savoir les employer dans une copie -> expression écrite.","doc":"2026_Découvrir les repères.pdf, TG21117-Maxime.html","ret":"2026-11-19"},{"i":276,"n":"113.1","sn":113,"cl":"TG05","mat":"Philosophie","d":"2026-11-17","h":"13h00–13h55","k":"c","cat":"Cours","ti":"Explication du texte 3 de Kant (deuxième moment de l’argumentation: l’énoncé de la maxime) : le dilemme moral, la légitimité, la maxime","tx":"Reprise de l'explication du texte de Kant là où la séance précédente s'était arrêtée : la fin de l'exemple que Kant présente dans le premier moment de son argumentation. L'exemple s'achève sur un dilemme moral, un cas de conscience, que l'on trouve figuré dans le texte par les mots : « il conserve encore assez de conscience morale pour se demander n'est-il pas interdit et contraire au devoir de se tirer d'affaires par un tel expédient », c'est-à-dire par un tel moyen. Ce sont les mots précis de « conscience morale » et de « devoir » qui permettent de comprendre et d'expliquer la const CLS=[{k:'TG02',c:'--c1'},{k:'TG05',c:'--c2'},{k:'TG09',c:'--c3'},{k:'HLP A',c:'--c5'},{k:'HLP B',c:'--c7'}];
const CLC=Object.fromEntries(CLS.map(x=>[x.k,`var(${x.c})`]));
const CATS=['Cours','Correction','Travaux dirigés','Méthodes','Philosophie HLP','Devoir sur table','Interrogation de cours','Film pour illustration de la séquence','Sans catégorie'];
const CATSHORT={'Film pour illustration de la séquence':'Film','Interrogation de cours':'Interrogation','Philosophie HLP':'Philo HLP'};
const CATC=Object.fromEntries(CATS.map((c,i)=>[c,i<8?`var(--c${i+1})`:'var(--none)']));
const short=c=>CATSHORT[c]||c;
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmt=d=>{const[y,m,j]=d.split('-');return `${+j} ${MOIS[+m-1]}`};
const active=new Set(CLS.map(c=>c.k));
const $=s=>document.querySelector(s);
const tip=$('#tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rec=D.filter(r=>true);
const sel=()=>D.filter(r=>active.has(r.cl));
const seances=()=>sel().filter(r=>r.k==='c');
const tafs=()=>sel().filter(r=>r.k==='t');
const label=r=>r.ti||(r.k==='c'?'Séance du '+fmt(r.d):'Travail à faire');
const tafLabel=r=>r.tx.replace(/\s+/g,' ').slice(0,70)+(r.tx.length>70?'…':'');
const tafsOf=s=>D.filter(r=>r.k==='t'&&r.cl===s.cl&&r.sn===s.sn);
const parentOf=t=>D.find(r=>r.k==='c'&&r.cl===t.cl&&r.sn===t.sn);

function detail(r){
  const el=$('#det');
  if(r.docNode){
    const L=D.filter(x=>x.doc===r.docNode);
    el.innerHTML=`<h3>${esc(r.docNode)}${(typeof DOCS!=="undefined"&&DOCS[r.docNode])?` <a href="${DOCS[r.docNode]}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">Ouvrir ↗</a>`:""}</h3><div class="meta">Document joint</div><div class="k">Utilisé dans ${L.length} entrée(s)</div><ul>${L.map(x=>`<li>${x.cl} · ${fmt(x.d)} · ${esc(label(x))}</li>`).join('')}</ul>`;return}
  if(r.catNode){
    const L=D.filter(x=>x.k==='c'&&x.cat===r.catNode&&active.has(x.cl));
    el.innerHTML=`<h3>${esc(r.catNode)}</h3><div class="meta">Catégorie</div><div class="k">${L.length} séance(s)</div><ul>${L.slice(0,40).map(x=>`<li>${x.cl} · ${fmt(x.d)} · ${esc(label(x))}</li>`).join('')}</ul>`;return}
  if(r.clsNode){
    const L=D.filter(x=>x.cl===r.clsNode);
    el.innerHTML=`<h3>${r.clsNode}</h3><div class="meta">${L[0].mat}</div><p class="txt">${L.filter(x=>x.k==='c').length} séances, ${L.filter(x=>x.k==='t').length} devoirs, du ${fmt(L[0].d)} au ${fmt(L[L.length-1].d)}.</p>`;return}
  const s=r.k==='t'?parentOf(r):r;
  const T=s?tafsOf(s):[];
  el.innerHTML=`<h3>${esc(label(r))}</h3><div class="meta">${r.cl} · ${fmt(r.d)} · ${r.h} · ${r.k==='t'?'Travail à faire':esc(r.cat)}</div>
  <p class="txt">${esc(r.tx)||'<span class="empty">Pas de description.</span>'}</p>
  ${r.ret?`<div class="k">À rendre pour le</div><div>${fmt(r.ret)}</div>`:''}
  ${r.doc?`<div class="k">Document joint</div><div>${docLinks(r.doc)}</div>`:''}
  ${r.k==='c'&&T.length?`<div class="k">Travail associé</div><ul style="line-height:1.45">${T.map(t=>`<li style="margin-bottom:6px;white-space:pre-wrap">${esc(t.tx)}${t.ret?' — à faire pour le '+fmt(t.ret):''}</li>`).join('')}</ul>`:''}`;
}
const docLinks=doc=>doc.split(', ').map(n=>{const u=(typeof DOCS!=="undefined"&&DOCS[n])||'';return u?`<a href="${u}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">${esc(n)} ↗</a>`:esc(n)}).join('<br>');
const tipOf=r=>`<b>${esc(label(r))}</b><br>${r.cl} · ${fmt(r.d)}${r.k==='c'?' · '+esc(short(r.cat)):' · devoir'}`;

const VIEWS=[
 {id:'reseau',name:'Réseau',title:'Réseau des séances',how:'Chaque point est une séance (plein) ou un devoir (anneau). Les chaînes suivent l’ordre des cours dans chaque classe. Les pointillés relient la même séance donnée dans deux classes. Glissez un point pour le déplacer.',draw:drawNet,tools:netTools},
 {id:'arbre',name:'Arbre radial',title:'Arbre du cours',how:'Du centre vers l’extérieur : matière, classe, mois, séance, puis devoir associé.',draw:drawTree},

let cur=VIEWS[0], netOpts={tafs:true,docs:true,cats:false}, matBy='cat';
const W=()=>Math.max(320,$('#cv').clientWidth);
function svgEl(w,h){return d3.create('svg').attr('width',w).attr('height',h).attr('viewBox',[0,0,w,h])}
function legendClasses(){ $('#lg').innerHTML=CLS.filter(c=>active.has(c.k)).map(c=>`<span><i style="background:var(${c.c})"></i>${c.k}</span>`).join('') }
function legendCats(used){ $('#lg').innerHTML=CATS.filter(c=>!used||used.has(c)).map(c=>`<span><i style="background:${CATC[c]}"></i>${short(c)}</span>`).join('') }

function netTools(){
  const t=$('#tools');
  t.innerHTML=[['tafs','Devoirs'],['docs','Documents'],['cats','Catégories']].map(([k,l])=>`<label class="opt"><input type="checkbox" id="o-${k}" ${netOpts[k]?'checked':''}> ${l}</label>`).join('');
  t.querySelectorAll('input').forEach(i=>i.onchange=()=>{netOpts[i.id.slice(2)]=i.checked;render()});
}
function matTools(){
  $('#tools').innerHTML=`<label for="mb" class="opt">Lignes <select id="mb"><option value="cat">Catégories</option><option value="cl">Classes</option></select></label>`;
  $('#mb').value=matBy;$('#mb').onchange=e=>{matBy=e.target.value;render()};
}

let sim=null;
function drawNet(){
  if(sim){sim.stop();sim=null}
  const w=W(),h=Math.max(520,Math.min(760,w*0.8));
  const nodes=[],links=[],byId=new Map();
  const add=n=>{byId.set(n.id,n);nodes.push(n);return n};
  CLS.filter(c=>active.has(c.k)).forEach(c=>add({id:'cl:'+c.k,t:'cl',clsNode:c.k,cl:c.k,r:15}));
  const S=seances(),T=tafs();
  const prev={};
  S.forEach(s=>{add({id:'r'+s.i,t:'s',r:s,cl:s.cl,rad:4.5});
    if(prev[s.cl])links.push({source:'r'+prev[s.cl].i,target:'r'+s.i,k:'chain'});else links.push({source:'cl:'+s.cl,target:'r'+s.i,k:'chain'});
    prev[s.cl]=s;});
  const byTitle={};
  S.forEach(s=>{if(s.ti&&s.mat==='Philosophie'){(byTitle[s.ti]=byTitle[s.ti]||[]).push(s)}});
  Object.values(byTitle).forEach(L=>{for(let i=1;i<L.length;i++)if(L[i].cl!==L[0].cl)links.push({source:'r'+L[0].i,target:'r'+L[i].i,k:'same'})});
  if(netOpts.tafs)T.forEach(t=>{const p=parentOf(t);if(p&&byId.has('r'+p.i)){add({id:'r'+t.i,t:'t',r:t,cl:t.cl,rad:2.8});links.push({source:'r'+p.i,target:'r'+t.i,k:'taf'})}});
  if(netOpts.docs){const docs=new Set();S.forEach(s=>{if(s.doc){docs.add(s.doc)}});docs.forEach(d=>add({id:'d:'+d,t:'d',docNode:d,rad:5}));S.forEach(s=>{if(s.doc)links.push({source:'r'+s.i,target:'d:'+s.doc,k:'doc'})})}
  if(netOpts.cats){const cs=new Set(S.map(s=>s.cat));cs.forEach(c=>add({id:'c:'+c,t:'c',catNode:c,rad:8}));S.forEach(s=>links.push({source:'r'+s.i,target:'c:'+s.cat,k:'cat'}))}
  const svg=svgEl(w,h);
  const g=svg.append('g');
  const L=g.append('g').selectAll('line').data(links).join('line')
    .style('stroke',d=>d.k==='same'?'var(--ink2)':'var(--muted)').style('stroke-opacity',d=>d.k==='chain'?.55:d.k==='same'?.5:.35)
    .attr('stroke-width',d=>d.k==='chain'?1.2:.8).attr('stroke-dasharray',d=>d.k==='same'?'3 3':null);
  const N=g.append('g').selectAll('g').data(nodes).join('g').attr('class','node');
  N.each(function(d){const e=d3.select(this);
    if(d.t==='cl'){e.append('circle').attr('r',d.r).style('fill',CLC[d.cl]).style('stroke','var(--surface)').attr('stroke-width',2);e.append('text').attr('text-anchor','middle').attr('dy',4).style('fill','#fff').style('font-weight',600).style('font-size','10px').text(d.cl.replace('HLP ','H'))}
    else if(d.t==='s')e.append('circle').attr('r',d.rad).style('fill',CLC[d.cl]).style('stroke','var(--surface)').attr('stroke-width',1);
    else if(d.t==='t')e.append('circle').attr('r',d.rad).style('fill','var(--surface)').style('stroke',CLC[d.cl]).attr('stroke-width',1.5);
    else if(d.t==='d')e.append('rect').attr('x',-d.rad).attr('y',-d.rad).attr('width',d.rad*2).attr('height',d.rad*2).attr('transform','rotate(45)').style('fill','var(--ink2)').style('stroke','var(--surface)');
    else {e.append('circle').attr('r',d.rad).style('fill',CATC[d.catNode]).style('stroke','var(--surface)').attr('stroke-width',2);e.append('text').attr('dx',11).attr('dy',4).text(short(d.catNode))}
  });
  N.on('mousemove',(ev,d)=>showTip(ev,d.r?tipOf(d.r):d.docNode?esc(d.docNode):d.catNode?esc(d.catNode):d.clsNode)).on('mouseleave',hideTip)
   .on('click',(ev,d)=>detail(d.r||d));
  sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>({chain:16,taf:12,doc:30,cat:60,same:80}[d.k])).strength(d=>({chain:.9,taf:.8,doc:.2,cat:.05,same:.03}[d.k])))
    .force('charge',d3.forceManyBody().strength(d=>d.t==='cl'?-200:-22))
    .force('center',d3.forceCenter(w/2,h/2)).force('x',d3.forceX(w/2).strength(.04)).force('y',d3.forceY(h/2).strength(.06))
    .force('col',d3.forceCollide(d=>(d.rad||d.r)+1.5));
  const clamp=(v,m,M)=>Math.max(m,Math.min(M,v));
  sim.on('tick',()=>{nodes.forEach(n=>{n.x=clamp(n.x,12,w-12);n.y=clamp(n.y,12,h-12)});
    L.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    N.attr('transform',d=>`translate(${d.x},${d.y})`)});
  N.call(d3.drag().on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y}).on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  $('#cv').replaceChildren(svg.node());
  $('#lg').innerHTML=CLS.filter(c=>active.has(c.k)).map(c=>`<span><i style="background:var(${c.c})"></i>${c.k}</span>`).join('')+'<span><i style="background:var(--surface);border:1.5px solid var(--ink2)"></i>devoir</span><span><i style="background:var(--ink2);border-radius:1px;transform:rotate(45deg) scale(.8)"></i>document</span>'+'<span>pointillés : même séance dans deux classes</span>';
  for(let i=0;i<150;i++)sim.tick();
}

function monthKey(d){return d.slice(0,7)}
const monthName=k=>{const m=+k.slice(5);return MOIS[m-1]};
function drawTree(){
  const w=W(),h=Math.min(Math.max(560,w),820);
  const R=Math.min(w,h)/2-80;
  const mats={};
  seances().forEach(s=>{
    const m=(mats[s.mat]=mats[s.mat]||{});
    const c=(m[s.cl]=m[s.cl]||{});
    (c[monthKey(s.d)]=c[monthKey(s.d)]||[]).push(s);
  });
  const root={name:'Cours',children:Object.entries(mats).map(([mat,cs])=>({name:mat,children:Object.entries(cs).map(([cl,ms])=>({name:cl,cl,children:Object.entries(ms).sort().map(([mk,L])=>({name:monthName(mk),cl,children:L.map(s=>({name:label(s),cl,r:s,children:tafsOf(s).map(t=>({name:tafLabel(t),cl,r:t}))}))}))}))}))};
  const hier=d3.hierarchy(root);
  d3.cluster().size([2*Math.PI,R]).separation((a,b)=>a.parent===b.parent?1:1.6)(hier);
  const svg=svgEl(w,h);const g=svg.append('g').attr('transform',`translate(${w/2},${h/2})`);
  const pt=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r];
  g.append('g').attr('fill','none').selectAll('path').data(hier.links()).join('path')
   .style('stroke',d=>d.target.data.cl?CLC[d.target.data.cl]:'var(--muted)').style('stroke-opacity',.45).attr('stroke-width',1)
   .attr('d',d3.linkRadial().angle(d=>d.x).radius(d=>d.y));
  const n=g.append('g').selectAll('g').data(hier.descendants()).join('g').attr('transform',d=>`translate(${pt(d.x,d.y)})`);
  n.filter(d=>d.depth>=4).append('circle').attr('r',d=>d.depth===4?3.4:2.4).style('fill',d=>d.depth===4?CLC[d.data.cl]:'var(--surface)').style('stroke',d=>CLC[d.data.cl]).attr('stroke-width',1.3).attr('class','node')
   .on('mousemove',(ev,d)=>showTip(ev,tipOf(d.data.r))).on('mouseleave',hideTip).on('click',(ev,d)=>detail(d.data.r));
  n.filter(d=>d.depth>0&&d.depth<4).append('circle').attr('r',d=>d.depth===2?12:5).style('fill',d=>d.depth===2?CLC[d.data.cl]:'var(--surface)').style('stroke',d=>d.depth===1?'var(--ink2)':CLC[d.data.cl]||'var(--ink2)').attr('stroke-width',2);
  n.filter(d=>d.depth===0).append('text').attr('text-anchor','middle').attr('dy',4).style('font-weight',600).style('fill','var(--ink)').text('Cours');
  n.filter(d=>d.depth===1).append('text').attr('class','lb').attr('text-anchor','middle').attr('dy',-9).style('fill','var(--ink)').style('font-weight',600).text(d=>d.data.name);
  n.filter(d=>d.depth===2).append('text').attr('text-anchor','middle').attr('dy',3.5).style('fill','#fff').style('font-size','9px').style('font-weight',600).text(d=>d.data.name.replace('HLP ','H'));
  n.filter(d=>d.depth===3).append('text').attr('transform',d=>`rotate(${d.x*180/Math.PI-90}) translate(0,0)`).attr('dx',d=>d.x<Math.PI?9:-9).attr('dy',4).attr('text-anchor',d=>d.x<Math.PI?'start':'end').attr('transform',d=>`rotate(${(d.x<Math.PI?d.x*180/Math.PI-90:d.x*180/Math.PI+90)}) `).attr('x',0).attr('class','lb').text(d=>d.data.name);
  g.selectAll('text.lb').style('paint-order','stroke').style('stroke','var(--surface)').attr('stroke-width',3);
  $('#cv').replaceChildren(svg.node());legendClasses();
}

function drawSun(){
  const w=W(),h=Math.min(Math.max(540,w),760),R=Math.min(w,h)/2-16;
  const tree={name:'Cours',children:CLS.filter(c=>active.has(c.k)).map(c=>({name:c.k,cl:c.k,children:CATS.map(cat=>({name:cat,cl:c.k,cat:1,children:seances().filter(s=>s.cl===c.k&&s.cat===cat).map(s=>({name:label(s),cl:c.k,r:s,value:1}))})).filter(x=>x.children.length)}))};
  const hier=d3.hierarchy(tree).sum(d=>d.value||0).sort((a,b)=>CATS.indexOf(a.data.name)-CATS.indexOf(b.data.name));
  let focus=hier;
  const svg=svgEl(w,h);const g=svg.append('g').attr('transform',`translate(${w/2},${h/2})`);
  function paint(){
    const f=focus;const x0=f.x0,x1=f.x1,dx=x1-x0;
    const maxD=Math.min(3,f.height);
    const ringW=R/(maxD+1.2),inner=ringW*.9;
    const rad=d=>inner+(d.depth-f.depth-1)*ringW;
    const arc=d3.arc().startAngle(d=>(d.x0-x0)/dx*2*Math.PI).endAngle(d=>(d.x1-x0)/dx*2*Math.PI).innerRadius(d=>rad(d)).outerRadius(d=>rad(d)+ringW-2).padAngle(.004);
    const vis=f.descendants().filter(d=>d!==f&&d.depth-f.depth<=3);
    g.selectAll('*').remove();
    g.append('g').selectAll('path').data(vis).join('path').attr('d',arc).attr('class','node')
      .style('fill',d=>CLC[d.data.cl]||'var(--none)').style('fill-opacity',d=>[0,.95,.7,.5][d.depth-f.depth]||.4).style('stroke','var(--surface)').attr('stroke-width',1)
      .on('mousemove',(ev,d)=>showTip(ev,d.data.r?tipOf(d.data.r):`<b>${esc(d.data.name)}</b><br>${d.value} séance(s)`)).on('mouseleave',hideTip)
      .on('click',(ev,d)=>{if(d.data.r){detail(d.data.r)}else{focus=d;paint()}});
    g.append('g').selectAll('text').data(vis.filter(d=>(d.x1-d.x0)/dx*2*Math.PI>.22&&d.depth-f.depth<=2&&!d.data.r)).join('text')
      .attr('transform',d=>{const a=((d.x0+d.x1)/2-x0)/dx*2*Math.PI;const r=rad(d)+ringW/2;const deg=a*180/Math.PI-90;return `rotate(${deg}) translate(${r},0) rotate(${a>Math.PI?180:0})`})
      .attr('text-anchor','middle').attr('dy',4).style('fill','var(--ink)').style('font-size','10.5px').style('font-weight',600).style('pointer-events','none').text(d=>d.depth===1?d.data.name:short(d.data.name));
    const c=g.append('g').attr('class','node').on('click',()=>{if(focus.parent){focus=focus.parent;paint()}});
    c.append('circle').attr('r',inner-6).style('fill','var(--surface)').style('stroke','var(--line)');
    c.append('text').attr('text-anchor','middle').attr('dy',-2).style('fill','var(--ink)').style('font-weight',600).text(focus.data.name);
    c.append('text').attr('text-anchor','middle').attr('dy',14).text(focus.value+' séances');
  }
  d3.partition().size([2*Math.PI,1])(hier);
  paint();
  $('#cv').replaceChildren(svg.node());legendClasses();
}

function drawTimeline(){
  const w=Math.max(W(),720),laneH=118,top=16,left=64,right=20;
  const cl=CLS.filter(c=>active.has(c.k));const h=top+cl.length*laneH+46;
  const x=d3.scaleTime().domain([new Date('2026-09-01'),new Date('2026-11-22')]).range([left,w-right]);
  const svg=svgEl(w,h);
  const weeks=d3.timeMonday.range(new Date('2026-08-31'),new Date('2026-11-23'));
  svg.append('g').selectAll('line').data(weeks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',top).attr('y2',h-40).style('stroke','var(--grid)');
  svg.append('g').selectAll('text').data(weeks.filter((d,i)=>i%2===0)).join('text').attr('x',d=>x(d)+3).attr('y',h-24).text(d=>`${d.getDate()} ${MOIS[d.getMonth()]}`);
  const used=new Set();
  cl.forEach((c,li)=>{
    const y0=top+li*laneH+laneH-40;
    svg.append('line').attr('x1',left).attr('x2',w-right).attr('y1',y0).attr('y2',y0).style('stroke','var(--line)');
    svg.append('text').attr('x',8).attr('y',y0+4).style('fill',CLC[c.k]).style('font-weight',700).style('font-size','13px').text(c.k);
    const S=seances().filter(s=>s.cl===c.k);
    const arcs=svg.append('g');
    tafs().filter(t=>t.cl===c.k&&t.ret).forEach(t=>{
      const x1=x(new Date(t.d)),x2=x(new Date(t.ret));const sp=Math.max(6,x2-x1);const hh=Math.min(laneH-52,10+sp*.25);
      arcs.append('path').attr('d',`M${x1},${y0} C${x1+sp*.1},${y0-hh*1.3} ${x2-sp*.1},${y0-hh*1.3} ${x2},${y0}`).attr('fill','none').style('stroke','var(--muted)').style('stroke-opacity',.35).attr('stroke-width',1)
        .attr('class','node').on('mousemove',ev=>showTip(ev,`<b>Devoir</b> ${esc(tafLabel(t))}<br>donné le ${fmt(t.d)}, pour le ${fmt(t.ret)}`)).on('mouseleave',hideTip).on('click',()=>detail(t))
        .on('mouseenter',function(){d3.select(this).style('stroke-opacity',1).style('stroke',CLC[c.k]).attr('stroke-width',2)}).on('mouseout',function(){d3.select(this).style('stroke-opacity',.35).style('stroke','var(--muted)').attr('stroke-width',1)});
      arcs.append('circle').attr('cx',x2).attr('cy',y0).attr('r',2).style('fill','var(--muted)');
    });
    const cnt={};
    S.forEach(s=>{used.add(s.cat);const dx=cnt[s.d]=(cnt[s.d]||0);cnt[s.d]++;
      svg.append('circle').attr('cx',x(new Date(s.d))).attr('cy',y0+10+dx*9).attr('r',4).attr('class','node').style('fill',CATC[s.cat]).style('stroke','var(--surface)').attr('stroke-width',1)
       .on('mousemove',ev=>showTip(ev,tipOf(s))).on('mouseleave',hideTip).on('click',()=>detail(s))});
  });
  $('#cv').replaceChildren(svg.node());legendCats(used);
  $('#lg').insertAdjacentHTML('beforeend','<span>arcs : devoir donné, puis rendu</span>');
}

function drawMatrix(){
  const S=seances();
  const weekStart=d=>d3.timeMonday.floor(new Date(d));
  const weeks=d3.timeMonday.range(new Date('2026-08-31'),new Date('2026-11-23'));
  const rows=matBy==='cat'?CATS.filter(c=>S.some(s=>s.cat===c)):CLS.filter(c=>active.has(c.k)).map(c=>c.k);
  const key=s=>matBy==='cat'?s.cat:s.cl;
  const m=new Map();S.forEach(s=>{const k=key(s)+'|'+(+weekStart(s.d));m.set(k,(m.get(k)||0)+1)});
  const max=d3.max([...m.values()])||1;
  const w=Math.max(W(),680),left=150,top=34,cw=(w-left-10)/weeks.length,ch=34,h=top+rows.length*ch+10;
  const cs=getComputedStyle(document.documentElement);const col=d3.scaleLinear().domain([0,max]).range([cs.getPropertyValue('--seq0').trim(),cs.getPropertyValue('--seq1').trim()]);
  const svg=svgEl(w,h);
  svg.append('g').selectAll('text').data(weeks).join('text').attr('x',(d,i)=>left+i*cw+cw/2).attr('y',22).attr('text-anchor','middle').text(d=>`${d.getDate()}/${d.getMonth()+1}`);
  rows.forEach((r,ri)=>{
    svg.append('text').attr('x',left-10).attr('y',top+ri*ch+ch/2+4).attr('text-anchor','end').style('fill','var(--ink)').text(matBy==='cat'?short(r):r);
    weeks.forEach((wk,i)=>{const v=m.get(r+'|'+ +wk)||0;
      const g=svg.append('g');
      g.append('rect').attr('x',left+i*cw+1).attr('y',top+ri*ch+1).attr('width',cw-2).attr('height',ch-2).attr('rx',3).style('fill',v?col(v):'var(--grid)').attr('class','node')
        .on('mousemove',ev=>showTip(ev,`<b>${matBy==='cat'?esc(short(r)):r}</b><br>semaine du ${fmt(d3.timeFormat('%Y-%m-%d')(wk))} : ${v} séance(s)`)).on('mouseleave',hideTip);
      if(v)g.append('text').attr('x',left+i*cw+cw/2).attr('y',top+ri*ch+ch/2+4).attr('text-anchor','middle').style('fill',v>max*.55?'#fff':'var(--ink)').style('pointer-events','none').text(v);
    });
  });
  $('#cv').replaceChildren(svg.node());
  $('#lg').innerHTML=`<span><i style="background:var(--seq0)"></i>0 à 1</span><span><i style="background:var(--seq1)"></i>${max} séances par semaine</span>`;
}

function drawSankey(){
  const S=seances(),w=Math.max(W(),640),h=Math.max(560,Math.min(760,w*.7));
  const nodes=[],idx={};const nid=(t,k)=>{const id=t+':'+k;if(!(id in idx)){idx[id]=nodes.length;nodes.push({id,name:k,t})}return idx[id]};
  const lk={};
  const bump=(a,b,cl)=>{const k=a+'>'+b+'>'+(cl||'');lk[k]=lk[k]||{source:a,target:b,value:0,cl};lk[k].value++};
  S.forEach(s=>{const a=nid('cl',s.cl),b=nid('cat',s.cat),c=nid('mo',monthKey(s.d));bump(a,b,s.cl);bump(b,c,s.cl)});
  const g=d3.sankey().nodeWidth(14).nodePadding(16).extent([[110,8],[w-110,h-8]]).nodeSort((a,b)=>{
    if(a.t==='cl')return CLS.findIndex(c=>c.k===a.name)-CLS.findIndex(c=>c.k===b.name);
    if(a.t==='cat')return CATS.indexOf(a.name)-CATS.indexOf(b.name);return a.name<b.name?-1:1})
    ({nodes:nodes.map(d=>({...d})),links:Object.values(lk).map(d=>({...d}))});
  const svg=svgEl(w,h);
  svg.append('g').attr('fill','none').selectAll('path').data(g.links).join('path').attr('d',d3.sankeyLinkHorizontal()).attr('stroke-width',d=>Math.max(1,d.width))
    .style('stroke',d=>CLC[d.cl]).style('stroke-opacity',.35).attr('class','node')
    .on('mousemove',(ev,d)=>showTip(ev,`<b>${d.cl}</b> · ${esc(short(d.source.name.length>5||d.source.t!=='cl'?d.source.name:d.source.name))} → ${esc(d.target.t==='mo'?monthName(d.target.name):short(d.target.name))}<br>${d.value} séance(s)`)).on('mouseleave',hideTip)
    .on('mouseenter',function(){d3.select(this).style('stroke-opacity',.75)}).on('mouseout',function(){d3.select(this).style('stroke-opacity',.35)});
  const nn=svg.append('g').selectAll('g').data(g.nodes).join('g');
  nn.append('rect').attr('x',d=>d.x0).attr('y',d=>d.y0).attr('width',d=>d.x1-d.x0).attr('height',d=>Math.max(1,d.y1-d.y0)).attr('rx',2).style('fill',d=>d.t==='cl'?CLC[d.name]:d.t==='cat'?CATC[d.name]:'var(--ink2)');
  nn.append('text').attr('x',d=>d.t==='mo'?d.x1+6:d.t==='cl'?d.x0-6:d.x0+(d.x1-d.x0)/2).attr('y',d=>(d.y0+d.y1)/2).attr('dy',4)
    .attr('text-anchor',d=>d.t==='mo'?'start':d.t==='cl'?'end':'middle').style('fill','var(--ink)').style('font-weight',500)
    .style('paint-order','stroke').style('stroke','var(--surface)').attr('stroke-width',3)
    .text(d=>d.t==='mo'?monthName(d.name):d.t==='cat'?short(d.name):d.name);
  $('#cv').replaceChildren(svg.node());legendClasses();
}

/* ---------- shell ---------- */
function render(){
  if(sim&&cur.id!=='reseau'){sim.stop()}
  $('#vt').textContent=cur.title;$('#vh').textContent=cur.how;
  $('#tools').innerHTML='';if(cur.tools)cur.tools();
  hideTip();cur.draw();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===cur.id));
  const S=seances().length,T=tafs().length;
  $('#sub').textContent=`${S} séances et ${T} devoirs, du 3 septembre au 20 novembre 2026`;
}
$('#tabs').innerHTML=VIEWS.map(v=>`<button type="button" data-id="${v.id}" aria-pressed="false">${v.name}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=VIEWS.find(v=>v.id===b.dataset.id);try{history.replaceState(null,'','#'+cur.id)}catch(_){}render()};
$('#chips').innerHTML=CLS.map(c=>`<button type="button" class="chip" data-k="${c.k}" aria-pressed="true"><i style="background:var(${c.c})"></i>${c.k}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;if(active.has(k)){if(active.size>1)active.delete(k)}else active.add(k);b.setAttribute('aria-pressed',active.has(k));render()};
const h0=location.hash.slice(1);if(VIEWS.some(v=>v.id===h0))cur=VIEWS.find(v=>v.id===h0);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});
addEventListener('hashchange',()=>{const v=VIEWS.find(v=>v.id===location.hash.slice(1));if(v&&v!==cur){cur=v;render()}});
(async()=>{
  try{
    if(typeof DecompressionStream!=="undefined"&&typeof TZ!=="undefined"){
      const bin=Uint8Array.from(atob(TZ),c=>c.charCodeAt(0));
      const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      const FULL=JSON.parse(txt);
      FULL.forEach((t,i)=>{if(D[i]&&t)D[i].tx=t;});
    }
  }catch(e){/* fallback : textes tronqués de D */}
  render();
})();
</script>
